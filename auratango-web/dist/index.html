function openQuiz(){state.quiz=[];state.quizStep=0;quizRender()}
function quizRender(){let n=state.quizStep;if(n===3){let path=state.quiz[0],id=path==='private'?'private':path==='pair'||path==='solo-pair'?'partnered':'ladies';state.quizResult=id;let c=classes[id];let loc=state.quiz[2]||'either';modal(T('This feels like<br><em>your kind of beginning.</em>','To brzmi jak<br><em>Twój dobry początek.</em>'),`<span class="pill green">${T('Your suggested starting point','Sugerowany pierwszy krok')}</span><h3 class="serif" style="margin:20px 0">${txt(c.name)}</h3><p>${txt(c.desc)}</p><div class="notice" style="margin-top:19px">${I('spark')}<span>${path==='solo-pair'?T('You are joining individually. We will demonstrate the matching request first—not a paid confirmed booking.','Dołączasz indywidualnie. Najpierw pokażemy zgłoszenie do dopasowania, nie opłaconą rezerwację.'):T('This is a rule-based suggestion, not an assessment by a teacher. Your preferred location will carry into the booking where available.','To sugestia oparta na regułach, nie ocena instruktora. Preferowana lokalizacja zostanie uwzględniona, gdy dostępna.')}</span></div><div class="modal-actions"><button class="btn light" onclick="closeModal();navigate('/class/${id}')">${T('Explore the class','Poznaj zajęcia')}</button><button class="btn" onclick="quizBook()">${T('Choose my date','Wybierz termin')}${I('arrow')}</button></div><button class="text-link" style="margin-top:20px" onclick="openQuiz()">${T('Start again','Zacznij ponownie')}${I('refresh')}</button>`);return}let data=n===0?{title:T('What brings<br><em>you here?</em>','Co Cię<br><em>tu przyciąga?</em>'),desc:T('A moment for you, a connection to share, or a little room to grow. Let us find your starting point.','Chwila dla siebie, bliskość z drugą osobą albo miejsce na rozwój. Znajdźmy Twój początek.'),choices:[['ladies','user',T('Solo · Tango Ladies','Solo · Tango dla kobiet'),T('A women’s movement class','Zajęcia ruchowe dla kobiet')],['pair','heart',T('With a partner','Z partnerem / partnerką'),T('A shared experience','Wspólne doświadczenie')],['solo-pair','users',T('Partnered tango, on my own','Tango w parze, zapis solo'),T('Ask for a matched place','Poproś o dopasowane miejsce')],['private','spark',T('Individual attention','Indywidualna uwaga'),T('A lesson around my goals','Lekcja dopasowana do celów')]]}:n===1?{title:T('What is your<br><em>starting point?</em>','Jaki jest Twój<br><em>punkt wyjścia?</em>'),desc:T('No wrong answer. It helps us explain what comes next.','Nie ma złej odpowiedzi. To pomoże dobrać kolejny krok.'),choices:[['new','leaf',T('Completely new','Zupełny początek'),T('Curious, but no experience','Ciekawość, bez doświadczenia')],['some','music',T('A little experience','Trochę doświadczenia'),T('I have tried a few steps','Mam za sobą kilka kroków')],['returning','refresh',T('Coming back','Wracam do tańca'),T('I want to find my rhythm again','Chcę odzyskać swój rytm')],['experienced','walk',T('Already dancing','Już tańczę'),T('I would like focused guidance','Szukam konkretnego wsparcia')]]}:{title:T('Where does tango<br><em>fit your week?</em>','Gdzie tango<br><em>pasuje do Twojego tygodnia?</em>'),desc:T('Choose a preferred Warsaw location. All dates are examples.','Wybierz lokalizację w Warszawie. Terminy są przykładowe.'),choices:[['goclaw','pin','Gocław','Abrahama 12'],['solec','pin','Solec','Solec 38'],['either','globe',T('I’m flexible','Jestem elastycznie'),T('Show me the options','Pokaż możliwości')]]};modal(data.title,`<p>${data.desc}</p><div class="quiz-progress">${[0,1,2].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div><div class="label muted">${T('Question','Pytanie')} ${n+1} / 3</div><div class="quiz-choices">${data.choices.map(([v,i,h,p])=>`<button class="quiz-choice" onclick="state.quiz[${n}]='${v}';state.quizStep++;quizRender()">${I(i)}<h4>${h}</h4><p>${p}</p></button>`).join('')}</div>${n?`<button class="text-link" style="margin-top:23px" onclick="state.quizStep--;quizRender()">${T('Previous question','Poprzednie pytanie')}</button>`:''}`)}
function quizBook(){let id=state.quizResult,loc=state.quiz[2],solo=state.quiz[0]==='solo-pair',exp=state.quiz[1];startBooking(id);if(solo)state.cart.party='solo';let slot=scheduleData().find(s=>s.id===id&&s.seats>0&&(loc==='either'||s.location===loc));if(slot)Object.assign(state.cart,{date:slot.date,time:slot.time,location:slot.location});state.cart.experience=exp;render();if(exp==='experienced'&&id!=='private')toast(T('Before a live booking, ask the teacher to confirm the most suitable level.','Przed prawdziwym zapisem potwierdź odpowiedni poziom z instruktorem.'))}
function waitlistModal(id,slot){const c=classes[id];slot=slot||{date:c.date,time:c.time,location:c.location};modal(T('A place that<br><em>fits you.</em>','Miejsce<br><em>dopasowane do Ciebie.</em>'),`<span class="pill peach">${T('Waiting-list request · not a booking','Lista oczekujących · nie rezerwacja')}</span><p style="margin-top:18px">${txt(c.name)} · ${dateLabel(slot.date)} · ${slot.time} · ${locations[slot.location].name}</p><p style="margin-top:12px">${T('We would check a suitable place and contact you before requesting payment. No match or place is guaranteed. This form only creates a fictional local request.','Przed płatnością sprawdzilibyśmy odpowiednie miejsce i skontaktowali się z Tobą. Nie gwarantujemy dopasowania. Formularz tworzy tylko fikcyjne lokalne zgłoszenie.')}</p><form onsubmit="submitWaitlist(event,'${id}','${slot.date}','${slot.time}','${slot.location}')" style="margin-top:24px"><div class="field"><label>${T('Sample email','Przykładowy e-mail')}</label><input type="email" required placeholder="demo@example.com" autocomplete="off"></div>${id==='partnered'?`<div class="field"><label>${T('Preferred dance role','Preferowana rola w tańcu')}</label><select name="role"><option value="either">${T('Either / discuss with me','Dowolna / do omówienia')}</option><option value="lead" ${slot.role==='lead'?'selected':''}>${T('Lead','Prowadzenie')}</option><option value="follow" ${slot.role==='follow'?'selected':''}>${T('Follow','Podążanie')}</option></select></div>`:''}<label class="checkline"><input type="checkbox" required><span>${T('I understand this is an unconfirmed demo request, not a paid reservation.','Rozumiem, że to niepotwierdzone zgłoszenie demo, nie opłacona rezerwacja.')}</span></label><button class="btn full" type="submit">${T('Join the demo waiting list','Dołącz do listy demo')}${I('users')}</button></form>`)}
function submitWaitlist(event,id,date,time,location){event.preventDefault();const form=new FormData(event.target),role=form.get('role')||'not-applicable';if(!state.waitlist.some(w=>w.classId===id&&w.date===date&&w.time===time&&w.location===location)){state.waitlist.push({id:'WL-'+Date.now().toString().slice(-6),classId:id,date,time,location,role});state.leads.unshift({name:'Demo waiting-list applicant',source:state.cart?.source||'Timetable',interest:txt(classes[id].name),status:'Enquiry'});persist()}state.cart=null;modal(T('Interest noted.<br><em>No charge made.</em>','Zgłoszenie zapisane.<br><em>Bez płatności.</em>'),`<div class="success-icon" style="margin:18px 0">${I('check')}</div><p>${T('Your fictional request now appears in the studio waiting-list preview. In a live service, the team would confirm suitability and send a booking invitation separately.','Fikcyjne zgłoszenie pojawiło się w podglądzie listy studia. W prawdziwym serwisie zespół potwierdzi dopasowanie i osobno wyśle zaproszenie do zapisu.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal();navigate('/studio/enrolments')">${T('See the studio queue','Zobacz kolejkę studia')}</button><button class="btn" onclick="closeModal();navigate('/classes')">${T('Explore other classes','Poznaj inne zajęcia')}${I('arrow')}</button></div>`)}
function memberReserveModal(id,date,time,location){if(state.bookings.some(b=>b.status==='confirmed'&&b.classId===id&&b.date===date&&b.time===time)){modal(T('Already in your diary.','Już w Twoim kalendarzu.'),`<p>${T('You already have this demo class reserved. No extra credit has been used.','Masz już zarezerwowane te zajęcia demo. Nie pobrano kolejnego wejścia.')}</p><div class="modal-actions"><button class="btn" onclick="closeModal();navigate('/member/classes')">${T('View my classes','Moje zajęcia')}</button></div>`);return}modal(T('Use your next<br><em>class credit.</em>','Wykorzystaj kolejne<br><em>wejście.</em>'),`<span class="pill green">${state.credits} ${T('Ladies credits available · demo','wejść Ladies · demo')}</span><h3 style="margin-top:24px">${txt(classes[id].name)}</h3><p style="margin-top:12px">${dateLabel(date)} · ${time} · ${locations[location].address}</p><p style="margin-top:14px">${T('This demonstration uses one Ladies credit. It does not reserve a live place.','Demonstracja wykorzystuje jedno wejście Ladies. Nie rezerwuje prawdziwego miejsca.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${T('Not now','Nie teraz')}</button><button class="btn" onclick="reserveCredit('${id}','${date}','${time}','${location}')">${T('Use 1 credit','Użyj 1 wejścia')}${I('check')}</button></div>`)}
function reserveCredit(id,date,time,location){if(state.credits<1){toast(T('No demo credits remain.','Brak wejść demo.'));return}if(state.bookings.some(b=>b.status==='confirmed'&&b.classId===id&&b.date===date&&b.time===time)){toast(T('This class is already booked.','Te zajęcia są już zarezerwowane.'));closeModal();return}state.credits--;state.bookings.push({id:'CR-'+Date.now().toString().slice(-7),classId:id,date,time,location,duration:classes[id].duration,status:'confirmed',usedCredit:true});persist();closeModal();navigate('/member/classes');toast(T('Demo class booked. One Ladies credit used.','Zajęcia demo zapisane. Wykorzystano jedno wejście Ladies.'))}
function bookingDetails(id){let b=state.bookings.find(b=>b.id===id);if(!b)return;modal(bookingName(b),`<span class="pill green">${T('Confirmed · demonstration','Potwierdzone · demonstracja')}</span><div class="stack" style="margin:23px 0;gap:17px"><div class="flex">${I('calendar')}${dateLabel(b.date,{weekday:'long',day:'numeric',month:'long'})}</div><div class="flex">${I('clock')}${b.time} · ${b.duration} min</div><div class="flex">${I('pin')}${locations[b.location]?.address||T('Partner venue · to be confirmed','Miejsce partnerskie · do ustalenia')}</div></div><div class="notice">${I('info')}<span>${T('Arrive with comfortable clothes and secure footwear. Check the real entrance and accessibility arrangements with the studio before any actual visit.','Wybierz wygodny strój i stabilne obuwie. Przed prawdziwą wizytą potwierdź wejście i dostępność ze studiem.')}</span></div><div class="modal-actions"><button class="btn light" onclick="downloadBookingCalendar('${id}')">${I('calendar')}${T('Calendar','Kalendarz')}</button><button class="btn" onclick="rescheduleModal('${id}')">${T('Reschedule','Zmień termin')}${I('refresh')}</button></div><button class="text-link" style="margin-top:20px;" onclick="cancelModal('${id}')">${T('Cancel this demo booking','Anuluj tę rezerwację demo')}</button>`)}
function rescheduleModal(id){let b=state.bookings.find(b=>b.id===id);if(!b)return;if(b.eventId){modal(T('An event with<br><em>a fixed date.</em>','Wydarzenie<br><em>ze stałym terminem.</em>'),`<p>${T('Events have a fixed demonstration date. Cancel this sample booking or explore another experience; it cannot be silently moved to a different event.','Wydarzenia mają stałą datę demo. Anuluj przykładowy zapis lub wybierz inne wydarzenie; nie można go automatycznie przenieść.')}</p><div class="modal-actions"><button class="btn light" onclick="cancelModal('${id}')">${T('Cancel booking','Anuluj zapis')}</button><button class="btn" onclick="closeModal();navigate('/events')">${T('View events','Zobacz wydarzenia')}</button></div>`);return}let next=new Date(b.date+'T12:00:00');next.setDate(next.getDate()+7);let nd=next.toISOString().slice(0,10);modal(T('Keep the class.<br><em>Change the moment.</em>','Zachowaj zajęcia.<br><em>Zmień chwilę.</em>'),`<p>${T('Rescheduling changes the existing demo booking. It does not deduct a second credit. Live deadlines and capacity checks are not implemented in this concept.','Zmiana dotyczy istniejącej rezerwacji demo. Nie pobiera kolejnego wejścia. Rzeczywiste terminy i sprawdzanie pojemności nie są wdrożone.')}</p><form onsubmit="rescheduleSubmit(event,'${id}')" style="margin-top:24px"><div class="field"><label>${T('Choose a sample alternative','Wybierz przykładowy alternatywny termin')}</label><select name="date"><option value="${nd}">${dateLabel(nd,{day:'numeric',month:'long'})} · ${b.time} · ${locations[b.location].name}</option></select></div><button class="btn full" type="submit">${T('Confirm new demo date','Potwierdź nowy termin demo')}${I('check')}</button></form><button class="text-link" style="margin-top:20px" onclick="cancelModal('${id}')">${T('Cancel instead','Zamiast tego anuluj')}</button>`)}
function rescheduleSubmit(event,id){event.preventDefault();let b=state.bookings.find(b=>b.id===id),date=new FormData(event.target).get('date');if(state.bookings.some(o=>o.id!==id&&o.status==='confirmed'&&o.classId===b.classId&&o.date===date&&o.time===b.time)){toast(T('You already have that class booked. Choose another option.','Masz już ten termin. Wybierz inną opcję.'));return}b.date=date;persist();closeModal();navigate('/member/classes');toast(T('Demo booking rescheduled. No extra credit used.','Zmieniono termin demo. Bez dodatkowego wejścia.'))}
function cancelModal(id){let b=state.bookings.find(b=>b.id===id);if(!b)return;modal(T('Change of plans?','Zmiana planów?'),`<p>${T('Cancel this demonstration booking?','Anulować tę demonstracyjną rezerwację?')} ${b.usedCredit?T('The one Ladies credit used for it will be restored.','Jedno wykorzystane wejście Ladies zostanie zwrócone.'):T('This booking did not use a class credit, so no credit will be added. No real refund is processed.','Ta rezerwacja nie użyła wejścia, więc żadne nie zostanie dodane. Bez rzeczywistego zwrotu pieniędzy.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${T('Keep my class','Zostaw rezerwację')}</button><button class="btn" onclick="cancelBooking('${id}')">${T('Cancel demo booking','Anuluj rezerwację demo')}</button></div>`)}
function cancelBooking(id){let b=state.bookings.find(b=>b.id===id);if(b&&b.status!=='cancelled'){b.status='cancelled';if(b.usedCredit){state.credits++;b.usedCredit=false}persist()}closeModal();navigate('/member/classes');toast(T('Demo booking cancelled.','Rezerwacja demo anulowana.'))}
function practiceNotes(i){const arr=[[T('Find your balance','Znajdź równowagę'),T('Recall one posture cue from your teacher. Notice whether your stance feels comfortable. Make a note of what you would like feedback on at the next lesson.','Przypomnij sobie jedną wskazówkę instruktora dotyczącą postawy. Zauważ, czy stoisz wygodnie. Zapisz, o co chcesz zapytać na kolejnej lekcji.')],[T('Hear the music','Usłysz muzykę'),T('Listen to a track you worked with in class. Notice moments where you hear a pause or a change. Bring one question about the music to your teacher.','Posłuchaj utworu z zajęć. Zwróć uwagę na pauzę lub zmianę. Przygotuj jedno pytanie do instruktora.')],[T('Connect the steps','Połącz kroki'),T('Revisit only material that has been taught in class. Do not force a movement or practise complex partnered figures without supervision. Ask for guidance when something is unclear.','Wracaj tylko do materiału z lekcji. Nie wymuszaj ruchu ani nie ćwicz złożonych figur bez nadzoru. Pytaj, gdy coś jest niejasne.')],[T('Your first practice','Twoja pierwsza praktyka'),T('Choose a beginner-friendly session and introduce yourself to the host. Agree on comfort and roles before a partnered dance. You can pause or decline at any time.','Wybierz praktykę dla początkujących i przedstaw się prowadzącemu. Uzgodnij komfort i role przed tańcem. Możesz zawsze zrobić przerwę lub odmówić.')]];modal(arr[i][0],`<span class="pill">${T('Sample class notes','Przykładowe notatki')}</span><p style="margin-top:20px">${arr[i][1]}</p><div class="notice" style="margin-top:20px">${I('book')}<span>${T('These are general reflection prompts, not personalised teaching. Live notes and media would be assigned by the teacher.','To ogólne wskazówki do refleksji, nie nauka indywidualna. Prawdziwe notatki i materiały przypisze instruktor.')}</span></div><div class="modal-actions"><button class="btn" onclick="closeModal();navigate('/event/sunday-practice')">${T('Explore supported practice','Zobacz praktykę ze wsparciem')}${I('arrow')}</button></div>`)}
function teacherModal(who){let r=who==='rick';modal(r?'Rick Daniel':'Anna Daniel',`<span class="pill">${r?T('Partnered Argentine tango','Tango argentyńskie w parze'):T('Tango Ladies','Tango dla kobiet')}</span><p style="margin-top:22px">${r?T('Rick is presented on the public partnered-tango page as a teacher whose background includes music and body awareness. In this concept, his profile links directly to suitable classes and private-lesson discovery.','Rick jest przedstawiony na publicznej stronie tanga w parze jako instruktor z doświadczeniem muzycznym i świadomością ciała. Ten profil łączy się z odpowiednimi zajęciami i lekcjami indywidualnymi.'):T('Anna is named on the public Tango Ladies page as its instructor. This concept gives her solo-class route a clear introduction, booking flow and a continuation pathway.','Anna jest wymieniona na publicznej stronie Tango dla kobiet jako prowadząca. Ta koncepcja zapewnia zajęciom solo jasne wprowadzenie, zapis i ścieżkę kontynuacji.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal();navigate('/class/private')">${T('Private attention','Indywidualna uwaga')}</button><button class="btn" onclick="closeModal();navigate('/class/${r?'partnered':'ladies'}')">${T('Explore the class','Zobacz zajęcia')}${I('arrow')}</button></div>`)}
function locationInfo(id){let l=locations[id];modal(l.name,`<div class="flex" style="margin:20px 0">${I('pin')}<strong>${l.address}</strong></div><p>${txt(l.note)}</p><p style="margin-top:14px">${T('This address is listed on the public tango service page. Entrance instructions, accessibility, facilities and the current class schedule must be confirmed with the studio before a real visit.','Adres jest wymieniony na publicznej stronie tanga. Wejście, dostępność, wyposażenie i bieżący grafik wymagają potwierdzenia ze studiem przed wizytą.')}</p><div class="modal-actions"><a class="btn light" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.address)}" target="_blank" rel="noopener">${I('pin')}${T('Open maps','Otwórz mapę')}</a><button class="btn" onclick="state.locationFilter='${id}';state.classFilter='all';closeModal();navigate('/timetable')">${T('See this timetable','Zobacz grafik')}${I('arrow')}</button></div>`)}
function partnerForm(){modal(T('Your space.<br><em>A shared experience.</em>','Twoja przestrzeń.<br><em>Wspólne doświadczenie.</em>'),`<p>${T('A café, club, cultural venue, employer or local initiative? Explore a hosted tango experience with a clear beginner pathway. This is a demonstration enquiry only.','Kawiarnia, klub, dom kultury, pracodawca lub inicjatywa lokalna? Odkryj spotkanie z tangiem prowadzące do zajęć dla początkujących. To wyłącznie zapytanie demo.')}</p><form onsubmit="submitPartner(event)" style="margin-top:23px"><div class="form-grid"><div class="field"><label>${T('Venue / organisation (sample)','Miejsce / organizacja (przykład)')}</label><input required placeholder="Demo Café"></div><div class="field"><label>${T('Sample email','Przykładowy e-mail')}</label><input type="email" required placeholder="demo@example.com"></div></div><div class="field" style="margin-top:17px"><label>${T('Format you are exploring','Interesujący format')}</label><select><option>${T('Café / cultural evening','Wieczór w kawiarni / kulturalny')}</option><option>${T('Street / outdoor pop-up','Miejski / plenerowy pop-up')}</option><option>${T('Workplace experience','Spotkanie firmowe')}</option><option>${T('Club / hosted social','Klub / spotkanie prowadzone')}</option></select></div><div class="field"><label>${T('Your idea','Twój pomysł')}</label><textarea required placeholder="${T('Tell us about the space and audience (sample information).','Opowiedz o przestrzeni i uczestnikach (dane przykładowe).')}"></textarea></div><button class="btn full" type="submit">${T('Preview partner enquiry','Wypróbuj zapytanie partnerskie')}${I('arrow')}</button><p class="banner-small">${T('No proposal or message is sent. No venue partnership is created.','Nie wysyłamy propozycji ani wiadomości. Nie powstaje partnerstwo.')}</p></form>`)}
function submitPartner(event){event.preventDefault();modal(T('The conversation<br><em>starts here.</em>','Rozmowa<br><em>zaczyna się tutaj.</em>'),`<div class="success-icon" style="margin:20px 0">${I('check')}</div><p>${T('This previews the acknowledgement a venue would receive. In production, a coordinator would review audience fit, costs, capacity, floor suitability, permissions and the next-class pathway. Nothing has been submitted from this prototype.','To podgląd potwierdzenia dla miejsca. W produkcji koordynator sprawdzi odbiorców, koszty, pojemność, podłogę, zgody i ścieżkę kolejnych zajęć. Z prototypu nic nie wysłano.')}</p><div class="modal-actions"><button class="btn" onclick="closeModal();navigate('/events')">${T('Explore the concepts','Poznaj koncepcje')}${I('arrow')}</button></div>`)}
function contactSubmit(event){event.preventDefault();event.target.reset();modal(T('A conversation<br><em>worth starting.</em>','Rozmowa,<br><em>którą warto zacząć.</em>'),`<p>${T('This is the acknowledgement visitors would see after an enquiry. No message has been sent or personal details stored. A live version would create a consent-aware CRM record and notify the responsible studio team.','To potwierdzenie, które zobaczy odwiedzający. Nic nie wysłano ani nie zapisano danych osobowych. Wersja produkcyjna utworzy rekord CRM ze zgodami i powiadomi zespół studia.')}</p><div class="modal-actions"><button class="btn" onclick="closeModal()">${T('Continue exploring','Odkrywaj dalej')}${I('arrow')}</button></div>`)}
function newsletter(event){event.preventDefault();event.target.reset();toast(T('Newsletter confirmation preview. No email collected or sent.','Podgląd potwierdzenia newslettera. Nie zebrano ani nie wysłano e-maila.'))}
function toggleTask(id,checked){state.tasks=checked?[...new Set([...state.tasks,id])]:state.tasks.filter(x=>x!==id);persist()}

function followupModal(i){let l=state.leads[i];modal(T('One helpful<br><em>next step.</em>','Jeden pomocny<br><em>kolejny krok.</em>'),`<span class="pill">${ESC(l.name)} · ${statusLabel(l.status)}</span><p style="margin-top:21px">${T('Hi there, thank you for your interest in tango. Is there anything you would like to know before choosing a first class? We can clarify the format, price, suitable date or partner arrangements.','Dziękujemy za zainteresowanie tangiem. Czy chcesz coś wiedzieć przed wyborem pierwszych zajęć? Możemy wyjaśnić format, cenę, odpowiedni termin lub kwestie partnera.')}</p><div class="notice" style="margin-top:20px">${I('mail')}<span>${T('Message template preview only. Production contact requires the appropriate permission and a configured messaging service.','Tylko podgląd szablonu. Rzeczywisty kontakt wymaga odpowiedniego uprawnienia i skonfigurowanej usługi.')}</span></div><div class="modal-actions"><button class="btn light" onclick="copyText(T('Thank you for your interest in tango. What would help you choose your first class?','Dziękujemy za zainteresowanie tangiem. Co pomoże Ci wybrać pierwsze zajęcia?'))">${I('copy')}${T('Copy template','Kopiuj szablon')}</button><button class="btn" onclick="closeModal()">${T('Done','Gotowe')}</button></div>`)}
function downloadFile(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function icsUTC(date,time){let [y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number);let timestamp=Date.UTC(y,m-1,d,h,min);for(let i=0;i<3;i++){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(timestamp));const map=Object.fromEntries(parts.map(p=>[p.type,p.value]));const asUTC=Date.UTC(Number(map.year),Number(map.month)-1,Number(map.day),Number(map.hour),Number(map.minute));timestamp+=Date.UTC(y,m-1,d,h,min)-asUTC}return new Date(timestamp)}
function icsStamp(d){return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'}
function makeCalendar(item,name){let start=icsUTC(item.date,item.time),end=new Date(start.getTime()+(item.duration||60)*60000);let esc=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AuraTango//Interactive Demo//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',`UID:${item.id||Date.now()}@auratango-demo.invalid`,`DTSTAMP:${icsStamp(new Date())}`,`DTSTART:${icsStamp(start)}`,`DTEND:${icsStamp(end)}`,`SUMMARY:${esc('DEMO — AuraTango: '+name)}`,`LOCATION:${esc(locations[item.location]?.address||'Proposed partner venue — not confirmed')}`,'DESCRIPTION:DEMONSTRATION ONLY. Not a real reservation. No payment was processed. Verify all actual dates and arrangements directly with AuraTango.','STATUS:TENTATIVE','END:VEVENT','END:VCALENDAR',''].join('\r\n')}
function downloadCalendar(id){let o=state.orders.find(x=>x.id===id);if(!o||!o.date)return;downloadFile(`AuraTango_DEMO_${id}.ics`,makeCalendar(o,o.name),'text/calendar;charset=utf-8');toast(T('Demo calendar file prepared. It is marked tentative, not a real reservation.','Przygotowano plik kalendarza demo, oznaczony jako wstępny, nie prawdziwa rezerwacja.'))}
function downloadBookingCalendar(id){let b=state.bookings.find(x=>x.id===id);if(b)downloadFile(`AuraTango_DEMO_${id}.ics`,makeCalendar(b,bookingName(b)),'text/calendar;charset=utf-8')}
function eventReminder(id){let e=events.find(e=>e.id===id);downloadFile(`AuraTango_DEMO_${e.id}.ics`,makeCalendar({...e,location:e.confirmedVenue?'solec':'partner'},txt(e.name)),'text/calendar;charset=utf-8');toast(T('Proposed event saved as a tentative demo calendar file. No reservation was made.','Zapisano proponowane wydarzenie jako wstępny plik demo. Bez rezerwacji.'))}
function downloadReceipt(id){let o=state.orders.find(x=>x.id===id);if(!o)return;downloadFile(`AuraTango_DEMO_Confirmation_${o.id}.txt`,['AURATANGO — DEMONSTRATION CONFIRMATION','NOT AN INVOICE. NOT EVIDENCE OF PAYMENT.','',`Reference: ${o.id}`,`Experience: ${o.name}`,`Option: ${o.packageLabel||'Demo'}`,`Illustrative total: ${money(o.total)}`,`Participants: ${o.people}`,o.date?`Sample session: ${o.date} at ${o.time} (Europe/Warsaw)`:'Gift-card concept — no redeemable value',o.location?`Location: ${locations[o.location]?.address||'Proposed partner venue — to be confirmed'}`:'','', 'No payment was processed, no message was sent and no real class or event place was reserved. All dates and availability must be confirmed directly with AuraTango before an actual visit.'].join('\n'));toast(T('Demonstration confirmation prepared.','Przygotowano potwierdzenie demonstracyjne.'))}
function exportCRM(){let esc=s=>{s=String(s);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let rows=[['DEMO ONLY — fictional records','Source','Interest','Status'],...state.leads.map(l=>[l.name,l.source,l.interest,l.status])];downloadFile('AuraTango_DEMO_CRM.csv','\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(T('Fictional CRM export prepared.','Przygotowano eksport fikcyjnego CRM.'))}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast(T('Copied.','Skopiowano.'))}catch(e){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)toast(T('Copied.','Skopiowano.'));else modal(T('Copy this text','Skopiuj tekst'),`<textarea readonly style="min-height:90px" onclick="this.select()">${ESC(text)}</textarea>`)}}
function resetDemo(){modal(T('A fresh<br><em>beginning?</em>','Nowy<br><em>początek?</em>'),`<p>${T('This clears all fictional orders, local bookings, CRM changes and preferences in this browser, then restores the original sample. It does not affect any real account.','Usunie fikcyjne zamówienia, rezerwacje, zmiany CRM i preferencje w tej przeglądarce, a potem przywróci przykład. Nie wpływa na prawdziwe konta.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${T('Keep exploring','Zostaw dane')}</button><button class="btn" onclick="try{localStorage.removeItem('auratango-crimson-v3')}catch(e){}location.hash='/';location.reload()">${T('Reset demo','Wyzeruj demo')}${I('refresh')}</button></div>`)}

let pageTransition;
window.addEventListener('hashchange', () => {
  const updatePage = () => {
    closeModal();
    document.getElementById('chat-root').innerHTML = '';
    render();
    window.scrollTo({top: 0, behavior: 'instant'});
  };
  const reducedMotion = document.documentElement.dataset.motion === 'reduced'
    || matchMedia('(prefers-reduced-motion: reduce)').matches;
  pageTransition?.skipTransition();
  if (reducedMotion || !document.startViewTransition) {
    updatePage();
    return;
  }
  document.documentElement.classList.add('route-transition');
  const transition = document.startViewTransition(updatePage);
  pageTransition = transition;
  const cleanup = () => {
    if (pageTransition !== transition) return;
    pageTransition = null;
    document.documentElement.classList.remove('route-transition');
  };
  transition.finished.then(cleanup, cleanup);
});

 {id:'solo-or-partnered',photo:'anna',tag:['FIND YOUR WAY','ZNAJDŹ SWOJĄ DROGĘ','НАЙТИ СВОЙ ПУТЬ','ЗНАЙТИ СВІЙ ШЛЯХ'],minutes:3,title:['On your own. Never out of place.','Solo. Ale zawsze na swoim miejscu.','Соло. И всё же на своём месте.','Соло. І все ж на своєму місці.'],intro:['There is more than one way into tango. Choose the beginning that fits you, rather than the one you think you should choose.','Do tanga prowadzi wiele dróg. Wybierz początek, który pasuje do Ciebie, a nie do cudzych oczekiwań.','В танго ведёт не одна дорога. Выберите начало, которое подходит вам, а не чужим ожиданиям.','У танго веде не одна дорога. Оберіть початок, який підходить вам, а не чужим очікуванням.'],sections:[
 [['An hour for yourself.','Godzina dla siebie.','Час для себя.','Година для себе.'],['Tango Ladies offers a solo route into movement, balance and musical expression. There is no partner to organise. Ask about the current level and language of the class, then make a little room in your week for yourself.','Tango Ladies pozwala odkrywać ruch, równowagę i muzykalność solo. Nie musisz szukać partnera. Zapytaj o poziom i język zajęć, a potem znajdź w tygodniu chwilę dla siebie.','Tango Ladies — сольный путь к движению, равновесию и музыкальности. Не нужно искать партнёра. Уточните уровень и язык занятия, а затем выделите немного времени себе.','Tango Ladies — сольний шлях до руху, рівноваги й музикальності. Не потрібно шукати партнера. Уточніть рівень і мову заняття, а потім виділіть трохи часу собі.']],
 [['A shared beginning.','Wspólny początek.','Начать вместе.','Почати разом.'],['Partnered tango is a different conversation: two people listening and moving together. Coming as a couple? Check the partner-rotation policy. Applying alone? A matching request is not yet a confirmed place. Wait for the school to explain the available options.','Tango w parze to rozmowa dwojga ludzi w ruchu. Przychodzicie razem? Sprawdźcie zasady zmiany partnerów. Zgłaszasz się solo? Prośba o dopasowanie to jeszcze nie potwierdzone miejsce. Poczekaj na informację o dostępnych możliwościach.','Парное танго — разговор двух людей в движении. Приходите парой? Уточните правила смены партнёров. Подаёте заявку самостоятельно? Запрос на подбор ещё не означает подтверждённого места. Дождитесь ответа школы о вариантах.','Парне танго — розмова двох людей у русі. Приходите парою? Уточніть правила зміни партнерів. Подаєте заявку самостійно? Запит на добір ще не означає підтвердженого місця. Дочекайтеся відповіді школи щодо варіантів.']],
 [['You can change your mind.','Możesz zmienić zdanie.','Можно передумать.','Можна передумати.'],['Your first choice is a beginning, not a label. Talk to a teacher when you become curious about another route. The right recommendation depends on your experience, comfort and the actual class programme.','Pierwszy wybór to początek, nie etykietka. Jeśli zaciekawi Cię inna ścieżka, porozmawiaj z instruktorem. Rekomendacja powinna uwzględniać doświadczenie, komfort i rzeczywisty program zajęć.','Первый выбор — начало, а не ярлык. Когда заинтересует другой формат, поговорите с преподавателем. Рекомендация зависит от вашего опыта, комфорта и реальной программы занятий.','Перший вибір — початок, а не ярлик. Коли зацікавить інший формат, поговоріть з інструктором. Рекомендація залежить від вашого досвіду, комфорту й реальної програми занять.']]
 ]},
 {id:'beyond-first-step',photo:'rick',tag:['KEEP THE FEELING','ZACHOWAJ TO UCZUCIE','СОХРАНИТЬ ОЩУЩЕНИЕ','ЗБЕРЕГТИ ВІДЧУТТЯ'],minutes:4,title:['The reason you come back.','Powód, dla którego wracasz.','Ради чего возвращаться.','Заради чого повертатися.'],intro:['Not a perfect performance. A familiar face, a small discovery, and a song that begins to feel like yours.','Nie idealny występ. Znajoma twarz, małe odkrycie i melodia, która zaczyna być Twoja.','Не идеальное выступление. Знакомое лицо, маленькое открытие и мелодия, которая становится своей.','Не ідеальний виступ. Знайоме обличчя, маленьке відкриття й мелодія, яка стає своєю.'],sections:[
 [['Make the next step visible.','Zobacz kolejny krok.','Увидеть следующий шаг.','Побачити наступний крок.'],['Before your introductory package ends, ask what comes next: the dates, level, price and focus of the continuing class. You should not have to guess where you belong. A clear next step leaves more room to enjoy the present one.','Przed końcem pakietu zapytaj o kolejne terminy, poziom, cenę i temat zajęć. Nie musisz zgadywać, gdzie jest Twoje miejsce. Jasny plan pozwala cieszyć się tym, co dzieje się teraz.','До окончания вводного абонемента спросите о следующих датах, уровне, цене и теме занятий. Не нужно угадывать, где ваше место. Понятный следующий шаг помогает наслаждаться нынешним.','До завершення вступного абонемента запитайте про наступні дати, рівень, ціну й тему занять. Не потрібно вгадувати, де ваше місце. Зрозумілий наступний крок допомагає насолоджуватися теперішнім.']],
 [['Give yourself a place to practise.','Znajdź przestrzeń na praktykę.','Найти место для практики.','Знайти місце для практики.'],['Ask your teacher which supervised practice suits your level. Repeat something familiar, ask a question and take a break when you need one. A beginner practice and a public social evening need not be the same experience.','Zapytaj instruktora o praktykę odpowiednią do Twojego poziomu. Powtórz znany ruch, zadaj pytanie i odpocznij, kiedy potrzebujesz. Praktyka dla początkujących i publiczny wieczór taneczny nie muszą wyglądać tak samo.','Спросите о практике с преподавателем, подходящей вашему уровню. Повторите знакомое движение, задайте вопрос и отдохните, когда нужно. Практика для начинающих и открытый танцевальный вечер могут быть разными форматами.','Запитайте про практику з інструктором, що відповідає вашому рівню. Повторіть знайомий рух, поставте запитання й відпочиньте, коли потрібно. Практика для початківців і відкритий танцювальний вечір можуть бути різними форматами.']],
 [['Notice your own progress.','Zauważ własny postęp.','Замечать свой прогресс.','Помічати свій поступ.'],['Write down one useful teacher cue after class. Perhaps a movement felt more comfortable, or asking a question felt easier. Progress is personal. Your member space is a place to keep those notes and your next bookings together, not to compare yourself with someone else.','Po lekcji zapisz jedną wskazówkę instruktora. Może jakiś ruch był wygodniejszy, a może łatwiej było o coś zapytać. Postęp jest osobisty. Panel kursanta służy Twoim notatkom i rezerwacjom, nie porównywaniu się z innymi.','После занятия запишите одну полезную подсказку преподавателя. Возможно, движение стало удобнее или вопрос задать легче. Прогресс индивидуален. Личный кабинет объединяет заметки и записи, а не сравнивает вас с другими.','Після заняття запишіть одну корисну підказку інструктора. Можливо, рух став зручнішим або запитання поставити легше. Поступ індивідуальний. Особистий кабінет поєднує нотатки й записи, а не порівнює вас з іншими.']]
 ]}
];
function txt(x){if(!Array.isArray(x))return x;return x[{en:0,pl:1,ru:2,uk:3}[state.lang]]??T(x[0],x[1]||x[0]);}
function switchLang(code){if(!Object.hasOwn(languages,code))return;saveDraft();state.lang=code;persist();closeModal();document.getElementById('chat-root').innerHTML='';render();}
function readingSettingsButton(){
 const label=L('Reading size & animation','Rozmiar tekstu i animacje','Размер текста и анимация','Розмір тексту й анімація');
 return `<button type="button" class="reading-trigger" title="${label}" aria-label="${label}" onclick="auraDisplaySettings()">Aa</button>`;
}
function languageSelector(){
 const label=L('Choose language','Wybierz język','Выбрать язык','Обрати мову');
 const options=Object.entries(languages).map(([code,name])=>`<option value="${code}" lang="${code}"${code===state.lang?' selected':''}>${name}</option>`).join('');
 return `<select class="language-trigger" aria-label="${label}" onchange="switchLang(this.value);document.querySelector('.language-trigger')?.focus()">${options}</select>`;
}
