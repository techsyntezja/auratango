замыслу.</em>","Ваша приватність.<br><em>За задумом.</em>"],"This local concept has no analytics scripts and sends no form, booking or payment data to a backend. External photographs and Google Fonts can make network requests when loaded.":["В концепции нет скриптов аналитики, формы и платежи не отправляются на сервер. Загрузка внешних фото и Google Fonts создаёт сетевые запросы. YouTube подключается после нажатия кнопки воспроизведения.","У концепції немає скриптів аналітики, форми й платежі не надсилаються на сервер. Завантаження зовнішніх фото й Google Fonts створює мережеві запити. YouTube підключається після натискання кнопки відтворення."],"Only fictional bookings, demo orders, interface preferences and workflow states are stored locally where the browser allows it. Entered checkout/contact details are not persisted. This does not constitute a production privacy policy.":["Локально сохраняются только вымышленные записи, заказы, настройки интерфейса и этапы работы, если браузер позволяет. Введённые данные оформления и контактов не сохраняются. Это не полноценная политика приватности.","Локально зберігаються лише вигадані записи, замовлення, налаштування інтерфейсу й етапи роботи, якщо браузер дозволяє. Введені дані оформлення й контактів не зберігаються. Це не повноцінна політика приватності."],"Essential local demo state":["Необходимое локальное состояние демо","Необхідний локальний стан демо"],"Optional analytics preference (no analytics is installed)":["Предпочтение аналитики (аналитика не установлена)","Уподобання аналітики (аналітику не встановлено)"],"Optional marketing preference (no messages are sent)":["Предпочтение маркетинга (сообщения не отправляются)","Уподобання маркетингу (повідомлення не надсилаються)"],"Essential only":["Только необходимое","Лише необхідне"],"Save preferences":["Сохранить предпочтения","Зберегти вподобання"],"A clear beginning.<br><em>Demo conditions.</em>":["Понятное начало.<br><em>Условия демоверсии.</em>","Зрозумілий початок.<br><em>Умови демоверсії.</em>"],"No contract, payment or real place is created through this file. All dates, seats, events and confirmations are simulated. The public prices used for context require owner confirmation, especially where Polish and English pages differ.":["Этот файл не создаёт договоров, платежей и настоящих мест. Даты, места, события и подтверждения симулируются. Цены требуют подтверждения владельцев, особенно при различиях польских и английских страниц.","Цей файл не створює договорів, платежів і справжніх місць. Дати, місця, події й підтвердження симулюються. Ціни потребують підтвердження власників, особливо за відмінностей польських та англійських сторінок."],"In this prototype":["В этом прототипе","У цьому прототипі"],"A matched solo place is requested before payment. Couples enrol together. Packages do not automatically renew. A used sample class credit is restored when that booking is cancelled. Rescheduling does not consume another credit.":["Место с подобранным партнёром запрашивается до оплаты. Пары записываются вместе. Абонементы не продлеваются автоматически. При отмене возвращается только использованное демо-посещение. Перенос не списывает ещё одно.","Місце з дібраним партнером запитується до оплати. Пари записуються разом. Абонементи не продовжуються автоматично. Під час скасування повертається лише використане демо-відвідування. Перенесення не списує ще одне."],"Before live launch":["Перед настоящим запуском","Перед справжнім запуском"],"The school must approve the seller identity, full commercial prices, payment provider, refund and cancellation terms, consumer information, accessibility, consent flows, privacy policy, event permissions and imagery rights. None are supplied as legal advice here.":["Школа должна утвердить продавца, полные цены, платёжного провайдера, возвраты и отмену, информацию для потребителя, доступность, согласия, приватность, разрешения на события и права на изображения. Это не юридическая консультация.","Школа має затвердити продавця, повні ціни, платіжного провайдера, повернення й скасування, інформацію для споживача, доступність, згоди, приватність, дозволи на події й права на зображення. Це не юридична консультація."],"Understood":["Понятно","Зрозуміло"],"This feels like<br><em>your kind of beginning.</em>":["Кажется, это<br><em>ваше начало.</em>","Здається, це<br><em>ваш початок.</em>"],"Your suggested starting point":["Предлагаемая отправная точка","Запропонована відправна точка"],"You are joining individually. We will demonstrate the matching request first—not a paid confirmed booking.":["Вы подаёте индивидуальную заявку. Сначала покажем запрос на подбор, не оплаченную подтверждённую запись.","Ви подаєте індивідуальну заявку. Спочатку покажемо запит на добір, не оплачений підтверджений запис."],"This is a rule-based suggestion, not an assessment by a teacher. Your preferred location will carry into the booking where available.":["Это рекомендация по правилам, не оценка преподавателя. Предпочтительное место будет перенесено в запись, где это возможно.","Це рекомендація за правилами, не оцінка викладача. Бажане місце буде перенесено до запису, де це можливо."],"Explore the class":["Посмотреть занятие","Переглянути заняття"],"Start again":["Начать заново","Почати знову"],"What brings<br><em>you here?</em>":["Что привело<br><em>вас сюда?</em>","Що привело<br><em>вас сюди?</em>"],"A moment for you, a connection to share, or a little room to grow. Let us find your starting point.":["Мгновение для себя, общая близость или пространство для роста. Найдём ваше начало.","Мить для себе, спільна близькість або простір для зростання. Знайдімо ваш початок."],"Solo · Tango Ladies":["Соло · Tango Ladies","Соло · Tango Ladies"],"A women’s movement class":["Занятие движением для женщин","Заняття рухом для жінок"],"With a partner":["С партнёром","З партнером"],"A shared experience":["Общее впечатление","Спільне враження"],"Partnered tango, on my own":["Парное танго, прихожу один/одна","Парне танго, приходжу сам/сама"],"Ask for a matched place":["Запросить место с партнёром","Запросити місце з партнером"],"Individual attention":["Индивидуальное внимание","Індивідуальна увага"],"A lesson around my goals":["Урок под мои цели","Урок під мої цілі"],"What is your<br><em>starting point?</em>":["С чего<br><em>вы начинаете?</em>","З чого<br><em>ви починаєте?</em>"],"No wrong answer. It helps us explain what comes next.":["Неправильных ответов нет. Это поможет объяснить следующий шаг.","Неправильних відповідей немає. Це допоможе пояснити наступний крок."],"Completely new":["Совсем с нуля","Зовсім із нуля"],"Curious, but no experience":["Интересно, но опыта нет","Цікаво, але досвіду немає"],"A little experience":["Немного опыта","Трохи досвіду"],"I have tried a few steps":["Уже пробовал(а) несколько шагов","Уже пробував/пробувала кілька кроків"],"Coming back":["Возвращаюсь","Повертаюся"],"I want to find my rhythm again":["Хочу снова найти свой ритм","Хочу знову знайти свій ритм"],"Already dancing":["Уже танцую","Уже танцюю"],"I would like focused guidance":["Нужны точные подсказки","Потрібні точні підказки"],"Where does tango<br><em>fit your week?</em>":["Где танго<br><em>впишется в вашу неделю?</em>","Де танго<br><em>впишеться у ваш тиждень?</em>"],"Choose a preferred Warsaw location. All dates are examples.":["Выберите место в Варшаве. Все даты примерные.","Оберіть місце у Варшаві. Усі дати прикладові."],"I’m flexible":["Мне подходит любой вариант","Мені підходить будь-який варіант"],"Show me the options":["Показать варианты","Показати варіанти"],"Question":["Вопрос","Запитання"],"Previous question":["Предыдущий вопрос","Попереднє запитання"],"Before a live booking, ask the teacher to confirm the most suitable level.":["Перед настоящей записью уточните у преподавателя подходящий уровень.","Перед справжнім записом уточніть у викладача відповідний рівень."],"A place that<br><em>fits you.</em>":["Место,<br><em>которое вам подходит.</em>","Місце,<br><em>яке вам підходить.</em>"],"Waiting-list request · not a booking":["Заявка в ожидание · не запись","Заявка в очікування · не запис"],"We would check a suitable place and contact you before requesting payment. No match or place is guaranteed. This form only creates a fictional local request.":["Мы бы проверили подходящее место и связались с вами до оплаты. Партнёр и место не гарантируются. Форма создаёт только вымышленную локальную заявку.","Ми б перевірили відповідне місце й зв’язалися з вами до оплати. Партнер і місце не гарантуються. Форма створює лише вигадану локальну заявку."],"Sample email":["Пример электронной почты","Приклад електронної пошти"],"Preferred dance role":["Предпочитаемая роль","Бажана роль"],"Either / discuss with me":["Любая / обсудить со мной","Будь-яка / обговорити зі мною"],"I understand this is an unconfirmed demo request, not a paid reservation.":["Я понимаю, что это неподтверждённая демо-заявка, не оплаченная бронь.","Я розумію, що це непідтверджена демо-заявка, не оплачене бронювання."],"Join the demo waiting list":["В демо-лист ожидания","До демо-списку очікування"],"Interest noted.<br><em>No charge made.</em>":["Интерес отмечен.<br><em>Без списаний.</em>","Інтерес відзначено.<br><em>Без списань.</em>"],"Your fictional request now appears in the studio waiting-list preview. In a live service, the team would confirm suitability and send a booking invitation separately.":["Вымышленная заявка появилась в списке ожидания студии. В настоящем сервисе команда отдельно проверит подходящее место и отправит приглашение записаться.","Вигадана заявка з’явилася у списку очікування студії. У справжньому сервісі команда окремо перевірить відповідне місце й надішле запрошення записатися."],"See the studio queue":["Посмотреть очередь студии","Переглянути чергу студії"],"Explore other classes":["Посмотреть другие занятия","Переглянути інші заняття"],"Already in your diary.":["Уже в вашем расписании.","Уже у вашому розкладі."],"You already have this demo class reserved. No extra credit has been used.":["Это демо-занятие уже забронировано. Дополнительное посещение не списано.","Це демо-заняття вже заброньовано. Додаткове відвідування не списано."],"View my classes":["Посмотреть мои занятия","Переглянути мої заняття"],"Use your next<br><em>class credit.</em>":["Используйте следующее<br><em>посещение.</em>","Використайте наступне<br><em>відвідування.</em>"],"Ladies credits available · demo":["Доступно посещений Ladies · демо","Доступно відвідувань Ladies · демо"],"This demonstration uses one Ladies credit. It does not reserve a live place.":["Демонстрация спишет одно посещение Ladies. Настоящее место не бронируется.","Демонстрація спише одне відвідування Ladies. Справжнє місце не бронюється."],"Not now":["Не сейчас","Не зараз"],"Use 1 credit":["Использовать 1 посещение","Використати 1 відвідування"],"No demo credits remain.":["Демо-посещения закончились.","Демо-відвідування закінчилися."],"This class is already booked.":["Это занятие уже забронировано.","Це заняття вже заброньовано."],"Demo class booked. One Ladies credit used.":["Демо-занятие записано. Списано одно посещение Ladies.","Демо-заняття записано. Списано одне відвідування Ladies."],"Confirmed · demonstration":["Подтверждено · демонстрация","Підтверджено · демонстрація"],"Partner venue · to be confirmed":["Площадка партнёра · будет подтверждена","Майданчик партнера · буде підтверджено"],"Arrive with comfortable clothes and secure footwear. Check the real entrance and accessibility arrangements with the studio before any actual visit.":["Приходите в удобной одежде и устойчивой обуви. Перед реальным визитом уточните вход и доступность у студии.","Приходьте у зручному одязі й стійкому взутті. Перед реальним візитом уточніть вхід і доступність у студії."],"Calendar":["Календарь","Календар"],"Cancel this demo booking":["Отменить демо-запись","Скасувати демо-запис"],"An event with<br><em>a fixed date.</em>":["Событие<br><em>с фиксированной датой.</em>","Подія<br><em>з фіксованою датою.</em>"],"Events have a fixed demonstration date. Cancel this sample booking or explore another experience; it cannot be silently moved to a different event.":["У события фиксированная демо-дата. Можно отменить примерную запись или выбрать другое событие; незаметно перенести её на другое событие нельзя.","У події фіксована демо-дата. Можна скасувати прикладовий запис або обрати іншу подію; непомітно перенести його на іншу подію не можна."],"Cancel booking":["Отменить запись","Скасувати запис"],"View events":["Посмотреть события","Переглянути події"],"Keep the class.<br><em>Change the moment.</em>":["Сохраните занятие.<br><em>Измените время.</em>","Збережіть заняття.<br><em>Змініть час.</em>"],"Rescheduling changes the existing demo booking. It does not deduct a second credit. Live deadlines and capacity checks are not implemented in this concept.":["Перенос изменяет существующую демо-запись, не списывая второе посещение. Настоящие сроки и проверка мест в концепции не реализованы.","Перенесення змінює наявний демо-запис, не списуючи друге відвідування. Справжні строки й перевірку місць у концепції не реалізовано."],"Choose a sample alternative":["Выберите пример альтернативы","Оберіть приклад альтернативи"],"Confirm new demo date":["Подтвердить новую демо-дату","Підтвердити нову демо-дату"],"Cancel instead":["Вместо этого отменить","Натомість скасувати"],"You already have that class booked. Choose another option.":["Это занятие уже забронировано. Выберите другой вариант.","Це заняття вже заброньовано. Оберіть інший варіант."],"Demo booking rescheduled. No extra credit used.":["Демо-запись перенесена. Дополнительное посещение не списано.","Демо-запис перенесено. Додаткове відвідування не списано."],"Change of plans?":["Планы изменились?","Плани змінилися?"],"Cancel this demonstration booking?":["Отменить эту демонстрационную запись?","Скасувати цей демонстраційний запис?"],"The one Ladies credit used for it will be restored.":["Использованное посещение Ladies будет возвращено.","Використане відвідування Ladies буде повернуто."],"This booking did not use a class credit, so no credit will be added. No real refund is processed.":["В этой записи посещение не списывалось, поэтому оно не добавится. Настоящий возврат денег не проводится.","У цьому записі відвідування не списувалося, тому воно не додасться. Справжнє повернення коштів не проводиться."],"Keep my class":["Оставить занятие","Залишити заняття"],"Cancel demo booking":["Отменить демо-запись","Скасувати демо-запис"],"Demo booking cancelled.":["Демо-запись отменена.","Демо-запис скасовано."],"Recall one posture cue from your teacher. Notice whether your stance feels comfortable. Make a note of what you would like feedback on at the next lesson.":["Вспомните одну подсказку преподавателя об осанке. Заметьте, удобно ли вам стоять. Запишите, о чём хотите спросить на следующем уроке.","Згадайте одну підказку викладача про поставу. Помітьте, чи зручно вам стояти. Запишіть, про що хочете запитати на наступному уроці."],"Listen to a track you worked with in class. Notice moments where you hear a pause or a change. Bring one question about the music to your teacher.":["Послушайте мелодию с занятия. Найдите паузы и изменения. Подготовьте один вопрос о музыке для преподавателя.","Послухайте мелодію із заняття. Знайдіть паузи й зміни. Підготуйте одне запитання про музику для викладача."],"Revisit only material that has been taught in class. Do not force a movement or practise complex partnered figures without supervision. Ask for guidance when something is unclear.":["Повторяйте только изученное на занятиях. Не форсируйте движение и не тренируйте сложные парные фигуры без наблюдения. Когда что-то непонятно, попросите помощи.","Повторюйте лише вивчене на заняттях. Не форсуйте рух і не тренуйте складні парні фігури без нагляду. Коли щось незрозуміло, попросіть допомоги."],"Choose a beginner-friendly session and introduce yourself to the host. Agree on comfort and roles before a partnered dance. You can pause or decline at any time.":["Выберите практику для начинающих и представьтесь ведущему. До парного танца обсудите комфорт и роли. Можно остановиться или отказаться в любой момент.","Оберіть практику для початківців і представтеся ведучому. До парного танцю обговоріть комфорт і ролі. Можна зупинитися чи відмовитися будь-якої миті."],"Sample class notes":["Пример заметок к уроку","Приклад нотаток до уроку"],"These are general reflection prompts, not personalised teaching. Live notes and media would be assigned by the teacher.":["Это общие вопросы для размышления, не персональное обучение. Настоящие заметки и материалы назначит преподаватель.","Це загальні запитання для роздумів, не персональне навчання. Справжні нотатки й матеріали призначить викладач."],"Explore supported practice":["Посмотреть практику с поддержкой","Переглянути практику з підтримкою"],"Rick is presented on the public partnered-tango page as a teacher whose background includes music and body awareness. In this concept, his profile links directly to suitable classes and private-lesson discovery.":["На публичной странице парного танго Рик представлен как преподаватель с музыкальным опытом и вниманием к осознанности тела. В концепции его профиль ведёт к подходящим занятиям и индивидуальным урокам.","На публічній сторінці парного танго Рік представлений як викладач із музичним досвідом та увагою до усвідомленості тіла. У концепції його профіль веде до відповідних занять та індивідуальних уроків."],"Anna is named on the public Tango Ladies page as its instructor. This concept gives her solo-class route a clear introduction, booking flow and a continuation pathway.":["Анна указана преподавателем на публичной странице Tango Ladies. Концепция даёт её сольным занятиям понятное знакомство, запись и продолжение.","Анна вказана викладачкою на публічній сторінці Tango Ladies. Концепція дає її сольним заняттям зрозуміле знайомство, запис і продовження."],"Private attention":["Индивидуальное внимание","Індивідуальна увага"],"This address is listed on the public tango service page. Entrance instructions, accessibility, facilities and the current class schedule must be confirmed with the studio before a real visit.":["Адрес указан на публичной странице танго. Вход, доступность, удобства и актуальное расписание нужно подтвердить со студией перед настоящим визитом.","Адресу вказано на публічній сторінці танго. Вхід, доступність, зручності й актуальний розклад потрібно підтвердити зі студією перед справжнім візитом."],"Open maps":["Открыть карту","Відкрити мапу"],"See this timetable":["Посмотреть расписание","Переглянути розклад"],"Your space.<br><em>A shared experience.</em>":["Ваше пространство.<br><em>Общее впечатление.</em>","Ваш простір.<br><em>Спільне враження.</em>"],"A café, club, cultural venue, employer or local initiative? Explore a hosted tango experience with a clear beginner pathway. This is a demonstration enquiry only.":["Кафе, клуб, культурная площадка, компания или районная инициатива? Обсудим вечер танго с понятным путём для начинающих. Это только демонстрационный запрос.","Кав’ярня, клуб, культурний майданчик, компанія чи районна ініціатива? Обговорімо вечір танго зі зрозумілим шляхом для початківців. Це лише демонстраційний запит."],"Venue / organisation (sample)":["Площадка / организация (пример)","Майданчик / організація (приклад)"],"Format you are exploring":["Интересующий формат","Формат, що цікавить"],"Café / cultural evening":["Кафе / культурный вечер","Кав’ярня / культурний вечір"],"Street / outdoor pop-up":["Уличное / открытое событие","Вулична / відкрита подія"],"Workplace experience":["Событие для команды","Подія для команди"],"Club / hosted social":["Клуб / вечер с ведущим","Клуб / вечір із ведучим"],"Your idea":["Ваша идея","Ваша ідея"],"Tell us about the space and audience (sample information).":["Расскажите о площадке и аудитории (примерные данные).","Розкажіть про майданчик і аудиторію (прикладові дані)."],"Preview partner enquiry":["Пример запроса о партнёрстве","Приклад запиту про партнерство"],"No proposal or message is sent. No venue partnership is created.":["Предложение и сообщение не отправляются. Партнёрство не создаётся.","Пропозиція й повідомлення не надсилаються. Партнерство не створюється."],"The conversation<br><em>starts here.</em>":["Разговор<br><em>начинается здесь.</em>","Розмова<br><em>починається тут.</em>"],"This previews the acknowledgement a venue would receive. In production, a coordinator would review audience fit, costs, capacity, floor suitability, permissions and the next-class pathway. Nothing has been submitted from this prototype.":["Это пример ответа площадке. В рабочем сервисе координатор проверит аудиторию, расходы, вместимость, пол, разрешения и переход к следующим занятиям. Прототип ничего не отправил.","Це приклад відповіді майданчику. У робочому сервісі координатор перевірить аудиторію, витрати, місткість, підлогу, дозволи й перехід до наступних занять. Прототип нічого не надіслав."],"Explore the concepts":["Посмотреть идеи","Переглянути ідеї"],"A conversation<br><em>worth starting.</em>":["Разговор,<br><em>который стоит начать.</em>","Розмова,<br><em>яку варто почати.</em>"],"This is the acknowledgement visitors would see after an enquiry. No message has been sent or personal details stored. A live version would create a consent-aware CRM record and notify the responsible studio team.":["Так выглядел бы ответ после запроса. Сообщение не отправлено, персональные данные не сохранены. В рабочей версии создастся запись CRM с учётом согласия и уведомлением команды.","Так виглядала б відповідь після запиту. Повідомлення не надіслано, персональні дані не збережено. У робочій версії створиться запис CRM з урахуванням згоди й сповіщенням команди."],"Continue exploring":["Продолжить знакомство","Продовжити знайомство"],"Newsletter confirmation preview. No email collected or sent.":["Пример подписки. Адрес не собран, письмо не отправлено.","Приклад підписки. Адресу не зібрано, лист не надіслано."],"One helpful<br><em>next step.</em>":["Один полезный<br><em>следующий шаг.</em>","Один корисний<br><em>наступний крок.</em>"],"Hi there, thank you for your interest in tango. Is there anything you would like to know before choosing a first class? We can clarify the format, price, suitable date or partner arrangements.":["Здравствуйте! Спасибо за интерес к танго. Что хотелось бы узнать перед выбором первого урока? Поможем уточнить формат, цену, подходящую дату и вопрос партнёра.","Вітаємо! Дякуємо за інтерес до танго. Що хотілося б дізнатися перед вибором першого уроку? Допоможемо уточнити формат, ціну, відповідну дату й питання партнера."],"Message template preview only. Production contact requires the appropriate permission and a configured messaging service.":["Только пример шаблона. Настоящая связь требует соответствующего разрешения и подключённого сервиса сообщений.","Лише приклад шаблону. Справжній зв’язок потребує відповідного дозволу й підключеного сервісу повідомлень."],"Copy template":["Скопировать шаблон","Скопіювати шаблон"],"Done":["Готово","Готово"],"Demo calendar file prepared. It is marked tentative, not a real reservation.":["Демо-файл календаря подготовлен. Статус предварительный, не настоящая бронь.","Демо-файл календаря підготовлено. Статус попередній, не справжнє бронювання."],"Proposed event saved as a tentative demo calendar file. No reservation was made.":["Предлагаемое событие сохранено в предварительном демо-календаре. Бронирование не создано.","Запропоновану подію збережено в попередньому демо-календарі. Бронювання не створено."],"Demonstration confirmation prepared.":["Демонстрационное подтверждение подготовлено.","Демонстраційне підтвердження підготовлено."],"Fictional CRM export prepared.":["Экспорт вымышленной CRM подготовлен.","Експорт вигаданої CRM підготовлено."],"Copied.":["Скопировано.","Скопійовано."],"Copy this text":["Скопируйте этот текст","Скопіюйте цей текст"],"A fresh<br><em>beginning?</em>":["Новое<br><em>начало?</em>","Новий<br><em>початок?</em>"],"This clears all fictional orders, local bookings, CRM changes and preferences in this browser, then restores the original sample. It does not affect any real account.":["Все вымышленные заказы, записи, изменения CRM и настройки в браузере будут очищены и заменены исходным примером. Настоящие аккаунты не затрагиваются.","Усі вигадані замовлення, записи, зміни CRM й налаштування в браузері буде очищено й замінено початковим прикладом. Справжні акаунти не зачіпаються."],"Keep exploring":["Продолжить знакомство","Продовжити знайомство"],"Reset demo":["Сбросить демо","Скинути демо"],"A little guidance":["Немного поддержки","Трохи підтримки"],"Guided helper · not live AI or chat":["Помощник по правилам · не настоящий ИИ или чат","Помічник за правилами · не справжній ШІ чи чат"],"A little curious? A little nervous? Both are welcome. Let us find a class that feels right, or answer what is on your mind.":["Немного любопытства? Немного волнения? И тому, и другому здесь рады. Найдём подходящее занятие или ответим на ваш вопрос.","Трохи цікавості? Трохи хвилювання? І тому, і тому тут раді. Знайдімо відповідне заняття чи відповімо на ваше запитання."],"What does it cost?":["Сколько это стоит?","Скільки це коштує?"],"Where are you?":["Где вы находитесь?","Де ви розташовані?"],"Ask the studio":["Спросить студию","Запитати студію"],"The published Ladies trial is 29 PLN; four Ladies classes are 220 PLN. The Polish partnered-tango page lists four classes at 260 PLN per person or 440 PLN per couple. All checkout here is simulated and live prices require confirmation.":["Опубликованный пробный урок Ladies — 29 PLN, четыре занятия — 220 PLN. На польской странице парного танго: четыре урока — 260 PLN за человека или 440 PLN за пару. Всё оформление здесь демонстрационное; актуальные цены нужно подтвердить.","Опублікований пробний урок Ladies — 29 PLN, чотири заняття — 220 PLN. На польській сторінці парного танго: чотири уроки — 260 PLN за особу або 440 PLN за пару. Усе оформлення тут демонстраційне; актуальні ціни потрібно підтвердити."],"The public tango pages list Abrahama 12 in Gocław and Solec 38 in Warsaw. Check your chosen class location and confirm actual access arrangements before a real visit.":["На публичных страницах танго указаны Abrahama 12 в Гоцлаве и Solec 38 в Варшаве. Проверьте место выбранного занятия и условия входа до настоящего визита.","На публічних сторінках танго вказано Abrahama 12 у Гоцлаві й Solec 38 у Варшаві. Перевірте місце обраного заняття й умови входу до справжнього візиту."],"A considerate check-in":["Бережное сообщение","Дбайливе повідомлення"],"Hi Alex, we missed you at the last class. We hope everything is okay. Your next session is available in your member area. Let us know if the timing no longer works, so we can discuss a suitable option.":["Алекс, здравствуйте! Нам вас не хватало на прошлом уроке. Надеемся, всё хорошо. Следующее занятие — в вашем кабинете. Сообщите, если время больше не подходит: обсудим удобный вариант.","Алекс, вітаємо! Нам вас бракувало на минулому уроці. Сподіваємося, усе гаразд. Наступне заняття — у вашому кабінеті. Повідомте, якщо час більше не підходить: обговоримо зручний варіант."],"Template preview only. No message is sent.":["Только пример шаблона. Сообщение не отправляется.","Лише приклад шаблону. Повідомлення не надсилається."],"Editorial tango photograph, used for atmosphere; not AuraTango students":["Иллюстративная фотография танго, не ученики AuraTango","Ілюстративна фотографія танго, не учні AuraTango"],"ARGENTINE TANGO / WARSAW":["АРГЕНТИНСКОЕ ТАНГО / ВАРШАВА","АРГЕНТИНСЬКЕ ТАНГО / ВАРШАВА"],"<span class=\"line\">Some things</span><span class=\"line\">are better</span><em>felt.</em>":["<span class=\"line\">Некоторые вещи</span><span class=\"line\">лучше</span><em>почувствовать.</em>","<span class=\"line\">Деякі речі</span><span class=\"line\">краще</span><em>відчути.</em>"],"Step out of your day. Into the music.<br>Find a little more connection—with someone else, or with yourself.":["Оставьте день за дверью. Войдите в музыку.<br>Найдите немного больше близости — с другим человеком или с собой.","Залиште день за дверима. Увійдіть у музику.<br>Знайдіть трохи більше близькості — з іншою людиною чи із собою."],"Find my first class":["Найти первое занятие","Знайти перше заняття"],"Meet the feeling":["Почувствовать атмосферу","Відчути атмосферу"],"No experience needed. Just a little curiosity.":["Опыт не нужен. Достаточно любопытства.","Досвід не потрібен. Достатньо цікавості."],"EDITORIAL PHOTOGRAPHY":["ИЛЛЮСТРАТИВНАЯ ФОТОГРАФИЯ","ІЛЮСТРАТИВНА ФОТОГРАФІЯ"],"A NEW KIND OF EVENING":["ДРУГОЙ ВЕЧЕР","ІНШИЙ ВЕЧІР"],"No perfect steps.<br><em>Just your first one.</em>":["Не идеальные шаги.<br><em>Всего лишь первый.</em>","Не ідеальні кроки.<br><em>Лише перший.</em>"],"Explore the classes":["Познакомиться с занятиями","Познайомитися із заняттями"],"WARSAW / GOCŁAW & SOLEC":["ВАРШАВА / ГОЦЛАВ И СОЛЕЦ","ВАРШАВА / ГОЦЛАВ І СОЛЕЦЬ"],"SOLO. TOGETHER. YOUR WAY.":["СОЛО. ВМЕСТЕ. ПО-ВАШЕМУ.","СОЛО. РАЗОМ. ПО-ВАШОМУ."],"A LITTLE MORE TO DISCOVER":["ЕЩЁ НЕМНОГО ОТКРЫТИЙ","ЩЕ ТРОХИ ВІДКРИТТІВ"],"A little less everyday":["Чуть меньше повседневности","Трохи менше буденності"],"Not here to impress.<br><em>Here to feel alive.</em>":["Не ради впечатления.<br><em>Ради ощущения жизни.</em>","Не заради враження.<br><em>Заради відчуття життя.</em>"],"You do not have to be a dancer. You do not have to have it all figured out. Bring a little curiosity. There is room here for your first step—and for whatever comes after.":["Не нужно быть танцором или знать все ответы. Приходите с любопытством. Здесь есть место вашему первому шагу и тому, что будет дальше.","Не потрібно бути танцівником чи знати всі відповіді. Приходьте з цікавістю. Тут є місце вашому першому кроку й тому, що буде далі."],"Come as you are.":["Приходите собой.","Приходьте собою."],"Find your rhythm. Leave the noise. Feel the music. Come as you are.":["Найдите ритм. Оставьте шум. Почувствуйте музыку. Будьте собой.","Знайдіть ритм. Залиште шум. Відчуйте музику. Будьте собою."],"Find your rhythm":["Найдите свой ритм","Знайдіть свій ритм"],"Leave the noise":["Оставьте шум","Залиште шум"],"Feel the music":["Почувствуйте музыку","Відчуйте музику"],"Come as you are":["Будьте собой","Будьте собою"],"FIND YOUR BEGINNING":["НАЙДИТЕ СВОЁ НАЧАЛО","ЗНАЙДІТЬ СВІЙ ПОЧАТОК"],"Your kind of<br><em>connection.</em>":["Близость.<br><em>По-вашему.</em>","Близькість.<br><em>По-вашому.</em>"],"A moment that is yours. An evening to share.<br>A little attention that changes how you move.<br>There is more than one way to begin.":["Мгновение для себя. Вечер вдвоём.<br>Внимание, которое меняет движение.<br>Начать можно по-разному.","Мить для себе. Вечір удвох.<br>Увага, яка змінює рух.<br>Почати можна по-різному."],"<strong>A little unsure?</strong> That is a perfectly good place to start.":["<strong>Немного сомнений?</strong> Это тоже хорошее начало.","<strong>Трохи сумнівів?</strong> Це теж гарний початок."],"Help me choose my class":["Помочь выбрать занятие","Допомогти обрати заняття"],"FIRST, FEEL AT EASE":["СНАЧАЛА ПОЧУВСТВУЙТЕ СЕБЯ СПОКОЙНО","СПОЧАТКУ ВІДЧУЙТЕ СЕБЕ СПОКІЙНО"],"Your first step<br>isn’t a performance.<br><em>It’s a beginning.</em>":["Первый шаг —<br>не выступление.<br><em>Это начало.</em>","Перший крок —<br>не виступ.<br><em>Це початок.</em>"],"A little nervous is welcome, too. We make the practical things clear, so you can leave a little room for the unexpected.":["Небольшому волнению здесь тоже рады. Практические детали понятны, чтобы осталось место приятному неожиданному.","Невеликому хвилюванню тут теж раді. Практичні деталі зрозумілі, щоб залишилося місце приємному несподіваному."],"Your first-visit guide":["Перед первым визитом","Перед першим візитом"],"Follow your curiosity.":["Следуйте любопытству.","Ідіть за цікавістю."],"Choose solo, partnered or private. See your teacher, the place, the price and what your first lesson will feel like.":["Выберите соло, пару или индивидуальный урок. Узнайте преподавателя, место, цену и формат первого занятия.","Оберіть соло, пару чи індивідуальний урок. Дізнайтеся про викладача, місце, ціну й формат першого заняття."],"Let the first step be simple.":["Пусть первый шаг будет простым.","Нехай перший крок буде простим."],"Pick a time that works for you. Your confirmation brings the details together. Applying solo for partnered tango? We explain matching before any payment.":["Выберите удобное время. Подтверждение соберёт детали вместе. Подаёте индивидуальную заявку на парное танго? Подбор партнёра объясняется до оплаты.","Оберіть зручний час. Підтвердження збере деталі разом. Подаєте індивідуальну заявку на парне танго? Добір партнера пояснюється до оплати."],"Find a reason to return.":["Найдите повод вернуться.","Знайдіть привід повернутися."],"A movement that feels easier. A face you recognise. A song you look forward to. Keep your bookings, progress and next steps together in your member space.":["Движение становится легче. Появляются знакомые лица и любимые мелодии. Записи, прогресс и следующие шаги собраны в вашем кабинете.","Рух стає легшим. З’являються знайомі обличчя й улюблені мелодії. Записи, поступ і наступні кроки зібрано у вашому кабінеті."],"THE CITY CAN WAIT":["ГОРОД МОЖЕТ ПОДОЖДАТЬ","МІСТО МОЖЕ ПОЧЕКАТИ"],"Good nights.<br><em>Great beginnings.</em>":["Хорошие вечера.<br><em>Прекрасные начала.</em>","Гарні вечори.<br><em>Чудові початки.</em>"],"A café that becomes a dance floor. A Sunday that stays with you. Make room for a different kind of plan.":["Кафе становится танцполом. Воскресенье остаётся в памяти. Найдите место другому плану.","Кав’ярня стає танцмайданчиком. Неділя залишається в пам’яті. Знайдіть місце іншому плану."],"Find an evening to remember":["Найти памятный вечер","Знайти пам’ятний вечір"],"A glimpse of what could be: all event dates, venues and availability below are illustrative, not confirmed public events.":["Взгляд на возможное: даты, площадки и места ниже иллюстративные, не подтверждённые публичные события.","Погляд на можливе: дати, майданчики й місця нижче ілюстративні, не підтверджені публічні події."],"Rick and Anna, photograph from their public Tango Ladies page":["Рик и Анна, фото с публичной страницы Tango Ladies","Рік і Анна, фото з публічної сторінки Tango Ladies"],"THE PEOPLE BEHIND YOUR FIRST STEP":["ЛЮДИ ЗА ВАШИМ ПЕРВЫМ ШАГОМ","ЛЮДИ ЗА ВАШИМ ПЕРШИМ КРОКОМ"],"WITH YOU, FROM THE START":["С ВАМИ С САМОГО НАЧАЛА","З ВАМИ ВІД САМОГО ПОЧАТКУ"],"The steps<br>can be taught.<br><em>The feeling is shared.</em>":["Шагам<br>можно научить.<br><em>Чувствами делятся.</em>","Кроків<br>можна навчити.<br><em>Почуттями діляться.</em>"],"Behind the music, there are people. Meet Rick and Anna, and discover the teachers behind partnered tango and Tango Ladies. Ask your questions. Find your pace. Begin a conversation.":["За музыкой стоят люди. Познакомьтесь с Риком и Анной, преподавателями парного танго и Tango Ladies. Задавайте вопросы, находите свой темп и начинайте разговор.","За музикою стоять люди. Познайомтеся з Ріком і Анною, викладачами парного танго й Tango Ladies. Ставте запитання, знаходьте свій темп і починайте розмову."],"Meet the people, not just the steps":["Познакомьтесь с людьми, не только с шагами","Познайомтеся з людьми, не лише з кроками"],"A LITTLE REASSURANCE":["НЕМНОГО УВЕРЕННОСТИ","ТРОХИ ВПЕВНЕНОСТІ"],"Less wondering.<br><em>More looking forward.</em>":["Меньше вопросов.<br><em>Больше предвкушения.</em>","Менше запитань.<br><em>Більше передчуття.</em>"],"Everything for your first visit":["Всё для первого визита","Усе для першого візиту"],"What if I have never danced before?":["А если я никогда не танцевал(а)?","А якщо я ніколи не танцював/танцювала?"],"Come on your own. Or make it your time together.":["Приходите самостоятельно. Или проведите время вместе.","Приходьте самостійно. Або проведіть час разом."],"That first good feeling. What comes after?":["То самое первое ощущение. Что дальше?","Те саме перше відчуття. Що далі?"],"FOR YOURSELF":["ДЛЯ СЕБЯ","ДЛЯ СЕБЕ"],"A little closer<br><em>to yourself.</em>":["Чуть ближе<br><em>к себе.</em>","Трохи ближче<br><em>до себе.</em>"],"Solo · First lesson 29 PLN":["Соло · первый урок 29 PLN","Соло · перший урок 29 PLN"],"FOR THE TWO OF YOU":["ДЛЯ ВАС ДВОИХ","ДЛЯ ВАС ДВОХ"],"Say more.<br><em>Without a word.</em>":["Скажите больше.<br><em>Без единого слова.</em>","Скажіть більше.<br><em>Без жодного слова.</em>"],"Together, or apply for a solo place":["Вместе или с заявкой на подбор партнёра","Разом або із заявкою на добір партнера"],"AT YOUR OWN PACE":["В ВАШЕМ ТЕМПЕ","У ВАШОМУ ТЕМПІ"],"Your rhythm.<br><em>Our attention.</em>":["Ваш ритм.<br><em>Наше внимание.</em>","Ваш ритм.<br><em>Наша увага.</em>"],"Personal guidance · Your goals":["Личные подсказки · ваши цели","Особисті підказки · ваші цілі"],"LEAVE A LITTLE ROOM FOR JOY":["ОСТАВЬТЕ НЕМНОГО МЕСТА РАДОСТИ","ЗАЛИШТЕ ТРОХИ МІСЦЯ РАДОСТІ"],"Your week.<br><em>A little more alive.</em>":["Ваша неделя.<br><em>Чуть больше жизни.</em>","Ваш тиждень.<br><em>Трохи більше життя.</em>"],"A new beginning. An evening worth stepping out for. A quiet nudge to make time for yourself. Stay close to what is next at AuraTango.":["Новое начало. Вечер, ради которого стоит выйти. Мягкое напоминание о времени для себя. Будьте рядом с тем, что готовит AuraTango.","Новий початок. Вечір, заради якого варто вийти. М’яке нагадування про час для себе. Будьте поруч із тим, що готує AuraTango."],"Your email address":["Ваш адрес электронной почты","Ваша адреса електронної пошти"],"Keep me close":["Оставаться рядом","Залишатися поруч"],"Prototype only. No email is collected or sent.":["Только прототип. Адрес не собирается, письма не отправляются.","Лише прототип. Адреса не збирається, листи не надсилаються."],"A little less noise.<br>A little more connection.<br>Argentine tango, in your own rhythm.":["Чуть меньше шума.<br>Чуть больше близости.<br>Аргентинское танго в вашем ритме.","Трохи менше шуму.<br>Трохи більше близькості.<br>Аргентинське танго у вашому ритмі."],"Find your time":["Найдите время","Знайдіть час"],"First time here?":["Впервые здесь?","Уперше тут?"],"A little more life":["Чуть больше жизни","Трохи більше життя"],"Nights & city moments":["Вечера и городские мгновения","Вечори й міські миті"],"Practice & community":["Практика и сообщество","Практика й спільнота"],"Give someone a feeling":["Подарите кому-то ощущение","Подаруйте комусь відчуття"],"Rick & Anna":["Рик и Анна","Рік і Анна"],"Bring tango to your venue":["Пригласите танго на свою площадку","Запросіть танго на свій майданчик"],"Come a little closer":["Станьте немного ближе","Станьте трохи ближче"],"Locations & a conversation":["Адреса и разговор","Адреси й розмова"],"Privacy & cookies":["Приватность и cookies","Приватність і cookies"],"Booking conditions":["Условия записи","Умови запису"],"About this prototype":["Об этом прототипе","Про цей прототип"],"Move closer.":["Чуть ближе.","Трохи ближче."],"Interactive design concept. Not a live booking service.":["Интерактивная концепция дизайна. Не настоящий сервис записи.","Інтерактивна концепція дизайну. Не справжній сервіс запису."],"For your first step. And the feeling after.":["Для первого шага. И чувства после.","Для першого кроку. І почуття після."],"Not a perfect step.<br><em>A real feeling.</em>":["Не идеальный шаг.<br><em>Настоящее чувство.</em>","Не ідеальний крок.<br><em>Справжнє почуття.</em>"],"Imagine an hour where the noise of the day gets a little quieter. A rhythm you can follow. Someone who has time for your questions. That is the beginning we want to invite you into.":["Представьте час, в котором шум дня становится тише. Ритм, которому можно следовать. Человека, у которого есть время для ваших вопросов. В такое начало мы приглашаем вас.","Уявіть годину, у якій шум дня стає тихішим. Ритм, за яким можна йти. Людину, яка має час для ваших запитань. У такий початок ми запрошуємо вас."],"Editorial tango image":["Иллюстративное фото танго","Ілюстративне фото танго"],"A little less noise. A little more you.":["Чуть меньше шума. Чуть больше вас.","Трохи менше шуму. Трохи більше вас."],"Feel welcome.":["Почувствуйте, что вам рады.","Відчуйте, що вам раді."],"Beginner routes with a clear first step.":["Понятный первый шаг для начинающих.","Зрозумілий перший крок для початківців."],"Move your way.":["Двигайтесь по-своему.","Рухайтеся по-своєму."],"Solo, partnered or personal guidance.":["Соло, в паре или с личной поддержкой.","Соло, у парі або з особистою підтримкою."],"Stay curious.":["Сохраняйте любопытство.","Зберігайте цікавість."],"Practice, people and something to return to.":["Практика, люди и повод вернуться.","Практика, люди й привід повернутися."],"What to expect":["Чего ожидать","Чого очікувати"],"First-class guide":["Путеводитель по первому уроку","Путівник першим уроком"],"Studio preview":["Демо студии","Демо студії"],"Book your first step":["Записаться на первый шаг","Записатися на перший крок"],"Argentine Tango in Warsaw":["Аргентинское танго в Варшаве","Аргентинське танго у Варшаві"],"Some things are better felt.":["Некоторые вещи лучше почувствовать.","Деякі речі краще відчути."],"Interactive concept, not a live service.":["Интерактивная концепция, не рабочий сервис.","Інтерактивна концепція, не робочий сервіс."],"Prototype notes":["О прототипе","Про прототип"],"A neighbourhood setting for your weekly pause.":["Районная студия для вашей еженедельной паузы.","Районна студія для вашої щотижневої паузи."],"A little more connection in the heart of your week.":["Чуть больше близости посреди вашей недели.","Трохи більше близькості посеред вашого тижня."],"No partner. No pressure. An hour that belongs to you.":["Без партнёра. Без давления. Час, который принадлежит вам.","Без партнера. Без тиску. Година, яка належить вам."],"Solo · Absolute beginners":["Соло · с нуля","Соло · із нуля"],"For the part of you that wants a little space. Explore rhythm, balance and expression without a partner or a performance to prepare for. You, the music, and permission to move in your own way.":["Для той части вас, которой нужно немного пространства. Откройте ритм, равновесие и выразительность без партнёра и подготовки к выступлению. Вы, музыка и возможность двигаться по-своему.","Для тієї частини вас, якій потрібно трохи простору. Відкрийте ритм, рівновагу й виразність без партнера й підготовки до виступу. Ви, музика й можливість рухатися по-своєму."],"Argentine Tango":["Аргентинское танго","Аргентинське танго"],"One shared rhythm. A little closer to each other.":["Один общий ритм. Чуть ближе друг к другу.","Один спільний ритм. Трохи ближче одне до одного."],"Partnered · From the beginning":["В паре · с самого начала","У парі · від самого початку"],"Learn to listen, move and connect, one step at a time. Join as a couple, or tell us your preferred role so we can check a suitable place for you.":["Учитесь слушать, двигаться и чувствовать связь, шаг за шагом. Приходите парой или сообщите предпочитаемую роль, чтобы мы проверили подходящее место.","Вчіться слухати, рухатися й відчувати зв’язок, крок за кроком. Приходьте парою або повідомте бажану роль, щоб ми перевірили відповідне місце."],"Your questions matter. Your pace matters. This is your time.":["Ваши вопросы важны. Ваш темп важен. Это ваше время.","Ваші запитання важливі. Ваш темп важливий. Це ваш час."],"Personal · All levels":["Индивидуально · все уровни","Індивідуально · усі рівні"],"A focused session shaped around your goals. Explore the basics, revisit a movement or work on musicality with individual guidance.":["Занятие вокруг ваших целей. Изучите основы, вернитесь к движению или поработайте над музыкальностью с личными подсказками.","Заняття навколо ваших цілей. Вивчіть основи, поверніться до руху або попрацюйте над музикальністю з особистими підказками."],"Familiar faces. Patient practice. A little more courage each time.":["Знакомые лица. Терпеливая практика. Каждый раз чуть больше смелости.","Знайомі обличчя. Терпляча практика. Щоразу трохи більше сміливості."],"Practice · Welcoming & social":["Практика · тепло и общение","Практика · тепло й спілкування"],"A relaxed place to revisit what you have learned, ask questions and enjoy dancing together. Your first social steps, with support nearby.":["Спокойное место для повторения, вопросов и радости совместного танца. Первые шаги на танцевальном вечере — с поддержкой рядом.","Спокійне місце для повторення, запитань і радості спільного танцю. Перші кроки на танцювальному вечорі — з підтримкою поруч."],"Tango, after hours":["Танго после заката","Танго після заходу сонця"],"Tango,<br>after hours.":["Танго<br>после заката.","Танго<br>після заходу сонця."],"Café evening":["Вечер в кафе","Вечір у кав’ярні"],"Partner café · Warsaw":["Кафе-партнёр · Варшава","Кав’ярня-партнер · Варшава"],"An early-evening introduction, a first dance and conversation. A proposed café partnership—not a confirmed public event.":["Знакомство ранним вечером, первый танец и разговор. Предложение сотрудничества с кафе — не подтверждённое публичное событие.","Знайомство раннього вечора, перший танець і розмова. Пропозиція співпраці з кав’ярнею — не підтверджена публічна подія."],"A city. A song. A first step.":["Город. Мелодия. Первый шаг.","Місто. Мелодія. Перший крок."],"Meet me<br>in the city.":["Встретимся<br>в городе.","Зустріньмося<br>у місті."],"City pop-up":["Городская встреча","Міська зустріч"],"Managed city space · TBC":["Городская площадка · уточняется","Міський майданчик · уточнюється"],"Stop for a few minutes. Leave with your first tango step. An outdoor activation concept, subject to space approval and weather.":["Остановитесь на несколько минут. Уходите с первым шагом танго. Идея открытого события зависит от разрешения на площадку и погоды.","Зупиніться на кілька хвилин. Ідіть із першим кроком танго. Ідея відкритої події залежить від дозволу на майданчик і погоди."],"Sunday, together":["Воскресенье вместе","Неділя разом"],"A slower<br>Sunday.":["Воскресенье<br>без спешки.","Неділя<br>без поспіху."],"Beginner practice":["Практика для начинающих","Практика для початківців"],"Solec · studio session":["Солец · занятие в студии","Солець · заняття у студії"],"A hosted practice for your next small breakthrough. Come to revise, ask a teacher or bring a curious friend. Sample programme awaiting approval.":["Практика с ведущим для следующего маленького открытия. Повторите шаги, спросите преподавателя или приведите любопытного друга. Примерная программа ожидает утверждения.","Практика з ведучим для наступного маленького відкриття. Повторіть кроки, запитайте викладача або приведіть цікавого друга. Прикладова програма очікує затвердження."],"An hour that is<br><em>entirely yours.</em>":["Час, который<br><em>целиком ваш.</em>","Година, яка<br><em>цілком ваша.</em>"],"Less small talk.<br><em>More connection.</em>":["Меньше слов.<br><em>Больше близости.</em>","Менше слів.<br><em>Більше близькості.</em>"],"Your questions.<br><em>Our full attention.</em>":["Ваши вопросы.<br><em>Наше полное внимание.</em>","Ваші запитання.<br><em>Наша повна увага.</em>"],"A familiar song.<br><em>A little more courage.</em>":["Знакомая мелодия.<br><em>Чуть больше смелости.</em>","Знайома мелодія.<br><em>Трохи більше сміливості.</em>"],"After<br><em>hours.</em>":["После<br><em>заката.</em>","Після<br><em>заходу сонця.</em>"],"Hello,<br><em>Warsaw.</em>":["Привет,<br><em>Варшава.</em>","Привіт,<br><em>Варшаво.</em>"],"Slow<br><em>Sunday.</em>":["Без спешки.<br><em>Воскресенье.</em>","Без поспіху.<br><em>Неділя.</em>"],"Prices & packages":["Цены и абонементы","Ціни й абонементи"],"Gift cards":["Подарочные сертификаты","Подарункові сертифікати"],"Contact":["Контакты","Контакти"]};

function txt(x){return Array.isArray(x)?x[state.lang==='pl'?1:0]:x}function price(n){return `${n.toLocaleString(LOCALE())} <small style="font:inherit;">PLN</small>`}function money(n){return n.toLocaleString(LOCALE())+' PLN'}
function dateLabel(d,opts={day:'numeric',month:'short'}){return new Date(d+'T12:00:00').toLocaleDateString(LOCALE(),opts)}
function photo(key,cls='',alt='',loading='lazy'){return `<img class="${cls}" src="${asset[key]||asset.hero}" alt="${ESC(alt||T('Tango editorial photography','Fotografia tanga'))}" loading="${loading}" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.classList.add('image-unavailable')">`}
function route(){return (location.hash.slice(1)||'/').split('?')[0]}function navigate(path){if(route()===path){render();window.scrollTo(0,0)}else location.hash=path}
const A=(path,label,icon='arrow',style='btn')=>`<a class="${style}" href="#${path}">${label}${icon?I(icon):''}</a>`;
function header(){let r=route();return `<div class="demo-strip"><span class="demo-dot"></span>${T('Interactive concept · Sample dates, availability & payments','Koncepcja interaktywna · Przykładowe terminy, miejsca i płatności')}<button onclick="showInfo()">${T('About this demo','O wersji demo')}</button></div><header class="header"><div class="wrap nav">${logo()}<nav class="nav-links" aria-label="Main navigation">${[['/classes',T('Learn tango','Nauka tanga')],['/timetable',T('Timetable','Grafik')],['/events',T('Nights & moments','Wieczory i spotkania')],['/story',T('The people','Ludzie')],['/guide',T('New to tango?','Pierwszy raz?')]].map(([url,name])=>`<a href="#${url}" class="${(r.startsWith(url)||(url==='/classes'&&r.startsWith('/class/')))?'active':''}">${name}</a>`).join('')}</nav><div class="nav-actions"><button class="lang" onclick="switchLang()" aria-label="${T('Switch to Polish','Zmień na angielski')}">${state.lang==='en'?'<strong>EN</strong> / PL':'EN / <strong>PL</strong>'}</button><a class="nav-user" href="#${state.member?'/member':'/login'}">${I('user')}<span>${state.member?T('My studio','Moje konto'):T('Sign in','Zaloguj się')}</span></a><button class="btn sm" onclick="openQuiz()">${T('Begin here','Zacznij tutaj')}${I('up')}</button><button class="round-button mobile-menu" onclick="mobileMenu()" aria-label="Menu">${I('menu')}</button></div></div></header>`}
function pageHead(title,desc,eyebrow='AuraTango · Warsaw',action=''){return `<section class="page-head"><div class="wrap"><div class="breadcrumb"><a href="#/">AuraTango</a>${I('chevron')}<span>${ESC(eyebrow)}</span></div><div class="eyebrow">${ESC(eyebrow)}</div><h1>${title}</h1>${desc?`<p class="lead">${desc}</p>`:''}${action}</div></section>`}
function classCard(id){let c=classes[id];return `<a href="#/class/${id}" class="class-card reveal"><div class="card-photo">${photo(c.photo,'',txt(c.name))}<span class="pill">${txt(c.tag)}</span><span class="photo-caption">${txt(c.subtitle)}</span></div><div class="card-body"><h3>${txt(c.name)}</h3><p>${id==='ladies'?T('An hour without a to-do list. Just you, the music, and room to find your own way of moving.','Godzina bez listy obowiązków. Ty, muzyka i miejsce, by odnaleźć własny sposób poruszania się.'):id==='partnered'?T('Turn a shared evening into a conversation without words. Come as a couple, or ask us about a matched solo place.','Zamień wspólny wieczór w rozmowę bez słów. Przyjdźcie razem albo zapytaj o dopasowane miejsce solo.'):txt(c.desc)}</p><div class="card-bottom"><div class="price">${price(c.price)}<small>${id==='ladies'?T('introductory lesson','lekcja próbna'):id==='partnered'?T('4 lessons / person','4 lekcje / osoba'):T('proposed demo price','proponowana cena demo')}</small></div><span class="round-button" aria-hidden="true">${I('up')}</span></div></div></a>`}
function eventCard(e){return `<a href="#/event/${e.id}" class="event-card reveal"><div class="event-art ${e.color}"><div class="poster-title">${txt(e.poster)}</div><span class="poster-caption">AURATANGO · ${dateLabel(e.date).toUpperCase()} · ${e.time}</span></div><div class="card-body"><div class="event-meta">${I('calendar')}${dateLabel(e.date)} · ${txt(e.typeName)}</div><h3 style="">${txt(e.name)}</h3><p>${txt(e.venue)}</p><div class="card-bottom"><span class="pill peach">${T('Proposed event · demo','Proponowane wydarzenie · demo')}</span><span class="round-button">${I('up')}</span></div></div></a>`}
function faqItems(){return [[T('Do I need a partner?','Czy potrzebuję partnera?'),T('Tango Ladies is a solo class. For partnered tango, you can join as a couple or apply for a solo place. A solo application is not a confirmed match; the booking flow clearly separates the waiting list from confirmed enrolment.','Tango dla kobiet to zajęcia solo. Na tango w parze można zapisać się razem lub zgłosić indywidualnie. Zgłoszenie solo nie gwarantuje dopasowania — lista oczekujących i potwierdzony zapis są wyraźnie rozdzielone.')],[T('Can I start with no dance experience?','Czy mogę zacząć bez doświadczenia?'),T('Choose a class marked “absolute beginners”. The proposed foundation pathway begins with walking, balance and listening to music, then builds from there. Teaching teams must approve the final curriculum.','Wybierz zajęcia „od podstaw”. Proponowana ścieżka zaczyna się od chodzenia, równowagi i słuchania muzyki. Ostateczny program wymaga zatwierdzenia przez instruktorów.')],[T('What should I wear?','W co się ubrać?'),T('Wear comfortable clothes that let you move, and secure shoes. You do not need to buy special dance shoes before your first visit. Ask the studio about the surface and any specific footwear guidance.','Wybierz wygodny strój i stabilne obuwie. Nie musisz kupować butów tanecznych przed pierwszą wizytą. Zapytaj studio o podłogę i zalecenia dotyczące obuwia.')],[T('What happens after my first lesson?','Co po pierwszej lekcji?'),T('Your member area connects the introductory lesson to a foundation package, the next suitable session and supported practice. You can review your progress and choose the next module without an automatic subscription.','Panel kursanta łączy lekcję próbną z pakietem podstawowym, kolejnymi zajęciami i praktyką. Możesz sprawdzać postępy i wybrać następny moduł bez automatycznej subskrypcji.')],[T('Can I change or cancel a booking?','Czy mogę zmienić lub odwołać rezerwację?'),T('The prototype lets you reschedule or cancel a sample booking from My classes. It restores a demonstration credit only if that booking originally used one. Live cancellation deadlines, refunds and legal terms must be approved before launch.','W prototypie możesz zmieniać i odwoływać przykładowe rezerwacje w zakładce Moje zajęcia. Punkt wraca tylko wtedy, gdy został wcześniej użyty. Rzeczywiste terminy anulacji, zwroty i regulamin wymagają zatwierdzenia.')],[T('Are these real dates and live payments?','Czy terminy i płatności są prawdziwe?'),T('No. This is a working website concept. All availability, intakes, events, member records and transactions are simulated. Published Ladies and partnered package prices are used for context; final commercial details must be confirmed by AuraTango.','Nie. To interaktywna koncepcja strony. Dostępność, nabory, wydarzenia, konta i transakcje są symulowane. Ceny zajęć dla kobiet i pakietów tanga pochodzą ze stron publicznych; ostateczne warunki musi potwierdzić AuraTango.')]]}
function faqs(limit=6){return `<div class="faq-wrap">${faqItems().slice(0,limit).map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`}
function classesPage(){return `${pageHead(T('A first step.<br><em>Entirely your own.</em>','Pierwszy krok.<br><em>Całkiem po Twojemu.</em>'),T('A quiet hour for yourself. A shared rhythm with someone else. Find the beginning that feels like you, with the details you need to feel at ease.','Spokojna godzina dla siebie. Wspólny rytm z drugą osobą. Znajdź początek, który pasuje do Ciebie — ze szczegółami, dzięki którym poczujesz się swobodnie.'),T('Find your class','Wybierz zajęcia'))}<section class="section-sm"><div class="wrap"><div class="filter-bar">${[['all',T('All classes','Wszystkie')],['solo',T('Solo','Solo')],['couples',T('Partnered','W parze')],['private',T('Private','Indywidualnie')],['community',T('Practice','Praktyka')]].map(([v,l])=>`<button class="filter-chip ${state.classFilter===v?'active':''}" onclick="state.classFilter='${v}';render()">${l}</button>`).join('')}</div><div class="grid2">${Object.keys(classes).filter(id=>state.classFilter==='all'||classes[id].category===state.classFilter).map(classCard).join('')}</div><div class="callout"><div><h3>${T('You do not have to choose alone.','Nie musisz wybierać samodzielnie.')}</h3><p>${T('Three small questions. A beginning that feels a little more like you.','Trzy proste pytania. Początek trochę bardziej dopasowany do Ciebie.')}</p></div><button class="btn" onclick="openQuiz()">${T('Find my fit','Znajdź coś dla mnie')}${I('spark')}</button></div></div></section>`}
function classPage(id){let c=classes[id];if(!c)return notFound();return `${pageHead(txt(c.feelingTitle||c.name),txt(c.subtitle),txt(c.name))}<div class="mobile-class-cta"><div><strong>${money(c.price)}</strong><small>${id==='ladies'?T('First lesson','Pierwsza lekcja'):id==='partnered'?T('4 classes / person','4 zajęcia / osoba'):T('Demo price','Cena demo')}</small></div><button class="btn" onclick="startBooking('${id}')">${T('Choose my date','Wybierz termin')}${I('up')}</button></div><section class="section-sm"><div class="wrap detail-layout"><div class="detail-body"><div class="detail-hero">${photo(c.photo,'',txt(c.name))}<span class="pill">${txt(c.tag)}</span></div><h2>${T('Not just a lesson.<br><em>A moment that is yours.</em>','Nie tylko lekcja.<br><em>Chwila, która jest Twoja.</em>')}</h2><p>${txt(c.desc)}</p><div class="feature-grid">${[['clock',`${c.duration} ${T('minutes per session','minut zajęć')}`],['pin',T('Gocław & Solec, Warsaw','Gocław i Solec, Warszawa')],['user',c.teacher],['heart',id==='ladies'?T('No partner needed','Bez partnera'):id==='partnered'?T('Couples or matched solo places','Pary lub dopasowane osoby solo'):T('Support at your pace','Wsparcie w Twoim tempie')]].map(([i,l])=>`<div class="feature">${I(i)}${l}</div>`).join('')}</div><h2>${T('Small discoveries.<br><em>A feeling of moving forward.</em>','Małe odkrycia.<br><em>Poczucie, że idziesz dalej.</em>')}</h2><p>${T('An illustrative foundation pathway. Your teacher adapts the pace to the group; the final programme needs studio approval.','Przykładowa ścieżka podstawowa. Instruktor dostosowuje tempo do grupy; program wymaga zatwierdzenia studia.')}</p><div class="syllabus">${[[T('Find your balance','Znajdź równowagę'),T('Walking, posture and becoming comfortable with movement.','Chodzenie, postawa i swoboda ruchu.')],[T('Listen to the music','Usłysz muzykę'),T('Notice the beat and give your movement a little intention.','Poczuj rytm i nadaj ruchom intencję.')],[T('Connect the movement','Połą function scheduleData(){let shift=state.week*7;const defs=[['ladies','2026-10-06','18:00','goclaw',6,'PL / EN',false],['partnered','2026-10-07','18:15','goclaw',4,'EN',true],['ladies','2026-10-08','18:00','goclaw',3,'PL / EN',false],['ladies','2026-10-10','10:00','solec',5,'PL / EN',false],['private','2026-10-10','12:00','solec',1,'EN',false],['partnered','2026-10-11','15:00','solec',0,'EN',true],['practice','2026-10-11','17:00','solec',8,'PL / EN',false]];return defs.map(([id,d,t,loc,seats,language,match])=>{let date=new Date(d+'T12:00:00');date.setDate(date.getDate()+shift);return {id,date:date.toISOString().slice(0,10),time:t,location:loc,seats,language,match}})}

function eventsPage(){return `${pageHead(T('Go out.<br><em>Feel something.</em>','Wyjdź z domu.<br><em>Poczuj coś więcej.</em>'),T('Not another night you scroll through. A café, a shared rhythm, a new face. Explore the evenings we would love to bring to life. All events shown are proposed concepts.','Nie kolejny wieczór przed ekranem. Kawiarnia, wspólny rytm, nowa twarz. Poznaj wieczory, które chcemy stworzyć. Pokazane wydarzenia są propozycjami.'),T('Events & experiences','Wydarzenia i spotkania'))}<section class="section-sm"><div class="wrap"><div class="filter-bar">${[['all',T('All experiences','Wszystkie')],['social',T('Café & social','Kawiarnia i spotkania')],['popup',T('City pop-ups','Miejskie pop-upy')],['practice',T('Guided practice','Praktyka')]].map(([v,l])=>`<button class="filter-chip ${state.eventFilter===v?'active':''}" onclick="state.eventFilter='${v}';render()">${l}</button>`).join('')}</div><div class="grid3">${events.filter(e=>state.eventFilter==='all'||e.type===state.eventFilter).map(eventCard).join('')}</div><p class="banner-small">${T('These are programme concepts, not announced events. No partnership, venue hire or public-space permission has been secured by this prototype.','To koncepcje programu, nie ogłoszone wydarzenia. Prototyp nie potwierdza partnerstw, najmu ani zgód na korzystanie z przestrzeni.')}</p><div class="callout"><div><h3>${T('Your space. Their next favourite memory.','Twoja przestrzeń. Ich nowe dobre wspomnienie.')}</h3><p>${T('Café, cultural venue, workplace or a neighbourhood initiative? Let us design a hosted tango experience together.','Kawiarnia, dom kultury, firma lub inicjatywa sąsiedzka? Stwórzmy razem spotkanie z tangiem.')}</p></div><button class="btn" onclick="partnerForm()">${T('Become an event partner','Zostań partnerem')}${I('up')}</button></div></div></section>`}
function eventPage(id){let e=events.find(x=>x.id===id);if(!e)return notFound();return `${pageHead(txt(e.name),txt(e.desc),txt(e.typeName))}<section class="section-sm"><div class="wrap detail-layout"><div class="detail-body"><div class="event-art ${e.color}" style="height:410px;border-radius:17px"><div class="poster-title" style="">${txt(e.poster)}</div><span class="poster-caption">AURATANGO · ${dateLabel(e.date).toUpperCase()} · ${e.time}</span></div><h2>${T('A little curiosity.<br><em>A lovely way to meet.</em>','Odrobina ciekawości.<br><em>Piękny sposób na spotkanie.</em>')}</h2><p>${T('No need to impress anyone. The proposed experience starts with a friendly welcome and an approachable introduction, with time to practise and ask questions.','Nie musisz nikomu imponować. Proponowane spotkanie zaczyna się od serdecznego powitania i prostego wprowadzenia, z czasem na praktykę i pytania.')}</p><div class="syllabus">${[['01',T('Arrive & settle in','Przyjdź i poczuj się swobodnie'),T('Meet your hosts and learn what to expect.','Poznaj prowadzących i dowiedz się, co Cię czeka.')],['02',T('Take your first step','Zrób pierwszy krok'),T('Try a short guided introduction. Observe first if you prefer.','Spróbuj krótkiego wprowadzenia. Możesz też najpierw poobserwować.')],['03',T('Stay for the connection','Zostań dla ludzi'),T('Practise, talk and discover a suitable next class.','Ćwicz, rozmawiaj i poznaj pasujące zajęcia.')]].map(([n,h,p])=>`<div class="syllabus-item"><span class="week">${n}</span><div><h4>${h}</h4><p>${p}</p></div></div>`).join('')}</div><h2>${T('Good to know','Warto wiedzieć')}</h2><p>${T('Taking part is always optional. No forced partner changes, and no assumption about your preferred dance role. Wear comfortable clothes and secure footwear. Venue access, floor suitability, licensing and permissions must be confirmed before a real event is sold.','Udział jest dobrowolny. Bez wymuszania zmian partnera i zakładania roli w tańcu. Wybierz wygodny strój i stabilne obuwie. Dostęp, podłoga, licencje i zgody muszą być potwierdzone przed sprzedażą prawdziwych biletów.')}</p></div><aside class="booking-panel"><span class="pill peach">${T('Proposed event · simulated booking','Proponowane wydarzenie · zapis demo')}</span><h3 style="margin-top:18px">${T('An evening<br>with a little soul.','Wieczór<br>z odrobiną duszy.')}</h3><div class="price">${e.price?price(e.price):T('Free','Bezpłatnie')}</div><p class="small muted">${T('Illustrative ticket price · per person','Przykładowa cena biletu · za osobę')}</p><hr class="rule"><div class="stack" style="gap:15px"><div class="flex small">${I('calendar')}${dateLabel(e.date,{day:'numeric',month:'long',year:'numeric'})}</div><div class="flex small">${I('clock')}${e.time} · ${e.duration} min</div><div class="flex small">${I('pin')}${txt(e.venue)}</div></div><p class="banner-small">${T('Venue and programme subject to approval. No real reservation is made.','Miejsce i program do zatwierdzenia. Rezerwacja nie jest rzeczywista.')}</p><button class="btn full" style="margin-top:23px" onclick="startEvent('${e.id}')">${T('Reserve my evening · demo','Zarezerwuj wieczór · demo')}${I('arrow')}</button><button class="btn light full" style="margin-top:10px" onclick="eventReminder('${e.id}')">${I('calendar')}${T('Preview calendar invitation','Podgląd zaproszenia')}</button></aside></div></section>`}
