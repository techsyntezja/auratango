function tourPage(){const i=Math.min(TOUR.length-1,Math.max(0,U.tour)),t=TOUR[i];return pageHead(L('A website that connects<br><em>the whole story.</em>','Strona łącząca<br><em>całą historię.</em>','Сайт, соединяющий<br><em>всю историю.</em>','Сайт, що поєднує<br><em>всю історію.</em>'),L('Follow a real sequence of local actions. No fabricated approved offer is loaded by default. Start with the document, then follow a customer into the community.','Przejdź kolejno przez działania lokalne. Domyślnie nie ma fikcyjnych zatwierdzonych ofert. Zacznij od dokumentu i śledź drogę klienta do społeczności.','Пройдите последовательность локальных действий. Одобренные предложения не выдуманы по умолчанию. Начните с документа и пути клиента в сообщество.','Пройдіть послідовність локальних дій. Схвалені пропозиції не вигадано за замовчуванням. Почніть із документа й шляху клієнта до спільноти.'),L('Guided review · seven steps','Przewodnik · siedem kroków','Пошаговый обзор · семь шагов','Покроковий огляд · сім кроків'))+section('',`<div class="tour-grid"><nav class="tour-nav" aria-label="Guided steps">${TOUR.map((t,j)=>`<button class="${i===j?'selected':''}" onclick="U.tour=${j};render()"><span>${String(j+1).padStart(2,'0')}</span>${q(t.title)}</button>`).join('')}</nav><div class="card card-pad tour-main"><div class="eyebrow">${i+1} / ${TOUR.length}</div><h2>${q(t.title)}</h2><p class="lead card-copy">${q(t.body)}</p><div class="button-row">${A(t.route,q(t.action),'arrow')}${i===2?`<button class="btn light" onclick="sampleValuesModal()">${L('Load illustrative offer values','Wczytaj przykładowe wartości','Загрузить пример значений','Завантажити приклад значень')}</button>`:''}</div>${i===2?notice(L('Sample values are opt-in test inputs, not AuraTango’s real tariffs, locations or class levels. Loading them does not create an order or skip teacher review.','Wartości przykładowe nie są taryfą, miejscem ani poziomami szkoły. Nie tworzą zakupu i nie pomijają kontroli nauczyciela.','Примеры — не тарифы, места или уровни школы. Они не создают покупку и не пропускают проверку.','Приклади — не тарифи, місця чи рівні школи. Вони не створюють купівлю й не пропускають перевірку.')):''}<div class="tour-status"><span>${V.requests.length} ${L('local requests','zgłoszeń lokalnych','локальных заявок','локальних заявок')}</span><span>${V.requests.filter(r=>r.status==='offered').length} ${L('invitations ready','gotowych zaproszeń','готовых приглашений','готових запрошень')}</span><span>${V.orders.length} ${L('simulated orders','zamówień demo','демо-заказов','демо-замовлень')}</span></div><div class="tour-controls"><button class="btn light" ${i===0?'disabled':''} onclick="U.tour--;render()">← ${W('back')}</button><button class="btn" ${i===TOUR.length-1?'disabled':''} onclick="U.tour++;render()">${W('next')} →</button></div></div></div><div class="callout spaced"><div><h3>${L('Check the work, not just the promise.','Sprawdź pracę, nie obietnicę.','Проверьте работу, не обещание.','Перевірте роботу, не обіцянку.')}</h3><p>${L('The feedback register maps every source section to the implemented screen and outstanding decision.','Rejestr łączy każdą sekcję z ekranem i brakującą decyzją.','Реестр связывает каждый раздел с экраном и решением.','Реєстр пов’язує кожен розділ з екраном і рішенням.')}</p></div>${A('/review',L('Open feedback register','Otwórz rejestr uwag','Открыть реестр','Відкрити реєстр'),'check','btn')}</div>`)}
function sampleValuesModal(){modal(L('Illustration, not an approved offer.','Przykład, nie zatwierdzona oferta.','Пример, не одобренное предложение.','Приклад, не схвалена пропозиція.'),`<p>${L('Load a test venue, October 2026 dates and example full prices into the operator invitation form? Every value remains editable. This creates no customer, booking, live place or payment.','Wczytać testowy lokal, daty października 2026 i przykładowe ceny do formularza? Wszystko edytowalne. Bez klienta, rezerwacji i płatności.','Загрузить тестовое место, даты октября 2026 и цены в форму? Всё редактируется. Клиенты, записи и платежи не создаются.','Завантажити тестове місце, дати жовтня 2026 і ціни у форму? Усе редагується. Клієнти, записи й платежі не створюються.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${T('Not now','Nie teraz')}</button><button class="btn" onclick="loadSampleValues()">${L('Load labelled test values','Wczytaj oznaczone przykłady','Загрузить помеченные примеры','Завантажити позначені приклади')}</button></div>`)}
function loadSampleValues(){V.mode='sample';for(const s of SLOTS)V.offers[s.id]={date:s.day===0?'2026-10-04':'2026-10-03',time:s.start,duration:OFFER[s.offer].duration,lessons:4,venue:'Example studio — TEST ONLY',address:'Training scenario; do not travel',capacity:12};saveV();closeModal();render();toast(L('Illustrative inputs loaded. Teacher review is still required.','Wczytano przykłady. Nadal wymagana kontrola nauczyciela.','Примеры загружены. Проверка преподавателя всё ещё нужна.','Приклади завантажено. Перевірка викладача все ще потрібна.'))}
function inviteFriend(){modal(L('Share a first step.','Podziel się pierwszym krokiem.','Поделитесь первым шагом.','Поділіться першим кроком.'),`<p>${L('A personal invitation, without sharing someone’s contact details. This copy is a message template, not an email sent by AuraTango.','Osobiste zaproszenie bez udostępniania kontaktów. To szablon, nie wysłany e-mail.','Личное приглашение без передачи контактов. Это шаблон, не отправленный email.','Особисте запрошення без передавання контактів. Це шаблон, не надісланий email.')}</p><textarea id="invite-copy" readonly>${ESC(L('I’m exploring tango with AuraTango. Would you like to try it with me? You can start solo or ask about a partner group—no pressure. Ask the studio for the confirmed timetable and booking link.','Odkrywam tango z AuraTango. Chcesz spróbować razem? Możesz zacząć solo lub zapytać o grupę w parach — bez presji. Poproś studio o grafik i link.','Я открываю танго с AuraTango. Попробуете со мной? Можно соло или в парной группе — без давления. Уточните у студии расписание и ссылку.','Я відкриваю танго з AuraTango. Спробуєте зі мною? Можна соло чи в парній групі — без тиску. Уточніть у студії розклад і посилання.'))}</textarea><div class="modal-actions"><button class="btn" onclick="copyText(document.getElementById('invite-copy').value)">${I('copy')}${T('Copy template','Kopiuj szablon')}</button></div>`)}

render=function(){renderCount++;document.documentElement.lang=state.lang;document.body.classList.toggle('polish',state.lang==='pl');const r=route(),parts=r.split('/').filter(Boolean),p=parts[0]||'',id=parts[1];let body='';

else if(p==='book')body=enrolPage(id?.startsWith('event-')?id.slice(6):id||'partnered');

else if(p==='invitation')body=invitationPage(id);

else if(p==='milonga')body=milongaPage();
else if(p==='workshops')body=workshopsPage();
else if(p==='workshop')body=workshopPage(id);
else if(p==='host')body=hostPage();
else if(p==='auratouch')body=auraTouch();
else if(p==='shop')body=id?productPage(id):atelier();
else if(p==='events')body=eventsPage();
else if(p==='event')body=eventPage(id);
else if(p==='community')body=id==='calendar'?calendarPage():communityPage();
else if(p==='return')body=returnPage();
else if(p==='member')body=memberShell(id||'');
else if(p==='studio')body=studioShell(id||'');
else if(p==='journal')body=journal(id);
else if(p==='film')body=filmPage(id);
else if(p==='story')body=story();
else if(p==='contact')body=contact();
else if(p==='guide')body=guide();
else if(p==='gift')body=gift();

else if(p==='review')body=reviewPage();

else body=notFound();
const minimal=['member','studio','enrol','book','checkout','receipt','request','invitation','confirmation'].includes(p);
document.title='AuraTango — '+({classes:W('classes'),class:itemTitle(id),milonga:W('milonga'),workshops:W('workshops'),auratouch:'AuraTouch',shop:W('shop'),community:W('community'),review:L('Feedback register','Rejestr uwag','Реестр замечаний','Реєстр зауважень'),tour:L('Guided review','Przewodnik','Пошаговый обзор','Покроковий огляд'),studio:L('Studio workspace','Panel studia','Кабинет студии','Кабінет студії')}[p]||L('Move. Connect. Belong.','Ruszaj się. Łącz. Bądź sobą.','Двигайтесь. Общайтесь. Будьте вместе.','Рухайтеся. Спілкуйтеся. Будьте разом.'));
document.getElementById('app').innerHTML=`<div class="scroll-meter" id="scroll-meter" aria-hidden="true"></div>${header()}<main id="main" class="page-enter" tabindex="-1">${body}</main>${minimal?`<div class="wrap" style="padding-bottom:95px"><div class="footer-bottom"><span>${demoText()}</span>${A('/review',W('owner'),'up','text-link')}</div></div>`:footer()}`;
decorate();filterEditorial();updateScrollMeter();
if(p!=='start')finderShownOnRoute=false;
else if(!finderShownOnRoute&&window.parent===window){
  finderShownOnRoute=true;

}

else if(!timetableTrialShown&&window.parent===window){

}
document.querySelectorAll('a[href^="#/"]').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.more-nav[open]').forEach(x=>x.open=false)}));
if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&matchMedia('(pointer:fine)').matches)document.querySelectorAll('.path-card,.image-event').forEach(el=>el.addEventListener('pointermove',e=>{const b=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-b.left)+'px');el.style.setProperty('--my',(e.clientY-b.top)+'px')},{passive:true}));
};
/* Source media and editorial narrative retained; known obsolete single-hour description corrected. */
for(const a of essays){a.sections=a.sections.map(([h,p])=>[h,p.map(s=>s.replace('An hour for yourself','Time for yourself').replace('An hour to yourself','Time for yourself'))])}
state.classFilter='all';state.editorialFilter='all';state.editorialSearch='';

</script><script id="auratango-display-controls">
/* Readable display controls. Business state and customer flows are untouched. */
(function(){
 'use strict';
 const KEY='auratango-display-v1';
 let prefs={type:'standard',motion:'system'};
 try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(['standard','large'].includes(saved.type))prefs.type=saved.type;if(['system','reduced'].includes(saved.motion))prefs.motion=saved.motion;}catch(e){}
 const text=(en,pl,ru,uk)=>typeof L==='function'?L(en,pl,ru,uk):en;
 function apply(){document.documentElement.dataset.type=prefs.type;document.documentElement.dataset.motion=prefs.motion;if(prefs.motion==='reduced'&&document.getAnimations)document.getAnimations().forEach(a=>a.cancel());try{localStorage.setItem(KEY,JSON.stringify(prefs))}catch(e){}}
 apply();
 window.auraDisplaySettings=function(){
  modal(text('Make yourself comfortable.','Poczuj się swobodnie.','Устройтесь поудобнее.','Влаштуйтеся зручніше.'),
  `<p>${text('Clear words, a little more space, and movement on your terms. These settings stay in this browser where local storage is available.','Czytelny tekst, więcej przestrzeni i ruch na Twoich zasadach. Ustawienia zostają w tej przeglądarce, jeśli dostępna jest pamięć lokalna.','Чёткий текст, больше пространства и движение на ваших условиях. Настройки сохраняются в этом браузере, если доступно локальное хранилище.','Чіткий текст, більше простору й рух на ваших умовах. Налаштування зберігаються в цьому браузері, якщо доступне локальне сховище.')}</p>
  <h3 style="margin-top:26px">${text('Reading size','Rozmiar tekstu','Размер текста','Розмір тексту')}</h3>
  <div class="reading-options"><button class="reading-option" aria-pressed="${prefs.type==='standard'}" onclick="auraSetDisplay('type','standard')"><strong>${text('Comfortable','Wygodny','Удобный','Зручний')}</strong><small>${text('Readable text with a balanced layout.','Czytelny tekst i przejrzysty układ.','Читаемый текст и сбалансированный макет.','Читабельний текст і збалансований макет.')}</small></button><button class="reading-option" aria-pressed="${prefs.type==='large'}" onclick="auraSetDisplay('type','large')"><strong>${text('A little larger','Nieco większy','Немного крупнее','Трохи більший')}</strong><small>${text('More generous text on every page.','Większy tekst na każdej stronie.','Более крупный текст на каждой странице.','Більший текст на кожній сторінці.')}</small></button></div>
  <h3>${text('Animation','Animacje','Анимация','Анімація')}</h3>
  <div class="reading-options"><button class="reading-option" aria-pressed="${prefs.motion==='system'}" onclick="auraSetDisplay('motion','system')"><strong>${text('Gentle movement','Subtelny ruch','Мягкое движение','М’який рух')}</strong><small>${text('Follows your device’s reduced-motion preference.','Respektuje ograniczenie ruchu ustawione na urządzeniu.','Учитывает настройку уменьшения движения на устройстве.','Враховує налаштування зменшення руху на пристрої.')}</small></button><button class="reading-option" aria-pressed="${prefs.motion==='reduced'}" onclick="auraSetDisplay('motion','reduced')"><strong>${text('Still & calm','Spokojnie i bez ruchu','Спокойно и без движения','Спокійно й без руху')}</strong><small>${text('Turn off decorative motion and transitions.','Wyłącz dekoracyjny ruch i przejścia.','Выключить декоративное движение и переходы.','Вимкнути декоративний рух і переходи.')}</small></button></div>
  <div class="reading-preview">${text('Come for the dance. Stay for the feeling. There is room here for your first step—and for whatever comes after.','Przyjdź dla tańca. Zostań dla emocji. Jest tu miejsce na Twój pierwszy krok — i na wszystko, co będzie dalej.','Приходите ради танца. Оставайтесь ради чувств. Здесь есть место вашему первому шагу — и всему, что будет дальше.','Приходьте заради танцю. Залишайтеся заради почуттів. Тут є місце вашому першому кроку — і всьому, що буде далі.')}</div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">${text('Back to my tango','Wracam do tanga','Вернуться к танго','Повернутися до танго')} ${I('check')}</button></div>`,true);
 };
 window.auraSetDisplay=function(key,value){if(key==='type'&&['standard','large'].includes(value))prefs.type=value;else if(key==='motion'&&['system','reduced'].includes(value))prefs.motion=value;else return;apply();auraDisplaySettings()};
 const skip=document.querySelector('a[href="#main"]');
 if(skip)skip.addEventListener('click',e=>{e.preventDefault();const main=document.getElementById('main');if(main){main.focus({preventScroll:true});main.scrollIntoView({block:'start',behavior:'auto'})}});
 let lastAnimated=null;
 const motionQuery=matchMedia('(prefers-reduced-motion:reduce)');
 motionQuery.addEventListener?.('change',()=>{if(motionQuery.matches&&document.getAnimations)document.getAnimations().forEach(a=>a.cancel())});
 const cardArrival=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{
  entries.forEach(({target,isIntersecting})=>{
   if(!isIntersecting)return;
   cardArrival.unobserve(target);
   if(prefs.motion!=='reduced'&&!motionQuery.matches){
    target.classList.add('visible');
    target.animate([{transform:'translateY(9px)'},{transform:'translateY(0)'}],{duration:440,easing:'cubic-bezier(.2,.7,.2,1)'});
   }
  });
 },{threshold:.1}):null;
 function refine(root=document){
  document.querySelectorAll('.table-scroll').forEach(el=>{if(el.scrollWidth>el.clientWidth+2){el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label',text('Table — scroll sideways to see every column','Tabela — przewiń w bok, aby zobaczyć wszystkie kolumny','Таблица — прокрутите в сторону, чтобы увидеть все столбцы','Таблиця — прокрутіть убік, щоб побачити всі стовпці'));}el.querySelectorAll('th').forEach(th=>th.setAttribute('scope','col'))});
  if(cardArrival)document.querySelectorAll('.reveal,.image-event,.essay-card').forEach(el=>{if(!el.dataset.clarityObserved){el.dataset.clarityObserved='1';cardArrival.observe(el)}});
  // Adapt data-heavy pages without hiding text to conceal overflow.
  const p=typeof route==='function'?route():'/';document.body.dataset.page=p.split('/')[1]||'home';
  document.querySelectorAll('button:not([type])').forEach(b=>{if(!b.closest('form'))b.type='button'});
  const main=document.getElementById('main');
  if(main&&main!==lastAnimated){
   lastAnimated=main;
   if(prefs.motion!=='reduced'&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    const visible=[...main.querySelectorAll('.page-head .wrap,.rouge-copy,.aura-touch-hero .wrap')];
    visible.forEach(el=>{if(el.getBoundingClientRect().top<innerHeight)el.animate([{transform:'translateY(9px)'},{transform:'translateY(0)'}],{duration:480,easing:'cubic-bezier(.2,.7,.2,1)'});});
   }
  }
 }
 // Called after each existing route render and dialog without replacing handlers.
 let queued=false;
 const observer=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;refine()})});
 observer.observe(document.getElementById('app'),{childList:true,subtree:true});
 observer.observe(document.getElementById('modal-root'),{childList:true,subtree:true});
 window.addEventListener('resize',()=>refine(),{passive:true});
 refine();
 window.auraClarityRefresh=refine;
})();
