const TRANSLATIONS={"Tango editorial photography":["Танго — иллюстративная фотография","Танго — ілюстративна фотографія"],"Interactive concept · Sample dates, availability & payments":["Интерактивная концепция · примерные даты, места и оплата","Інтерактивна концепція · прикладові дати, місця й оплата"],"About this demo":["О демоверсии","Про демоверсію"],"Learn tango":["Учиться танго","Вчитися танго"],"Timetable":["Расписание","Розклад"],"Nights & moments":["Вечера и мгновения","Вечори й миті"],"The people":["Наши люди","Наші люди"],"New to tango?":["Впервые на танго?","Уперше на танго?"],"Switch to Polish":["Выбрать польский","Обрати польську"],"My studio":["Моя студия","Моя студія"],"Sign in":["Войти","Увійти"],"Begin here":["Начните здесь","Почніть тут"],"Explore":["Открывать","Відкривати"],"My tango · demo":["Моё танго · демо","Моє танго · демо"],"Studio · demo":["Студия · демо","Студія · демо"],"Class guide":["Помощь с выбором","Допомога з вибором"],"An hour without a to-do list. Just you, the music, and room to find your own way of moving.":["Час без списка дел. Только вы, музыка и пространство для вашего движения.","Година без списку справ. Лише ви, музика й простір для вашого руху."],"Turn a shared evening into a conversation without words. Come as a couple, or ask us about a matched solo place.":["Превратите совместный вечер в разговор без слов. Приходите парой или спросите о подборе партнёра.","Перетворіть спільний вечір на розмову без слів. Приходьте парою або запитайте про добір партнера."],"introductory lesson":["вводное занятие","вступне заняття"],"4 lessons / person":["4 занятия / человек","4 заняття / особа"],"proposed demo price":["примерная цена","прикладова ціна"],"Proposed event · demo":["Предлагаемое событие · демо","Запропонована подія · демо"],"Do I need a partner?":["Нужен ли мне партнёр?","Чи потрібен мені партнер?"],"Tango Ladies is a solo class. For partnered tango, you can join as a couple or apply for a solo place. A solo application is not a confirmed match; the booking flow clearly separates the waiting list from confirmed enrolment.":["Tango Ladies — сольные занятия. На парное танго можно прийти вдвоём или подать индивидуальную заявку. Заявка ещё не означает, что партнёр подобран: лист ожидания и подтверждённая запись — разные этапы.","Tango Ladies — сольні заняття. На парне танго можна прийти вдвох або подати індивідуальну заявку. Заявка ще не означає, що партнера дібрано: список очікування й підтверджений запис — різні етапи."],"Can I start with no dance experience?":["Можно начать без танцевального опыта?","Можна почати без танцювального досвіду?"],"Choose a class marked “absolute beginners”. The proposed foundation pathway begins with walking, balance and listening to music, then builds from there. Teaching teams must approve the final curriculum.":["Выберите занятие «с нуля». Предлагаемый начальный курс начинается с ходьбы, равновесия и внимания к музыке. Итоговую программу должна утвердить преподавательская команда.","Оберіть заняття «з нуля». Запропонований початковий курс починається з ходьби, рівноваги й уваги до музики. Остаточну програму має затвердити викладацька команда."],"What should I wear?":["Что надеть?","Що вдягнути?"],"Wear comfortable clothes that let you move, and secure shoes. You do not need to buy special dance shoes before your first visit. Ask the studio about the surface and any specific footwear guidance.":["Выберите удобную одежду для движения и устойчивую обувь. Не нужно покупать специальные танцевальные туфли до первого визита. Уточните у студии требования к обуви и особенности пола.","Оберіть зручний одяг для руху та стійке взуття. Не потрібно купувати спеціальні танцювальні туфлі до першого візиту. Уточніть у студії вимоги до взуття й особливості підлоги."],"What happens after my first lesson?":["Что будет после первого урока?","Що буде після першого уроку?"],"Your member area connects the introductory lesson to a foundation package, the next suitable session and supported practice. You can review your progress and choose the next module without an automatic subscription.":["Личный кабинет связывает первый урок с начальным абонементом, следующими занятиями и практикой. Можно отслеживать свой прогресс и выбирать продолжение без автоматической подписки.","Особистий кабінет пов’язує перший урок із початковим абонементом, наступними заняттями й практикою. Можна стежити за своїм поступом і обирати продовження без автоматичної підписки."],"Can I change or cancel a booking?":["Можно перенести или отменить запись?","Можна перенести чи скасувати запис?"],"The prototype lets you reschedule or cancel a sample booking from My classes. It restores a demonstration credit only if that booking originally used one. Live cancellation deadlines, refunds and legal terms must be approved before launch.":["В разделе «Мои занятия» можно перенести или отменить демонстрационную запись. Демо-посещение возвращается только если оно было списано при этой записи. Реальные сроки отмены, возвраты и условия нужно утвердить перед запуском.","У розділі «Мої заняття» можна перенести чи скасувати демонстраційний запис. Демо-відвідування повертається лише якщо його було списано під час цього запису. Реальні строки скасування, повернення коштів та умови потрібно затвердити перед запуском."],"Are these real dates and live payments?":["Это реальные даты и платежи?","Це реальні дати й платежі?"],"No. This is a working website concept. All availability, intakes, events, member records and transactions are simulated. Published Ladies and partnered package prices are used for context; final commercial details must be confirmed by AuraTango.":["Нет. Это действующая концепция сайта. Места, наборы, события, записи участников и платежи симулируются. Опубликованные цены Tango Ladies и парного танго приведены для контекста; окончательные условия должна подтвердить AuraTango.","Ні. Це робоча концепція сайту. Місця, набори, події, записи учасників і платежі симулюються. Опубліковані ціни Tango Ladies і парного танго наведено для контексту; остаточні умови має підтвердити AuraTango."],"A first step.<br><em>Entirely your own.</em>":["Первый шаг.<br><em>По-вашему.</em>","Перший крок.<br><em>По-вашому.</em>"],"A quiet hour for yourself. A shared rhythm with someone else. Find the beginning that feels like you, with the details you need to feel at ease.":["Тихий час для себя. Общий ритм с другим человеком. Найдите своё начало — с понятными деталями, чтобы чувствовать себя спокойно.","Тиха година для себе. Спільний ритм з іншою людиною. Знайдіть свій початок — зі зрозумілими деталями, щоб почуватися спокійно."],"Find your class":["Найдите своё занятие","Знайдіть своє заняття"],"All classes":["Все занятия","Усі заняття"],"Solo":["Соло","Соло"],"Partnered":["В паре","У парі"],"Private":["Индивидуально","Індивідуально"],"Practice":["Практика","Практика"],"You do not have to choose alone.":["Не обязательно выбирать самостоятельно.","Не обов’язково обирати самостійно."],"Three small questions. A beginning that feels a little more like you.":["Три простых вопроса. Начало, которое чуть больше похоже на вас.","Три прості запитання. Початок, який трохи більше схожий на вас."],"Find my fit":["Найти своё занятие","Знайти своє заняття"],"First lesson":["Первый урок","Перший урок"],"4 classes / person":["4 занятия / человек","4 заняття / особа"],"Demo price":["Демо-цена","Демо-ціна"],"Choose my date":["Выбрать дату","Обрати дату"],"Not just a lesson.<br><em>A moment that is yours.</em>":["Не просто урок.<br><em>Мгновение для вас.</em>","Не просто урок.<br><em>Мить для вас.</em>"],"minutes per session":["минут на занятие","хвилин на заняття"],"Gocław & Solec, Warsaw":["Гоцлав и Солец, Варшава","Гоцлав і Солець, Варшава"],"No partner needed":["Партнёр не нужен","Партнер не потрібен"],"Couples or matched solo places":["Для пар или после подбора партнёра","Для пар або після добору партнера"],"Support at your pace":["Поддержка в вашем темпе","Підтримка у вашому темпі"],"Small discoveries.<br><em>A feeling of moving forward.</em>":["Маленькие открытия.<br><em>Ощущение движения вперёд.</em>","Маленькі відкриття.<br><em>Відчуття руху вперед.</em>"],"An illustrative foundation pathway. Your teacher adapts the pace to the group; the final programme needs studio approval.":["Пример начальной программы. Преподаватель подстраивает темп под группу; итоговый план должна утвердить студия.","Приклад початкової програми. Викладач підлаштовує темп під групу; остаточний план має затвердити студія."],"Find your balance":["Найти равновесие","Знайти рівновагу"],"Walking, posture and becoming comfortable with movement.":["Ходьба, осанка и ощущение комфорта в движении.","Ходьба, постава й відчуття комфорту в русі."],"Listen to the music":["Слушать музыку","Слухати музику"],"Notice the beat and give your movement a little intention.":["Услышать ритм и добавить движению намерение.","Почути ритм і додати рухові намір."],"Connect the movement":["Соединить движения","Поєднати рухи"],"Bring simple ideas together, with individual feedback.":["Объединить простые элементы с личными подсказками преподавателя.","Поєднати прості елементи з особистими підказками викладача."],"Make it your own":["Сделать по-своему","Зробити по-своєму"],"Revisit, practise and find your suitable next step.":["Повторить, попрактиковаться и найти следующий шаг.","Повторити, попрактикуватися й знайти наступний крок."],"Step":["Шаг","Крок"],"Before you arrive":["Перед визитом","Перед візитом"],"Demo enrolment":["Демонстрационная запись","Демонстраційний запис"],"One hour.<br>Nothing to prove.":["Один час.<br>Ничего не нужно доказывать.","Одна година.<br>Нічого не потрібно доводити."],"Something to<br>look forward to.":["То, чего<br>приятно ждать.","Те, чого<br>приємно чекати."],"Trial lesson · 4-class package: 220 PLN":["Пробный урок · абонемент на 4 занятия: 220 PLN","Пробний урок · абонемент на 4 заняття: 220 PLN"],"4 lessons / person · 440 PLN / couple":["4 занятия / человек · 440 PLN / пара","4 заняття / особа · 440 PLN / пара"],"Illustrative price; not an approved offer.":["Примерная цена; предложение не утверждено.","Прикладова ціна; пропозицію не затверджено."],"Sample intake: October 2026":["Пример набора: октябрь 2026","Приклад набору: жовтень 2026"],"Choose Gocław or Solec":["Выберите Гоцлав или Солец","Оберіть Гоцлав або Солець"],"Teaching language confirmed in booking":["Язык занятия уточняется при записи","Мова заняття уточнюється під час запису"],"Buy a 4-class package":["Купить абонемент на 4 занятия","Купити абонемент на 4 заняття"],"No real payment. Sample availability. Booking does not reserve a live class.":["Без реальной оплаты. Места примерные. Запись не резервирует настоящее занятие.","Без реальної оплати. Місця прикладові. Запис не резервує справжнє заняття."],"A little unsure? Let us help.":["Не уверены? Давайте поможем.","Не впевнені? Допоможімо."],"Make time<br>for <em>the feeling.</em>":["Найдите время<br>для <em>ощущений.</em>","Знайдіть час<br>для <em>відчуттів.</em>"],"Between everything you have to do, make room for something you get to feel. Choose your class, your place and your next good hour.":["Между всеми делами оставьте место тому, что можно почувствовать. Выберите занятие, место и следующий приятный час.","Між усіма справами залиште місце тому, що можна відчути. Оберіть заняття, місце й наступну приємну годину."],"Sample timetable · Not live":["Пример расписания · не актуальные места","Приклад розкладу · не актуальні місця"],"Ladies":["Для женщин","Для жінок"],"All locations":["Все места","Усі локації"],"Availability shown is simulated.":["Показанные места симулируются.","Показані місця симулюються."],"Solo partnered places require matching.":["Для парного танго соло-заявки требуют подбора.","Для парного танго соло-заявки потребують добору."],"sessions":["занятия","заняття"],"demo":["демо","демо"],"sample places":["примерных мест","прикладових місць"],"Waiting list":["Лист ожидания","Список очікування"],"Book class":["Записаться","Записатися"],"Join waitlist":["В лист ожидания","До списку очікування"],"No sessions match these filters. Try another class or location.":["Занятия не найдены. Выберите другой формат или место.","Заняття не знайдено. Оберіть інший формат або місце."],"Go out.<br><em>Feel something.</em>":["Выйдите в город.<br><em>Почувствуйте что-то.</em>","Вийдіть у місто.<br><em>Відчуйте щось.</em>"],"Not another night you scroll through. A café, a shared rhythm, a new face. Explore the evenings we would love to bring to life. All events shown are proposed concepts.":["Не ещё один вечер за экраном. Кафе, общий ритм и новое лицо. Познакомьтесь с идеями вечеров, которые хотелось бы воплотить. Все события — концепции.","Не ще один вечір перед екраном. Кав’ярня, спільний ритм і нове обличчя. Познайомтеся з ідеями вечорів, які хотілося б втілити. Усі події — концепції."],"Events & experiences":["События и впечатления","Події та враження"],"All experiences":["Все форматы","Усі формати"],"Café & social":["Кафе и встречи","Кав’ярні та зустрічі"],"City pop-ups":["Городские встречи","Міські зустрічі"],"Guided practice":["Практика с преподавателем","Практика з викладачем"],"These are programme concepts, not announced events. No partnership, venue hire or public-space permission has been secured by this prototype.":["Это идеи программы, не анонсы. В рамках прототипа не заключены партнёрства, аренда и разрешения на использование общественного пространства.","Це ідеї програми, не анонси. У межах прототипу не укладено партнерств, оренди й дозволів на використання громадського простору."],"Your space. Their next favourite memory.":["Ваша площадка. Их новое любимое воспоминание.","Ваш майданчик. Їхній новий улюблений спогад."],"Café, cultural venue, workplace or a neighbourhood initiative? Let us design a hosted tango experience together.":["Кафе, культурная площадка, рабочая команда или районная инициатива? Создадим вечер танго вместе.","Кав’ярня, культурний майданчик, робоча команда чи районна ініціатива? Створімо вечір танго разом."],"Become an event partner":["Стать партнёром события","Стати партнером події"],"A little curiosity.<br><em>A lovely way to meet.</em>":["Немного любопытства.<br><em>Прекрасный способ познакомиться.</em>","Трохи цікавості.<br><em>Чудовий спосіб познайомитися.</em>"],"No need to impress anyone. The proposed experience starts with a friendly welcome and an approachable introduction, with time to practise and ask questions.":["Не нужно никого впечатлять. В программе — тёплый приём, доступное знакомство с танго, время для практики и вопросов.","Не потрібно нікого вражати. У програмі — теплий прийом, доступне знайомство з танго, час для практики й запитань."],"Arrive & settle in":["Прийти и освоиться","Прийти й освоїтися"],"Meet your hosts and learn what to expect.":["Познакомьтесь с ведущими и узнайте план вечера.","Познайомтеся з ведучими й дізнайтеся план вечора."],"Take your first step":["Сделать первый шаг","Зробити перший крок"],"Try a short guided introduction. Observe first if you prefer.":["Попробуйте короткое вводное занятие. Можно сначала посмотреть.","Спробуйте коротке вступне заняття. Можна спершу подивитися."],"Stay for the connection":["Остаться ради общения","Залишитися заради спілкування"],"Practise, talk and discover a suitable next class.":["Практикуйтесь, общайтесь и узнайте о следующем подходящем занятии.","Практикуйтеся, спілкуйтеся й дізнайтеся про наступне відповідне заняття."],"Good to know":["Полезно знать","Корисно знати"],"Taking part is always optional. No forced partner changes, and no assumption about your preferred dance role. Wear comfortable clothes and secure footwear. Venue access, floor suitability, licensing and permissions must be confirmed before a real event is sold.":["Участие добровольное. Без принудительной смены партнёров и предположений о вашей танцевальной роли. Выберите удобную одежду и устойчивую обувь. До настоящей продажи билетов нужно подтвердить доступ, покрытие пола, лицензии и разрешения.","Участь добровільна. Без примусової зміни партнерів і припущень щодо вашої танцювальної ролі. Оберіть зручний одяг і стійке взуття. До справжнього продажу квитків потрібно підтвердити доступ, покриття підлоги, ліцензії та дозволи."],"Proposed event · simulated booking":["Предлагаемое событие · демонстрационная запись","Запропонована подія · демонстраційний запис"],"An evening<br>with a little soul.":["Вечер<br>с душой.","Вечір<br>із душею."],"Free":["Бесплатно","Безкоштовно"],"Illustrative ticket price · per person":["Примерная цена билета · за человека","Прикладова ціна квитка · за особу"],"Venue and programme subject to approval. No real reservation is made.":["Площадка и программа требуют согласования. Настоящая бронь не создаётся.","Майданчик і програма потребують узгодження. Справжнє бронювання не створюється."],"Reserve my evening · demo":["Забронировать вечер · демо","Забронювати вечір · демо"],"Preview calendar invitation":["Пример приглашения в календарь","Приклад запрошення в календар"],"A shared rhythm.<br><em>A human connection.</em>":["Общий ритм.<br><em>Живое общение.</em>","Спільний ритм.<br><em>Живе спілкування.</em>"],"A little room to slow down. A shared rhythm. People who make the first step feel possible.":["Место, где можно замедлиться. Общий ритм. Люди, с которыми первый шаг кажется возможным.","Місце, де можна сповільнитися. Спільний ритм. Люди, з якими перший крок здається можливим."],"The feeling comes first":["Сначала ощущение","Спочатку відчуття"],"Not a performance.<br><em>A conversation.</em>":["Не выступление.<br><em>Разговор.</em>","Не виступ.<br><em>Розмова.</em>"],"Thoughtful teaching. A clear beginning. Space to keep growing. Tango can be a moment to yourself, a shared experience, or a new connection to music and people. Find your own way into the dance.":["Внимательное обучение. Понятное начало. Пространство для роста. Танго может стать временем для себя, общим переживанием или знакомством с музыкой и людьми. Найдите свой путь.","Уважне навчання. Зрозумілий початок. Простір для зростання. Танго може стати часом для себе, спільним переживанням або знайомством із музикою й людьми. Знайдіть свій шлях."],"Choose a beginning that feels right. You do not have to know the steps to take the first one.":["Выберите начало, которое подходит вам. Не нужно знать шаги, чтобы сделать первый.","Оберіть початок, який підходить вам. Не потрібно знати кроки, щоб зробити перший."],"Teaching team image from the public Tango Ladies page":["Фото преподавателей с публичной страницы Tango Ladies","Фото викладачів із публічної сторінки Tango Ladies"],"Meet your teachers":["Знакомьтесь с преподавателями","Знайомтеся з викладачами"],"The people<br><em>you begin with.</em>":["Люди,<br><em>с которыми вы начинаете.</em>","Люди,<br><em>з якими ви починаєте.</em>"],"Partnered Argentine tango":["Парное аргентинское танго","Парне аргентинське танго"],"Music, rhythm and body awareness. Discover partnered tango with Rick, one clear step at a time.":["Музыка, ритм и осознанность движения. Откройте парное танго с Риком — шаг за шагом.","Музика, ритм і усвідомленість руху. Відкрийте парне танго з Ріком — крок за кроком."],"Tango Ladies":["Tango Ladies","Tango Ladies"],"Movement, balance and expression. Explore your own rhythm with Anna in Tango Ladies.":["Движение, равновесие и выразительность. Найдите свой ритм с Анной на Tango Ladies.","Рух, рівновага й виразність. Знайдіть свій ритм з Анною на Tango Ladies."],"Meet your teacher":["Познакомиться с преподавателем","Познайомитися з викладачем"],"A little time.<br><em>A lot to feel.</em>":["Немного времени.<br><em>Много чувств.</em>","Трохи часу.<br><em>Багато почуттів.</em>"],"Start with a first feeling, or make tango part of your week. One lesson or a thoughtful package. No automatic subscription. These are demonstration purchases, not live reservations.":["Начните с первого ощущения или сделайте танго частью недели. Один урок или продуманный абонемент. Без автоматической подписки. Покупки демонстрационные, не реальные бронирования.","Почніть із першого відчуття або зробіть танго частиною тижня. Один урок або продуманий абонемент. Без автоматичної підписки. Покупки демонстраційні, не реальні бронювання."],"Packages & prices":["Абонементы и цены","Абонементи й ціни"],"The first spark":["Первая искра","Перша іскра"],"Tango Ladies · One introductory lesson":["Tango Ladies · один вводный урок","Tango Ladies · один вступний урок"],"A simple way to experience the class before choosing a package.":["Простой способ познакомиться с форматом до покупки абонемента.","Простий спосіб познайомитися з форматом до купівлі абонемента."],"Your hour, each week":["Ваш час каждую неделю","Ваша година щотижня"],"Tango Ladies · Four lessons":["Tango Ladies · четыре занятия","Tango Ladies · чотири заняття"],"Four class credits and a clear foundation pathway.":["Четыре посещения и понятная начальная программа.","Чотири відвідування й зрозуміла початкова програма."],"Just the two of you":["Только вы вдвоём","Лише ви вдвох"],"Partnered tango · Four lessons per couple":["Парное танго · четыре занятия для пары","Парне танго · чотири заняття для пари"],"One package for two people. Both participants are registered together.":["Один абонемент для двоих. Оба участника регистрируются вместе.","Один абонемент для двох. Обоє учасників реєструються разом."],"Published price":["Опубликованная цена","Опублікована ціна"],"Choose this path":["Выбрать этот путь","Обрати цей шлях"],"Partnered individual packages: 4 lessons 260 PLN, 8 lessons 440 PLN. Couple packages: 4 lessons 440 PLN, 8 lessons 768 PLN. Solo applications require a confirmed suitable place before payment in this concept.":["Индивидуальные абонементы на парное танго: 4 урока — 260 PLN, 8 — 440 PLN. Для пары: 4 урока — 440 PLN, 8 — 768 PLN. В этой концепции индивидуальные заявки оплачиваются только после подтверждения подходящего места.","Індивідуальні абонементи на парне танго: 4 уроки — 260 PLN, 8 — 440 PLN. Для пари: 4 уроки — 440 PLN, 8 — 768 PLN. У цій концепції індивідуальні заявки оплачуються лише після підтвердження відповідного місця."],"Give someone a beautiful beginning.":["Подарите кому-то прекрасное начало.","Подаруйте комусь чудовий початок."],"Explore the proposed digital gift-card experience.":["Познакомьтесь с концепцией цифрового подарочного сертификата.","Познайомтеся з концепцією цифрового подарункового сертифіката."],"Explore gifts":["Выбрать подарок","Обрати подарунок"],"Curiosity is<br><em>a beautiful start.</em>":["Любопытство —<br><em>красивое начало.</em>","Цікавість —<br><em>гарний початок.</em>"],"You do not need the right shoes, the perfect partner or a ready-made confidence. Let us answer the little questions, so you can look forward to the first step.":["Не нужны идеальные туфли, партнёр или уверенность заранее. Ответим на простые вопросы, чтобы вы могли с радостью ждать первого шага.","Не потрібні ідеальні туфлі, партнер чи впевненість заздалегідь. Відповімо на прості запитання, щоб ви могли з радістю чекати першого кроку."],"The beginner’s guide":["Путеводитель новичка","Путівник початківця"],"Your first class, explained":["Как проходит первый урок","Як проходить перший урок"],"From choosing what to wear to finding your way into the room.":["От выбора одежды до входа в зал.","Від вибору одягу до входу в зал."],"Solo or together?":["Соло или вместе?","Соло чи разом?"],"Two different starting points. A class that fits your preference.":["Два начала. Занятие по вашим предпочтениям.","Два початки. Заняття за вашими вподобаннями."],"Keep your rhythm":["Сохранить свой ритм","Зберегти свій ритм"],"From an introduction to confident, consistent practice.":["От знакомства до уверенной, регулярной практики.","Від знайомства до впевненої, регулярної практики."],"Beginner notes":["Заметки для начинающих","Нотатки для початківців"],"Read the guide":["Читать путеводитель","Читати путівник"],"Curiosity is enough.":["Любопытства достаточно.","Цікавості достатньо."],"Let us help you find a comfortable beginning.":["Поможем найти комфортное начало.","Допоможемо знайти комфортний початок."],"Find my class":["Найти моё занятие","Знайти моє заняття"],"What happens in your first tango class?":["Что происходит на первом уроке танго?","Що відбувається на першому уроці танго?"],"You do not need to arrive knowing how to dance. Arrive curious, with comfortable clothes and an open mind.":["Не нужно уже уметь танцевать. Приходите с любопытством, в удобной одежде и с открытым настроением.","Не потрібно вже вміти танцювати. Приходьте з цікавістю, у зручному одязі й з відкритим настроєм."],"Before you leave home":["Перед выходом из дома","Перед виходом із дому"],"Check the venue, start time, teacher and class type in your confirmation. A solo class and a partnered class are different experiences. Ask about footwear, access or support needs before you travel.":["Проверьте в подтверждении адрес, время, преподавателя и формат. Сольное и парное занятия различаются. Уточните обувь, доступ и особые потребности до поездки.","Перевірте в підтвердженні адресу, час, викладача й формат. Сольне й парне заняття різняться. Уточніть взуття, доступ і особливі потреби до поїздки."],"Let the first lesson be a first lesson":["Пусть первый урок будет первым","Нехай перший урок буде першим"],"Try a small movement, listen, ask questions and take a pause when you need it. You are not expected to perform. In partnered work, communication and consent come before a movement.":["Пробуйте небольшие движения, слушайте, спрашивайте и отдыхайте при необходимости. Вы не обязаны выступать. В парной работе общение и согласие предшествуют движению.","Пробуйте невеликі рухи, слухайте, запитуйте й відпочивайте за потреби. Ви не зобов’язані виступати. У парній роботі спілкування й згода передують руху."],"Leave knowing what happens next":["Уходите с понятным следующим шагом","Ідіть із зрозумілим наступним кроком"],"Ask which class follows, when it happens and what the package includes. Your member area is designed to keep the next date, class credits and recommended practice in one place.":["Спросите о следующем занятии, времени и составе абонемента. Личный кабинет объединяет даты, посещения и рекомендуемую практику.","Запитайте про наступне заняття, час і склад абонемента. Особистий кабінет поєднує дати, відвідування й рекомендовану практику."],"Solo or partnered: find your starting point.":["Соло или в паре: найдите своё начало.","Соло чи в парі: знайдіть свій початок."],"Choose based on the experience you want—not whether you already have a dance partner.":["Выбирайте по желаемому опыту, а не по наличию партнёра.","Обирайте за бажаним досвідом, а не за наявністю партнера."],"Tango Ladies: movement for yourself":["Tango Ladies: движение для себя","Tango Ladies: рух для себе"],"This is a solo route that focuses on posture, balance, rhythm and expression. No partner matching is needed. A trial lesson lets you experience the format before choosing a package.":["Сольный формат с вниманием к осанке, равновесию, ритму и выразительности. Подбор партнёра не нужен. Пробный урок помогает познакомиться с форматом до покупки абонемента.","Сольний формат з увагою до постави, рівноваги, ритму й виразності. Добір партнера не потрібен. Пробний урок допомагає познайомитися з форматом до купівлі абонемента."],"Partnered tango: a shared conversation":["Парное танго: общий разговор","Парне танго: спільна розмова"],"Couples can book together. Individual applicants can indicate whether they prefer to lead, follow or explore either role. A request is not a guarantee that a compatible place is available.":["Пары записываются вместе. Индивидуальные участники могут выбрать ведущую, ведомую или любую роль. Заявка не гарантирует подходящего места.","Пари записуються разом. Індивідуальні учасники можуть обрати ведучу, ведену або будь-яку роль. Заявка не гарантує відповідного місця."],"Still unsure?":["Всё ещё не уверены?","Ще не впевнені?"],"Use the class finder, then speak with a teacher about your goals. You can move between suitable formats as your interests develop.":["Воспользуйтесь подбором занятий и обсудите цели с преподавателем. По мере развития интересов можно пробовать другие подходящие форматы.","Скористайтеся добором занять і обговоріть цілі з викладачем. Із розвитком інтересів можна пробувати інші відповідні формати."],"After your first lesson, keep the rhythm.":["После первого урока сохраните ритм.","Після першого уроку збережіть ритм."],"Progress is easier to notice when the next step is clear and the routine is realistic.":["Легче замечать прогресс, когда следующий шаг понятен, а расписание реалистично.","Легше помічати поступ, коли наступний крок зрозумілий, а розклад реалістичний."],"Find a time you can return to":["Найдите время, к которому можно возвращаться","Знайдіть час, до якого можна повертатися"],"Choose a suitable recurring slot instead of a schedule that only works once. Confirm how class credits and missed sessions are handled before purchasing a package.":["Выберите регулярное время, а не дату, которая подходит только однажды. До покупки уточните правила посещений и пропусков.","Оберіть регулярний час, а не дату, яка підходить лише один раз. До купівлі уточніть правила відвідувань і пропусків."],"Notice the small changes":["Замечайте маленькие изменения","Помічайте маленькі зміни"],"A more comfortable walk, an easier connection to music or a clearer question are all useful things to discuss with your teacher. Progress is individual, not a race through fixed milestones.":["Более удобный шаг, ощущение музыки или ясный вопрос — полезные темы для разговора с преподавателем. Прогресс индивидуален, это не гонка по фиксированным этапам.","Зручніший крок, відчуття музики чи чітке запитання — корисні теми для розмови з викладачем. Поступ індивідуальний, це не перегони за фіксованими етапами."],"Give practice a place":["Оставьте место практике","Залиште місце практиці"],"A supported practice is a place to revisit what you learned and meet other people. Try one that matches your level, and ask the host how newcomers are welcomed.":["Практика с поддержкой позволяет повторить изученное и познакомиться с людьми. Выберите подходящий уровень и спросите ведущего, как встречают новичков.","Практика з підтримкою дозволяє повторити вивчене й познайомитися з людьми. Оберіть відповідний рівень і запитайте ведучого, як зустрічають новачків."],"All guides":["Все путеводители","Усі путівники"],"AuraTango · Beginner notes":["AuraTango · заметки новичка","AuraTango · нотатки початківця"],"Your next step can be simple.":["Следующий шаг может быть простым.","Наступний крок може бути простим."],"Your first question<br><em>is welcome.</em>":["Ваш первый вопрос<br><em>здесь уместен.</em>","Ваше перше запитання<br><em>тут доречне.</em>"],"Find our publicly listed Warsaw locations or leave a demonstration enquiry. Class dates and exact access arrangements need studio confirmation.":["Найдите опубликованные адреса в Варшаве или оставьте демо-запрос. Даты и условия доступа должна подтвердить студия.","Знайдіть опубліковані адреси у Варшаві або залиште демо-запит. Дати й умови доступу має підтвердити студія."],"Locations & contact":["Адреса и контакты","Адреси й контакти"],"Illustrative location diagram · not to scale":["Иллюстративная схема · не в масштабе","Ілюстративна схема · не в масштабі"],"Plan your visit":["Спланировать визит","Спланувати візит"],"Let’s start a conversation":["Начнём разговор","Почнімо розмову"],"Let’s start<br><em>with a conversation.</em>":["Начнём<br><em>с разговора.</em>","Почнімо<br><em>з розмови.</em>"],"Your name":["Ваше имя","Ваше ім’я"],"Use a sample name":["Используйте вымышленное имя","Використайте вигадане ім’я"],"I’m interested in":["Меня интересует","Мене цікавить"],"Partnered tango":["Парное танго","Парне танго"],"Private lessons":["Индивидуальные уроки","Індивідуальні уроки"],"Events & partnerships":["События и партнёрства","Події й партнерства"],"Your question":["Ваш вопрос","Ваше запитання"],"A sample enquiry is enough for the demo.":["Для демоверсии достаточно примерного запроса.","Для демоверсії достатньо прикладового запиту."],"Preview enquiry submission":["Проверить отправку запроса","Перевірити надсилання запиту"],"Nothing is sent. Do not enter sensitive information.":["Ничего не отправляется. Не вводите чувствительные данные.","Нічого не надсилається. Не вводьте чутливі дані."],"Give a feeling.<br><em>Not another thing.</em>":["Подарите ощущение.<br><em>Не ещё одну вещь.</em>","Подаруйте відчуття.<br><em>Не ще одну річ.</em>"],"A proposed digital gift-card experience. Choose a value and a message, then try the simulated checkout.":["Концепция цифрового подарочного сертификата. Выберите сумму, добавьте послание и попробуйте демо-оплату.","Концепція цифрового подарункового сертифіката. Оберіть суму, додайте послання й спробуйте демо-оплату."],"The gift of tango":["Танго в подарок","Танго в подарунок"],"A little time.<br><em>Just for you.</em>":["Немного времени.<br><em>Только для вас.</em>","Трохи часу.<br><em>Лише для вас.</em>"],"Gift values and redemption are a concept. Expiry, refunds, delivery and usage terms need approval. No gift card bought here has monetary value.":["Номиналы и использование — концепция. Срок действия, возвраты, доставка и правила требуют утверждения. Демо-сертификат не имеет денежной ценности.","Номінали й використання — концепція. Строк дії, повернення, доставка й правила потребують затвердження. Демо-сертифікат не має грошової цінності."],"Make it personal":["Добавьте личное послание","Додайте особисте послання"],"Gift amount":["Сумма подарка","Сума подарунка"],"Recipient’s first name (sample)":["Имя получателя (пример)","Ім’я одержувача (приклад)"],"A little note":["Несколько слов","Кілька слів"],"Here is a little time, just for you.":["Немного времени — только для вас.","Трохи часу — лише для вас."],"Preview gift checkout":["Проверить покупку подарка","Перевірити купівлю подарунка"],"A small detour.":["Небольшой поворот.","Невеликий поворот."],"That page is not part of this concept. Let us find your way back.":["Такой страницы нет в концепции. Давайте найдём дорогу назад.","Такої сторінки немає в концепції. Знайдімо дорогу назад."],"Back to AuraTango":["Вернуться в AuraTango","Повернутися до AuraTango"],"One introduction · 60 minutes":["Одно знакомство · 60 минут","Одне знайомство · 60 хвилин"],"4-class foundation":["Начальный курс из 4 занятий","Початковий курс із 4 занять"],"One place per lesson · no automatic renewal":["Одно место на урок · без автопродления","Одне місце на урок · без автопродовження"],"Per person · matching required":["За человека · нужен подбор партнёра","За особу · потрібен добір партнера"],"One package for two people":["Один абонемент на двоих","Один абонемент на двох"],"8-class foundation":["Начальный курс из 8 занятий","Початковий курс із 8 занять"],"One session · proposed demo price":["Одно занятие · примерная демо-цена","Одне заняття · прикладова демо-ціна"],"Digital gift card":["Цифровой подарочный сертификат","Цифровий подарунковий сертифікат"],"Event entry":["Вход на событие","Вхід на подію"],"Demonstration gift card":["Демонстрационный подарочный сертификат","Демонстраційний подарунковий сертифікат"],"Your first step":["Ваш первый шаг","Ваш перший крок"],"When":["Когда","Коли"],"Where":["Где","Де"],"Partner venue · TBC":["Площадка партнёра · уточняется","Майданчик партнера · уточнюється"],"Gift value":["Сумма подарка","Сума подарунка"],"Participants":["Участники","Учасники"],"Additional charges":["Дополнительные сборы","Додаткові збори"],"Demo total":["Демо-итог","Демо-підсумок"],"No live charge. All commercial details and availability need final approval.":["Без настоящего списания. Цены, условия и места требуют итогового подтверждения.","Без справжнього списання. Ціни, умови й місця потребують остаточного підтвердження."],"Read the demonstration conditions":[" тёжного API.","Симуляція BLIK, картки й гаманців. Без торговельного рахунку й платіжного API."],"Authentication & permissions":["Аутентификация и права","Автентифікація й права"],"Open preview. Implement secure authentication and server-side role checks.":["Открытый просмотр. Нужны безопасный вход и серверная проверка ролей.","Відкритий перегляд. Потрібні безпечний вхід і серверна перевірка ролей."],"Availability & attendance":["Места и посещаемость","Місця й відвідуваність"],"Local demonstration data. Production needs transactional capacity control.":["Локальные демо-данные. При запуске нужен транзакционный контроль вместимости.","Локальні демо-дані. Під час запуску потрібен транзакційний контроль місткості."],"Messaging & invoices":["Сообщения и счета","Повідомлення й рахунки"],"No email, SMS, WhatsApp or invoice is sent. Approve providers and templates.":["Письма, SMS, WhatsApp и счета не отправляются. Утвердите провайдеров и шаблоны.","Листи, SMS, WhatsApp і рахунки не надсилаються. Затвердьте провайдерів і шаблони."],"SEO & analytics":["SEO и аналитика","SEO й аналітика"],"No analytics tags. Demo is noindex; hash pages are not production SEO architecture.":["Тегов аналитики нет. Демо закрыто noindex; hash-страницы не подходят для рабочей SEO-архитектуры.","Тегів аналітики немає. Демо закрите noindex; hash-сторінки не підходять для робочої SEO-архітектури."],"Demonstration data":["Демонстрационные данные","Демонстраційні дані"],"Selections, fictional bookings and workflow changes persist only in this browser when local storage is available. Clear them to start from the original sample state.":["Выбор, вымышленные записи и изменения сохраняются только в этом браузере, если локальное хранилище доступно. Очистите их, чтобы вернуться к исходному примеру.","Вибір, вигадані записи й зміни зберігаються лише в цьому браузері, якщо локальне сховище доступне. Очистьте їх, щоб повернутися до початкового прикладу."],"Reset all demo data":["Сбросить все демо-данные","Скинути
