function roadmapPage(){let total=PHASES.reduce((a,p)=>a+p.tasks.length,0),complete=V.checks.filter(k=>k.startsWith('phase-')).length;return `<h1>${L('Build the foundation.<br><em>Then grow.</em>','Zbuduj podstawy.<br><em>Potem rozwijaj.</em>','Постройте основу.<br><em>Затем растите.</em>','Побудуйте основу.<br><em>Потім зростайте.</em>')}</h1><p class="lead card-copy">${L('The five phases and task wording below are preserved from the supplied English document. Checkboxes record your local planning review—not evidence that real-world work has been completed.','Pięć etapów i treść zadań poniżej zachowano z angielskiego dokumentu. Pola to lokalny przegląd planu, nie dowód realizacji.','Пять этапов и формулировки ниже сохранены из английского документа. Галочки — локальный просмотр плана, не доказательство выполнения.','П’ять етапів і формулювання нижче збережено з англійського документа. Позначки — локальний перегляд плану, не доказ виконання.')}</p><div class="progress-line" style="margin:25px 0"><span style="width:${complete/total*100}%"></span></div><p class="small muted">${complete} / ${total} ${L('planning checks','kontroli planowania','проверок плана','перевірок плану')}</p>${PHASES.map((p,i)=>{let prior=i===0||PHASES[i-1].tasks.every((_,j)=>V.checks.includes('phase-'+(i-1)+'-'+j));return `<section class="card card-pad roadmap-phase"><div class="flex between"><span class="eyebrow">PHASE 0${i+1}</span>${pill(prior?L('Planning review available','Przegląd planu dostępny','Проверка плана доступна','Перевірка плану доступна'):L('Prior phase still open','Poprzedni etap otwarty','Предыдущий этап не закрыт','Попередній етап не закрито'),'peach')}</div><h2>${q(p.title)}</h2><p class="micro muted card-copy">${L('Original source checklist · English','Oryginalna lista źródłowa · angielski','Исходный список · английский','Вихідний список · англійська')}</p>${p.tasks.map(([t,path],j)=>{let k='phase-'+i+'-'+j;return `<div class="task-item"><input id="${k}" type="checkbox" ${V.checks.includes(k)?'checked':''} onchange="milestoneToggle('${k}',this.checked)"><div><label for="${k}">${ESC(t)}</label>${A(path,L('Open the implementation','Otwórz wdrożenie','Открыть реализацию','Відкрити реалізацію'),'up','text-link')}</div></div>`}).join('')}${i>0?`<p class="editorial-note">${L('Dependencies guide the launch order; all prototype sections stay available for inspection. A checked box does not launch a project or remove commercial safeguards.','Zależności wskazują kolejność; prototyp pozostaje dostępny. Zaznaczenie nie uruchamia projektu ani nie usuwa zabezpieczeń.','Зависимости задают порядок запуска; разделы прототипа доступны для проверки. Галочка не запускает проект и не снимает ограничения.','Залежності задають порядок запуску; розділи прототипу доступні для перевірки. Позначка не запускає проєкт і не знімає обмеження.')}</p>`:''}</section>`}).join('')}${sourceHint(13)}`}
function financialResult(m){let fields=['ticket','venueCost','djCost','refreshmentCost','promotionCost','otherCost','variableCost','expected'];if(fields.some(k=>m[k]===''||m[k]==null))return null;let p=Number(m.ticket),v=Number(m.variableCost),n=Number(m.expected),cap=Number(m.capacity),fixed=['venueCost','djCost','refreshmentCost','promotionCost','otherCost'].reduce((s,k)=>s+Number(m[k]),0);if(fields.some(k=>!Number.isFinite(Number(m[k]))||Number(m[k])<0)||!Number.isInteger(n)||!Number.isInteger(cap)||cap<1||cap>100||[p,v,n,cap,fixed].some(x=>!Number.isFinite(x))||p<0||v<0||n<0||fixed<0||n>cap)return {invalid:true};let margin=p-v;return {price:p,variable:v,expected:n,cap,fixed,revenue:n*p,totalCost:fixed+n*v,contribution:n*margin-fixed,breakEven:margin>0?Math.ceil(fixed/margin):null,profitAt:margin>0?Math.floor(fixed/margin)+1:null}}
function financeMarkup(){let f=financialResult(V.milonga);if(!f)return notice(L('Enter every cost and expected attendance. Enter 0 where a cost is genuinely zero. No profit is inferred from blanks.','Wpisz koszty i frekwencję. Wpisz 0 tam, gdzie koszt jest zerowy. Puste pola nie oznaczają zysku.','Введите все затраты и посещаемость. Введите 0 для нулевых затрат. Пустые поля не означают прибыль.','Введіть усі витрати й відвідуваність. Введіть 0 для нульових витрат. Порожні поля не означають прибуток.'));if(f.invalid)return notice(L('Check numbers: expected attendance must not exceed capacity; costs cannot be negative.','Sprawdź liczby: frekwencja nie może przekraczać limitu; koszty nieujemne.','Проверьте числа: посещаемость не выше вместимости; расходы неотрицательны.','Перевірте числа: відвідуваність не вища за місткість; витрати невід’ємні.'));return `<div class="stats">${[[f.revenue,L('Ticket revenue · forecast','Prognoza biletów','Прогноз билетов','Прогноз квитків')],[f.totalCost,L('Total cost · forecast','Prognoza kosztów','Прогноз затрат','Прогноз витрат')],[f.contribution,L('Contribution · not net profit','Wynik przed resztą kosztów','Маржа · не чистая прибыль','Маржа · не чистий прибуток')]].map(([v,t])=>`<div class="stat"><div class="value">${money(v)}</div><div class="name">${t}</div></div>`).join('')}</div>${notice(f.breakEven===null?L('No feasible break-even: ticket income does not exceed variable cost per person.','Brak progu rentowności: bilet nie pokrywa kosztu zmiennego na osobę.','Безубыточность недостижима: билет не превышает переменные расходы на человека.','Беззбитковість недосяжна: квиток не перевищує змінні витрати на людину.'):L('Break-even attendance: ','Frekwencja na zero: ','Посещаемость для безубыточности: ','Відвідуваність для беззбитковості: ')+f.breakEven+' · '+L('First positive contribution: ','Pierwszy dodatni wynik: ','Первый положительный результат: ','Перший додатний результат: ')+f.profitAt+(f.profitAt>f.cap?' · '+L('Not reachable within capacity. Reduce costs or review pricing.','Poza limitem. Zmniejsz koszty lub sprawdź ceny.','Выше вместимости. Снизьте расходы или пересмотрите цену.','Вище місткості. Зменште витрати чи перегляньте ціну.'):'') )}<p class="micro muted card-copy">${L('Formula: attendance × ticket − fixed costs − attendance × variable cost. Taxes, unallocated overhead and payment fees are not inferred. Include any relevant costs in the inputs.','Wzór: frekwencja × bilet − koszty stałe − frekwencja × koszty zmienne. Podatki, koszty ogólne i opłaty nie są zakładane. Uwzględnij je we wpisach.','Формула: посещаемость × билет − фиксированные затраты − посещаемость × переменные затраты. Налоги, общие расходы и комиссии не предполагаются.','Формула: відвідуваність × квиток − фіксовані витрати − відвідуваність × змінні витрати. Податки, загальні витрати й комісії не припускаються.')}</p>`}
function studioMilonga(){let m=V.milonga;return `<h1>${L('The milonga.<br><em>Built to last.</em>','Milonga.<br><em>Na dłużej.</em>','Милонга.<br><em>Надолго.</em>','Мілонга.<br><em>Надовго.</em>')}</h1><div class="subnav"><a href="#/milonga">${L('Public page','Strona publiczna','Публичная страница','Публічна сторінка')} ↗</a><a href="#/studio/attendance">${L('Guest check-in','Wejście gości','Вход гостей','Вхід гостей')} ↗</a></div>${notice(L('Source constraint: NOT Solec 38 for the late-night milonga. Plan a suitable venue, up to 100 people, until approximately 01:00–02:00.','Warunek: NIE Solec 38 dla nocnej milongi. Odpowiedni lokal, do 100 osób, do ok. 01:00–02:00.','Ограничение: НЕ Solec 38 для ночной милонги. Подходящая площадка, до 100 человек, до 01:00–02:00.','Обмеження: НЕ Solec 38 для нічної мілонги. Відповідний майданчик, до 100 людей, до 01:00–02:00.'))}<form onsubmit="saveMilonga(event)" oninput="captureMilonga(event)"><div class="card card-pad spaced"><h2>${L('01 / Venue & ticket','01 / Lokal i bilet','01 / Площадка и билет','01 / Майданчик і квиток')}</h2><div class="form-grid">${field('venue',L('Venue name · sample','Nazwa lokalu · przykład','Площадка · пример','Майданчик · приклад'),'text',m.venue,'required maxlength="100"')}${field('address',L('Address · sample','Adres · przykład','Адрес · пример','Адреса · приклад'),'text',m.address,'required maxlength="160"')}${field('date',L('Sample event date','Przykładowa data','Демо-дата','Демо-дата'),'date',m.date,'required')}${field('start',L('Start','Początek','Начало','Початок'),'time',m.start,'required')}${sel('end',L('End · following day','Koniec · następny dzień','Конец · следующий день','Кінець · наступний день'),[['01:00','01:00 (+1)'],['02:00','02:00 (+1)']],m.end)}${field('capacity',L('Safe capacity · maximum 100','Bezpieczny limit · maks. 100','Вместимость · максимум 100','Місткість · максимум 100'),'number',m.capacity,'min="1" max="100" required')}${field('ticket',L('Full ticket price · PLN','Pełna cena biletu · PLN','Цена билета · PLN','Ціна квитка · PLN'),'number',m.ticket,'min="0.01" step="0.01" required')}${field('expected',L('Expected attendance · forecast','Prognozowana frekwencja','Ожидаемая посещаемость','Очікувана відвідуваність'),'number',m.expected,'min="0" max="100" required')}</div></div><div class="card card-pad spaced"><h2>${L('02 / Economics','02 / Finanse','02 / Экономика','02 / Економіка')}</h2><div class="form-grid">${[['venueCost',L('Venue · fixed cost PLN','Lokal · stały koszt PLN','Площадка · фикс. PLN','Майданчик · фікс. PLN')],['djCost',L('DJ · fixed cost PLN','DJ · stały koszt PLN','Диджей · фикс. PLN','Диджей · фікс. PLN')],['refreshmentCost',L('Drinks/snacks · fixed provision PLN','Napoje/przekąski · stała pula PLN','Напитки/закуски · фикс. PLN','Напої/перекуси · фікс. PLN')],['promotionCost',L('Promotion · fixed cost PLN','Promocja · stały koszt PLN','Продвижение · фикс. PLN','Просування · фікс. PLN')],['otherCost',L('Other fixed costs · PLN','Inne koszty stałe · PLN','Прочие фиксированные · PLN','Інші фіксовані · PLN')],['variableCost',L('Additional cost per attendee · PLN','Dodatkowy koszt na osobę · PLN','Доп. расходы на человека · PLN','Дод. витрати на людину · PLN')]].map(([k,t])=>field(k,t,'number',m[k],'min="0" step="0.01" required')).join('')}</div><div id="milonga-results">${financeMarkup()}</div></div><div class="card card-pad spaced"><h2>${L('03 / Launch gates','03 / Warunki startu','03 / Условия запуска','03 / Умови запуску')}</h2>${MILONGA_CHECKS.map(([k,t])=>check('gate-'+k,q(t),m.approved.includes(k))).join('')}<p id="milonga-error" class="error" role="alert"></p><button type="submit" class="btn">${L('Save event scenario','Zapisz scenariusz wydarzenia','Сохранить сценарий события','Зберегти сценарій події')}${I('check')}</button><p class="editorial-note">${L('These are user-declared scenario checks, not proof of permissions or medical/legal compliance. Saving does not sell tickets or send messages.','To deklaracje do scenariusza, nie dowód pozwoleń czy zgodności. Zapis nie sprzedaje biletów ani nie wysyła wiadomości.','Это проверки сценария по декларации пользователя, не доказательство разрешений или соответствия. Сохранение не продаёт билеты.','Це перевірки сценарію за декларацією користувача, не доказ дозволів чи відповідності. Збереження не продає квитки.')}</p></div></form><div class="card card-pad spaced"><h2>${L('04 / The team','04 / Zespół','04 / Команда','04 / Команда')}</h2><p class="micro muted card-copy">${L('Responsibilities below retain the English wording of the source. Assign a person to each role.','Obowiązki zachowano po angielsku ze źródła. Przypisz osobę do roli.','Обязанности сохранены на английском из источника. Назначьте человека на каждую роль.','Обов’язки збережено англійською з джерела. Призначте людину на кожну роль.')}</p>${TEAM_ROLES.map(([k,n,t])=>`<div class="role-row"><div><h4>${q(n)}</h4><p class="small muted">${t}</p></div>${field('role-'+k,L('Assigned owner · example','Odpowiedzialny · przykład','Ответственный · пример','Відповідальний · приклад'),'text',V.team[k]||'','maxlength="80" onchange="V.team[\''+k+'\']=this.value;saveV()"')}</div>`).join('')}</div><div class="card card-pad spaced"><h2>${L('05 / Refreshment stock','05 / Zapasy napojów','05 / Запас напитков','05 / Запас напоїв')}</h2><p class="small muted card-copy">${L('Record planned and used units. Financial provision is entered separately above; do not double-count it. No alcohol service is assumed.','Zapisz ilości planowane i użyte. Koszty są osobno powyżej; nie licz ich podwójnie. Nie zakładamy serwowania alkoholu.','Запишите запланированное и использованное. Затраты вводятся отдельно; не считайте дважды. Алкоголь не предполагается.','Запишіть заплановане й використане. Витрати вводяться окремо; не рахуйте двічі. Алкоголь не припускається.')}</p><form onsubmit="addStock(event)" class="stock-form">${field('item',L('Item','Produkt','Товар','Товар'),'text','','required maxlength="60" placeholder="Tea / coffee"')}${field('planned',L('Planned units','Planowane sztuki','Запланировано','Заплановано'),'number','','required min="0"')}${field('used',L('Used units','Zużyte sztuki','Использовано','Використано'),'number',0,'required min="0"')}<button class="btn sm">${L('Add','Dodaj','Добавить','Додати')}</button></form><div class="table-scroll"><table><thead><tr><th>${L('Item','Produkt','Товар','Товар')}</th><th>${L('Planned','Plan','План','План')}</th><th>${L('Used','Zużyte','Расход','Витрата')}</th><th>${L('Remaining','Pozostało','Остаток','Залишок')}</th></tr></thead><tbody>${(m.stock||[]).map((s,i)=>`<tr><td>${ESC(s.item)}</td><td>${s.planned}</td><td><input type="number" min="0" max="${s.planned}" value="${s.used}" aria-label="${L('Used units','Zużyte sztuki','Использовано','Використано')}" onchange="updateStock(${i},this.value)"></td><td>${s.planned-s.used}</td></tr>`).join('')}</tbody></table></div></div><div class="card card-pad spaced"><h2>${L('06 / Review before recurrence','06 / Ocena przed powtórką','06 / Оценка перед повторением','06 / Оцінка перед повторенням')}</h2><p class="small muted card-copy">${L('Review actual check-ins, ticket purchases, costs, feedback and loss risk. Guest DJs and weekly recurrence remain later options, not scheduled promises.','Sprawdź wejścia, bilety, koszty, opinie i ryzyko straty. Gościnni DJ-e i cotygodniowe wydarzenia są opcjami, nie obietnicą.','Оцените входы, билеты, затраты, отзывы и риск убытка. Гостевые диджеи и еженедельность — дальнейшие варианты, не обещание.','Оцініть входи, квитки, витрати, відгуки й ризик збитку. Гостьові диджеї та щотижневість — подальші варіанти, не обіцянка.')}</p>${area('milonga-review',L('Event learning notes · sample only','Wnioski z wydarzenia · przykład','Заметки по событию · пример','Нотатки за подією · приклад'),V.notes.milonga||'','onchange="V.notes.milonga=this.value;saveV()"')}</div>`}
function captureMilonga(e){const form=e.currentTarget,d=new FormData(form);for(const k of ['venue','address','date','start','end','ticket','expected','venueCost','djCost','refreshmentCost','promotionCost','otherCost','variableCost'])if(d.has(k))V.milonga[k]=String(d.get(k));V.milonga.capacity=Number(d.get('capacity'));V.milonga.approved=MILONGA_CHECKS.filter(([k])=>d.has('gate-'+k)).map(([k])=>k);saveV();let results=document.getElementById('milonga-results');if(results)results.innerHTML=financeMarkup()}
function saveMilonga(e){e.preventDefault();captureMilonga(e);let m=V.milonga;let error='';if(/solec\s*38/i.test(m.venue+' '+m.address))error=L('Solec 38 cannot be used for this late-night event.','Solec 38 nie jest miejscem tego nocnego wydarzenia.','Solec 38 нельзя использовать для ночного события.','Solec 38 не можна використати для нічної події.');else if(!financialResult(m)||financialResult(m).invalid)error=L('Complete and check the financial inputs.','Uzupełnij i sprawdź finanse.','Заполните и проверьте финансы.','Заповніть і перевірте фінанси.');else if(!MILONGA_CHECKS.every(([k])=>m.approved.includes(k)))error=L('Saved as planning only. Complete all six gates before preparing a ticket offer.','Zapisano jako plan. Spełnij sześć warunków przed ofertą biletu.','Сохранено как план. Завершите шесть проверок до предложения билета.','Збережено як план. Завершіть шість перевірок до пропозиції квитка.');if(!error&&!milongaReady())error=L('Keep planning: complete venue/date fields, assign all delivery roles, and check that profitable attendance is possible within capacity.','Uzupełnij lokal i termin, przypisz role i sprawdź rentowność w limicie.','Уточните место и дату, назначьте роли и проверьте достижимость прибыли.','Уточніть місце й дату, призначте ролі й перевірте досяжність прибутку.');if(error){document.getElementById('milonga-error').textContent=error;return}saveV();toast(L('Local event scenario ready for invitation review. Not a live event.','Lokalny scenariusz gotowy do przeglądu zaproszeń. Nie wydarzenie na żywo.','Локальный сценарий готов для проверки приглашений. Не настоящее событие.','Локальний сценарій готовий для перевірки запрошень. Не справжня подія.'))}
function addStock(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),n=Number(d.planned),u=Number(d.used);if(u>n){toast(L('Used units exceed stock.','Zużycie przekracza zapas.','Расход превышает запас.','Витрата перевищує запас.'));return}V.milonga.stock??=[];V.milonga.stock.push({item:clean(d.item,60),planned:n,used:u});saveV();render()}
function updateStock(i,v){let s=V.milonga.stock[i];if(s){s.used=Math.min(s.planned,Math.max(0,Number(v)||0));saveV();render()}}
function studioAttendanceNew(){return `<h1>${L('Who actually came?<br><em>Make it visible.</em>','Kto naprawdę przyszedł?<br><em>Zobacz to jasno.</em>','Кто действительно пришёл?<br><em>Увидьте ясно.</em>','Хто справді прийшов?<br><em>Побачте ясно.</em>')}</h1><p class="lead card-copy">${L('Search a booking reference, programme or date. Cancelled bookings cannot be checked in. A mark records the whole local booking party; it is not medical or skill data.','Szukaj numeru, programu lub daty. Anulowanych nie oznaczamy. Znacznik dotyczy całej rezerwacji demo, nie danych medycznych ani umiejętności.','Ищите номер, программу или дату. Отменённые записи не отмечаются. Отметка относится ко всей демо-группе, не к здоровью или навыкам.','Шукайте номер, програму чи дату. Скасовані записи не позначаються. Позначка стосується всієї демо-групи, не здоров’я чи навичок.')}</p><div class="field spaced"><label for="attendance-search">${L('Search bookings','Szukaj rezerwacji','Поиск записей','Пошук записів')}</label><input id="attendance-search" oninput="filterTable('attendance-table',this.value)"></div><div class="card table-scroll"><table id="attendance-table"><thead><tr><th>${L('Booking','Rezerwacja','Запись','Запис')}</th><th>${L('Session','Spotkanie','Занятие','Заняття')}</th><th>${L('People','Osoby','Люди','Люди')}</th><th>${T('Attendance','Obecność')}</th></tr></thead><tbody>${V.bookings.filter(b=>b.status==='confirmed').map(b=>`<tr><td>${b.id}</td><td>${itemTitle(b.target)}<br>${b.date} · ${b.time}</td><td>${b.people}</td><td><select aria-label="${T('Attendance','Obecność')}" onchange="V.attendance['${b.id}']=this.value;saveV()">${[['unmarked',T('Not marked','Nieoznaczona')],['attended',T('Attended','Obecność')],['absent',T('Absent','Nieobecność')]].map(([v,n])=>`<option value="${v}" ${(V.attendance[b.id]||'unmarked')===v?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="button-row"><button class="btn light" onclick="attendanceExport()">${I('download')}${L('Export register','Eksport listy','Экспорт списка','Експорт списку')}</button><button class="text-link" onclick="absenceMessage()">${L('Preview a considerate check-in','Podgląd życzliwej wiadomości','Пример заботливого сообщения','Приклад дбайливого повідомлення')}</button></div>`}
function filterTable(id,qv){document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(qv.toLowerCase()))}
function exportRequests(){let rows=[['DEMO ONLY','Target','Kind','Slot','Party','Stage','Segment','Source','Opted into updates'],...V.requests.map(r=>[r.id,r.target,r.kind,r.slot,r.party,r.status,r.segment,r.source,r.updates])];csvDownload('AuraTango_DEMO_requests.csv',rows)}
function csvDownload(n,rows){const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};downloadFile(n,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function attendanceExport(){csvDownload('AuraTango_DEMO_attendance.csv',[['Booking','Programme','Date','Time','People','Status','Attendance'],...V.bookings.map(b=>[b.id,b.target,b.date,b.time,b.people,b.status,V.attendance[b.id]||'unmarked'])])}

function studioCommunity(){return `<h1>${L('One noticeboard.<br><em>Less chasing.</em>','Jedna tablica.<br><em>Mniej przypominania.</em>','Одна доска.<br><em>Меньше напоминаний.</em>','Одна дошка.<br><em>Менше нагадувань.</em>')}</h1><p class="lead card-copy">${L('Create a draft, review it, then publish to the local community feed. Dated announcements also appear in the calendar. No WhatsApp, email or push message is sent.','Utwórz szkic, sprawdź i opublikuj w lokalnej społeczności. Ogłoszenia z datą trafią do kalendarza. Bez WhatsApp, e-maila i push.','Создайте черновик, проверьте и опубликуйте в локальной ленте. Объявления с датой появятся в календаре. Без WhatsApp, email и push.','Створіть чернетку, перевірте й опублікуйте в локальній стрічці. Оголошення з датою з’являться в календарі. Без WhatsApp, email і push.')}</p><div class="card card-pad spaced"><form onsubmit="saveAnnouncement(event)"><div class="form-grid">${field('title',L('Title · sample','Tytuł · przykład','Заголовок · пример','Заголовок · приклад'),'text','','required maxlength="120"')}${sel('type',L('Category','Kategoria','Категория','Категорія'),[['class',W('classes')],['workshop',W('workshops')],['milonga',W('milonga')],['practice',itemTitle('practice')],['social',L('Social / cultural gathering','Spotkanie towarzyskie / kulturalne','Социальная / культурная встреча','Соціальна / культурна зустріч')],['auratouch','AuraTouch']])}${field('date',L('Date · optional for news','Data · opcjonalna dla wiadomości','Дата · необязательна для новости','Дата · необов’язкова для новини'),'date')}${field('time',L('Time','Godzina','Время','Час'),'time')}${field('venue',L('Venue · sample','Miejsce · przykład','Место · пример','Місце · приклад'),'text','','maxlength="120"')}${sel('audience',L('Interest circle','Krąg zainteresowań','Круг интересов','Коло інтересів'),[['all',L('Everyone','Wszyscy','Все','Усі')],...CIRCLES.map(c=>[c.id,q(c.title)])])}</div>${area('body',L('Announcement · sample only','Treść · tylko przykład','Текст · только пример','Текст · лише приклад'),'','required')}${check('ack',L('This is a prototype announcement, not a verified public event.','To ogłoszenie prototypu, nie zweryfikowane wydarzenie publiczne.','Это объявление прототипа, не подтверждённое публичное событие.','Це оголошення прототипу, не підтверджена публічна подія.'),false,true)}<button class="btn" type="submit">${L('Save draft','Zapisz szkic','Сохранить черновик','Зберегти чернетку')}${I('book')}</button></form></div><h2 class="subsection-heading">${L('Draft → review → publish','Szkic → przegląd → publikacja','Черновик → проверка → публикация','Чернетка → перевірка → публікація')}</h2>${V.posts.map(p=>`<div class="card request-row"><div><span class="pill ${p.status==='published'?'green':'peach'}">${p.status==='published'?L('Published locally','Opublikowano lokalnie','Опубликовано локально','Опубліковано локально'):L('Draft','Szkic','Черновик','Чернетка')}</span><h3 class="card-copy">${ESC(p.title)}</h3><p class="small muted">${ESC(p.body)}<br>${p.date||''} ${p.time||''} · ${ESC(p.venue||'')}<br>${L('RSVPs','RSVP','RSVP','RSVP')}: ${V.rsvps.includes(p.id)?1:0} ${L('local sample member','lokalny członek demo','локальный демо-участник','локальний демо-учасник')}</p></div><div class="button-row"><button class="btn light sm" onclick="reviewPost('${p.id}')">${L('Review','Sprawdź','Проверить','Перевірити')}</button>${p.status==='published'?`<button class="text-link" onclick="unpublishPost('${p.id}')">${L('Unpublish','Wycofaj publikację','Снять публикацию','Зняти публікацію')}</button>`:''}</div></div>`).join('')}<div class="button-row">${A('/community',L('View community feed','Zobacz tablicę','Посмотреть ленту','Переглянути стрічку'),'up','text-link')}${A('/community/calendar',L('View calendar','Zobacz kalendarz','Посмотреть календарь','Переглянути календар'),'calendar','text-link')}</div>`}
function saveAnnouncement(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));V.posts.push({id:uid('POST'),title:clean(d.title,120),body:clean(d.body),type:d.type,audience:d.audience,date:d.date||'',time:d.time||'',venue:clean(d.venue,120),status:'draft'});saveV();render()}
function reviewPost(id){let p=V.posts.find(x=>x.id===id);if(!p)return;modal(L('Review before publishing.','Sprawdź przed publikacją.','Проверьте перед публикацией.','Перевірте перед публікацією.'),`<span class="pill peach">${W('demo')}</span><h3 class="card-copy">${ESC(p.title)}</h3><p class="card-copy">${ESC(p.body)}</p><p class="small card-copy">${p.date||''} ${p.time||''} · ${ESC(p.venue||W('pending'))}</p>${p.type==='milonga'&&!milongaReady()?notice(L('Milonga details have not passed the venue and planning gates. Publication is blocked.','Milonga nie przeszła warunków lokalu i planu. Publikacja zablokowana.','Милонга не прошла проверки площадки и плана. Публикация заблокирована.','Мілонга не пройшла перевірки майданчика й плану. Публікацію заблоковано.')):''}<form onsubmit="publishPost(event,'${id}')">${check('review',L('I have reviewed the audience, date, description and image/communication permissions for this local scenario.','Sprawdzono odbiorców, datę, opis i prawa komunikacji w tym lokalnym scenariuszu.','Проверены аудитория, дата, описание и разрешения для локального сценария.','Перевірено аудиторію, дату, опис і дозволи для локального сценарію.'),false,true)}<button class="btn full" ${p.type==='milonga'&&!milongaReady()?'disabled':''}>${L('Publish to local community','Opublikuj w lokalnej społeczności','Опубликовать в локальном сообществе','Опублікувати в локальній спільноті')}${I('check')}</button></form>`)}
function publishPost(e,id){e.preventDefault();let p=V.posts.find(x=>x.id===id);if(!p||p.type==='milonga'&&!milongaReady())return;if(p.type==='milonga'){p.date=V.milonga.date;p.time=V.milonga.start;p.venue=V.milonga.venue+' · '+V.milonga.address}p.status='published';saveV();closeModal();navigate('/community')}
function unpublishPost(id){let p=V.posts.find(x=>x.id===id);if(p){p.status='draft';saveV();render()}}
const SEGMENTS=[['current',Q('Current students','Obecni kursanci','Текущие ученики','Поточні учні')],['former',Q('Former students','Byli kursanci','Бывшие ученики','Колишні учні')],['workshop',Q('Workshop participants','Uczestnicy warsztatów','Участники семинаров','Учасники майстер-класів')],['milonga',Q('Milonga attendees','Uczestnicy milong','Посетители милонг','Відвідувачі мілонг')],['interested',Q('Interested / new people','Zainteresowani / nowi','Заинтересованные / новые','Зацікавлені / нові')]];
function templateFor(seg){return seg==='former'?L('Hello, we are preparing the Saturday groups and thought you might like to reconnect. Would you like to see the current details or simply join a community moment?','Cześć, przygotowujemy sobotnie grupy. Może chcesz wrócić? Sprawdź szczegóły lub dołącz po prostu do spotkania społeczności.','Здравствуйте! Готовим субботние группы. Возможно, вам интересно вернуться? Посмотрите детали или просто присоединитесь к встрече сообщества.','Вітаємо! Готуємо суботні групи. Можливо, вам цікаво повернутися? Перегляньте деталі або просто долучіться до зустрічі спільноти.'):seg==='workshop'?L('We are developing a special connection workshop. Would you like the details once the teacher, level and date are confirmed?','Tworzymy specjalny warsztat kontaktu. Czy chcesz szczegóły po potwierdzeniu prowadzącego, poziomu i daty?','Готовим специальный семинар по контакту. Хотите детали после подтверждения ведущего, уровня и даты?','Готуємо спеціальний майстер-клас із контакту. Бажаєте деталі після підтвердження ведучого, рівня й дати?'):seg==='milonga'?L('The next AuraTango milonga is in planning. Follow the announcement page for confirmed details—no need to book an unconfirmed date.','Kolejna milonga jest w planowaniu. Śledź stronę z potwierdzonymi informacjami — bez rezerwacji nieustalonej daty.','Следующая милонга планируется. Следите за подтверждёнными деталями — не нужно бронировать неизвестную дату.','Наступна мілонга планується. Стежте за підтвердженими деталями — не потрібно бронювати невідому дату.'):L('Your next tango moment can be a class, a practica or simply time with the community. Choose what suits you, and update your preferences whenever you wish.','Kolejna chwila tanga to zajęcia, praktika lub spotkanie. Wybierz, co pasuje, i zmieniaj preferencje, kiedy chcesz.','Следующая встреча — урок, практика или время с сообществом. Выбирайте подходящее и меняйте настройки в любое время.','Наступна зустріч — урок, практика чи час зі спільнотою. Обирайте відповідне й змінюйте налаштування будь-коли.')}
function studioReactivation(){let seg=V.campaign||'all',rs=V.requests.filter(r=>r.kind!=='host'&&(seg==='all'||r.segment===seg)),eligible=rs.filter(r=>r.updates&&!['withdrawn','declined'].includes(r.status)&&!V.preferences.pause);return `<h1>${L('An invitation back.<br><em>Not a broadcast to everyone.</em>','Zaproszenie do powrotu.<br><em>Nie wysyłka do wszystkich.</em>','Приглашение вернуться.<br><em>Не рассылка всем.</em>','Запрошення повернутися.<br><em>Не розсилка всім.</em>')}</h1><p class="lead card-copy">${L('Keep current, former, workshop, milonga and interested audiences distinct. Only contacts with the applicable permission belong in a promotional queue. No real contacts are imported here.','Rozdziel obecnych, byłych, warsztatowych, milongowych i zainteresowanych. Do kolejki promocji tylko właściwe zgody. Nie importowano prawdziwych kontaktów.','Разделяйте текущих, бывших, семинарских, милонговых и новых. В очередь продвижения — только подходящее разрешение. Реальные контакты не импортированы.','Розділяйте поточних, колишніх, учасників майстер-класів, мілонг і нових. У чергу просування — лише відповідний дозвіл. Справжні контакти не імпортовано.')}</p><div class="filter-bar spaced">${[['all',Q('All segments','Wszystkie segmenty','Все сегменты','Усі сегменти')],...SEGMENTS].map(([k,t])=>`<button class="filter-chip ${seg===k?'active':''}" onclick="V.campaign='${k}';saveV();render()">${q(t)}</button>`).join('')}</div><div class="stats">${[[rs.length,L('Records in segment','Rekordy segmentu','Записи сегмента','Записи сегмента')],[eligible.length,L('Eligible for local draft','Do lokalnego szkicu','Доступно для черновика','Доступно для чернетки')],[rs.length-eligible.length,L('Excluded / paused','Wykluczone / wstrzymane','Исключено / пауза','Виключено / пауза')]].map(([v,t])=>`<div class="stat"><div class="value">${v}</div><div class="name">${t}</div></div>`).join('')}</div><div class="card card-pad"><h3>${L('Relevant message preview','Podgląd odpowiedniej wiadomości','Подходящий текст','Відповідний текст')}</h3><p class="card-copy">${templateFor(seg)}</p>${notice(L('The source’s example future dates are not facts. These templates do not claim that a workshop is confirmed next month or a milonga is already scheduled.','Przykładowe przyszłe daty ze źródła nie są faktami. Szablony nie twierdzą, że warsztat czy milonga są potwierdzone.','Будущие даты из примера не являются фактами. Шаблоны не утверждают, что семинар или милонга уже назначены.','Майбутні дати з прикладу не є фактами. Шаблони не стверджують, що майстер-клас чи мілонгу вже призначено.'))}<div class="button-row"><button class="btn" ${eligible.length?'':'disabled'} onclick="queueDrafts()">${L('Prepare eligible local drafts','Przygotuj dozwolone szkice lokalne','Подготовить допустимые черновики','Підготувати допустимі чернетки')}${I('mail')}</button><button class="btn light" onclick="copyText(templateFor(V.campaign))">${T('Copy template','Kopiuj szablon')}</button></div></div><div class="card table-scroll spaced"><table><thead><tr><th>ID</th><th>${L('Segment','Segment','Сегмент','Сегмент')}</th><th>${L('Updates allowed in demo','Zgoda na wiadomości demo','Разрешены демо-новости','Дозволені демо-новини')}</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${r.id}</td><td><select aria-label="Segment" onchange="V.requests.find(x=>x.id==='${r.id}').segment=this.value;saveV();render()">${SEGMENTS.map(([k,t])=>`<option value="${k}" ${r.segment===k?'selected':''}>${q(t)}</option>`).join('')}</select></td><td>${r.updates&&!V.preferences.pause?L('Yes · local choice','Tak · lokalny wybór','Да · локальный выбор','Так · локальний вибір'):L('No / paused','Nie / wstrzymano','Нет / пауза','Ні / пауза')}</td></tr>`).join('')}</tbody></table></div><h3 class="subsection-heading">${L('Draft queue · never sent','Kolejka szkiców · niewysłane','Очередь черновиков · не отправлено','Черга чернеток · не надіслано')}</h3>${V.messages.map(m=>`<div class="card card-pad spaced"><p class="micro muted">${m.id} · ${m.request} · ${L('UNSENT','NIEWYSŁANE','НЕ ОТПРАВЛЕНО','НЕ НАДІСЛАНО')}</p><p class="small card-copy">${ESC(m.body)}</p></div>`).join('')}${sourceHint(10)}`}
function queueDrafts(){let seg=V.campaign||'all',count=0;V.requests.filter(r=>r.kind!=='host'&&(seg==='all'||r.segment===seg)&&r.updates&&!['withdrawn','declined'].includes(r.status)&&!V.preferences.pause).forEach(r=>{let signature=r.id+'|'+r.segment;if(!V.messages.some(m=>m.signature===signature)){V.messages.push({id:uid('DRAFT'),signature,request:r.id,body:templateFor(r.segment),status:'unsent'});count++}});saveV();render();toast(count+' '+L('local drafts prepared. Nothing sent.','szkiców lokalnych. Nic nie wysłano.','локальных черновиков. Ничего не отправлено.','локальних чернеток. Нічого не надіслано.'))}
const DRESS_CHECKS=[['design',Q('Designs prototyped','Projekty prototypowe','Дизайны прототипированы','Дизайни прототиповано')],['fabric',Q('Fabrics tested','Tkaniny sprawdzone','Ткани проверены','Тканини перевірено')],['movement',Q('Movement and comfort tested with dancers','Ruch i wygoda przetestowane z tancerzami','Движение и комфорт проверены с танцующими','Рух і комфорт перевірено з танцівниками')],['customer',Q('Target customer and demand validated','Odbiorca i popyt zweryfikowane','Аудитория и спрос проверены','Аудиторію й попит перевірено')],['cost',Q('Production costs established','Ustalono koszty produkcji','Установлена себестоимость','Встановлено собівартість')],['price',Q('Realistic price reviewed','Sprawdzono realną cenę','Проверена реалистичная цена','Перевірено реалістичну ціну')],['model',Q('Small batch or made-to-order chosen','Wybrano małą serię lub szycie na zamówienie','Выбрана серия или пошив на заказ','Обрано серію чи пошиття на замовлення')],['photos',Q('Real finished products photographed','Gotowe produkty sfotografowane','Готовые товары сфотографированы','Готові товари сфотографовано')],['collection',Q('Initial collection and limited sales plan approved','Kolekcja i ograniczona sprzedaż zatwierdzone','Первая коллекция и малые продажи согласованы','Першу колекцію й малі продажі погоджено')]];
function studioAtelier(){let d=V.dressPlan;return `<h1>${L('Validate the movement.<br><em>Then the product.</em>','Sprawdź ruch.<br><em>Potem produkt.</em>','Проверьте движение.<br><em>Затем продукт.</em>','Перевірте рух.<br><em>Потім продукт.</em>')}</h1><p class="lead card-copy">${L('No inventory has been invented. The public atelier collects testing preferences. Operational choices below stay separate from live selling.','Nie wymyślono zapasu. Atelier zbiera preferencje testowe. Wybory operacyjne są oddzielone od sprzedaży.','Запас не выдуман. Публичное ателье собирает предпочтения тестирования. Операционные решения отделены от продаж.','Запас не вигадано. Публічне ательє збирає вподобання тестування. Операційні рішення відокремлено від продажів.')}</p><div class="card card-pad spaced"><form onsubmit="saveDressPlan(event)"><div class="form-grid">${sel('production',L('Production model','Model produkcji','Модель производства','Модель виробництва'),[['undecided',L('Undecided','Do decyzji','Не решено','Не вирішено')],['small-batch',L('Small batch','Mała seria','Малая серия','Мала серія')],['made-to-order',L('Made to order','Na zamówienie','На заказ','На замовлення')]],d.production)}${field('fabric',L('Fabric under test · no product claim','Tkanina w teście · nie obietnica produktu','Ткань на тесте · не обещание товара','Тканина на тесті · не обіцянка товару'),'text',d.fabric,'maxlength="120"')}${field('unitCost',L('Unit production cost · PLN','Koszt produkcji sztuki · PLN','Себестоимость единицы · PLN','Собівартість одиниці · PLN'),'number',d.unitCost,'min="0" step="0.01"')}${field('price',L('Possible selling price · PLN','Możliwa cena sprzedaży · PLN','Возможная цена · PLN','Можлива ціна · PLN'),'number',d.price,'min="0" step="0.01"')}${field('batch',L('Initial batch limit · optional','Limit pierwszej serii · opcjonalnie','Лимит первой серии · необязательно','Ліміт першої серії · необов’язково'),'number',d.batch,'min="1" max="1000"')}</div>${DRESS_CHECKS.map(([k,t])=>check('d-'+k,q(t),d.approvals.includes(k))).join('')}<button class="btn">${W('save')}${I('check')}</button></form>${d.unitCost!==''&&d.price!==''?notice(L('Price minus production cost only: ','Cena minus koszt produkcji: ','Цена минус себестоимость: ','Ціна мінус собівартість: ')+money(Number(d.price)-Number(d.unitCost))+'. '+L('Not net profit; packaging, fulfilment, returns, taxes and fees are not included unless entered in costs.','Nie zysk netto; opakowania, dostawy, zwroty, podatki i opłaty nie są ujęte, chyba że dodane w kosztach.','Не чистая прибыль: упаковка, доставка, возвраты, налоги и комиссии не включены, если не учтены в затратах.','Не чистий прибуток: пакування, доставка, повернення, податки й комісії не включено, якщо не враховано у витратах.')):''}<p class="editorial-note">${L('Even a completed checklist does not activate a real shop. The supplied brief has no sellable catalogue, approved prices, product photographs, fulfilment or return terms.','Nawet kompletna lista nie aktywuje sklepu. Dokument nie zawiera katalogu do sprzedaży, cen, zdjęć, realizacji ani warunków zwrotu.','Даже полный список не активирует магазин. В документе нет продаваемого каталога, цен, фото, исполнения и условий возврата.','Навіть повний список не активує магазин. У документі немає каталогу для продажу, цін, фото, виконання й умов повернення.')}</p></div><h2 class="subsection-heading">${L('Dancer feedback','Opinie tancerzy','Отзывы танцующих','Відгуки танцівників')}</h2><div class="card table-scroll"><table><thead><tr><th>${L('Direction','Kierunek','Направление','Напрям')}</th><th>${L('Use','Użycie','Использование','Використання')}</th><th>${L('Priority','Priorytet','Приоритет','Пріоритет')}</th><th>${L('Testing','Testowanie','Тестирование','Тестування')}</th><th>${L('Research budget band','Przedział budżetu','Бюджет исследования','Бюджет дослідження')}</th></tr></thead><tbody>${V.feedback.map(f=>`<tr><td>${itemTitle(f.product)}</td><td>${ESC(f.use)}</td><td>${ESC(f.priority)}</td><td>${ESC(f.testing)}</td><td>${ESC(f.budget)}</td></tr>`).join('')}</tbody></table></div><div class="button-row">${A('/shop',L('Try the public feedback flow','Wypróbuj formularz publiczny','Проверить публичный отзыв','Перевірити публічний відгук'),'up','text-link')}<button class="btn light" onclick="csvDownload('AuraTango_DEMO_product_feedback.csv',[['Product','Use','Priority','Testing','Budget'],...V.feedback.map(f=>[f.product,f.use,f.priority,f.testing,f.budget])])">${I('download')}CSV</button></div>${sourceHint('7, 13')}`}
function saveDressPlan(e){e.preventDefault();let f=new FormData(e.target);V.dressPlan={production:f.get('production'),fabric:clean(f.get('fabric'),120),unitCost:f.get('unitCost'),price:f.get('price'),batch:f.get('batch'),approvals:DRESS_CHECKS.filter(([k])=>f.has('d-'+k)).map(([k])=>k)};saveV();render()}
function contentStudio(){let tasks=[['Single approved programme record','Use the supplied Saturday and weekend schedule. Confirm real dates, duration, level, assigned venue, instructor, language, capacity and tariffs before public checkout.','/studio/requests'],['A complete family of pages','Classes, Workshops, Milonga, AuraTouch, Community, Atelier, About and Contact are separate destinations, with guided links.','/review'],['Original films and journal','Existing school-linked films and articles are retained. Interviews remain previews until recordings and permissions exist.','/journal'],['Workshop and AuraTouch media','Write a topic brief, photograph/video a real pilot with permission, then replace concept assets. Do not invent participants or testimonials.','/auratouch'],['Milonga photos/videos','Add a real event gallery only after the event. Existing atmosphere photos are not proof the future milonga occurred.','/milonga'],['Dresses: finished product photography','Test and finish the garment, photograph it on a consenting model, verify fabric/fit data, then prepare an actual product page.','/shop'],['Indexable multilingual URLs','This file uses hash routes and noindex. Production requires separate indexable pages with translated titles, descriptions, equivalent-language navigation, canonical handling and sitemaps.','/studio/settings'],['Booking and measurement events','Define request, invitation, accepted offer, confirmed order, attendance, eligible renewal and refund review separately. This HTML has no live analytics or SEO measurements.','/studio/settings'],['Rights and consent','Approve images, music, media publication, service terms and communications before production. Third-party video loads only after play.','/studio/settings']];return `<h1>${L('Show what is real.<br><em>Make it easy to find.</em>','Pokaż to, co prawdziwe.<br><em>Ułatw odkrywanie.</em>','Покажите настоящее.<br><em>Помогите найти.</em>','Покажіть справжнє.<br><em>Допоможіть знайти.</em>')}</h1><p class="lead card-copy">${L('Implementation handoff notes below are in English. These are development tasks, not a completed SEO audit or a claim of live integrations.','Notatki wdrożeniowe poniżej są po angielsku. To zadania, nie audyt SEO ani działające integracje.','Заметки внедрения ниже на английском. Это задачи, не готовый SEO-аудит или живые интеграции.','Нотатки впровадження нижче англійською. Це завдання, не готовий SEO-аудит чи живі інтеграції.')}</p>${tasks.map(([t,d,p],i)=>`<div class="card card-pad spaced"><div class="task-item"><input type="checkbox" id="content-check-${i}" ${V.checks.includes('content-'+i)?'checked':''} onchange="milestoneToggle('content-${i}',this.checked)"><div><label for="content-check-${i}">${t}</label><p class="small muted card-copy">${d}</p>${A(p,L('Inspect','Sprawdź','Проверить','Перевірити'),'up','text-link')}</div></div></div>`).join('')}`}

function hostPage(){let kind=new URLSearchParams(location.hash.split('?')[1]||'').get('kind')||'workshop';return pageHead(L('Your city.<br><em>Our next conversation.</em>','Twoje miasto.<br><em>Nasza kolejna rozmowa.</em>','Ваш город.<br><em>Наш следующий разговор.</em>','Ваше місто.<br><em>Наша наступна розмова.</em>'),L('Invite Rick for a workshop, festival, tango weekend or guest-teaching event. Venue and community partners can also introduce a suitable space. An enquiry is not an accepted booking.','Zaproś Ricka na warsztat, festiwal, weekend tanga lub gościnne lekcje. Partnerzy mogą zaproponować lokal. Zapytanie nie jest przyjętą rezerwacją.','Пригласите Рика на семинар, фестиваль, танго-выходные или гостевое обучение. Партнёры могут предложить площадку. Запрос не означает принятой брони.','Запросіть Ріка на майстер-клас, фестиваль, танго-вихідні чи гостьове навчання. Партнери можуть запропонувати майданчик. Запит не означає прийнятого бронювання.'),L('Invite Rick / partner with AuraTango','Zaproś Ricka / partnerstwo','Пригласить Рика / партнёрство','Запросити Ріка / партнерство'))+`<div class="guided-shell">${flowChips([L('Your idea','Twój pomysł','Ваша идея','Ваша ідея'),L('Studio review','Przegląd studia','Проверка студии','Перевірка студії'),L('Scope & agreement','Zakres i ustalenia','Объём и условия','Обсяг та умови')],0)}<div class="card card-pad">${notice(demoText())}<form onsubmit="submitHost(event)"><div class="form-grid">${sel('format',L('Proposed format','Proponowany format','Формат','Формат'),[['workshop',W('workshops')],['festival',L('Festival','Festiwal','Фестиваль','Фестиваль')],['weekend',L('Tango weekend','Weekend tanga','Танго-выходные','Танго-вихідні')],['guest',L('Guest teaching','Gościnne lekcje','Гостевое обучение','Гостьове навчання')],['venue',L('Late-night milonga venue','Lokal na nocną milongę','Площадка ночной милонги','Майданчик нічної мілонги')],['cafe',L('Café / club partnership','Partnerstwo kawiarni / klubu','Кафе / клуб','Кав’ярня / клуб')]],kind)}${field('organisation',L('Organisation · sample','Organizacja · przykład','Организация · пример','Організація · приклад'),'text','','required maxlength="100" placeholder="Example tango community"')}${field('city',L('City','Miasto','Город','Місто'),'text','','required maxlength="80"')}${field('email',L('Sample contact email','Przykładowy e-mail','Пример email','Приклад email'),'email','','required placeholder="organiser@example.com"')}${field('date',L('Preferred date · not a booking','Preferowana data · nie rezerwacja','Желаемая дата · не бронь','Бажана дата · не бронювання'),'date')}${field('capacity',L('Expected participants','Planowana liczba osób','Ожидаемые участники','Очікувані учасники'),'number','','min="1" max="1000"')}${field('venue',L('Proposed venue · sample','Proponowany lokal · przykład','Предлагаемое место · пример','Запропоноване місце · приклад'),'text','','maxlength="120"')}${field('budget',L('Indicative organiser budget · PLN · optional','Orientacyjny budżet · PLN · opcjonalnie','Бюджет организатора · PLN · необязательно','Бюджет організатора · PLN · необов’язково'),'number','','min="0" step="1"')}</div>${area('audience',L('Audience, level, topic and practical access requirements · sample','Odbiorcy, poziom, temat i dostęp · przykład','Аудитория, уровень, тема и доступ · пример','Аудиторія, рівень, тема й доступ · приклад'),'','required')}${check('ack',L('This is a fictional local proposal. Organisation, city and idea are stored locally; no email is stored or sent and no invitation is accepted automatically.','To fikcyjna propozycja lokalna. Organizacja, miasto i pomysł zostają lokalnie; bez zapisu e-maila, wysyłki i automatycznej akceptacji.','Это вымышленное локальное предложение. Организация, город и идея сохраняются локально; email не сохраняется, приглашение не принимается автоматически.','Це вигадана локальна пропозиція. Організація, місто й ідея зберігаються локально; email не зберігається, запрошення не приймається автоматично.'),false,true)}<button class="btn full" type="submit">${L('Create a local invitation request','Utwórz lokalne zapytanie','Создать локальный запрос','Створити локальний запит')}${I('arrow')}</button></form></div></div>`}
function submitHost(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));V.hosts??=[];let h={id:uid('HOST'),format:d.format,organisation:clean(d.organisation,100),city:clean(d.city,80),date:d.date,capacity:d.capacity,budget:d.budget,venue:clean(d.venue,120),audience:clean(d.audience),stage:'new',reply:''};V.hosts.push(h);saveV();modal(L('A conversation has a starting point.','Rozmowa ma swój początek.','У разговора есть начало.','У розмови є початок.'),`<p>${L('Your sample proposal is now in the studio’s host-invitation board. No email was sent; availability, scope, travel, venue terms and price still need human agreement.','Przykładowa propozycja jest w tablicy zaproszeń. Bez e-maila; dostępność, zakres, podróż, lokal i cena wymagają ustaleń.','Пример предложения теперь на доске приглашений студии. Email не отправлен; доступность, объём, поездка, место и цена требуют согласования.','Приклад пропозиції тепер на дошці запрошень студії. Email не надіслано; доступність, обсяг, поїздка, місце й ціна потребують погодження.')}</p><div class="modal-actions">${A('/studio/partners',L('Review in studio','Sprawdź w studiu','Проверить в студии','Перевірити у студії'),'up')}${A('/workshops',W('workshops'),'arrow','btn light')}</div>`)}
function studioPartners(){return `<h1>${L('New cities.<br><em>Real relationships first.</em>','Nowe miasta.<br><em>Najpierw relacje.</em>','Новые города.<br><em>Сначала отношения.</em>','Нові міста.<br><em>Спочатку стосунки.</em>')}</h1><p class="lead card-copy">${L('Contact organisers → introduce the teaching approach → offer topics → build the relationship → agree an invitation. The prototype never sends a proposal or confirms travel automatically.','Kontakt → podejście → tematy → relacja → ustalone zaproszenie. Prototyp nie wysyła oferty ani nie potwierdza podróży automatycznie.','Контакт → подход → темы → отношения → согласованное приглашение. Прототип не отправляет предложение и не подтверждает поездку автоматически.','Контакт → підхід → теми → стосунки → погоджене запрошення. Прототип не надсилає пропозицію й не підтверджує поїздку автоматично.')}</p><div class="button-row">${A('/host',L('Try organiser enquiry','Wypróbuj zapytanie organizatora','Проверить запрос организатора','Перевірити запит організатора'),'up','btn light')}</div>${(V.hosts||[]).map(h=>`<div class="card card-pad spaced"><span class="pill peach">${ESC(h.format)} · DEMO</span><h3 class="card-copy">${ESC(h.organisation)} · ${ESC(h.city)}</h3><p class="small muted card-copy">${ESC(h.audience)}<br>${h.date||W('pending')} · ${ESC(h.venue||'')}<br>${h.capacity||'—'} ${L('participants','osób','участников','учасників')} · ${h.budget?money(Number(h.budget)):L('Budget not supplied','Budżet niepodany','Бюджет не указан','Бюджет не вказано')}</p><form onsubmit="saveHostReply(event,'${h.id}')">${sel('stage',L('Local workflow stage','Etap lokalnego procesu','Локальный этап','Локальний етап'),[['new',L('New','Nowe','Новое','Нове')],['review',L('Reviewing fit & availability','Sprawdzanie dopasowania i dat','Проверка соответствия и дат','Перевірка відповідності й дат')],['proposal',L('Proposal drafted · unsent','Szkic oferty · niewysłany','Предложение в черновике · не отправлено','Пропозиція в чернетці · не надіслано')],['discussion',L('Terms discussion · demo','Ustalanie warunków · demo','Обсуждение условий · демо','Обговорення умов · демо')],['agreed',L('Agreement scenario · not a contract','Scenariusz uzgodniony · nie umowa','Согласованный сценарий · не договор','Погоджений сценарій · не договір')],['closed',L('Closed','Zamknięte','Закрыто','Закрито')]],h.stage)}${area('reply',L('Scope, travel, fee and venue questions · draft only','Zakres, podróż, stawka i lokal · szkic','Объём, поездка, гонорар и место · черновик','Обсяг, поїздка, гонорар і місце · чернетка'),h.reply||'')}<button class="btn sm" type="submit">${W('save')}</button>${h.reply?`<button class="text-link" type="button" style="margin-left:15px" onclick="copyHostReply('${h.id}')">${T('Copy template','Kopiuj szablon')}</button>`:''}</form></div>`).join('')||`<div class="empty">${L('No organiser enquiries in this preview. No national bookings or partnerships are implied.','Brak zapytań w podglądzie. Nie zakładamy rezerwacji krajowych ani partnerstw.','Запросов пока нет. Национальные брони или партнёрства не подразумеваются.','Запитів поки немає. Національні бронювання чи партнерства не припускаються.')}</div>`}${sourceHint(5)}`}
function saveHostReply(e,id){e.preventDefault();let h=V.hosts.find(x=>x.id===id),d=new FormData(e.target);h.stage=d.get('stage');h.reply=clean(d.get('reply'));saveV();toast(L('Draft saved. Nothing sent or contracted.','Zapisano szkic. Nic nie wysłano ani nie zawarto umowy.','Черновик сохранён. Ничего не отправлено, договор не заключён.','Чернетку збережено. Нічого не надіслано, договір не укладено.'));render()}

 Nowy dokument nie przypisuje grup do tych adresów. Potwierdź lokal w zaproszeniu przed wizytą. Solec 38 wykluczono dla nocnej milongi.','Abrahama 12 и Solec 38 были в исходном HTML. Новый документ не назначает группы этим адресам. Проверьте место в приглашении до поездки. Solec 38 исключён для ночной милонги.','Abrahama 12 і Solec 38 були у вихідному HTML. Новий документ не призначає групи цим адресам. Перевірте місце в запрошенні до поїздки. Solec 38 виключено для нічної мілонги.')}</p><div class="button-row">${A('/timetable',W('timetable'),'calendar','text-link')}${A('/milonga',W('milonga'),'music','text-link')}</div></div><div class="button-row"><a target="_blank" rel="noopener" href="https://www.instagram.com/auratangodaniel/" class="btn light">Instagram ${I('up')}</a><a target="_blank" rel="noopener" href="https://www.facebook.com/p/Argentine-Tango-Auratango-100063567937605/" class="btn light">Facebook ${I('up')}</a></div>`) };
function FAQ(){return [[L('Do I need a partner?','Czy potrzebuję partnera?','Нужен ли партнёр?','Чи потрібен партнер?'),L('Ladies’ Solo needs no partner. For a Saturday partner group, apply as a couple or individually. A solo application requires a suitable, mutually accepted arrangement and teacher approval before payment.','Ladies’ Solo nie wymaga partnera. Na sobotnią grupę zapisz się w parze lub solo. Solo wymaga zgodnego dopasowania i akceptacji nauczyciela przed płatnością.','Ladies’ Solo не требует партнёра. В субботнюю группу подайте заявку парой или отдельно. Соло-заявке нужны взаимно принятые условия и одобрение до оплаты.','Ladies’ Solo не потребує партнера. До суботньої групи подайте заявку парою чи окремо. Соло-заявці потрібні взаємно прийняті умови й схвалення до оплати.')],[L('Which Saturday group is for my level?','Która grupa pasuje do poziomu?','Какая группа подходит по уровню?','Яка група відповідає рівню?'),L('The document gives three time windows, but does not assign levels. We do not label them beginner/intermediate/advanced without approval. Tell the teacher about your experience first.','Dokument podaje trzy godziny bez poziomów. Nie przypisujemy poziomów bez zatwierdzenia. Opowiedz nauczycielowi o doświadczeniu.','Документ задаёт три времени, но не уровни. Мы не присваиваем уровни без одобрения. Сначала расскажите преподавателю об опыте.','Документ задає три години, але не рівні. Ми не присвоюємо рівні без схвалення. Спочатку розкажіть викладачу про досвід.')],[L('Why are the old prices not shown?','Dlaczego nie widać starych cen?','Почему нет старых цен?','Чому немає старих цін?'),L('Ladies’ Solo is now specified as 10:00–12:00, and the group timetable has changed. The brief provides no approved new tariffs. A complete invitation must show the price, venue, teacher and conditions before payment.','Ladies’ Solo ma teraz 10:00–12:00, a grafik grup się zmienił. Dokument nie podaje cen nowego programu. Pełne zaproszenie pokaże cenę, miejsce, nauczyciela i warunki przed płatnością.','Ladies’ Solo теперь 10:00–12:00, расписание групп изменилось. В документе нет новых тарифов. Полное приглашение покажет цену, место, преподавателя и условия до оплаты.','Ladies’ Solo тепер 10:00–12:00, розклад груп змінився. У документі немає нових тарифів. Повне запрошення покаже ціну, місце, викладача й умови до оплати.')],[L('Can I remain in the community during a break?','Czy mogę zostać podczas przerwy?','Можно остаться в сообществе в перерыве?','Можна залишитися у спільноті в перерві?'),L('Yes. Circles, community news and a return route do not require an active class package. You can pause updates or leave a circle whenever you choose.','Tak. Kręgi, wiadomości i powrót nie wymagają aktywnego pakietu. Możesz wstrzymać aktualizacje i opuścić krąg.','Да. Круги, новости и возвращение не требуют активного пакета. Можно остановить новости или выйти из круга.','Так. Кола, новини й повернення не потребують активного пакета. Можна зупинити новини чи вийти з кола.')],[L('Is AuraTouch a tango course or therapy?','Czy AuraTouch to kurs lub terapia?','AuraTouch — курс или терапия?','AuraTouch — курс чи терапія?'),L('It is a proposed three-hour connection experience using basic tango as a tool. It is not primarily a dance course, medical treatment or psychotherapy. Every exercise and contact is optional.','To proponowane trzygodzinne doświadczenie kontaktu wykorzystujące podstawy tanga. Nie jest głównie kursem, leczeniem ani psychoterapią. Ćwiczenia i kontakt są dobrowolne.','Это предлагаемый трёхчасовой опыт контакта через основы танго. Не прежде всего курс, лечение или психотерапия. Упражнения и контакт добровольны.','Це запропонований тригодинний досвід контакту через основи танго. Не передусім курс, лікування чи психотерапія. Вправи й контакт добровільні.')],[L('Can I buy dresses now?','Czy mogę kupić sukienki teraz?','Можно купить платье сейчас?','Можна купити сукню зараз?'),L('Not in this concept stage. You can explore the design directions and give testing feedback. A finished collection, price, real photos and fulfilment terms must come before sales.','Nie na etapie koncepcji. Możesz poznać projekty i przekazać opinie. Kolekcja, cena, zdjęcia i realizacja muszą poprzedzić sprzedaż.','Не на стадии концепции. Можно посмотреть направления и дать отзыв. Коллекция, цена, фото и исполнение должны предшествовать продажам.','Не на стадії концепції. Можна переглянути напрями й дати відгук. Колекція, ціна, фото й виконання мають передувати продажам.')],[L('Do any buttons collect real money?','Czy przyciski pobierają pieniądze?','Кнопки списывают реальные деньги?','Кнопки списують справжні гроші?'),demoText()]]}
faqItems=FAQ;faqs=function(limit=99){return `<div class="faq-wrap">${FAQ().slice(0,limit).map(([h,p])=>`<details><summary>${h}</summary><p>${p}</p></details>`).join('')}</div>`};
guide=function(){return pageHead(L('A little clarity.<br><em>A warmer beginning.</em>','Trochę jasności.<br><em>Cieplejszy początek.</em>','Немного ясности.<br><em>Более тёплое начало.</em>','Трохи ясності.<br><em>Тепліший початок.</em>'),L('Choose the experience, check the practical details and ask about anything that would help you feel at ease.','Wybierz doświadczenie, sprawdź szczegóły i zapytaj o to, co pomoże czuć się swobodnie.','Выберите опыт, проверьте детали и спросите, что поможет чувствовать себя спокойно.','Оберіть досвід, перевірте деталі й запитайте, що допоможе почуватися спокійно.'),L('Your first visit','Twoja pierwsza wizyta','Первый визит','Перший візит'))+section('',faqs()+`<div class="button-row">${A('/start',L('Find my way','Znajdź drogę','Найти путь','Знайти шлях'),'spark')}${A('/journal/first-class',L('Read the first-visit story','Przeczytaj historię pierwszej wizyty','Прочитать о первом визите','Прочитати про перший візит'),'book','text-link')}</div>`)};
gift=function(){return pageHead(L('A feeling to give.<br><em>When the details are ready.</em>','Emocje do podarowania.<br><em>Gdy szczegóły będą gotowe.</em>','Подарить чувство.<br><em>Когда детали готовы.</em>','Подарувати почуття.<br><em>Коли деталі готові.</em>'),L('Gift cards were a concept in the original HTML, not a priced product in the new brief. Values, validity, delivery and redemption must be approved before sale.','Karty były koncepcją starego HTML, nie wycenionym produktem nowego planu. Wartości, ważność, dostawa i realizacja wymagają zatwierdzenia.','Сертификаты были идеей в исходном HTML, но не оценённым продуктом нового плана. Суммы, срок, доставка и использование требуют согласования.','Сертифікати були ідеєю у вихідному HTML, але не оціненим продуктом нового плану. Суми, строк, доставка й використання потребують погодження.'),T('Gift cards','Karty podarunkowe'))+section('',`<div class="gift-art"><span class="eyebrow">AURATANGO / CONCEPT</span><div class="display">${L('A little time.<br><em>Just for you.</em>','Trochę czasu.<br><em>Tylko dla Ciebie.</em>','Немного времени.<br><em>Только для вас.</em>','Трохи часу.<br><em>Лише для вас.</em>')}</div></div><div class="button-row"><button class="btn" onclick="beginRequest('gift')">${W('interest')}${I('gift')}</button></div>`) };
showPolicy=function(kind){modal(kind==='privacy'?L('Local by design.','Lokalnie z założenia.','Локально по замыслу.','Локально за задумом.'):L('Clear boundaries for this prototype.','Jasne granice prototypu.','Понятные границы прототипа.','Зрозумілі межі прототипу.'),kind==='privacy'?`<p>${L('There is no backend, analytics tracker, verified account or messaging connection. Interface choices, anonymous request metadata, orders, community choices, operator notes and sample host proposals are stored in this browser when permitted. Enrolment names and emails are held only temporarily for form validation and discarded on submission. Do not enter real personal or sensitive information.','Brak zaplecza, analityki, zweryfikowanego konta i wiadomości. Wybory, anonimowe zgłoszenia, zamówienia, notatki operatora i przykładowe propozycje zostają w przeglądarce. Imiona i e-maile zapisów są chwilowe i odrzucane po zgłoszeniu. Nie wpisuj prawdziwych danych osobowych ani wrażliwych.','Нет сервера, аналитики, проверенного аккаунта и сообщений. Выборы, анонимные заявки, заказы, заметки оператора и примеры предложений хранятся в браузере. Имена и email из записи временные и удаляются при отправке. Не вводите настоящие персональные или чувствительные данные.','Немає сервера, аналітики, перевіреного акаунта й повідомлень. Вибори, анонімні заявки, замовлення, нотатки оператора й приклади пропозицій зберігаються у браузері. Імена й email із запису тимчасові та видаляються під час подання. Не вводьте справжні персональні чи чутливі дані.')}</p><p class="card-copy">${L('School images and fonts are retained as external resources. They may make requests when loaded. YouTube playback is loaded only after you choose Play; original audio is not automatically translated. External-media delivery has not been independently verified in this revision.','Zdjęcia i fonty są zewnętrzne i mogą wykonywać żądania. YouTube wczytuje się dopiero po Play; dźwięk nie jest tłumaczony automatycznie. Zewnętrzne media nie były niezależnie zweryfikowane w tej zmianie.','Фото и шрифты внешние и могут делать запросы. YouTube загружается после Play; звук не переводится автоматически. Доставка внешних медиа в этой версии независимо не проверена.','Фото й шрифти зовнішні та можуть робити запити. YouTube завантажується після Play; звук не перекладається автоматично. Доставку зовнішніх медіа в цій версії незалежно не перевірено.')}</p><div class="modal-actions">${A('/member/account',L('Manage preferences','Zarządzaj preferencjami','Управлять настройками','Керувати налаштуваннями'),'settings')}${A('/studio/settings',L('Export / clear local data','Eksport / usuń dane lokalne','Экспорт / удаление локальных данных','Експорт / видалення локальних даних'),'up','btn light')}</div>`:`<p>${demoText()}</p><p class="card-copy">${L('Known recurring times come from Auratango.docx. Levels, venues, prices and event details not supplied remain pending. Operator-entered offers are simulations only. A production service requires approved seller and consumer information, payment processing, cancellation/refund terms, secure accounts, permissions and verified event/product data.','Stałe godziny pochodzą z dokumentu. Brakujące poziomy, miejsca, ceny i wydarzenia pozostają do ustalenia. Oferty operatora są symulacją. Produkcja wymaga zatwierdzonego sprzedawcy, informacji, płatności, anulacji, zwrotów, kont, uprawnień i danych.','Регулярные часы из документа. Отсутствующие уровни, места, цены и события ожидают уточнения. Предложения оператора — симуляции. Для работы нужны данные продавца, условия, платежи, возвраты, безопасность, разрешения и проверенные данные.','Регулярні години з документа. Відсутні рівні, місця, ціни й події очікують уточнення. Пропозиції оператора — симуляції. Для роботи потрібні дані продавця, умови, платежі, повернення, безпека, дозволи й перевірені дані.')}</p><p class="card-copy">${L('A package cancellation restores only its used session credit. A single-entry cancellation is marked for refund review, not automatically refunded. This prototype is not legal advice or a production policy.','Anulowanie zwraca tylko użyte wejście pakietu. Pojedynczy bilet trafia do kontroli zwrotu, nie automatycznego oddania pieniędzy. To nie porada prawna ani regulamin produkcji.','Отмена возвращает только использованное посещение пакета. Разовый билет отмечается для проверки возврата, не возвращается автоматически. Это не юридическая консультация или рабочие правила.','Скасування повертає лише використане відвідування пакета. Разовий квиток позначається для перевірки повернення, не повертається автоматично. Це не юридична консультація чи робочі правила.')}</p>`)};
showInfo=function(){navigate('/tour')};toggleChat=function(){navigate('/start')};
function settingsStudio(){return `<h1>${L('A clear handoff.<br><em>No hidden promises.</em>','Jasne przekazanie.<br><em>Bez ukrytych obietnic.</em>','Ясная передача.<br><em>Без скрытых обещаний.</em>','Ясне передавання.<br><em>Без прихованих обіцянок.</em>')}</h1><div class="card card-pad spaced"><h3>${L('Local workspace','Lokalny obszar pracy','Локальное пространство','Локальний простір')}</h3><p class="small muted card-copy">${L('This browser stores local scenario work only. The member/studio switch is for demonstration, not role-based access control. The supplied original file has not been overwritten.','Przeglądarka zapisuje tylko scenariusz. Przełącznik kursanta/studia nie kontroluje dostępu. Oryginalny plik nie został nadpisany.','Браузер хранит только локальный сценарий. Переключатель участник/студия не контролирует доступ. Исходный файл не перезаписан.','Браузер зберігає лише локальний сценарій. Перемикач учасник/студія не контролює доступ. Вихідний файл не перезаписано.')}</p><div class="button-row"><button class="btn light" onclick="exportWorkspace()">${I('download')}${L('Export local workspace','Eksport lokalnego obszaru','Экспорт локального пространства','Експорт локального простору')}</button><button class="btn light" onclick="resetDemo()">${I('refresh')}${L('Clear demo data','Usuń dane demo','Удалить демо-данные','Видалити демо-дані')}</button></div><p class="micro muted card-copy">${L('Export includes operator notes and sample host proposals. Do not enter real personal data. Files are not automatically synced to the school.','Eksport zawiera notatki i propozycje demo. Nie wpisuj danych osobowych. Pliki nie są synchronizowane ze szkołą.','Экспорт включает заметки и примеры предложений. Не вводите персональные данные. Файлы не синхронизируются со школой.','Експорт містить нотатки й приклади пропозицій. Не вводьте персональні дані. Файли не синхронізуються зі школою.')}</p></div><div class="card card-pad spaced"><h3>${L('Production integrations still required','Niezbędne integracje produkcyjne','Необходимые рабочие интеграции','Необхідні робочі інтеграції')}</h3><p class="micro muted card-copy">${L('Technical handoff notes · English','Notatki techniczne · angielski','Технические заметки · английский','Технічні нотатки · англійська')}</p><ul class="handoff-list"><li>Server-side accounts, verification, separate member/operator permissions and audited actions.</li><li>Authoritative programme catalogue, transactional capacity, role-aware partner allocations and idempotent payment webhooks.</li><li>Approved seller, tax, cancellation/refund, consumer information and event/product terms. Legal review is not supplied by this HTML.</li><li>Configured payment provider, receipts/invoicing, refunds and attendance/check-in endpoints. Never collect banking details in this static file.</li><li>Consent-aware CRM imports, unsubscribe handling, message templates and actual email/SMS/WhatsApp integrations.</li><li>Community permissions, moderation, publication approvals, opt-in audiences and reconnecting former members without requiring a paid package.</li><li>Approved AuraTouch pilot staff, venue, dates and practical boundaries. No medical/psychotherapy claims.</li><li>Actual product prototypes, photos, fabric/size information, prices, stock/made-to-order process, delivery and return terms before shop checkout.</li><li>Production URLs per language, crawlable content, correct metadata and language alternates, canonical handling, sitemap, performance and indexability checks.</li><li>Media permissions, approved interview recordings and real event photography. Current external photos/videos are retained from the submitted draft and may fail to load.</li></ul></div><div class="button-row">${A('/review',L('Read every feedback decision','Przeczytaj wszystkie decyzje','Прочитать все решения','Прочитати всі рішення'),'check','text-link')}${A('/tour',L('Run the guided tour','Uruchom przewodnik','Пройти пошаговый обзор','Пройти покроковий огляд'),'arrow','text-link')}</div>`}

resetDemo=function(){modal(L('Clear this local workspace?','Usunąć ten lokalny obszar?','Удалить это локальное пространство?','Видалити цей локальний простір?'),`<p>${L('This removes only this revision’s local demo data. It does not touch the original HTML, the school’s real records or any online account. Export your local notes first.','Usuwa tylko dane demo tej wersji. Nie zmienia oryginału, rekordów szkoły ani kont. Najpierw wyeksportuj notatki.','Удаляет только демо-данные этой версии. Не затрагивает исходный HTML, данные школы или аккаунты. Сначала экспортируйте заметки.','Видаляє лише демо-дані цієї версії. Не зачіпає вихідний HTML, дані школи чи акаунти. Спочатку експортуйте нотатки.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${T('Not now','Nie teraz')}</button><button class="btn" onclick="clearWorkspace()">${L('Clear and restart','Usuń i zacznij od nowa','Удалить и начать заново','Видалити й почати знову')}</button></div>`)};

function reviewPage(){let shown=FEEDBACK.filter(f=>!U.query||(f.label+' '+f.detail).toLowerCase().includes(U.query.toLowerCase()));return pageHead(L('Every point.<br><em>In plain sight.</em>','Każdy punkt.<br><em>Jasno pokazany.</em>','Каждый пункт.<br><em>На виду.</em>','Кожен пункт.<br><em>На видноті.</em>'),L('Compare the uploaded plan with the implementation. Open a requirement, jump to its screen, or read the exact source section. Nothing is silently promoted from an idea into a live offer.','Porównaj dokument z wdrożeniem. Otwórz punkt, przejdź do ekranu lub przeczytaj oryginalną sekcję. Pomysły nie stają się automatycznie ofertą.','Сравните документ с реализацией. Откройте пункт, перейдите к экрану или прочитайте исходный раздел. Идеи не становятся автоматически действующей продажей.','Порівняйте документ із реалізацією. Відкрийте пункт, перейдіть до екрана чи прочитайте вихідний розділ. Ідеї не стають автоматично чинним продажем.'),L('Feedback implementation register','Rejestr wdrożenia uwag','Реестр реализации замечаний','Реєстр реалізації зауважень'))+section('',`<div class="stats"><div class="stat"><div class="value">15</div><div class="name">${L('Source sections','Sekcji dokumentu','Разделов документа','Розділів документа')}</div></div><div class="stat"><div class="value">${FEEDBACK.length}</div><div class="name">${L('Mapped decisions','Decyzji z mapowaniem','Связанных решений','Пов’язаних рішень')}</div></div><div class="stat"><div class="value">${V.reviewed.length}</div><div class="name">${L('Marked reviewed by you','Oznaczone przez Ciebie','Отмечено вами','Відзначено вами')}</div></div></div>${notice(L('The archive and detailed implementation notes below are in English, matching the supplied document. The visitor and workflow interfaces support four languages. “Local flow built” means a browser simulation, not a connected live service.','Archiwum i notatki są po angielsku jak dokument. Interfejsy obsługują cztery języki. „Local flow built” oznacza symulację przeglądarkową, nie aktywną usługę.','Архив и заметки на английском, как документ. Интерфейсы поддерживают четыре языка. «Local flow built» — симуляция браузера, не подключённая услуга.','Архів і нотатки англійською, як документ. Інтерфейси підтримують чотири мови. «Local flow built» — симуляція браузера, не підключена послуга.'))}<div class="button-row">${A('/tour',L('Test the guided journey','Wypróbuj przewodnik','Проверить путь','Перевірити шлях'),'arrow')}<button class="btn light" onclick="exportFeedback()">${I('download')}${L('Export decisions','Eksport decyzji','Экспорт решений','Експорт рішень')}</button>${A('/studio/settings',L('What remains before launch','Co zostało przed startem','Что нужно до запуска','Що потрібно до запуску'),'up','text-link')}</div><div class="card card-pad review-decisions"><h3>${L('What I deliberately did not invent','Czego celowo nie wymyślono','Что намеренно не выдумано','Що навмисно не вигадано')}</h3><p class="small muted card-copy">${L('No old price applied to a new two-hour programme. No venue or level assigned without source support. No late-night milonga at Solec 38. No dress inventory, invented product photos or checkout. No corporate AuraTouch sale before a pilot. No medical programme added to a brief that does not request one.','Bez starych cen dla nowego dwugodzinnego programu, niepotwierdzonych miejsc i poziomów, nocnej milongi na Solec 38, fikcyjnych sukienek i sprzedaży firmowego AuraTouch przed pilotażem. Nie dodano programu medycznego.','Без старых цен для нового двухчасового формата, выдуманных мест и уровней, ночной милонги в Solec 38, фиктивных платьев и корпоративного AuraTouch до пилота. Медицинская программа не добавлена.','Без старих цін для нового двогодинного формату, вигаданих місць і рівнів, нічної мілонги в Solec 38, фіктивних суконь і корпоративного AuraTouch до пілота. Медична програма не додана.')}</p><p class="small muted card-copy">${L('Earlier café/street events, Partner Night, gifts, journals and films were retained where compatible. Partner Night is explicitly voluntary; jewellery and alcohol sales are not launched by this file.','Zachowano zgodne wcześniejsze wydarzenia, Partner Night, prezenty, dziennik i filmy. Partner Night jest dobrowolny; plik nie uruchamia sprzedaży biżuterii ani alkoholu.','Сохранены совместимые прежние события, Partner Night, подарки, журнал и фильмы. Partner Night доброволен; продажа украшений и алкоголя не запущена.','Збережено сумісні попередні події, Partner Night, подарунки, журнал і фільми. Partner Night добровільний; продаж прикрас та алкоголю не запущено.')}</p></div><div class="field spaced"><label for="review-search">${L('Search the implementation notes','Szukaj w notatkach wdrożenia','Поиск по заметкам реализации','Пошук у нотатках реалізації')}</label><input id="review-search" value="${ESC(U.query)}" placeholder="Saturday, dresses, milonga…" oninput="filterReview(this.value)"></div><div id="feedback-items">${feedbackRows(shown)}</div><div class="section-head spaced"><h2>${L('The original plan.<br><em>Section by section.</em>','Oryginalny plan.<br><em>Sekcja po sekcji.</em>','Исходный план.<br><em>Раздел за разделом.</em>','Вихідний план.<br><em>Розділ за розділом.</em>')}</h2></div><p class="micro muted">Auratango.docx · source archive · original English · programme proposals are not confirmed commercial offers.</p><div class="source-archive">${SOURCE_SECTIONS.map((s,i)=>`<details id="source-${i+1}"><summary>${ESC(s.title)}<span>${I('down')}</span></summary><div class="source-text">${s.text.map(t=>`<p>${ESC(t)}</p>`).join('')}</div></details>`).join('')}</div>`)}
function feedbackRows(items){return items.map(f=>`<details class="feedback-item" id="${f.id}"><summary><span class="feedback-code">${f.id}</span><span>${ESC(f.label)}</span><span class="pill ${f.status==='Local flow built'?'green':''}">${ESC(f.status)}</span>${I('down')}</summary><div class="feedback-body"><p>${ESC(f.detail)}</p><div class="button-row">${A(f.route,L('Open implementation','Otwórz wdrożenie','Открыть реализацию','Відкрити реалізацію'),'up','btn light sm')}<button class="text-link" onclick="openSource(${f.section})">${L('Read source section','Przeczytaj źródło','Прочитать источник','Прочитати джерело')} ${f.section}</button><label class="checkline"><input type="checkbox" ${V.reviewed.includes(f.id)?'checked':''} onchange="markReviewed('${f.id}',this.checked)"><span>${L('I reviewed this point','Sprawdzono ten punkt','Я проверил(а) пункт','Я перевірив/перевірила пункт')}</span></label></div></div></details>`).join('')||`<div class="empty">${L('No matching notes.','Brak wyników.','Совпадений нет.','Збігів немає.')}</div>`}
function filterReview(v){U.query=v;document.getElementById('feedback-items').innerHTML=feedbackRows(FEEDBACK.filter(f=>(f.label+' '+f.detail).toLowerCase().includes(v.toLowerCase())))}
function openSource(i){let s=SOURCE_SECTIONS[i-1];modal(ESC(s.title),`<div class="source-text"><p class="micro muted">Auratango.docx · original source wording</p>${s.text.map(t=>`<p>${ESC(t)}</p>`).join('')}</div>`,true)}
function markReviewed(id,on){V.reviewed=on?[...new Set([...V.reviewed,id])]:V.reviewed.filter(x=>x!==id);saveV()}
function exportFeedback(){downloadFile('AuraTango_Feedback_Implementation.json',JSON.stringify({basis:'Auratango.docx and supplied Crimson HTML',warning:'Local prototype only. Source facts, proposals and production dependencies are distinguished.',decisions:FEEDBACK,reviewed:V.reviewed,sourceSections:SOURCE_SECTIONS},null,2),'application/json;charset=utf-8')}
