ное танго — возможность, не обязанность. Поможем подобрать субботнюю группу.','Залишайтеся в соло скільки хочеться. Парне танго — можливість, не обов’язок. Допоможемо дібрати суботню групу.')}</p><div class="button-row">${A('/class/partnered',L('Explore partnered tango','Poznaj tango w parze','Узнать о парном танго','Дізнатися про парне танго'),'arrow','text-link')}</div>${notice(L('A 12:00–13:00 Saturday or Sunday group is only a possibility. Register interest; it is not on the bookable timetable.','Grupa 12:00–13:00 w sobotę lub niedzielę jest możliwością. Zgłoś zainteresowanie; nie jest dostępna do rezerwacji.','Группа 12:00–13:00 в субботу или воскресенье только рассматривается. Можно оставить интерес, но не оплатить.','Група 12:00–13:00 у суботу чи неділю лише розглядається. Можна залишити інтерес, але не оплатити.'))}<button class="btn light" style="margin-top:18px" onclick="beginRequest('ladies','extra-ladies')">${L('Interested in the extra group','Interesuje mnie dodatkowa grupa','Интересует дополнительная группа','Цікавить додаткова група')}</button>`:''}<h2>${L('A clear path.<br><em>No pressure.</em>','Jasna droga.<br><em>Bez presji.</em>','Понятный путь.<br><em>Без давления.</em>','Зрозумілий шлях.<br><em>Без тиску.</em>')}</h2>${numberedSteps([[L('Tell us where you are starting','Powiedz, od czego zaczynasz','Расскажите, с чего начинаете','Розкажіть, із чого починаєте'),L('Choose your preferred time and share your experience. For private classes choose Rick, Anna or a recommendation.','Wybierz godzinę i doświadczenie. Na prywatne zajęcia wybierz Ricka, Annę lub rekomendację.','Выберите время и опыт. Для личного урока выберите Рика, Анну или рекомендацию.','Оберіть час і досвід. Для особистого уроку оберіть Ріка, Анну чи рекомендацію.')],[L('A human confirms the fit','Człowiek potwierdza dopasowanie','Человек подтверждает подходящий формат','Людина підтверджує відповідний формат'),L('The studio confirms level, teacher, venue, language, price and availability. Solo partner applications also need a suitable match before payment.','Studio potwierdza poziom, nauczyciela, miejsce, język, cenę i dostępność. Zapis solo na pary wymaga dopasowania przed płatnością.','Студия подтверждает уровень, преподавателя, место, язык, цену и наличие места. Для соло-заявки на парное танго нужен подбор до оплаты.','Студія підтверджує рівень, викладача, місце, мову, ціну й наявність місця. Для соло-заявки на парне танго потрібен добір до оплати.')],[L('Review, enrol, return','Sprawdź, zapisz się, wracaj','Проверьте, запишитесь, возвращайтесь','Перевірте, запишіться, повертайтеся'),L('Review the invitation in My community. After the demonstration purchase, manage your bookings and choose your next community experience.','Sprawdź zaproszenie w Mojej społeczności. Po zakupie demo zarządzaj rezerwacjami i kolejnymi doświadczeniami.','Проверьте приглашение в кабинете. После демо-покупки управляйте записями и выбирайте следующие встречи.','Перевірте запрошення в кабінеті. Після демо-купівлі керуйте записами й обирайте наступні зустрічі.')]])}</div><aside class="booking-panel"><span class="pill peach">${c.phase===1?L('Core weekly programme','Podstawowy program','Основная программа','Основна програма'):L('Community development','Rozwój społeczności','Развитие сообщества','Розвиток спільноти')}</span><h3 class="card-copy">${q(c.title)}</h3><p class="small muted card-copy">${L('The new brief specifies the timetable, not an approved tariff or assigned venue. Request first. No charge until details and suitability are confirmed.','Nowy dokument określa grafik, nie cennik ani przypisane miejsce. Najpierw zgłoszenie; potem potwierdzenie i płatność.','Новый документ задаёт расписание, но не тарифы и адрес занятия. Сначала заявка, затем подтверждение и оплата.','Новий документ задає розклад, але не тарифи й адресу заняття. Спочатку заявка, потім підтвердження й оплата.')}</p><button class="btn full" onclick="beginRequest('${id}')">${W('request')}${I('arrow')}</button><div class="button-row">${A('/timetable',W('timetable'),'calendar','text-link')}${A('/guide',L('Before your first visit','Przed pierwszą wizytą','Перед первым визитом','Перед першим візитом'),'book','text-link')}</div>${sourceHint(id==='ladies'?'3':id==='partnered'?'2':'8')}</aside></div>`) };
function timetableRow(slot){
  const offer=OFFER[slot.offer];
  const description=slot.offer==='partnered'
    ?L('Group level confirmed by teacher','Poziom potwierdza nauczyciel','Уровень подтверждает преподаватель','Рівень підтверджує викладач')
    :L('Year-round solo programme','Całoroczny program solo','Круглогодичная сольная программа','Цілорічна сольна програма');
  const status=V.offers[slot.id]?L('Demo offer configured','Oferta demo ustawiona','Демо-условия заданы','Демо-умови задано'):W('pending');
  return `<div class="new-schedule-row">
    <div class="time">${slot.start}<small>${slot.end} · ${offer.duration} min</small></div>
    <div class="timetable-class">
      <h4>${A('/class/'+slot.offer,itemTitle(slot.offer),'','')}</h4>
      <p class="small muted">${description}</p>
      <img class="timetable-photo" src="${asset[offer.photo]}" alt="" width="144" height="108" loading="lazy" decoding="async">
    </div>
    <div class="timetable-row-actions">
      ${pill(status,'peach')}
      <button class="btn sm" type="button" onclick="beginRequest('${slot.offer}','${slot.id}')">${W('request')}${I('arrow')}</button>
    </div>
  </div>`;
}
timetable=function(){const show=s=>state.classFilter==='all'||state.classFilter===s.offer;return pageHead(L('Your weekend.<br><em>With a little more tango.</em>','Twój weekend.<br><em>Z odrobiną więcej tanga.</em>','Ваши выходные.<br><em>С большим танго.</em>','Ваші вихідні.<br><em>З більшим танго.</em>'),L('Recurring time windows from the school’s plan. Start dates, levels, venue assignments, prices and capacities still need studio confirmation.','Stałe godziny z planu szkoły. Start, poziomy, miejsca, ceny i limity wymagają potwierdzenia.','Регулярные часы из плана школы. Даты начала, уровни, места, цены и вместимость ещё уточняются.','Регулярні години з плану школи. Дати початку, рівні, місця, ціни й місткість ще уточнюються.'),W('timetable'),trialClassCallout(timetableTrialButton()))+section('',`${scenarioNote()}<div class="filter-bar">${[['all',T('All classes','Wszystkie')],['partnered',itemTitle('partnered')],['ladies',itemTitle('ladies')]].map(([v,t])=>`<button class="filter-chip ${state.classFilter===v?'active':''}" onclick="state.classFilter='${v}';render()">${t}</button>`).join('')}</div>${[6,0].map(day=>{let ss=SLOTS.filter(s=>s.day===day&&show(s));return ss.length?`<div class="schedule-day"><div class="schedule-date">${dayName(day)} ${sourceHint(day===6?'2–3':'3')}</div>${ss.sort((a,b)=>a.start.localeCompare(b.start)).map(timetableRow).join('')}</div>`:''}).join('')}${notice(L('Possible extra Ladies’ Solo: 12:00–13:00 on Saturday or Sunday. Interest only. Private classes and practicas are arranged separately.','Możliwa dodatkowa grupa Ladies’ Solo: 12:00–13:00 w sobotę lub niedzielę. Tylko zainteresowanie. Prywatne lekcje i praktiki ustalane osobno.','Возможная дополнительная группа Ladies’ Solo: 12:00–13:00 в субботу или воскресенье. Только интерес. Личные уроки и практики согласуются отдельно.','Можлива додаткова група Ladies’ Solo: 12:00–13:00 у суботу чи неділю. Лише інтерес. Особисті уроки й практики узгоджуються окремо.'))}<div class="button-row"><button class="btn light" onclick="beginRequest('ladies','extra-ladies')">${W('interest')} · 12:00–13:00</button>${A('/class/private',itemTitle('private'),'arrow','text-link')}${A('/class/practice',itemTitle('practice'),'arrow','text-link')}</div>`) };
pricing=function(){return pageHead(L('Clear before you commit.<br><em>Always.</em>','Jasno, zanim zdecydujesz.<br><em>Zawsze.</em>','Ясно до решения.<br><em>Всегда.</em>','Ясно до рішення.<br><em>Завжди.</em>'),L('The new programme changes session lengths and schedules. Old draft prices have not been carried over as approved prices. Your invitation shows the full offer before any demonstration purchase.','Nowy program zmienia długość zajęć i grafik. Nie przenosimy starych cen jako zatwierdzonych. Zaproszenie pokaże pełną ofertę przed zakupem demo.','Новая программа меняет длительность и расписание. Старые цены не перенесены как утверждённые. Приглашение покажет полные условия до демо-покупки.','Нова програма змінює тривалість і розклад. Старі ціни не перенесені як затверджені. Запрошення покаже повні умови до демо-купівлі.'),T('Prices & packages','Ceny i pakiety'))+section('',`<div class="grid3">${['partnered','ladies','private'].map(k=>plainCard(itemTitle(k),W('pending'),`<button class="btn" onclick="beginRequest('${k}')">${W('request')}${I('arrow')}</button>`)).join('')}</div>${notice(L('Want to inspect the payment flow? The guided walkthrough includes a clearly labelled sample offer. No displayed example price is an approved school tariff.','Chcesz sprawdzić płatność? Przewodnik zawiera oznaczoną ofertę przykładową. Nie jest to cennik szkoły.','Хотите проверить оплату? Пошаговый обзор включает явно отмеченный пример предложения, не тариф школы.','Хочете перевірити оплату? Покроковий огляд містить явно позначений приклад пропозиції, не тариф школи.'))}<div class="button-row">${A('/tour',L('Test the complete journey','Sprawdź całą ścieżkę','Проверить весь путь','Перевірити весь шлях'),'arrow')}</div>`) };

function milongaReady(){const m=V.milonga;const f=financialResult(m);return !!(m.venue.trim()&&m.address.trim()&&m.date&&m.start&&['01:00','02:00'].includes(m.end)&&! /solec\s*38/i.test(m.venue+' '+m.address)&&Number(m.capacity)>=1&&Number(m.capacity)<=100&&Number(m.ticket)>0&&f&&!f.invalid&&f.profitAt!==null&&f.profitAt<=Number(m.capacity)&&TEAM_ROLES.every(t=>String(V.team[t[0]]||'').trim())&&MILONGA_CHECKS.every(c=>m.approved.includes(c[0])))}
function milongaPage(){let m=V.milonga,ready=milongaReady();return pageHead(L('One night.<br><em>A whole community.</em>','Jeden wieczór.<br><em>Cała społeczność.</em>','Один вечер.<br><em>Всё сообщество.</em>','Один вечір.<br><em>Уся спільнота.</em>'),L('A larger AuraTango milonga for the Warsaw tango community—and, in time, dancers from further afield. A dedicated project, growing carefully within one shared community.','Większa milonga AuraTango dla warszawskiej społeczności i z czasem gości z innych miast. Osobny projekt w jednej wspólnej społeczności.','Большая милонга AuraTango для Варшавы и, со временем, гостей из других городов. Отдельный проект внутри одного сообщества.','Велика мілонга AuraTango для Варшави й, з часом, гостей з інших міст. Окремий проєкт усередині однієї спільноти.'),'AURATANGO / MILONGA')+section('',`<div class="detail-layout"><div class="detail-body"><div class="detail-hero">${photo('teachers','',L('School photo · atmosphere only','Fotografia szkoły · nastrój','Фото школы · атмосфера','Фото школи · атмосфера'))}<span class="pill peach">${L('Project in preparation','Projekt w przygotowaniu','Проект в подготовке','Проєкт у підготовці')}</span></div><h2>${L('A room that lets<br><em>the night breathe.</em>','Miejsce, w którym<br><em>wieczór trwa.</em>','Место, где вечер<br><em>может продолжаться.</em>','Місце, де вечір<br><em>може тривати.</em>')}</h2><p>${L('The plan calls for a suitable dance venue for up to 100 people, with music until approximately 01:00–02:00, a good floor, public transport, drinks/snacks and the possibility of returning regularly.','Plan zakłada salę do 100 osób, muzykę do około 01:00–02:00, dobrą podłogę, komunikację, napoje/przekąski i regularny wynajem.','План: подходящий зал до 100 человек, музыка примерно до 01:00–02:00, хороший пол, транспорт, напитки/закуски и регулярная аренда.','План: відповідна зала до 100 людей, музика приблизно до 01:00–02:00, добра підлога, транспорт, напої/перекуси й регулярна оренда.')}< ')],[L('A reason to return','Powód, by wrócić','Причина вернуться','Причина повернутися'),L('Review attendance, feedback and contribution before setting the next date or scaling the event.','Oceń frekwencję, opinie i wynik finansowy przed kolejnym terminem lub zwiększeniem skali.','Оцените посещаемость, отзывы и финансовый результат до следующей даты или расширения.','Оцініть відвідуваність, відгуки й фінансовий результат до наступної дати чи розширення.')]])}<div class="button-row"><button class="btn light" onclick="openFilm('tango')">${I('play')}${L('See the school’s tango film','Zobacz film szkoły','Смотреть фильм школы','Дивитися фільм школи')}</button>${A('/community/calendar',L('Community calendar','Kalendarz społeczności','Календарь сообщества','Календар спільноти'),'calendar','text-link')}</div><p class="editorial-note">${L('No photographs or videos of the future milonga exist in the supplied materials. Event galleries will be added after an actual event, with publication permission.','W materiałach nie ma zdjęć przyszłej milongi. Galeria powstanie po prawdziwym wydarzeniu, za zgodą na publikację.','В материалах нет фото будущей милонги. Галерея появится после реального события с разрешением на публикацию.','У матеріалах немає фото майбутньої мілонги. Галерея з’явиться після реальної події з дозволом на публікацію.')}</p></div><aside class="booking-panel"><span class="pill peach">${ready?W('demo'):L('Date & venue not announced','Termin i miejsce nieogłoszone','Дата и место не объявлены','Дата й місце не оголошено')}</span><h3 class="card-copy">${L('Save your interest.<br>Not your payment.','Zapisz zainteresowanie.<br>Nie płatność.','Оставьте интерес.<br>Не платёж.','Залиште інтерес.<br>Не платіж.')}</h3>${ready?`<p class="small card-copy">${ESC(m.venue)}<br>${dateLabel(m.date)} · ${m.start}–${m.end} (+1)<br>${money(Number(m.ticket))} · ${W('demo')}</p><button class="btn full" onclick="beginRequest('milonga')">${L('Explore sample tickets','Zobacz bilety demo','Посмотреть демо-билеты','Переглянути демо-квитки')}${I('ticket')}</button>`:`<p class="small muted card-copy">${L('We will announce the practical details when the venue, team and event economics are ready. No tickets are sold against an unconfirmed venue.','Szczegóły ogłosimy po potwierdzeniu lokalu, zespołu i finansów. Nie sprzedajemy biletów bez ustalonego miejsca.','Детали появятся после готовности площадки, команды и финансов. Нет продажи билетов на неподтверждённую площадку.','Деталі з’являться після готовності майданчика, команди й фінансів. Немає продажу квитків на непідтверджений майданчик.')}</p><button class="btn full" onclick="beginRequest('milonga')">${W('interest')}${I('heart')}</button>`}<div class="button-row">${A('/host?kind=venue',L('Suggest a venue','Zaproponuj lokal','Предложить площадку','Запропонувати майданчик'),'pin','text-link')}${A('/studio/milonga',L('Explore the event plan','Zobacz plan wydarzenia','Посмотреть план события','Переглянути план події'),'up','text-link')}</div>${sourceHint(4)}</aside></div>`) };
function workshopsPage(){return pageHead(L('A little deeper.<br><em>A little further.</em>','Trochę głębiej.<br><em>Trochę dalej.</em>','Чуть глубже.<br><em>Чуть дальше.</em>','Трохи глибше.<br><em>Трохи далі.</em>'),L('Special workshops for dancers in Warsaw, including visitors from other schools. Guest teaching in other cities grows through real invitations—not invented event dates.','Specjalne warsztaty dla tancerzy w Warszawie, także z innych szkół. Gościnne nauczanie w innych miastach rozwijamy przez rzeczywiste zaproszenia.','Специальные семинары для танцующих в Варшаве, включая другие школы. Обучение в других городах развивается через реальные приглашения.','Спеціальні майстер-класи для танцівників у Варшаві, зокрема інших шкіл. Навчання в інших містах розвивається через справжні запрошення.'),W('workshops'))+section('',`<div class="filter-bar">${[['all',L('All ideas','Wszystkie pomysły','Все идеи','Усі ідеї')],['warsaw','Warszawa'],['away',L('Other cities','Inne miasta','Другие города','Інші міста')]].map(([k,n])=>`<button class="filter-chip ${U.workshopFilter===k||(!U.workshopFilter&&k==='all')?'active':''}" onclick="U.workshopFilter='${k}';render()">${n}</button>`).join('')}</div>${U.workshopFilter!=='away'?`<div class="grid3">${THEMES.map(t=>photoTile('/workshop/'+t.id,t.photo,L('WARSAW · TOPIC PROPOSAL','WARSZAWA · PROPOZYCJA','ВАРШАВА · ПРЕДЛОЖЕНИЕ','ВАРШАВА · ПРОПОЗИЦІЯ'),q(t.title),q(t.desc))).join('')}</div><p class="editorial-note">${L('These are suggested topics based on the brief’s workshop categories. No curriculum, host, price or date has been approved.','To proponowane tematy na podstawie kategorii z dokumentu. Program, prowadzący, ceny i daty wymagają zatwierdzenia.','Это предлагаемые темы по категориям документа. Программа, ведущий, цены и даты не утверждены.','Це запропоновані теми за категоріями документа. Програма, ведучий, ціни й дати не затверджені.')}</p>`:''}${U.workshopFilter!=='warsaw'?`<div class="venue-banner"><div><div class="eyebrow">${L('BRING RICK TO YOUR CITY','ZAPROŚ RICKA DO SWOJEGO MIASTA','ПРИГЛАСИТЕ РИКА В СВОЙ ГОРОД','ЗАПРОСІТЬ РІКА ДО СВОГО МІСТА')}</div><h2>${L('Your community.<br><em>A shared discovery.</em>','Twoja społeczność.<br><em>Wspólne odkrycie.</em>','Ваше сообщество.<br><em>Общее открытие.</em>','Ваша спільнота.<br><em>Спільне відкриття.</em>')}</h2><p>${L('Workshops, festivals, tango weekends or guest teaching. Introduce your community, audience, proposed dates and venue. The team will review scope and terms before an invitation is accepted.','Warsztaty, festiwale, weekendy tanga lub gościnne lekcje. Przedstaw społeczność, odbiorców, terminy i lokal. Zespół sprawdzi zakres i warunki przed przyjęciem.','Семинары, фестивали, танго-выходные или гостевое обучение. Расскажите об аудитории, датах и месте. Команда рассмотрит условия до принятия приглашения.','Майстер-класи, фестивалі, танго-вихідні чи гостьове навчання. Розкажіть про аудиторію, дати й місце. Команда розгляне умови до прийняття запрошення.')}</p>${A('/host',L('Start an invitation','Rozpocznij zaproszenie','Начать приглашение','Почати запрошення'),'up')}</div><div>${photo('rick','','Rick Daniel')}</div></div>`:''}${sourceHint(5)}`)};
function workshopPage(id){let t=THEMES.find(x=>x.id===id);if(!t)return notFound();return pageHead(q(t.title),q(t.desc),W('workshops'))+section('',`<div class="detail-layout"><div class="detail-body"><div class="detail-hero">${photo(t.photo,'',q(t.title))}</div><h2>${L('Bring a question.<br><em>Leave room for discovery.</em>','Przynieś pytanie.<br><em>Zostaw miejsce na odkrycia.</em>','Принесите вопрос.<br><em>Оставьте место открытию.</em>','Принесіть запитання.<br><em>Залиште місце відкриттю.</em>')}</h2><p>${L('Open to dancers from AuraTango and other schools. Share your experience and what you want to work on. The teaching team defines the prerequisites, duration and programme before a place can be confirmed.','Dla tancerzy AuraTango i innych szkół. Opisz doświadczenie i cele. Zespół określi wymagania, czas i program przed potwierdzeniem miejsca.','Для танцующих в AuraTango и других школах. Расскажите об опыте и целях. Команда определит требования, длительность и программу до подтверждения.','Для танцівників AuraTango й інших шкіл. Розкажіть про досвід і цілі. Команда визначить вимоги, тривалість і програму до підтвердження.')}</p><div class="button-row">${A('/workshops',W('back'),'','text-link')}${A('/host',L('Host this workshop','Zorganizuj warsztat','Организовать семинар','Організувати майстер-клас'),'up','text-link')}</div></div><aside class="booking-panel">${pill(W('example'),'peach')}<h3 class="card-copy">${W('interest')}</h3><p class="small muted card-copy">${L('Date, city, venue, level and price will be confirmed before payment. Interest is not a reservation.','Data, miasto, lokal, poziom i cena zostaną potwierdzone przed płatnością. Zainteresowanie nie jest rezerwacją.','Дата, город, место, уровень и цена уточняются до оплаты. Интерес не означает бронирование.','Дата, місто, місце, рівень і ціна уточнюються до оплати. Інтерес не означає бронювання.')}</p><button class="btn full" onclick="beginRequest('${id}')">${W('request')}${I('arrow')}</button>${sourceHint('5, 13')}</aside></div>`) };
const AURA_STEPS=[Q('Introduction','Wprowadzenie','Введение','Вступ'),Q('Individual awareness & body exercises','Świadomość i ćwiczenia indywidualne','Осознанность и индивидуальные упражнения','Усвідомленість та індивідуальні вправи'),Q('Partner connection exercises','Ćwiczenia kontaktu w parze','Упражнения на контакт в паре','Вправи на контакт у парі'),Q('Basic tango movement','Podstawy ruchu tanga','Основы движения танго','Основи руху танго'),Q('Communication & connection','Komunikacja i kontakt','Общение и контакт','Спілкування й контакт'),Q('Guided tango experience','Prowadzone doświadczenie tanga','Танго с ведущим','Танго з ведучим'),Q('Reflection & integration','Refleksja i integracja','Рефлексия и интеграция','Рефлексія й інтеграція')];
function auraTouch(){return `<section class="aura-touch-hero"><div class="wrap"><span class="eyebrow">AURATOUCH / BY AURATANGO</span><h1>${L('Before the steps,<br><em>there is connection.</em>','Zanim pojawią się kroki,<br><em>jest kontakt.</em>','До шагов<br><em>есть связь.</em>','До кроків<br><em>є зв’язок.</em>')}</h1><p class="lead">${L('Three hours to explore presence, awareness and communication through movement. Tango is the tool. Connection is the invitation.','Trzy godziny na obecność, świadomość i komunikację przez ruch. Tango jest narzędziem. Kontakt — zaproszeniem.','Три часа для присутствия, осознанности и общения через движение. Танго — инструмент. Связь — приглашение.','Три години для присутності, усвідомленості й спілкування через рух. Танго — інструмент. Зв’язок — запрошення.')}</p><div class="button-row"><button class="btn" onclick="beginRequest('auratouch')">${L('Explore the pilot','Poznaj pilotaż','Узнать о пилоте','Дізнатися про пілот')}${I('arrow')}</button>${pill(L('In development · 3-hour concept','W opracowaniu · 3 godziny','В разработке · 3 часа','У розробці · 3 години'),'peach')}</div></div></section>${section(L('Not a dance course.<br><em>A different kind of experience.</em>','Nie kurs tańca.<br><em>Inny rodzaj doświadczenia.</em>','Не танцевальный курс.<br><em>Другой опыт.</em>','Не танцювальний курс.<br><em>Інший досвід.</em>'),`<div class="grid3">${plainCard(L('For couples','Dla par','Для пар','Для пар'),L('Shared time, communication through movement and space to notice each other.','Wspólny czas, komunikacja przez ruch i uważność na drugą osobę.','Общее время, общение через движение и внимание друг к другу.','Спільний час, спілкування через рух і увага одне до одного.'),`<button class="text-link" onclick="beginRequest('auratouch','','couple')">${W('interest')}${I('arrow')}</button>`)}${plainCard(L('For individuals','Dla osób solo','Для отдельных участников','Для окремих учасників'),L('Self-awareness, presence and meeting others without pressure to form a couple.','Świadomość siebie, obecność i spotkania bez presji tworzenia pary.','Осознанность, присутствие и встречи без давления образовать пару.','Усвідомленість, присутність і зустрічі без тиску утворити пару.'),`<button class="text-link" onclick="beginRequest('auratouch','','solo')">${W('interest')}${I('arrow')}</button>`)}${plainCard(L('For teams · later','Dla zespołów · później','Для команд · позже','Для команд · пізніше'),L('A possible future adaptation for organisations. Enquiries help shape it; no ready corporate programme is promised.','Możliwa przyszła adaptacja dla organizacji. Zapytania pomagają ją stworzyć; nie obiecujemy gotowego programu.','Возможная будущая адаптация для организаций. Запросы помогут её создать; готовая программа не обещается.','Можлива майбутня адаптація для організацій. Запити допоможуть її створити; готова програма не обіцяється.'),`<button class="text-link" onclick="beginRequest('auratouch','','team')">${L('Discuss a future format','Omów przyszły format','Обсудить будущий формат','Обговорити майбутній формат')}${I('arrow')}</button>`)}</div>`)}${section(L('The three-hour arc.','Przebieg trzech godzin.','Три часа опыта.','Три години досвіду.'),`<div class="aura-arc">${AURA_STEPS.map((s,i)=>`<div><span>0${i+1}</span><h3>${q(s)}</h3></div>`).join('')}</div><p class="editorial-note">${L('The seven parts follow the supplied plan. Exact timings, facilitators, breaks and access arrangements must be tested and approved with the pilot team.','Siedem części pochodzi z dokumentu. Dokładne czasy, prowadzący, przerwy i dostępność wymagają testu i zatwierdzenia.','Семь частей следуют документу. Точные интервалы, ведущие, перерывы и доступность нужно проверить и утвердить.','Сім частин відповідають документу. Точні інтервали, ведучі, перерви й доступність потрібно перевірити та затвердити.')}</p>`, 'AURATOUCH / 180 MINUTES', 'rose-section')}${section(L('Your boundaries<br><em>belong to you.</em>','Twoje granice<br><em>należą do Ciebie.</em>','Ваши границы<br><em>принадлежат вам.</em>','Ваші межі<br><em>належать вам.</em>'),`<div class="grid2">${plainCard(L('Every exercise is an invitation','Każde ćwiczenie jest zaproszeniem','Каждое упражнение — приглашение','Кожна вправа — запрошення'),L('You may observe, pause, decline touch or stay with a familiar partner. A preference at registration is never permanent consent. Ask and agree again in the moment.','Możesz obserwować, odpocząć, odmówić dotyku lub zostać z bliską osobą. Preferencja przy zapisie nie jest trwałą zgodą. Zapytaj i uzgodnij w danej chwili.','Можно наблюдать, делать паузы, отказаться от прикосновения или остаться со знакомым партнёром. Предпочтение при записи не означает постоянного согласия.','Можна спостерігати, робити паузи, відмовитися від дотику або залишитися зі знайомим партнером. Уподобання під час запису не означає постійної згоди.'))}${plainCard(L('Connection, without promises','Kontakt bez obietnic','Контакт без обещаний','Контакт без обіцянок'),L('This concept is not a medical treatment, psychotherapy or a dating service. No relationship, wellbeing result or fixed partner is guaranteed.','To nie leczenie, psychoterapia ani usługa randkowa. Nie gwarantujemy relacji, samopoczucia ani stałego partnera.','Это не медицинское лечение, психотерапия или знакомство для отношений. Результат и постоянный партнёр не гарантируются.','Це не медичне лікування, психотерапія чи знайомство для стосунків. Результат і постійний партнер не гарантуються.'))}</div><div class="button-row"><button class="btn" onclick="beginRequest('auratouch')">${W('interest')}${I('heart')}</button>${A('/class/partnered',L('Prefer tango lessons?','Wolisz lekcje tanga?','Предпочитаете уроки танго?','Віддаєте перевагу урокам танго?'),'arrow','text-link')}</div>${sourceHint(6)}`)}`}
function conceptCard(e){return photoTile('/event/'+e.id,e.photo,L('PROPOSED MOMENT','PROPONOWANE SPOTKANIE','ПРЕДЛОЖЕНИЕ','ПРОПОЗИЦІЯ'),q(e.title),q(e.desc))}
eventsPage=function(){return pageHead(L('Make memories.<br><em>Keep dancing.</em>','Twórz wspomnienia.<br><em>Tańcz dalej.</em>','Создавайте воспоминания.<br><em>Продолжайте танцевать.</em>','Створюйте спогади.<br><em>Продовжуйте танцювати.</em>'),L('Small community moments are distinct from the large milonga. Plans below are proposals; sign up for interest or explore a configured demonstration date.','Małe spotkania społeczności to coś innego niż duża milonga. Poniżej propozycje; zgłoś zainteresowanie lub sprawdź termin demo.','Небольшие встречи отличаются от большой милонги. Ниже предложения: оставьте интерес или изучите настроенную демо-дату.','Невеликі зустрічі відрізняються від великої мілонги. Нижче пропозиції: залиште інтерес або перегляньте налаштовану демо-дату.'),T('Nights & moments','Wieczory i chwile'))+section('',`<div class="filter-bar">${[['all',L('All moments','Wszystkie chwile','Все встречи','Усі зустрічі')],['community',W('community')],['practice',itemTitle('practice')],['social',L('City & café','Miasto i kawiarnia','Город и кафе','Місто й кав’ярня')]].map(([k,n])=>`<button class="filter-chip ${state.eventFilter===k?'active':''}" onclick="state.eventFilter='${k}';render()">${n}</button>`).join('')}</div><div class="grid2">${CONCEPTS.filter(e=>state.eventFilter==='all'||e.cat===state.eventFilter).map(conceptCard).join('')}</div><div class="callout"><div><h3>${W('milonga')}</h3><p>${L('A separate late-night event project with its own venue, team and economics.','Osobny projekt nocny z lokalem, zespołem i budżetem.','Отдельный ночной проект со своим местом, командой и экономикой.','Окремий нічний проєкт зі своїм місцем, командою й економікою.')}</p></div>${A('/milonga',L('Explore the milonga','Poznaj milongę','Узнать о милонге','Дізнатися про мілонгу'),'arrow')}</div>`) };
eventPage=function(id){let e=CONCEPTS.find(x=>x.id===id);if(!e)return id==='milonga'?milongaPage():notFound();let partner=e.id==='partner-night';return pageHead(q(e.head),q(e.desc),q(e.title))+section('',`<div class="detail-layout"><div class="detail-body"><div class="detail-hero">${photo(e.photo,'',q(e.title))}<span class="pill peach">${W('example')}</span></div><h2>${L('A little plan.<br><em>A lot of room to feel.</em>','Mały plan.<br><em>Dużo przestrzeni na emocje.</em>','Небольшой план.<br><em>Пространство для чувств.</em>','Невеликий план.<br><em>Простір для почуттів.</em>')}</h2>${numberedSteps(partner?[[L('Welcome the first-month cohort','Powitaj nowy pierwszy miesiąc','Встреча группы первого месяца','Зустріч групи першого місяця'),L('Music, coffee, tea and time to recognise familiar faces. No jewellery purchase is needed to take part.','Muzyka, kawa, herbata i znajome twarze. Zakup biżuterii nie jest warunkiem udziału.','Музыка, кофе, чай и знакомые лица. Для участия не нужно покупать украшения.','Музика, кава, чай і знайомі обличчя. Для участі не потрібно купувати прикраси.')],[L('Dance and choose your comfort','Tańcz w swoim komforcie','Танец в вашем комфорте','Танець у вашому комфорті'),L('Hosted practice, optional changes of partner and the freedom to observe. Nobody is publicly ranked, selected or rejected.','Praktyka, dobrowolne zmiany partnerów i możliwość obserwacji. Bez publicznego oceniania, selekcji i odrzucania.','Практика, добровольные смены и возможность наблюдать. Никого публично не оценивают и не отбирают.','Практика, добровільні зміни й можливість спостерігати. Нікого публічно не оцінюють і не відбирають.')],[L('An invitation, not a commitment','Zaproszenie, nie zobowiązanie','Приглашение, не обязательство','Запрошення, не зобов’язання'),L('“Would you like to keep dancing with me?” Ask privately first. A symbolic moment is optional, reversible and never exclusive. The next class is open whether you choose a partner or not.','„Chcesz dalej ze mną tańczyć?” Najpierw zapytaj prywatnie. Symboliczny moment jest dobrowolny i nie oznacza wyłączności. Kolejne zajęcia są dla wszystkich.','«Хотите продолжать танцевать со мной?» Спросите сначала наедине. Символический момент доброволен и не эксклюзивен. Следующий урок открыт всем.','«Хочете продовжувати танцювати зі мною?» Запитайте спочатку наодинці. Символічна мить добровільна й не ексклюзивна. Наступний урок відкритий усім.')]]:[[L('Arrive & feel welcome','Przyjdź i poczuj się dobrze','Приходите и освоитесь','Приходьте й освоюйтеся'),L('A host explains the format, practical details and boundaries.','Prowadzący wyjaśnia format, szczegóły i granice.','Ведущий объясняет формат, детали и границы.','Ведучий пояснює формат, деталі й межі.')],[L('Participate at your pace','Uczestnicz w swoim tempie','Участвуйте в своём темпе','Беріть участь у своєму темпі'),L('A short introduction or supported practice. Observing and taking breaks are welcome.','Krótkie wprowadzenie lub wspierana praktyka. Obserwacja i przerwy są mile widziane.','Краткое знакомство или практика с поддержкой. Можно наблюдать и отдыхать.','Коротке знайомство чи практика з підтримкою. Можна спостерігати й відпочивати.')],[L('Find your next moment','Znajdź kolejną chwilę','Найдите следующую встречу','Знайдіть наступну зустріч'),L('Explore a suitable class, a community circle or the next confirmed event.','Poznaj odpowiednie zajęcia, krąg społeczności lub następne potwierdzone spotkanie.','Выберите подходящий урок, круг общения или следующее подтверждённое событие.','Оберіть відповідний урок, коло спілкування чи наступну підтверджену подію.')]])}${partner?notice(L('Carried forward from your earlier idea, not an explicit ring-selling requirement in Auratango.docx. Jewellery sales and wine service are deferred until suppliers, terms and venue arrangements are approved.','Pomysł z wcześniejszej rozmowy, nie wymóg sprzedaży pierścionków w dokumencie. Sprzedaż biżuterii i serwowanie wina odłożono do zatwierdzenia dostawców i warunków.','Идея из предыдущей беседы, не требование продавать кольца из документа. Продажа украшений и вино отложены до согласования поставщиков и условий.','Ідея з попередньої розмови, не вимога продавати каблучки з документа. Продаж прикрас і вино відкладено до погодження постачальників та умов.')):''}</div><aside class="booking-panel"><h3>${W('interest')}</h3><p class="small muted card-copy">${L('No event date, venue booking or final price has been supplied. This creates a local interest request, not a ticket.','Nie podano daty, lokalu ani ceny. To lokalne zgłoszenie zainteresowania, nie bilet.','Дата, место и итоговая цена не предоставлены. Это локальная заявка, не билет.','Дата, місце й остаточна ціна не надані. Це локальна заявка, не квиток.')}</p><button class="btn full" onclick="beginRequest('${id}')">${W('interest')}${I('arrow')}</button><div class="button-row">${A('/community',W('community'),'users','text-link')}${A('/timetable',W('timetable'),'calendar','text-link')}</div>${sourceHint('9, 13')}${e.source==='conversation'?`<p class="micro muted">${L('Additional concept from prior discussion.','Dodatkowy pomysł z rozmowy.','Дополнительная идея из беседы.','Додаткова ідея з розмови.')}</p>`:''}</aside></div>`) };
function atelier(){return pageHead(L('Made for movement.<br><em>Still becoming.</em>','Tworzone dla ruchu.<br><em>Wciąż w rozwoju.</em>','Создано для движения.<br><em>Ещё в разработке.</em>','Створено для руху.<br><em>Ще в розробці.</em>'),L('Practical tango clothing for training and milongas. We are exploring designs, fabrics, movement and comfort before committing to a collection. Help us shape what comes next.','Praktyczne ubrania na treningi i milongi. Badamy projekty, tkaniny, ruch i wygodę przed kolekcją. Pomóż nam ją stworzyć.','Практичная одежда для тренировок и милонг. Исследуем дизайн, ткани, движение и комфорт до запуска коллекции. Помогите её создать.','Практичний одяг для тренувань і мілонг. Досліджуємо дизайн, тканини, рух і комфорт до запуску колекції. Допоможіть її створити.'),'AURATANGO / ATELIER')+section('',`<div class="grid2">${PRODUCT.map((p,i)=>`<a href="#/shop/${p.id}" class="atelier-card"><div class="fabric-study fabric-${i}"><div class="fabric-fold"></div><span>DESIGN STUDY / 0${i+1}</span><strong>${q(p.title)}</strong><small>${L('Abstract design study—not a product photograph','Abstrakcyjne studium, nie zdjęcie produktu','Абстрактный этюд, не фото товара','Абстрактний етюд, не фото товару')}</small></div><div class="card-body">${pill(L('Prototype direction','Kierunek prototypu','Направление прототипа','Напрям прототипу'),'peach')}<h3 class="card-copy">${q(p.title)}</h3><p>${L('Help test the idea. No stock, approved fabric, sizes or selling price yet.','Pomóż przetestować pomysł. Brak zapasu, zatwierdzonej tkaniny, rozmiarów i ceny.','Помогите проверить идею. Пока нет запасов, утверждённой ткани, размеров или цены.','Допоможіть перевірити ідею. Поки немає запасів, затвердженої тканини, розмірів чи ціни.')}</p><span class="text-link">${L('Explore & give feedback','Poznaj i oceń','Узнать и оставить отзыв','Дізнатися й залишити відгук')} ${I('arrow')}</span></div></a>`).join('')}</div><div class="stage-strip">${[L('Prototype','Prototyp','Протот function warsawDateTime(date=new Date()){
  const format=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const {year,month,day,hour,minute}=Object.fromEntries(format.formatToParts(date).map(part=>[part.type,part.value]));
  return `${year}-${month}-${day}T${hour}:${minute}`;
}
function validPrivateTime(date,time){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return false;
  const requested=`${date}T${time}`;
  const instant=icsUTC(date,time);
  return Number.isFinite(instant.getTime())&&instant.getTime()>Date.now()&&warsawDateTime(instant)===requested;
}

  if(activePrivateHold?.teacher===teacher&&activePrivateHold.time===time&&privateHoldTime()>0)return true;
  clearPrivateHold();
  const hold={teacher,time,token:crypto.randomUUID()};
  const started=performance.now();
  const response=await window.changePrivateSlotHold('hold',hold);
  if(!response?.secondsLeft)return false;
  if(!onPrivateBookingRoute()||!form.isConnected){
    window.changePrivateSlotHold('release',hold).catch(()=>{});
    return false;
  }
  activePrivateHold={...hold,deadline:started+response.secondsLeft*1000};
  privateHoldTimer=setInterval(()=>{
    if(privateHoldTime()===0&&!privateHoldBusy){privateHoldExpired();return}
    const clock=document.getElementById('private-hold-clock');
    if(clock)clock.textContent=privateHoldLabel();
  },500);
  return true;
}

function completePayment(id){let p=U.pay,r=V.requests.find(x=>x.id===id);if(!p||p.busy||r?.status!=='offered'||!r.quote)return;let err=document.getElementById('pay-error');if(document.getElementById('f-outcome').value==='failure'){err.textContent=L('Declined in this test. No order, booking or credit was created. Choose Success and retry.','Odrzucono w teście. Nie utworzono zamówienia, rezerwacji ani wejścia. Wybierz Sukces i ponów.','Отказ в тесте. Заказ, запись и посещения не созданы. Выберите «Успех» и повторите.','Відмова в тесті. Замовлення, запис і відвідування не створено. Оберіть «Успіх» і повторіть.');return}if(p.quoteVersion!==r.quote.version){err.textContent=L('Offer changed. Review it again before paying.','Oferta zmieniona. Sprawdź ponownie przed płatnością.','Предложение изменилось. Проверьте снова до оплаты.','Пропозиція змінилася. Перевірте знову до оплати.');return}if(remaining(r)<r.guests){err.textContent=L('This sample session is full. No payment created.','Brak miejsc demo. Nie utworzono płatności.','Демо-мест нет. Платёж не создан.','Демо-місць немає. Платіж не створено.');return}let key=offerKey(r,r.quote);if(V.bookings.some(b=>b.key===key&&b.status==='confirmed')){err.textContent=L('You already have this session. No duplicate charge is created.','Masz już ten termin. Bez podwójnego obciążenia.','Это занятие уже есть. Повторного списания нет.','Це заняття вже є. Повторного списання немає.');return}p.busy=true;document.getElementById('pay-now').disabled=true;let o=r.quote;let order={id:uid('AT'),request:id,target:r.target,category:r.kind,total:o.price,people:r.guests,method:p.method,status:'confirmed',date:o.date,time:o.time,duration:o.duration,venue:o.venue,address:o.address,created:new Date().toISOString(),quote:{...o},confirmationLanguage:state.lang,confirmationProgramme:itemTitle(r.target)};let wallet=null;if(o.lessons>1){wallet={id:uid('PASS'),target:r.target,order:order.id,total:o.lessons,remaining:o.lessons-1,people:r.guests,quote:{...o},slot:r.slot};V.wallet.push(wallet)}let booking={id:uid('B'),request:id,order:order.id,target:r.target,key,date:o.date,time:o.time,duration:o.duration,venue:o.venue,address:o.address,teacher:o.teacher,language:o.language,capacity:o.capacity,people:r.guests,status:'confirmed',wallet:wallet?.id||null,creditUsed:!!wallet,source:r.source};V.orders.push(order);V.bookings.push(booking);r.status='accepted';r.timeline.push('accepted');r.segment=r.target==='milonga'?'milonga':r.kind==='workshop'?'workshop':'current';U.pay=null;state.member=true;const saved=saveV();navigate('/receipt/'+order.id);if(saved)toast(L('Demo booking and payment complete.','Rezerwacja i płatność demo zakończone.','Демо-запись и оплата завершены.','Демо-запис та оплату завершено.'))}
async function previewBookingEmail(id){
  const order=V.orders.find(o=>o.id===id&&o.status==='confirmed');
  if(!order)return;
  const receiptRoute=route();
  try{
    const {bookingConfirmationEmail}=await import('./booking-confirmation.js');
    if(route()!==receiptRoute)return;
    const message=bookingConfirmationEmail(order,order.confirmationProgramme||itemTitle(order.target),order.confirmationLanguage||state.lang);
    const title=L('Confirmation email preview','Podgląd e-maila z potwierdzeniem','Предпросмотр письма с подтверждением','Перегляд листа з підтвердженням');
    const note=L('This is a preview of the customer email.','To podgląd wiadomości dla klienta.','Это предварительный просмотр письма для клиента.','Це попередній перегляд листа для клієнта.');
    modal(title,`<p class="notice">${note}</p><h3>${ESC(message.subject)}</h3><p class="booking-email-preview">${ESC(message.text)}</p>`,true);
  }catch(error){console.error(error);toast(L('Email preview is unavailable.','Podgląd wiadomości jest niedostępny.','Предпросмотр письма недоступен.','Перегляд листа недоступний.'))}
}
function receiptPage(id){let o=V.orders.find(o=>o.id===id);if(!o)return notFound();return `<div class="success-card card"><div class="success-icon">${I('check')}</div><span class="eyebrow">${W('demo')}</span><h1>${o.status==='confirmed'?L('Demo booking complete','Rezerwacja demo zakończona','Демо-запись завершена','Демо-запис завершено'):L('Booking summary','Podsumowanie rezerwacji','Сводка записи','Підсумок запису')}</h1><p class="muted card-copy">${demoText()}</p><div class="ticket"><span class="label">${o.id}</span><h3 class="card-copy">${itemTitle(o.target)}</h3><p class="small">${dateLabel(o.date)} · ${o.time} · ${o.duration} min<br>${ESC(o.venue)} · ${ESC(o.address)}<br>${o.people} ${L('participants','uczestników','участников','учасників')} · ${money(o.total)}</p><p class="small muted card-copy">${L('No email, charge or real reservation was made.','Bez e-maila, obciążenia i prawdziwej rezerwacji.','Email, списание и настоящая бронь не созданы.','Email, списання й справжню бронь не створено.')}</p></div><div class="buttons"><button class="btn light" onclick="downloadOrder('${id}')">${I('download')}${L('Demo confirmation','Potwierdzenie demo','Демо-подтверждение','Демо-підтвердження')}</button>${o.status==='confirmed'?`<button class="btn light" onclick="previewBookingEmail('${id}')">${I('mail')}${L('Preview confirmation email','Podgląd e-maila z potwierdzeniem','Посмотреть письмо с подтверждением','Переглянути лист із підтвердженням')}</button>`:''}<button class="btn light" onclick="calendarOrder('${id}')">${I('calendar')}${T('Add to calendar','Dodaj do kalendarza')}</button>${A('/member/classes',L('Manage my classes','Zarządzaj zajęciami','Управлять занятиями','Керувати заняттями'),'arrow')}</div><div class="next-step-box"><h3>${L('Your story does not end here.','Twoja historia trwa dalej.','Ваша история продолжается.','Ваша історія триває.')}</h3><div class="button-row">${A('/community',W('community'),'users','text-link')}${A('/workshops',W('workshops'),'arrow','text-link')}${A('/event/partner-night',L('Your first-month celebration','Świętowanie pierwszego miesiąca','Праздник первого месяца','Свято першого місяця'),'heart','text-link')}</div></div></div>`}
function changeRequest(id,status){let r=V.requests.find(r=>r.id===id);if(!r||r.status==='accepted')return;r.status=status;r.timeline.push(status);saveV();closeModal();render()}
function calendarText(b){let s=icsUTC(b.date,b.time),e=new Date(s.getTime()+b.duration*60000),esc=t=>String(t).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AuraTango//Community prototype//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+b.id+'@auratango-demo.invalid','DTSTAMP:'+icsStamp(new Date()),'DTSTART:'+icsStamp(s),'DTEND:'+icsStamp(e),'SUMMARY:'+esc('DEMO — '+itemTitle(b.target)),'LOCATION:'+esc(b.venue+' · '+b.address),'DESCRIPTION:Local prototype. Not a real booking. Times converted from Europe/Warsaw.','STATUS:TENTATIVE','END:VEVENT','END:VCALENDAR',''].join('\r\n')}
function calendarOrder(id){const b=V.bookings.find(x=>x.order===id);if(b?.status==='confirmed'){downloadFile('AuraTango_DEMO_'+id+'.ics',calendarText(b),'text/calendar;charset=utf-8')}else toast(L('There is no active booking to add.','Brak aktywnej rezerwacji.','Нет активной записи.','Немає активного запису.'))}
function calendarBooking(id){let b=V.bookings.find(x=>x.id===id);if(b)downloadFile('AuraTango_DEMO_'+id+'.ics',calendarText(b),'text/calendar;charset=utf-8')}
function downloadOrder(id){let o=V.orders.find(x=>x.id===id);if(o)downloadFile('AuraTango_DEMO_'+id+'.txt',['AURATANGO — DEMONSTRATION ONLY','NOT AN INVOICE. NO PAYMENT WAS PROCESSED.',o.id,itemTitle(o.target),o.date+' '+o.time+' Europe/Warsaw',o.duration+' min',o.venue,o.address,'Participants: '+o.people,'Illustrative total: '+money(o.total),'Status: '+o.status,'Conditions (demo): '+o.quote.terms].join('\n'))}

ng for review, what is offered and what you have accepted.','Sprawdź, co czeka, co zaoferowano i co zaakceptowano.','Проверьте ожидание, предложения и принятые приглашения.','Перевірте очікування, пропозиції й прийняті запрошення.'),A('/member/requests',L('Open requests','Otwórz zgłoszenia','Открыть заявки','Відкрити заявки'),'arrow','text-link'))}${plainCard(L('Stay connected during a break','Bądź z nami podczas przerwy','Оставайтесь рядом в перерыве','Залишайтеся поруч у перерві'),L('Interest circles and announcements remain available without buying another package.','Kręgi i ogłoszenia pozostają dostępne bez kupowania pakietu.','Круги общения и новости доступны без покупки пакета.','Кола спілкування й новини доступні без купівлі пакета.'),A('/member/account',L('Choose my updates','Wybierz aktualizacje','Выбрать новости','Обрати новини'),'settings','text-link'))}</div><div class="next-step-box"><h3>${L('One month in. A moment to belong.','Pierwszy miesiąc. Chwila bliskości.','Первый месяц. Время почувствовать себя своим.','Перший місяць. Час відчути себе своїм.')}</h3><p class="small muted card-copy">${L('Explore the proposed Tango Partner Night. Participation and choosing a dance partner are always optional.','Poznaj propozycję wieczoru partnerów tanga. Udział i wybór partnera są zawsze dobrowolne.','Познакомьтесь с идеей вечера танго-партнёров. Участие и выбор партнёра всегда добровольны.','Познайомтеся з ідеєю вечора танго-партнерів. Участь і вибір партнера завжди добровільні.')}</p>${A('/event/partner-night',L('Explore the moment','Poznaj spotkanie','Узнать о встрече','Дізнатися про зустріч'),'arrow','text-link')}</div>`};
function memberRequests(){return `<div class="account-head"><div><h1>${L('Your requests.<br><em>No guessing.</em>','Twoje zgłoszenia.<br><em>Bez domysłów.</em>','Ваши заявки.<br><em>Без догадок.</em>','Ваші заявки.<br><em>Без здогадок.</em>')}</h1><p>${demoText()}</p></div></div>${V.requests.length?V.requests.map(r=>`<div class="card request-row"><div><span class="pill ${r.status==='offered'?'green':'peach'}">${W(r.status)}</span><h3 class="card-copy">${itemTitle(r.target)}</h3><p class="small muted">${r.target==='private'?privateRequestDetails(r):(r.slot?ESC(r.slot):L('Preference recorded','Zapisano preferencję','Предпочтение записано','Уподобання записано'))} · ${r.id}</p></div><div class="button-row">${r.status==='offered'?A('/invitation/'+r.id,L('Review invitation','Sprawdź zaproszenie','Проверить приглашение','Перевірити запрошення'),'arrow'):r.status==='accepted'?A('/member/classes',L('Manage booking','Zarządzaj rezerwacją','Управлять записью','Керувати записом'),'arrow','btn light'):A('/request/'+r.id,W('details'),'arrow','text-link')}${['submitted','waiting','offered'].includes(r.status)?`<button class="text-link" onclick="changeRequest('${r.id}','withdrawn')">${L('Withdraw','Wycofaj','Отозвать','Відкликати')}</button>`:''}</div></div>`).join(''):`<div class="empty">${L('No requests yet. Choose a class or experience to start.','Brak zgłoszeń. Wybierz zajęcia lub doświadczenie.','Заявок пока нет. Выберите урок или событие.','Заявок поки немає. Оберіть урок чи подію.')}${A('/start',L('Find my way','Znajdź drogę','Найти путь','Знайти шлях'),'arrow','text-link')}</div>`}`}
memberClasses=function(){return `<div class="account-head"><div><h1>${L('Your bookings.<br><em>Your next steps.</em>','Twoje rezerwacje.<br><em>Kolejne kroki.</em>','Ваши записи.<br><em>Следующие шаги.</em>','Ваші записи.<br><em>Наступні кроки.</em>')}</h1><p>${L('Packages remain separate by programme and party size. No automatic renewal.','Pakiety są rozdzielone według programu i liczby osób. Bez automatycznego odnawiania.','Пакеты разделены по программе и числу участников. Без автопродления.','Пакети розділено за програмою й кількістю учасників. Без автопродовження.')}</p></div></div><div class="stack">${V.wallet.map(w=>`<div class="card card-pad"><div class="flex between"><div><h3>${itemTitle(w.target)}</h3><p class="small muted">${w.people} ${L('participants per booking','osób na rezerwację','участников на запись','учасників на запис')}</p></div><div class="price">${w.remaining} / ${w.total}</div></div><p class="small muted card-copy">${L('Unused sessions · a couple’s credit covers both people. Credits never transfer to a different programme.','Niewykorzystane zajęcia · wejście pary obejmuje obie osoby. Nie przenosimy między programami.','Неиспользованные занятия · посещение пары покрывает двоих. Не переносятся между программами.','Невикористані заняття · відвідування пари покриває двох. Не переносяться між програмами.')}</p><div class="button-row"><button class="btn sm" ${w.remaining<=0?'disabled':''} onclick="walletBooking('${w.id}')">${L('Use a session','Użyj wejścia','Использовать посещение','Використати відвідування')}${I('calendar')}</button><button class="text-link" onclick="beginRequest('${w.target}','${w.slot||''}','${w.people===2?'couple':'solo'}')">${L('Ask about continuation','Zapytaj o kontynuację','Спросить о продолжении','Запитати про продовження')}${I('arrow')}</button></div></div>`).join('')}</div><h2 class="subsection-heading">${L('In your diary','W Twoim kalendarzu','В вашем календаре','У вашому календарі')}</h2>${V.bookings.length?V.bookings.map(b=>`<div class="card request-row"><div><span class="pill ${b.status==='confirmed'?'green':'peach'}">${b.status==='confirmed'?W('accepted'):T('Cancelled','Anulowano')}</span><h3 class="card-copy">${itemTitle(b.target)}</h3><p class="small muted">${dateLabel(b.date)} · ${b.time} · ${b.duration} min<br>${ESC(b.venue)} · ${b.people} ${L('people','osób','чел.','ос.')}<br>${ESC(b.teacher)} · ${ESC(b.language)}</p></div><div class="button-row"><button class="btn light sm" onclick="calendarBooking('${b.id}')">${I('calendar')}${T('Calendar','Kalendarz')}</button>${b.status==='confirmed'?`<button class="btn light sm" onclick="rescheduleNew('${b.id}')">${T('Reschedule','Zmień termin')}</button><button class="text-link" onclick="cancelNew('${b.id}')">${W('cancel')}</button>`:''}</div></div>`).join(''):`<div class="empty">${L('No bookings. Requests are not paid reservations.','Brak rezerwacji. Zgłoszenia nie są płatnymi rezerwacjami.','Записей нет. Заявки не являются оплаченными местами.','Записів немає. Заявки не є оплаченими місцями.')}</div>`}`};
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sessionKey(target,o){return `${target}|${o.date}|${o.time}|${o.venue}`}
function walletBooking(id){let w=V.wallet.find(x=>x.id===id);if(!w||w.remaining<=0)return;let opts=Array.from({length:w.total},(_,i)=>{let d=addDays(w.quote.date,i*7),k=sessionKey(w.target,{...w.quote,date:d});return{date:d,key:k}}).filter(s=>!V.bookings.some(b=>b.status==='confirmed'&&b.key===s.key)&&bookedSeats(s.key)+w.people<=w.quote.capacity);modal(L('Keep the rhythm.','Zachowaj rytm.','Сохраните ритм.','Збережіть ритм.'),`<p>${itemTitle(w.target)} · ${w.remaining} ${L('unused sessions','niewykorzystanych wejść','неиспользованных посещений','невикористаних відвідувань')}</p>${notice(L('These are weekly repetitions in the local package simulation, not verified real availability.','To cotygodniowe terminy symulacji pakietu, nie rzeczywista dostępność.','Это еженедельные даты локальной симуляции, не настоящая доступность.','Це щотижневі дати локальної симуляції, не справжня доступність.'))}${opts.length?`<form onsubmit="reserveWallet(event,'${id}')">${sel('date',L('Choose next session','Wybierz kolejne zajęcia','Выберите следующее занятие','Оберіть наступне заняття'),opts.map(s=>[s.date,dateLabel(s.date)+' · '+w.quote.time]))}<button class="btn full">${L('Use one package session','Wykorzystaj jedno wejście','Использовать одно посещение','Використати одне відвідування')}${I('check')}</button></form>`:notice(L('No eligible dates remain in this sample package. Ask the studio; no credit will be consumed.','Brak dostępnych terminów tego pakietu demo. Zapytaj studio; bez pobierania wejścia.','В примере нет подходящих дат. Спросите студию; посещение не списывается.','У прикладі немає відповідних дат. Запитайте студію; відвідування не списується.'))}`)}
function reserveWallet(e,id){e.preventDefault();let w=V.wallet.find(x=>x.id===id),date=new FormData(e.target).get('date');if(!w||w.remaining<1)return;let eligible=Array.from({length:w.total},(_,i)=>addDays(w.quote.date,i*7));if(!eligible.includes(date))return;let key=sessionKey(w.target,{...w.quote,date});if(V.bookings.some(b=>b.key===key&&b.status==='confirmed')||bookedSeats(key)+w.people>w.quote.capacity){toast(L('Already booked or full. Nothing deducted.','Już zarezerwowano lub pełne. Bez potrącenia.','Уже записано или мест нет. Ничего не списано.','Уже записано чи місць немає. Нічого не списано.'));return}w.remaining--;V.bookings.push({id:uid('B'),target:w.target,date,time:w.quote.time,duration:w.quote.duration,venue:w.quote.venue,address:w.quote.address,teacher:w.quote.teacher,language:w.quote.language,people:w.people,capacity:w.quote.capacity,key,status:'confirmed',wallet:w.id,creditUsed:true,order:w.order,source:'member'});saveV();closeModal();navigate('/member/classes')}
function cancelNew(id){let b=V.bookings.find(b=>b.id===id);if(!b||b.status!=='confirmed')return;modal(L('Change of plans?','Zmiana planów?','Планы изменились?','Плани змінилися?'),`<p>${b.wallet?L('Cancelling restores exactly one session to the original package. Repeated clicks cannot restore it twice.','Anulowanie zwraca jedno wejście do pierwotnego pakietu. Wielokrotne kliknięcia nie zwracają go ponownie.','Отмена вернёт ровно одно посещение исходного пакета. Повторный клик не вернёт его дважды.','Скасування поверне рівно одне відвідування вихідного пакета. Повторний клік не поверне його двічі.'):L('This was not paid with a class credit. Cancellation opens a demo refund-review record; it does not issue money or grant a class credit.','Nie użyto wejścia z pakietu. Anulacja tworzy sprawę zwrotu demo, bez pieniędzy i dodatkowych wejść.','Запись не использовала посещение пакета. Отмена создаёт демо-запрос на проверку возврата, без денег и новых посещений.','Запис не використав відвідування пакета. Скасування створює демо-запит на перевірку повернення, без грошей і нових відвідувань.')}</p><div class="modal-actions"><button class="btn light" onclick="closeModal()">${L('Keep booking','Zachowaj rezerwację','Оставить запись','Залишити запис')}</button><button class="btn" onclick="confirmCancel('${id}')">${W('cancel')}</button></div>`)}
function confirmCancel(id){let b=V.bookings.find(b=>b.id===id);if(!b||b.status!=='confirmed')return;b.status='cancelled';if(b.wallet&&b.creditUsed){let w=V.wallet.find(w=>w.id===b.wallet);if(w)w.remaining=Math.min(w.total,w.remaining+1);b.creditUsed=false}else{let o=V.orders.find(o=>o.id===b.order);if(o)o.status='refund-review'}delete V.attendance[id];saveV();closeModal();navigate('/member/classes')}
function rescheduleNew(id){let b=V.bookings.find(b=>b.id===id);if(!b||b.status!=='confirmed')return;if(!OFFER[b.target]||['private','practice'].includes(b.target)){modal(L('A date agreed with the host.','Termin ustalany z prowadzącym.','Дата по согласованию.','Дата за погодженням.'),`<p>${L('This event or individually arranged session is not automatically moved. Cancel and ask for an alternative; no silent transfer to another event.','Nie przenosimy automatycznie takiego spotkania. Anuluj i zapytaj o alternatywę.','Это событие не переносится автоматически. Отмените и запросите альтернативу.','Ця подія не переноситься автоматично. Скасуйте й запитайте про альтернативу.')}</p><div class="modal-actions"><button class="btn light" onclick="cancelNew('${id}')">${W('cancel')}</button><button class="btn" onclick="beginRequest('${b.target}')">${W('request')}</button></div>`);return}let choices=[7,14].map(n=>addDays(b.date,n));modal(L('Same rhythm.<br>Another date.','Ten sam rytm.<br>Inny termin.','Тот же ритм.<br>Другая дата.','Той самий ритм.<br>Інша дата.'),`<p>${L('Same programme, venue, duration and party size. The prototype checks duplicate bookings and capacity. No extra credit is consumed.','Ten sam program, lokal, czas i liczba osób. Demo sprawdza duplikaty i limit. Bez dodatkowego wejścia.','Та же программа, место, длительность и группа. Демо проверяет дубликаты и вместимость. Без дополнительного списания.','Та сама програма, місце, тривалість і група. Демо перевіряє дублікати й місткість. Без додаткового списання.')}</p><form onsubmit="saveReschedule(event,'${id}')">${sel('date',L('Alternative sample date','Alternatywna data demo','Другая демо-дата','Інша демо-дата'),choices.map(d=>[d,dateLabel(d)+' · '+b.time]))}<p id="move-error" class="error"></p><button class="btn full">${L('Confirm change · demo','Potwierdź zmianę · demo','Подтвердить перенос · демо','Підтвердити перенесення · демо')}</button></form>`)}
function saveReschedule(e,id){e.preventDefault();let b=V.bookings.find(b=>b.id===id),date=new FormData(e.target).get('date');if(!b||b.status!=='confirmed'||![addDays(b.date,7),addDays(b.date,14)].includes(date))return;let key=sessionKey(b.target,{...b,date});if(V.bookings.some(x=>x.id!==id&&x.status==='confirmed'&&x.key===key)||bookedSeats(key,id)+b.people>b.capacity){document.getElementById('move-error').textContent=L('Already booked or full. Choose another date.','Już zarezerwowano lub brak miejsc. Wybierz inny termin.','Уже записано или мест нет. Выберите другую дату.','Уже записано чи місць немає. Оберіть іншу дату.');return}b.date=date;b.key=key;delete V.attendance[id];saveV();closeModal();navigate('/member/classes')}
memberProgress=function(){let done=Object.values(V.attendance).filter(v=>v==='attended').length;return `<h1>${L('Your learning.<br><em>At your pace.</em>','Twoja nauka.<br><em>W Twoim tempie.</em>','Ваше обучение.<br><em>В вашем темпе.</em>','Ваше навчання.<br><em>У вашому темпі.</em>')}</h1><div class="stats"><div class="stat"><div class="value">${done}</div><div class="name">${L('Attendance marks in this demo','Obecności w demo','Отметок посещения в демо','Позначок відвідування в демо')}</div></div></div>${notice(L('Attendance is not a skill assessment. No invented progress percentage, level promotion or certificate is shown. Teaching goals are agreed with Rick / Anna.','Obecność nie jest oceną umiejętności. Nie wymyślamy procentu postępu, awansu ani certyfikatu. Cele ustalasz z Rickiem / Anną.','Посещаемость не оценивает навыки. Нет выдуманных процентов прогресса, уровней или сертификатов. Цели согласуются с Риком / Анной.','Відвідуваність не оцінює навички. Немає вигаданих відсотків поступу, рівнів чи сертифікатів. Цілі узгоджуються з Ріком / Анною.'))}<div class="grid2" style="margin-top:24px">${plainCard(L('Bring a question','Przynieś pytanie','Принесите вопрос','Принесіть запитання'),L('What felt easier? What did you notice in the music? Ask the teacher for one useful next focus.','Co było łatwiejsze? Co słyszysz w muzyce? Poproś o jeden kolejny cel.','Что стало легче? Что заметили в музыке? Попросите один полезный следующий ориентир.','Що стало легше? Що помітили в музиці? Попросіть один корисний наступний орієнтир.'),A('/class/private',itemTitle('private'),'arrow','text-link'))}${plainCard(L('Give practice a place','Znajdź miejsce na praktykę','Найдите место практике','Знайдіть місце практиці'),L('Explore guided practice, workshops and an appropriate next class without compulsory progression.','Poznaj praktykę, warsztaty i odpowiednie zajęcia bez obowiązkowego awansu.','Изучите практики, семинары и подходящий урок без обязательного перехода.','Перегляньте практики, майстер-класи й відповідний урок без обов’язкового переходу.'),A('/class/practice',itemTitle('practice'),'arrow','text-link'))}</div><div class="button-row">${A('/journal/beyond-first-step',L('Read: the reason you return','Przeczytaj: powód powrotu','Читать: причина вернуться','Читати: причина повернутися'),'book','text-link')}</div>`};
function communityContent(publicView=true){return `<div class="section-head"><div><div class="eyebrow">${L('STAY CONNECTED, YOUR WAY','POZOSTAŃ BLISKO, PO SWOJEMU','ОСТАВАЙТЕСЬ РЯДОМ ПО-СВОЕМУ','ЗАЛИШАЙТЕСЯ ПОРУЧ ПО-СВОЄМУ')}</div><h2>${L('You are more<br><em>than a current student.</em>','Jesteś kimś więcej<br><em>niż obecnym kursantem.</em>','Вы больше,<br><em>чем действующий ученик.</em>','Ви більше,<br><em>ніж чинний учень.</em>')}</h2></div>${A('/community/calendar',L('Open calendar','Otwórz kalendarz','Открыть календарь','Відкрити календар'),'calendar','text-link')}</div><p class="lead">${L('Classes, practicas, workshops, milongas and life beyond tango. Join the circles that interest you. Stay connected during a break without having to buy another course.','Zajęcia, praktiki, warsztaty, milongi i życie poza tangiem. Dołącz do swoich kręgów. Zostań z nami podczas przerwy bez zakupu kursu.','Уроки, практики, семинары, милонги и жизнь за пределами танго. Выбирайте свои круги. Оставайтесь рядом в перерыве без покупки курса.','Уроки, практики, майстер-класи, мілонги й життя поза танго. Обирайте свої кола. Залишайтеся поруч у перерві без купівлі курсу.')}</p><div class="grid2 circle-grid">${CIRCLES.map(c=>`<div class="card card-pad"><div class="circle-symbol">${I(c.id==='ladies'?'user':c.id==='practice'?'walk':c.id==='social'?'heart':'users')}</div><h3>${q(c.title)}</h3><p class="small muted card-copy">${q(c.body)}</p><button class="btn ${V.groups.includes(c.id)?'light':''} sm" onclick="toggleCircle('${c.id}')">${V.groups.includes(c.id)?L('Joined · leave circle','Dołączono · opuść krąg','Вы в круге · выйти','Ви в колі · вийти'):L('Join this circle · demo','Dołącz do kręgu · demo','Вступить в круг · демо','Долучитися до кола · демо')}${I(V.groups.includes(c.id)?'check':'users')}</button></div>`).join('')}</div><div class="notice">${I('shield')}<span>${L('These are local subscription groups, not a live chat. No public member directory, automatic matching or compulsory role based on gender. Joining a circle does not opt you into marketing messages.','To lokalne grupy subskrypcji, nie czat na żywo. Bez publicznego katalogu, automatycznego dobierania i ról narzuconych według płci. Dołączenie nie zapisuje na marketing.','Это локальные группы подписок, не живой чат. Нет публичного каталога, автоподбора и роли по полу. Вступление не подписывает на маркетинг.','Це локальні групи підписок, не живий чат. Немає публічного каталогу, автодобору й ролі за статтю. Вступ не підписує на маркетинг.')}</span></div><h2 class="subsection-heading">${L('Community noticeboard','Tablica społeczności','Доска сообщества','Дошка спільноти')}</h2><div class="filter-bar"><button class="filter-chip ${U.newsFilter!=='mine'?'active':''}" onclick="U.newsFilter='all';render()">${L('All public updates','Wszystkie ogłoszenia','Все публичные новости','Усі публічні новини')}</button><button class="filter-chip ${U.newsFilter==='mine'?'active':''}" onclick="U.newsFilter='mine';render()">${L('My circles + general','Moje kręgi i ogólne','Мои круги + общие','Мої кола + загальні')}</button></div>${announcementFeed()}<div class="button-row">${A('/member/account',L('Choose or pause updates','Wybierz lub wstrzymaj wiadomości','Выбрать или приостановить новости','Обрати чи призупинити новини'),'settings','text-link')}${A('/return',L('Find my way back','Znajdź drogę powrotu','Найти путь назад','Знайти шлях назад'),'refresh','text-link')}</div>`}
function communityPage(){return pageHead(L('The class ends.<br><em>The connection stays.</em>','Zajęcia się kończą.<br><em>Bliskość zostaje.</em>','Урок заканчивается.<br><em>Связь остаётся.</em>','Урок закінчується.<br><em>Зв’язок залишається.</em>'),'',W('community'))+section('',communityContent(true))}
function toggleCircle(id){if(!CIRCLES.some(c=>c.id===id))return;V.groups=V.groups.includes(id)?V.groups.filter(x=>x!==id):[...V.groups,id];state.member=true;saveV();render()}
function postRoute(p){return p.type==='milonga'?'/milonga':p.type==='workshop'?'/workshops':p.type==='practice'?'/class/practice':p.type==='class'?'/timetable':p.type==='auratouch'?'/auratouch':'/community/calendar'}
function announcementFeed(){let posts=V.posts.filter(p=>p.status==='published'&&(!(U.newsFilter==='mine')||p.audience==='all'||V.groups.includes(p.audience)));return posts.length?posts.map(p=>`<div class="card card-pad post-card"><span class="pill">${p.type==='social'?L('Community moment','Chwila społeczności','Встреча сообщества','Зустріч спільноти'):p.type.toUpperCase()} · DEMO</span><h3 class="card-copy">${ESC(p.title)}</h3><p class="small muted card-copy">${ESC(p.body)}</p>${p.date?`<p class="small">${dateLabel(p.date)} · ${p.time||''} · ${ESC(p.venue||'')}</p>`:''}<div class="button-row">${A(postRoute(p),L('Explore details','Poznaj szczegóły','Изучить детали','Вивчити деталі'),'arrow','text-link')}${p.type==='social'&&p.date?`<button class="btn light sm" onclick="rsvpPost('${p.id}')">${V.rsvps.includes(p.id)?L('RSVP saved · cancel','Zapisano RSVP · anuluj','RSVP сохранён · отменить','RSVP збережено · скасувати'):L('RSVP · demo','RSVP · demo','RSVP · демо','RSVP · демо')}</button>`:''}</div></div>`).join(''):`<div class="empty">${L('No announcements have been published in this local preview. The studio can save a draft, review it and publish it here. Existing WhatsApp messages have not been imported.','Brak opublikowanych ogłoszeń w lokalnym podglądzie. Studio może zapisać szkic, sprawdzić i opublikować. Wiadomości WhatsApp nie zostały zaimportowane.','В локальном просмотре ещё нет объявлений. Студия может сохранить черновик, проверить и опубликовать. Сообщения WhatsApp не импортированы.','У локальному перегляді ще немає оголошень. Студія може зберегти чернетку, перевірити й опублікувати. Повідомлення WhatsApp не імпортовано.')}<div class="button-row">${A('/studio/community',L('Try a studio announcement','Wypróbuj ogłoszenie studia','Создать объявление студии','Створити оголошення студії'),'up','text-link')}</div></div>`}
function rsvpPost(id){let p=V.posts.find(p=>p.id===id);if(!p||p.status!=='published'||p.type!=='social'||!p.date)return;V.rsvps=V.rsvps.includes(id)?V.rsvps.filter(x=>x!==id):[...V.rsvps,id];state.member=true;saveV();render()}
function calendarPage(){let p=V.posts.filter(x=>x.status==='published'&&x.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return pageHead(L('Make room<br><em>for the next moment.</em>','Zrób miejsce<br><em>na kolejną chwilę.</em>','Оставьте место<br><em>следующей встрече.</em>','Залиште місце<br><em>наступній зустрічі.</em>'),L('Only dated studio announcements appear here. Weekly class windows remain on the timetable; proposed moments do not get invented dates.','Tutaj tylko ogłoszenia z datą. Stałe godziny zajęć są w grafiku; propozycjom nie wymyślamy dat.','Здесь только объявления студии с датой. Еженедельные часы в расписании; предложениям не выдумываются даты.','Тут лише оголошення студії з датою. Щотижневі години в розкладі; пропозиціям не вигадуються дати.'),L('Community calendar','Kalendarz społeczności','Календарь сообщества','Календар спільноти'),trialClassCallout())+section('',`<div class="filter-bar">${[['all',L('Everything','Wszystko','Всё','Усе')],['class',W('classes')],['workshop',W('workshops')],['milonga',W('milonga')],['practice',itemTitle('practice')],['social',L('Social','Spotkania','Встречи','Зустрічі')]].map(([v,n])=>`<button class="filter-chip ${U.calendarFilter===v||(!U.calendarFilter&&v==='all')?'active':''}" onclick="U.calendarFilter='${v}';render()">${n}</button>`).join('')}</div>${p.filter(x=>!U.calendarFilter||U.calendarFilter==='all'||x.type===U.calendarFilter).map(x=>`<div class="card request-row"><div class="date-box">${new Date(x.date+'T12:00:00').getDate()}<small>${dateLabel(x.date,{month:'short'})}</small></div><div><h3>${ESC(x.title)}</h3><p class="small muted">${x.time||''} · ${ESC(x.venue||W('pending'))} · DEMO</p></div><div class="button-row">${x.type==='social'?`<button class="btn sm" onclick="rsvpPost('${x.id}')">${V.rsvps.includes(x.id)?L('Cancel RSVP','Anuluj RSVP','Отменить RSVP','Скасувати RSVP'):'RSVP · DEMO'}</button>`:A(postRoute(x),W('details'),'arrow','btn sm')}</div></div>`).join('')||`<div class="empty">${L('No dated announcements match yet.','Brak pasujących ogłoszeń z datą.','Подходящих дат пока нет.','Відповідних дат поки немає.')}</div>`}<div class="button-row">${A('/timetable',W('timetable'),'calendar','text-link')}${A('/events',T('Nights & moments','Wieczory i chwile'),'heart','text-link')}${A('/community',W('community'),'users','text-link')}</div>`) }
memberAccount=function(){let pr=V.preferences;return `<h1>${L('Close, not crowded.<br><em>Your preferences.</em>','Blisko, bez natłoku.<br><em>Twoje preferencje.</em>','Рядом, без перегруза.<br><em>Ваши настройки.</em>','Поруч, без перевантаження.<br><em>Ваші налаштування.</em>')}</h1><div class="card card-pad" style="margin-top:28px"><form onsubmit="savePreferences(event)">${check('updates',L('Optional relevant class and community updates · simulated only','Opcjonalne wiadomości o zajęciach i społeczności · tylko symulacja','Необязательные новости занятий и сообщества · только симуляция','Необов’язкові новини занять і спільноти · лише симуляція'),pr.updates)}${sel('frequency',L('Preferred rhythm','Preferowany rytm','Предпочитаемый ритм','Бажаний ритм'),[['monthly',L('Monthly digest','Podsumowanie miesięczne','Ежемесячный обзор','Щомісячний огляд')],['important',L('Important announcements only','Tylko ważne ogłoszenia','Только важные объявления','Лише важливі оголошення')]],pr.frequency)}${check('pause',L('Pause all optional updates while keeping my community access','Wstrzymaj wiadomości, zachowując dostęp do społeczności','Приостановить новости, сохранив доступ к сообществу','Призупинити новини, зберігши доступ до спільноти'),pr.pause)}<button class="btn" type="submit">${W('save')}${I('check')}</button><button class="text-link" type="button" style="margin-left:18px" onclick="unsubscribeAll()">${L('Unsubscribe from optional updates','Wypisz z wiadomości opcjonalnych','Отписаться от необязательных новостей','Відписатися від необов’язкових новин')}</button></form></div><h2 class="subsection-heading">${L('Your orders · demo','Twoje zamówienia · demo','Ваши заказы · демо','Ваші замовлення · демо')}</h2>${V.orders.map(o=>`<div class="card request-row"><div><h3>${itemTitle(o.target)}</h3><p class="small muted">${o.id} · ${money(o.total)} · ${o.status==='refund-review'?L('Cancellation · refund review, no money returned','Anulowano · kontrola zwrotu, bez zwrotu pieniędzy','Отмена · проверка возврата, деньги не возвращены','Скасування · перевірка повернення, кошти не повернено'):W('accepted')}</p></div><div class="button-row">${A('/receipt/'+o.id,W('details'),'arrow','text-link')}<button class="btn light sm" onclick="downloadOrder('${o.id}')">${I('download')}${T('Document','Dokument')}</button></div></div>`).join('')||`<div class="empty">${L('No demo orders.','Brak zamówień demo.','Нет демо-заказов.','Немає демо-замовлень.')}</div>`}<p class="editorial-note">${L('Order confirmations are not invoices. Refunds, customer-data requests and actual account security require production services.','Potwierdzenia nie są fakturami. Zwroty, obsługa danych i bezpieczeństwo wymagają usług produkcyjnych.','Подтверждения не являются счетами. Возвраты, запросы данных и безопасность требуют рабочих сервисов.','Підтвердження не є рахунками. Повернення, запити даних і безпека потребують робочих сервісів.')}</p>`};
function savePreferences(e){e.preventDefault();let d=new FormData(e.target);V.preferences={updates:d.has('updates'),pause:d.has('pause'),frequency:d.get('frequency')};if(!d.has('updates'))V.requests.forEach(r=>r.updates=false);saveV();toast(L('Preferences saved locally. No subscription service contacted.','Zapisano lokalnie. Bez połączenia z usługą subskrypcji.','Сохранено локально. Сервис подписки не вызван.','Збережено локально. Сервіс підписки не викликано.'))}
function unsubscribeAll(){V.preferences.updates=false;V.preferences.pause=true;V.requests.forEach(r=>r.updates=false);saveV();render()}
function returnPage(){return pageHead(L('You do not have to<br><em>start over.</em>','Nie musisz<br><em>zaczynać od zera.</em>','Не обязательно<br><em>начинать с нуля.</em>','Не обов’язково<br><em>починати з нуля.</em>'),L('Life changes. You can reconnect with people, join a practica or ask a teacher where to return. An active package is not the price of belonging.','Życie się zmienia. Wróć do ludzi, przyjdź na praktikę lub zapytaj nauczyciela o grupę. Aktywny pakiet nie jest ceną przynależności.','Жизнь меняется. Вернитесь к людям, зайдите на практику или спросите преподавателя о группе. Активный пакет не является ценой принадлежности.','Життя змінюється. Поверніться до людей, завітайте на практику чи запитайте викладача про групу. Активний пакет не є ціною приналежності.'),L('Welcome back','Witaj ponownie','С возвращением','З поверненням'))+section('',`<div class="grid3">${plainCard(L('See familiar faces','Spotkaj znajomych','Увидеть знакомые лица','Побачити знайомі обличчя'),L('Keep up with your circles and community plans.','Bądź blisko kręgów i planów społeczności.','Оставайтесь в курсе кругов и планов.','Будьте в курсі кіл і планів.'),A('/community',W('community'),'users'))}${plainCard(L('Ask about the right group','Zapytaj o właściwą grupę','Спросить о подходящей группе','Запитати про відповідну групу'),L('Your past experience matters. The teacher confirms where you fit now.','Twoje doświadczenie jest ważne. Nauczyciel pomoże wybrać grupę.','Ваш опыт важен. Преподаватель поможет выбрать группу сейчас.','Ваш досвід важливий. Викладач допоможе обрати групу зараз.'),`<button class="btn" onclick="beginRequest('partnered');U.wizard.experience='returning';render()">${W('request')}${I('arrow')}</button>`)}${plainCard(L('Return gently through practice','Wróć spokojnie przez praktykę','Вернуться спокойно через практику','Повернутися спокійно через практику'),L('Ask about regular or guided practicas before choosing a class package.','Zapytaj o praktikę przed wyborem pakietu.','Спросите о практике до покупки пакета.','Запитайте про практику до купівлі пакета.'),A('/class/practice',itemTitle('practice'),'walk'))}</div>${sourceHint('9–10')}`)}

studioShell=function(tab=''){let pages={'':studioOverview,roadmap:roadmapPage,requests:studioRequests,enrolments:studioRequests,milonga:studioMilonga,events:studioMilonga,community:studioCommunity,reactivation:studioReactivation,attendance:studioAttendanceNew,atelier:studioAtelier,partners:studioPartners,content:contentStudio,settings:settingsStudio};return `<div class="wrap account-layout"><aside class="sidebar"><div class="profile"><span class="eyebrow">AURATANGO / STUDIO</span><h3>${L('Build it properly.','Buduj z głową.','Стройте правильно.','Будуйте правильно.')}</h3></div><nav>${studioNav().map(([p,t,i])=>`<a href="#/studio${p?'/'+p:''}" class="${tab===p?'active':''}">${I(i)}${t}</a>`).join('')}</nav></aside><div class="account-main">${notice(L('Open operator preview. No access control or live systems. Work entered here stays in this browser. Use sample information only.','Otwarty podgląd operatora. Bez kontroli dostępu i usług na żywo. Dane zostają w przeglądarce; używaj przykładów.','Открытый просмотр оператора. Нет контроля доступа или живых систем. Данные остаются в браузере; используйте примеры.','Відкритий перегляд оператора. Немає контролю доступу чи живих систем. Дані залишаються в браузері; використовуйте приклади.'),'shield')}<div style="height:25px"></div>${(pages[tab]||settingsStudio)()}</div></div>`};

saction classification, not profit or a live accounting report. Open enquiries, prototype dress interest and external teaching invitations are not revenue.','To klasyfikacja transakcji, nie zysk ani księgowość. Zapytania, zainteresowanie sukienkami i zaproszenia nie są przychodem.','Это классификация транзакций, не прибыль или бухгалтерия. Запросы, интерес к платьям и приглашения не являются доходом.','Це класифікація транзакцій, не прибуток чи бухгалтерія. Запити, інтерес до суконь і запрошення не є доходом.')}</p>`}

iv class="empty">${L('No requests yet. Start from the website, or follow the guided walkthrough.','Brak zgłoszeń. Zacznij od strony lub przewodnika.','Заявок пока нет. Начните на сайте или в пошаговом обзоре.','Заявок поки немає. Почніть на сайті чи в покроковому огляді.')}${A('/tour',L('Try the complete flow','Wypróbuj cały proces','Пройти весь процесс','Пройти весь процес'),'arrow','text-link')}</div>`}<div class="button-row"><button class="btn light" onclick="exportRequests()">${I('download')}CSV</button></div>${notice(L('Names and email input from enrolment are discarded; workflow records use request IDs. Matching is an operator review, not a public directory or automatic romantic pairing.','Imiona i e-maile z zapisów są odrzucane; rekordy używają identyfikatorów. Dopasowanie to decyzja operatora, nie publiczny katalog czy romantyczne parowanie.','Имена и email из записи удаляются; используются ID заявок. Подбор — проверка оператором, не публичный каталог или романтическое соединение.','Імена й email із запису видаляються; використовуються ID заявок. Добір — перевірка оператором, не публічний каталог чи романтичне поєднання.'))}`}
