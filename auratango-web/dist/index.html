function pricing(){return `${pageHead(T('A little time.<br><em>A lot to feel.</em>','Trochę czasu.<br><em>Wiele do poczucia.</em>'),T('Start with a first feeling, or make tango part of your week. One lesson or a thoughtful package. No automatic subscription. These are demonstration purchases, not live reservations.','Zacznij od pierwszego wrażenia albo zaproś tango do swojego tygodnia. Jedna lekcja lub pakiet. Bez automatycznej subskrypcji. Zakupy są demonstracyjne, nie są rzeczywistą rezerwacją.'),T('Packages & prices','Pakiety i ceny'))}<section class="section-sm"><div class="wrap"><div class="grid3">${[['ladies','trial',T('The first spark','Pierwsza iskra'),29,T('Tango Ladies · One introductory lesson','Tango dla kobiet · Jedna lekcja próbna'),T('A simple way to experience the class before choosing a package.','Prosty sposób na poznanie zajęć przed zakupem pakietu.')],['ladies','package',T('Your hour, each week','Twoja godzina co tydzień'),220,T('Tango Ladies · Four lessons','Tango dla kobiet · Cztery zajęcia'),T('Four class credits and a clear foundation pathway.','Cztery wejścia i jasna ścieżka podstawowa.')],['partnered','couple',T('Just the two of you','Tylko Wy dwoje'),440,T('Partnered tango · Four lessons per couple','Tango w parze · Cztery lekcje dla pary'),T('One package for two people. Both participants are registered together.','Jeden pakiet dla dwóch osób. Oboje zapisujecie się razem.')]].map(([id,pack,h,p,sub,desc],i)=>`<div class="card card-pad" style="${i===1?'border:1px solid var(--wine);box-shadow:var(--shadow)':''}"><span class="pill ${i===1?'dark':''}">${T('Published price','Cena opublikowana')}</span><h3 class="serif" style="margin:26px 0 18px">${h}</h3><div class="price" style="">${price(p)}</div><p class="small" style="margin-top:20px">${sub}</p><p class="small muted" style="margin:15px 0 25px">${desc}</p><button class="btn full ${i===1?'':'light'}" onclick="startBooking('${id}','${pack}')">${T('Choose this path','Wybierz tę ścieżkę')}${I('arrow')}</button></div>`).join('')}</div><div class="notice" style="margin-top:24px">${I('info')}<div>${T('Partnered individual packages: 4 lessons 260 PLN, 8 lessons 440 PLN. Couple packages: 4 lessons 440 PLN, 8 lessons 768 PLN. Solo applications require a confirmed suitable place before payment in this concept.','Pakiety indywidualne tanga w parze: 4 lekcje 260 PLN, 8 lekcji 440 PLN. Dla par: 4 lekcje 440 PLN, 8 lekcji 768 PLN. Zgłoszenia solo wymagają dopasowanego miejsca przed płatnością.')}</div></div><div class="callout"><div><h3>${T('Give someone a beautiful beginning.','Podaruj komuś piękny początek.')}</h3><p>${T('Explore the proposed digital gift-card experience.','Sprawdź proponowane cyfrowe karty podarunkowe.')}</p></div>${A('/gift',T('Explore gifts','Zobacz prezenty'),'gift','btn')}</div></div></section>`}
function guide(){return `${pageHead(T('Curiosity is<br><em>a beautiful start.</em>','Ciekawość to<br><em>piękny początek.</em>'),T('You do not need the right shoes, the perfect partner or a ready-made confidence. Let us answer the little questions, so you can look forward to the first step.','Nie potrzebujesz idealnych butów, wymarzonej pary ani gotowej pewności siebie. Odpowiemy na małe pytania, żeby łatwiej było cieszyć się pierwszym krokiem.'),T('The beginner’s guide','Przewodnik na start'))}<section class="section-sm"><div class="wrap"><div class="grid3">${[['first-class',T('Your first class, explained','Pierwsza lekcja krok po kroku'),T('From choosing what to wear to finding your way into the room.','Od wyboru stroju po wejście na salę.')],['solo-or-partnered',T('Solo or together?','Solo czy razem?'),T('Two different starting points. A class that fits your preference.','Różne początki. Zajęcia dopasowane do preferencji.')],['beyond-first-step',T('Keep your rhythm','Zachowaj rytm'),T('From an introduction to confident, consistent practice.','Od wprowadzenia do regularnej, swobodnej praktyki.')]].map(([id,h,p],i)=>`<a class="card card-pad" href="#/journal/${id}"><span class="label muted">0${i+1} · ${T('Beginner notes','Wskazówki na start')}</span><h3 style="margin:22px 0 16px">${h}</h3><p class="small muted">${p}</p><span class="text-link" style="margin-top:23px">${T('Read the guide','Przeczytaj')}${I('arrow')}</span></a>`).join('')}</div><div style="padding-top:55px">${faqs()}</div><div class="callout"><div><h3>${T('Curiosity is enough.','Ciekawość wystarczy.')}</h3><p>${T('Let us help you find a comfortable beginning.','Pomożemy Ci znaleźć dobry początek.')}</p></div><button class="btn" onclick="openQuiz()">${T('Find my class','Znajdź zajęcia')}${I('spark')}</button></div></div></section>`}
function journal(id){let d={ 'first-class':[T('What happens in your first tango class?','Jak wygląda pierwsza lekcja tanga?'),T('You do not need to arrive knowing how to dance. Arrive curious, with comfortable clothes and an open mind.','Nie musisz przychodzić z umiejętnością tańca. Wystarczy ciekawość, wygodny strój i otwartość.'),[[T('Before you leave home','Zanim wyjdziesz'),T('Check the venue, start time, teacher and class type in your confirmation. A solo class and a partnered class are different experiences. Ask about footwear, access or support needs before you travel.','Sprawdź adres, godzinę, instruktora i rodzaj zajęć w potwierdzeniu. Zajęcia solo i w parze to różne doświadczenia. Zapytaj wcześniej o obuwie, dostępność lub potrzebne wsparcie.')],[T('Let the first lesson be a first lesson','Pozwól pierwszej lekcji być pierwszą'),T('Try a small movement, listen, ask questions and take a pause when you need it. You are not expected to perform. In partnered work, communication and consent come before a movement.','Spróbuj prostego ruchu, słuchaj, pytaj i rób przerwy. Nikt nie oczekuje występu. W pracy w parze komunikacja i zgoda są ważniejsze niż ruch.')],[T('Leave knowing what happens next','Wyjdź z jasnym kolejnym krokiem'),T('Ask which class follows, when it happens and what the package includes. Your member area is designed to keep the next date, class credits and recommended practice in one place.','Zapytaj, jakie są kolejne zajęcia, kiedy się odbywają i co obejmuje pakiet. Panel kursanta zbiera następny termin, wejścia i polecaną praktykę.')]]], 'solo-or-partnered':[T('Solo or partnered: find your starting point.','Solo czy w parze: od czego zacząć?'),T('Choose based on the experience you want—not whether you already have a dance partner.','Wybierz doświadczenie, którego szukasz — nie tylko w zależności od tego, czy masz partnera.'),[[T('Tango Ladies: movement for yourself','Tango dla kobiet: ruch dla siebie'),T('This is a solo route that focuses on posture, balance, rhythm and expression. No partner matching is needed. A trial lesson lets you experience the format before choosing a package.','To ścieżka solo skupiona na postawie, równowadze, rytmie i ekspresji. Nie potrzebujesz dopasowanego partnera. Lekcja próbna pozwala poznać format.')],[T('Partnered tango: a shared conversation','Tango w parze: wspólna rozmowa'),T('Couples can book together. Individual applicants can indicate whether they prefer to lead, follow or explore either role. A request is not a guarantee that a compatible place is available.','Pary zapisują się razem. Osoby solo mogą wskazać prowadzenie, podążanie lub obie role. Zgłoszenie nie oznacza gwarancji dopasowanego miejsca.')],[T('Still unsure?','Nadal nie wiesz?'),T('Use the class finder, then speak with a teacher about your goals. You can move between suitable formats as your interests develop.','Skorzystaj z przewodnika i porozmawiaj z instruktorem o celach. Wraz z rozwojem zainteresowań możesz wybierać różne formaty.')]]], 'beyond-first-step':[T('After your first lesson, keep the rhythm.','Po pierwszej lekcji zostań w rytmie.'),T('Progress is easier to notice when the next step is clear and the routine is realistic.','Łatwiej dostrzec postępy, gdy kolejny krok jest jasny, a rytm ćwiczeń realistyczny.'),[[T('Find a time you can return to','Znajdź porę, do której możesz wracać'),T('Choose a suitable recurring slot instead of a schedule that only works once. Confirm how class credits and missed sessions are handled before purchasing a package.','Wybierz powtarzalną porę zamiast terminu, który pasuje tylko raz. Przed zakupem sprawdź zasady wejść i nieobecności.')],[T('Notice the small changes','Dostrzegaj małe zmiany'),T('A more comfortable walk, an easier connection to music or a clearer question are all useful things to discuss with your teacher. Progress is individual, not a race through fixed milestones.','Swobodniejsze chodzenie, lepszy kontakt z muzyką czy trafniejsze pytanie to tematy do rozmowy z instruktorem. Postęp jest indywidualny, a nie wyścigiem.')],[T('Give practice a place','Zrób miejsce na praktykę'),T('A supported practice is a place to revisit what you learned and meet other people. Try one that matches your level, and ask the host how newcomers are welcomed.','Praktyka ze wsparciem pozwala powtórzyć materiał i poznać ludzi. Wybierz poziom dla siebie i zapytaj, jak przyjmowane są nowe osoby.')]]]}[id];if(!d)return notFound();return `<article class="article"><a href="#/guide" class="text-link">${I('arrow')} ${T('All guides','Wszystkie poradniki')}</a><div class="eyebrow" style="margin-top:33px">${T('AuraTango · Beginner notes','AuraTango · Wskazówki na start')}</div><h1>${d[0]}</h1><p class="article-intro">${d[1]}</p>${d[2].map(([h,p])=>`<h2>${h}</h2><p>${p}</p>`).join('')}<div class="callout" style="display:block"><h3>${T('Your next step can be simple.','Twój kolejny krok może być prosty.')}</h3><button class="btn" style="margin-top:19px" onclick="openQuiz()">${T('Find my class','Znajdź moje zajęcia')}${I('arrow')}</button></div></article>`}
function contact(){return `${pageHead(T('Your first question<br><em>is welcome.</em>','Na Twoje pytania<br><em>jest tu miejsce.</em>'),T('Find our publicly listed Warsaw locations or leave a demonstration enquiry. Class dates and exact access arrangements need studio confirmation.','Sprawdź publicznie wymienione lokalizacje w Warszawie lub wypróbuj formularz. Daty i szczegóły wejścia wymagają potwierdzenia.'),T('Locations & contact','Lokalizacje i kontakt'))}<section class="section-sm"><div class="wrap"><div class="grid2"><div><div class="map-art"><div class="map-road"></div><div class="map-road b"></div><button class="map-pin" style="top:34%;left:23%" onclick="locationInfo('solec')">${I('pin')}Solec</button><button class="map-pin" style="top:57%;left:61%" onclick="locationInfo('goclaw')">${I('pin')}Gocław</button><div class="map-label">${T('Illustrative location diagram · not to scale','Schemat orientacyjny · bez skali')}</div></div><div class="grid2" style="gap:15px;margin-top:20px">${Object.entries(locations).map(([k,l])=>`<div class="card card-pad" style="padding:20px"><h3 style="">${l.name}</h3><p class="small muted" style="margin:10px 0 17px">${l.address}</p><button class="text-link" onclick="locationInfo('${k}')">${T('Plan your visit','Zaplanuj wizytę')}${I('up')}</button></div>`).join('')}</div></div><div class="card card-pad"><div class="eyebrow">${T('Let’s start a conversation','Zacznijmy rozmowę')}</div><h2 style="margin-bottom:22px">${T('Let’s start<br><em>with a conversation.</em>','Zacznijmy<br><em>od rozmowy.</em>')}</h2><form onsubmit="contactSubmit(event)"><div class="form-grid"><div class="field"><label>${T('Your name','Imię')}</label><input required name="name" autocomplete="off" placeholder="${T('Use a sample name','Użyj przykładowego imienia')}"></div><div class="field"><label>Email</label><input type="email" required name="email" autocomplete="off" placeholder="demo@example.com"></div></div><div class="field" style="margin-top:17px"><label>${T('I’m interested in','Interesuje mnie')}</label><select name="interest"><option>Tango Ladies</option><option>${T('Partnered tango','Tango w parze')}</option><option>${T('Private lessons','Lekcje indywidualne')}</option><option>${T('Events & partnerships','Wydarzenia i partnerstwa')}</option></select></div><div class="field"><label>${T('Your question','Twoje pytanie')}</label><textarea required name="message" placeholder="${T('A sample enquiry is enough for the demo.','Do wersji demo wystarczy przykładowe pytanie.')}"></textarea></div><button class="btn full" type="submit">${T('Preview enquiry submission','Wypróbuj wysłanie zapytania')}${I('arrow')}</button><p class="banner-small">${T('Nothing is sent. Do not enter sensitive information.','Nic nie jest wysyłane. Nie wpisuj danych wrażliwych.')}</p></form></div></div></div></section>`}
function gift(){return `${pageHead(T('Give a feeling.<br><em>Not another thing.</em>','Podaruj emocje.<br><em>Nie kolejną rzecz.</em>'),T('A proposed digital gift-card experience. Choose a value and a message, then try the simulated checkout.','Proponowana cyfrowa karta podarunkowa. Wybierz wartość, dodaj wiadomość i wypróbuj płatność.'),T('The gift of tango','Tango w prezencie'))}<section class="section-sm"><div class="wrap grid2"><div><div class="gift-art"><div class="flex between">${logo()}<small>DIGITAL GIFT · DEMO</small></div><div class="display">${T('A little time.<br><em>Just for you.</em>','Trochę czasu.<br><em>Tylko dla Ciebie.</em>')}</div><div class="flex between"><span class="gift-value" id="gift-preview">220 PLN</span><small>AURATANGO · WARSAW</small></div></div><div class="notice" style="margin-top:24px">${I('info')}<div>${T('Gift values and redemption are a concept. Expiry, refunds, delivery and usage terms need approval. No gift card bought here has monetary value.','Wartości i realizacja są koncepcją. Ważność, zwroty, dostawa i warunki wymagają zatwierdzenia. Karty demo nie mają wartości pieniężnej.')}</div></div></div><div class="card card-pad"><h3 style="margin-bottom:24px">${T('Make it personal','Dodaj coś od siebie')}</h3><form onsubmit="startGift(event)"><div class="field"><label>${T('Gift amount','Wartość karty')}</label><select name="amount" onchange="document.getElementById('gift-preview').textContent=this.value+' PLN'"><option value="100">100 PLN</option><option value="220" selected>220 PLN</option><option value="440">440 PLN</option></select></div><div class="field"><label>${T('Recipient’s first name (sample)','Imię odbiorcy (przykład)')}</label><input required name="recipient" placeholder="Alex"></div><div class="field"><label>${T('A little note','Kilka słów')}</label><textarea name="note" maxlength="200" placeholder="${T('Here is a little time, just for you.','Oto trochę czasu tylko dla Ciebie.')}"></textarea></div><button class="btn full" type="submit">${T('Preview gift checkout','Przejdź do zakupu demo')}${I('gift')}</button></form></div></div></section>`}
function notFound(){return `${pageHead(T('A small detour.','Mały objazd.'),T('That page is not part of this concept. Let us find your way back.','Ta strona nie jest częścią koncepcji. Wróćmy na właściwą drogę.'))}<div class="wrap section-sm">${A('/',T('Back to AuraTango','Wróć do AuraTango'))}</div>`}
function optionsFor(c){if(c.kind==='gift'||c.kind==='event')return [];if(c.id==='ladies')return[{key:'trial',title:T('First lesson','Lekcja próbna'),sub:T('One introduction · 60 minutes','Jedno wprowadzenie · 60 minut'),total:29,credits:1},{key:'package',title:T('4-class foundation','Pakiet 4 zajęć'),sub:T('One place per lesson · no automatic renewal','Jedno miejsce na zajęcia · bez automatycznego odnowienia'),total:220,credits:4}];if(c.id==='partnered'){let solo=c.party==='solo';return[{key:'four',title:T('4-class foundation','Pakiet 4 lekcji'),sub:solo?T('Per person · matching required','Za osobę · wymagane dopasowanie'):T('One package for two people','Jeden pakiet dla dwóch osób'),total:solo?260:440,credits:4},{key:'eight',title:T('8-class foundation','Pakiet 8 lekcji'),sub:solo?T('Per person · matching required','Za osobę · wymagane dopasowanie'):T('One package for two people','Jeden pakiet dla dwóch osób'),total:solo?440:768,credits:8}]}return[{key:'single',title:txt(classes[c.id].name),sub:T('One session · proposed demo price','Jedno spotkanie · proponowana cena demo'),total:classes[c.id].price,credits:1}]}
function updateCart(){let c=state.cart;if(!c)return;if(c.kind==='class'){let opts=optionsFor(c);let opt=opts.find(o=>o.key===c.pack)||opts[0];c.pack=opt.key;c.unit=opt.total;c.total=opt.total;c.credits=opt.credits;c.packageLabel=opt.title;c.people=c.id==='partnered'&&c.party==='couple'?2:1;c.name=txt(classes[c.id].name)}else if(c.kind==='event'){let e=events.find(e=>e.id===c.id);c.name=txt(e.name);c.total=c.unit*c.people}else c.name=T('Digital gift card','Cyfrowa karta podarunkowa')}
function startBooking(id,pack){const c=classes[id];state.cart={kind:'class',id,party:id==='partnered'?'couple':'solo',pack:id==='partnered'?(pack==='eight'?'eight':'four'):(pack||'trial'),date:c.date,time:c.time,location:c.location,people:1,duration:c.duration,source:state.attribution||'Website concept'};state.checkoutStep=0;state.checkoutDraft={};state.payment='blik';updateCart();closeModal();navigate('/book/'+id)}
function bookSlot(id,date,time,loc,seats){if(!seats){waitlistModal(id,{date,time,location:loc});return}if(state.member&&id==='ladies'&&state.credits>0){memberReserveModal(id,date,time,loc);return}startBooking(id);Object.assign(state.cart,{date,time,location:loc});render()}
function startEvent(id){let e=events.find(e=>e.id===id);state.cart={kind:'event',id,name:txt(e.name),unit:e.price,total:e.price,people:1,date:e.date,time:e.time,duration:e.duration,location:e.confirmedVenue?'solec':'partner',source:'Event concept',packageLabel:T('Event entry','Wejście na wydarzenie')};state.checkoutStep=0;state.checkoutDraft={};navigate('/book/event-'+id)}
function startGift(event){event.preventDefault();let f=new FormData(event.target);state.cart={kind:'gift',id:'gift',name:T('Digital gift card','Cyfrowa karta podarunkowa'),unit:Number(f.get('amount')),total:Number(f.get('amount')),people:1,recipient:String(f.get('recipient')),note:String(f.get('note')),packageLabel:T('Demonstration gift card','Demonstracyjna karta podarunkowa')};state.checkoutStep=1;state.checkoutDraft={};navigate('/book/gift')}
function cartSlots(){let c=state.cart;let ss=scheduleData().filter(s=>s.id===c.id&&s.seats>0);if(!ss.some(s=>s.date===c.date&&s.time===c.time&&s.location===c.location))ss.unshift({id:c.id,date:c.date,time:c.time,location:c.location,seats:4,language:'PL / EN'});return ss}
function chooseSlot(v){let [date,time,location]=v.split('|');Object.assign(state.cart,{date,time,location});render()}
function summary(){let c=state.cart;return `<aside class="card order-summary">${c.kind!=='gift'?`<div class="summary-photo">${c.kind==='event'?`<div class="event-art ${events.find(e=>e.id===c.id).color}" style="height:150px"><div class="poster-title" style="">${txt(events.find(e=>e.id===c.id).poster)}</div></div>`:photo(classes[c.id].photo,'',c.name)}</div>`:''}<span class="label muted">${T('Your first step','Twój pierwszy krok')}</span><h3 style="margin-top:12px;">${ESC(c.name)}</h3><p class="small muted" style="margin-top:7px">${ESC(c.packageLabel||'')}</p><hr class="rule">${c.date?`<div class="summary-line"><span>${T('When','Kiedy')}</span><strong>${dateLabel(c.date)} · ${c.time}</strong></div><div class="summary-line"><span>${T('Where','Gdzie')}</span><span>${locations[c.location]?.name||T('Partner venue · TBC','Miejsce partnerskie · do ustalenia')}</span></div>`:''}<div class="summary-line"><span>${c.kind==='gift'?T('Gift value','Wartość karty'):T('Participants','Uczestnicy')}</span><span>${c.kind==='gift'?money(c.total):c.people}</span></div><div class="summary-line"><span>${T('Additional charges','Dodatkowe opłaty')}</span><span>0 PLN</span></div><div class="summary-total"><span>${T('Demo total','Suma demo')}</span><span>${money(c.total)}</span></div><div class="notice" style="margin-top:20px;padding:12px;">${I('shield')}<span>${T('No live charge. All commercial details and availability need final approval.','Bez prawdziwego obciążenia. Warunki i dostępność wymagają zatwierdzenia.')}</span></div><button class="text-link" style="margin-top:17px;" onclick="showPolicy('terms')">${T('Read the demonstration conditions','Warunki demonstracyjne')}${I('up')}</button></aside>`}
function checkout(){if(!state.cart){return `${pageHead(T('Let’s find your beginning.','Znajdźmy Twój początek.'),T('Choose a class or an event to start a sample booking.','Wybierz zajęcia lub wydarzenie, aby rozpocząć rezerwację demo.'))}<section class="section-sm"><div class="wrap">${A('/classes',T('Explore classes','Zobacz zajęcia'))}</div></section>`}updateCart();let c=state.cart,s=state.checkoutStep;let content='';if(s===0){content=`<h2>${T('Make it your kind<br>of <em>beginning.</em>','Niech to będzie<br><em>Twój początek.</em>')}</h2><p>${T('Choose the experience and a sample date.','Wybierz doświadczenie i przykładowy termin.')}</p>${c.kind==='class'?`${c.id==='partnered'?`<label>${T('How are you joining?','Jak dołączasz?')}</label><div class="grid2" style="gap:10px;margin-bottom:22px">${[['couple',T('As a couple','Jako para'),T('2 people · book together','2 osoby · wspólny zapis')],['solo',T('On my own','Samodzielnie'),T('Request a matched place','Zgłoszenie do dopasowania')]].map(([v,h,p])=>`<button class="select-card ${c.party===v?'selected':''}" onclick="state.cart.party='${v}';updateCart();render()"><span class="radio"></span><div><h4>${h}</h4><p>${p}</p></div></button>`).join('')}</div>`:''}<label>${T('Your option','Twój wariant')}</label><div class="stack" style="gap:11px;margin-bottom:23px">${optionsFor(c).map(o=>`<button class="select-card ${o.key===c.pack?'selected':''}" onclick="state.cart.pack='${o.key}';updateCart();render()"><span class="radio"></span><div><h4>${o.title}</h4><p>${o.sub}</p></div><span class="price-mini">${money(o.total)}</span></button>`).join('')}</div><div class="field"><label>${T('First session · sample availability','Pierwsze zajęcia · dostępność przykładowa')}</label><select id="booking-slot" onchange="chooseSlot(this.value)">${cartSlots().map(slot=>`<option value="${slot.date}|${slot.time}|${slot.location}" ${slot.date===c.date&&slot.time===c.time&&slot.location===c.location?'selected':''}>${dateLabel(slot.date)} · ${slot.time} · ${locations[slot.location].name} · ${slot.language} (${T('demo','demo')})</option>`).join('')}</select></div>${c.id==='partnered'&&c.party==='solo'?`<div class="field"><label>${T('Your preferred dance role','Preferowana rola')}</label><select id="solo-role" onchange="state.cart.role=this.value"><option value="either">${T('Either / let’s discuss','Dowolna / do omówienia')}</option value="lead">${T('Lead','Prowadzenie')}</option><option value="follow">${T('Follow','Podążanie')}</option></select></div><div class="notice">${I('users')}<span>${T('A suitable partner is not guaranteed. Join the demonstration waiting list first; no payment is requested.','Nie gwarantujemy dopasowania. Najpierw dołącz do demonstracyjnej listy oczekujących — bez płatności.')}</span></div>`:`<div class="notice">${I('calendar')}<span>${T('The first session is selected above. Remaining package lessons are managed in your student area; no automatic renewal.','Pierwsze zajęcia wybrano powyżej. Pozostałe wejścia obsłużysz w panelu kursanta; bez automatycznego odnowienia.')}</span></div>`}`:c.kind==='event'?`<div class="field"><label>${T('Number of guests','Liczba gości')}</label><select onchange="state.cart.people=Number(this.value);updateCart();render()">${[1,2,3,4].map(n=>`<option value="${n}" ${c.people===n?'selected':''}>${n} ${T('guest(s)','osób')}</option>`).join('')}</select></div><div class="notice">${I('info')}<span>${T('This event is a proposal, not a confirmed partnership or public booking. The checkout below is a demonstration only.','To propozycja wydarzenia, nie potwierdzona współpraca ani rezerwacja publiczna. Poniżej wyłącznie demonstracja zakupu.')}</span></div>`:''}<button class="btn full" style="margin-top:26px" onclick="bookingNext()">${c.kind==='class'&&c.id==='partnered'&&c.party==='solo'?T('Request a matched place','Poproś o dopasowane miejsce'):T('Continue to your details','Przejdź do danych')}${I('arrow')}</button>`}else if(s===1){let d=state.checkoutDraft;content=`<h2>${T('A little about <em>you.</em>','Kilka słów o <em>Tobie.</em>')}</h2><p>${T('Use sample details to explore the flow. Nothing is sent to AuraTango.','Użyj przykładowych danych. Nic nie jest wysyłane do AuraTango.')}</p><form id="details-form" onsubmit="submitDetails(event)"><div class="form-grid"><div class="field"><label for="first-name">${T('First name','Imię')} *</label><input id="first-name" name="name" required maxlength="60" value="${ESC(d.name||'')}" placeholder="Alex" autocomplete="off"></div><div class="field"><label for="last-name">${T('Last name','Nazwisko')} *</label><input id="last-name" name="surname" required maxlength="60" value="${ESC(d.surname||'')}" placeholder="Example" autocomplete="off"></div></div><div class="field" style="margin-top:17px"><label for="book-email">Email *</label><input id="book-email" name="email" type="email" required value="${ESC(d.email||'')}" placeholder="demo@example.com" autocomplete="off"></div>${c.kind==='class'&&c.people===2?`<div class="field"><label>${T('Partner’s first name','Imię partnera / partnerki')} *</label><input name="partner" required placeholder="Sam" value="${ESC(d.partner||'')}"></div>`:''}<div class="field"><label>${T('How did you find us?','Jak do nas trafiasz?')}</label><select name="source">${[T('Website / search','Strona / wyszukiwarka'),'Instagram',T('Café or club event','Wydarzenie w kawiarni / klubie'),T('Street pop-up','Miejski pop-up'),T('A friend / referral','Znajomy / polecenie')].map(v=>`<option ${d.source===v?'selected':''}>${v}</option>`).join('')}</select></div><label class="checkline"><input type="checkbox" required name="terms" ${d.terms?'checked':''}><span>${T('I understand this is a simulated booking with no live payment or reservation.','Rozumiem, że to rezerwacja symulowana, bez prawdziwej płatności i rezerwacji.')} <button type="button" class="text-link" style="" onclick="showPolicy('terms')">${T('View demo conditions','Warunki demo')}</button></span></label><label class="checkline"><input type="checkbox" name="marketing" ${d.marketing?'checked':''}><span>${T('Optional: demonstrate opting into class and event updates. No messages will be sent.','Opcjonalnie: demonstracja zgody na wiadomości o zajęciach i wydarzeniach. Nic nie zostanie wysłane.')}</span></label><div class="flex" style="margin-top:26px"><button type="button" class="btn light" onclick="saveDraft();state.checkoutStep=0;render()">${T('Back','Wstecz')}</button><button class="btn" style="flex:1" type="submit">${T('Review & payment','Podsumowanie i płatność')}${I('arrow')}</button></div></form>`}else{content=`<h2>${T('One step<br><em>closer.</em>','O krok<br><em>bliżej.</em>')}</h2><p>${T('This is a payment simulation. Do not enter card numbers, banking codes or real payment information.','To symulacja płatności. Nie wpisuj numeru karty, kodu bankowego ani prawdziwych danych płatniczych.')}</p><div class="notice" style="margin-bottom:23px">${I('shield')}<span>${T('The real site would hand payment to a licensed provider. This HTML never connects to a payment service.','Prawdziwa strona przekieruje do dostawcy płatności. Ten plik HTML nie łączy się z żadnym serwisem płatniczym.')}</span></div>${c.total>0?`<label>${T('Choose a demonstration payment method','Wybierz demonstracyjną metodę płatności')}</label><div class="stack" style="gap:10px">${[['blik','BLIK',T('Simulate a BLIK payment','Symuluj płatność BLIK')],['card',T('Payment card','Karta płatnicza'),T('No card information required','Bez danych karty')],['wallet','Apple Pay / Google Pay',T('Wallet simulation only','Wyłącznie symulacja portfela')]].map(([v,l,desc])=>`<button class="select-card ${state.payment===v?'selected':''}" onclick="state.payment='${v}';render()"><span class="radio"></span><div><h4>${l}</h4><p>${desc}</p></div>${I(v==='card'?'card':'lock')}</button>`).join('')}</div>`:`<div class="notice">${I('ticket')}<span>${T('This is a free demonstration registration. No payment is needed.','To bezpłatny zapis demonstracyjny. Płatność nie jest potrzebna.')}</span></div>`}<div class="field" style="margin-top:23px"><label>${T('Test payment outcome','Przetestuj wynik płatności')}</label><select id="payment-outcome"><option value="success">${T('Success → booking confirmation','Sukces → potwierdzenie')}</option><option value="failure">${T('Declined → retry safely','Odrzucona → bezpieczna próba ponownie')}</option></select></div><p id="payment-error" class="error" aria-live="polite"></p><div class="flex" style="margin-top:24px"><button class="btn light" onclick="state.checkoutStep=1;render()">${T('Back','Wstecz')}</button><button class="btn" style="flex:1" id="pay-btn" onclick="payDemo()">${c.total?T('Simulate payment','Symuluj płatność'):T('Confirm demo registration','Potwierdź zapis demo')}${I('check')}</button></div><p class="banner-small">${T('Your chosen method will not be charged. A downloadable demo confirmation follows.','Wybrana metoda nie zostanie obciążona. Potem pobierzesz potwierdzenie demo.')}</p>`}return `<div class="booking-shell"><div class="breadcrumb"><a href="#/classes">${T('Classes & experiences','Zajęcia i wydarzenia')}</a>${I('chevron')}<span>${T('Your booking','Twoja rezerwacja')}</span></div><div class="checkout-steps">${[T('Experience','Wybór'),T('Your details','Dane'),T('Payment','Płatność'),T('You’re in','Gotowe')].map((v,i)=>`<div class="checkout-step ${i===s?'active':i<s?'done':''}"><span>${i<s?'✓':i+1}</span>${v}</div>`).join('')}</div><div class="checkout-grid"><div class="card checkout-main">${content}</div>${summary()}</div></div>`}
function bookingNext(){if(state.cart.id==='partnered'&&state.cart.party==='solo'){waitlistModal('partnered',{date:state.cart.date,time:state.cart.time,location:state.cart.location,role:state.cart.role});return}state.checkoutStep=1;render();window.scrollTo({top:0,behavior:'smooth'})}
function saveDraft(){let f=document.getElementById('details-form');if(f){let d=new FormData(f);state.checkoutDraft=Object.fromEntries(d);state.checkoutDraft.terms=d.has('terms');state.checkoutDraft.marketing=d.has('marketing')}}
function submitDetails(event){event.preventDefault();saveDraft();state.checkoutStep=2;render();window.scrollTo({top:0,behavior:'smooth'})}
let paying=false;
function payDemo(){if(paying)return;const btn=document.getElementById('pay-btn');if(document.getElementById('payment-outcome').value==='failure'){document.getElementById('payment-error').textContent=T('Demo payment declined. No booking or credit was created. Select Success to retry.','Płatność demo odrzucona. Nie utworzono rezerwacji ani wejść. Wybierz Sukces, aby spróbować ponownie.');return}paying=true;btn.disabled=true;btn.textContent=T('Confirming demo booking…','Potwierdzanie rezerwacji demo…');setTimeout(()=>{let c=state.cart;const id='AT-'+String(Date.now()).slice(-7);const order={id,kind:c.kind,classId:c.kind==='class'?c.id:null,eventId:c.kind==='event'?c.id:null,name:c.name,packageLabel:c.packageLabel,total:c.total,people:c.people,date:c.date||null,time:c.time||null,location:c.location||null,duration:c.duration||60,credits:c.credits||0,method:state.payment,status:'demo-confirmed',created:new Date().toISOString()};state.orders.unshift(order);state.lastOrder=order;state.member=true;let dup=state.bookings.find(b=>b.classId===c.id&&b.date===c.date&&b.time===c.time&&b.status==='confirmed');if(c.kind==='class'){if(c.id==='ladies'&&c.credits>1){state.credits+=c.credits;if(!dup)state.credits--}if(!dup)state.bookings.push({id:order.id,classId:c.id,date:c.date,time:c.time,location:c.location,duration:c.duration,status:'confirmed',usedCredit:c.id==='ladies'&&c.credits>1})}else if(c.kind==='event'){state.bookings.push({id:order.id,eventId:c.id,date:c.date,time:c.time,location:c.location,duration:c.duration,status:'confirmed',usedCredit:false})}state.leads.unshift({name:'Demo buyer '+String(state.orders.length).padStart(2,'0'),source:state.checkoutDraft.source||c.source||'Website concept',interest:c.name,status:'Package purchased'});persist();paying=false;state.cart=null;state.checkoutDraft={};navigate('/confirmation')},600)}
function confirmation(){let o=state.lastOrder||state.orders[0];if(!o)return notFound();return `<div class="success-card card"><div class="success-icon">${I('check')}</div><div class="eyebrow" style="justify-content:center">${T('Demonstration confirmed','Potwierdzenie demonstracyjne')}</div><h1>${o.kind==='gift'?T('A beautiful<br><em>beginning to give.</em>','Piękny początek<br><em>do podarowania.</em>'):T('Your first yes.<br><em>A lovely beginning.</em>','Twoje pierwsze tak.<br><em>Piękny początek.</em>')}</h1><p class="muted" style="margin-top:22px">${T('The flow is complete. No money was taken, no email was sent and no live place was reserved.','Proces zakończony. Nie pobrano pieniędzy, nie wysłano e-maila i nie zarezerwowano rzeczywistego miejsca.')}</p><div class="ticket"><div class="flex between"><span class="label muted">${T('Demo confirmation','Potwierdzenie demo')}</span><span class="pill green">${T('Confirmed · demo','Potwierdzono · demo')}</span></div><h3 style="margin-top:17px">${ESC(o.name)}</h3>${o.date?`<p class="small muted" style="margin-top:9px">${dateLabel(o.date,{day:'numeric',month:'long',year:'numeric'})} · ${o.time} · ${locations[o.location]?.address||T('Partner venue to be confirmed','Miejsce partnerskie do ustalenia')}</p>`:''}<hr class="rule"><div class="flex between"><div class="ticket-code">${o.id}</div><strong>${money(o.total)}</strong></div></div><div class="buttons">${o.date?`<button class="btn light" onclick="downloadCalendar('${o.id}')">${I('calendar')}${T('Add to calendar','Dodaj do kalendarza')}</button>`:''}<button class="btn light" onclick="downloadReceipt('${o.id}')">${I('download')}${T('Demo confirmation','Potwierdzenie demo')}</button>${A('/member',T('Go to my studio','Przejdź do mojego konta'),'arrow')}</div><div class="notice" style="text-align:left;margin-top:27px">${I('heart')}<span>${T('Your next step: review your classes, try a reschedule, explore your progress or invite a friend from your member area.','Kolejny krok: sprawdź zajęcia, zmień termin, poznaj postępy lub zaproś znajomą osobę w panelu kursanta.')}</span></div></div>`}
function login(){return `<section class="section"><div class="wrap"><div class="grid2" style="max-width:970px;margin:auto;gap:55px;align-items:center"><div><div class="eyebrow">${T('Your tango, in one place','Twoje tango w jednym miejscu')}</div><h1 style="">${T('Welcome back.<br><em>This part is yours.</em>','Witaj z powrotem.<br><em>To Twoje miejsce.</em>')}</h1><p class="lead" style="margin-top:25px">${T('The next song. The next small breakthrough. Your classes, your progress and your people—all a little closer.','Kolejna melodia. Kolejne małe odkrycie. Twoje zajęcia, postępy i ludzie — wszystko trochę bliżej.')}</p><div class="feature-grid">${[['calendar',T('Easy booking','Proste rezerwacje')],['ticket',T('Class credits','Twoje wejścia')],['book',T('Your progress','Twoje postępy')],['users',T('Your community','Społeczność')]].map(([i,t])=>`<div class="feature">${I(i)}${t}</div>`).join('')}</div></div><div class="card card-pad"><span class="pill peach">${T('Demo sign-in · no authentication','Logowanie demo · bez uwierzytelnienia')}</span><h3 style="margin:24px 0">${T('Welcome to your studio.','Witaj w swoim studiu.')}</h3><form onsubmit="event.preventDefault();enterMember()"><div class="field"><label>${T('Sample email address','Przykładowy adres e-mail')}</label><input type="email" required placeholder="demo@example.com" autocomplete="off"></div><button class="btn full" type="submit">${T('Enter member demo','Otwórz panel demonstracyjny')}${I('arrow')}</button></form><p class="banner-small">${T('This opens a sample account. No password, verification email or real account is created. Do not use this as production authentication.','Otwiera przykładowe konto. Bez hasła, e-maila weryfikacyjnego i prawdziwego konta. To nie jest uwierzytelnianie produkcyjne.')}</p><hr class="rule"><button class="btn light full" onclick="openQuiz()">${T('New here? Find your first class','Pierwszy raz? Znajdź swoje zajęcia')}</button></div></div></div></section>`}
function enterMember(){state.member=true;persist();closeModal();navigate('/member')}
function memberShell(tab){if(!state.member)return login();const nav=[['','grid',T('Overview','Przegląd')],['classes','calendar',T('My classes','Moje zajęcia')],['progress','book',T('My progress','Moje postępy')],['community','users',T('Community','Społeczność')],['account','settings',T('Account & orders','Konto i zamówienia')]];return `<div class="wrap account-layout"><aside class="sidebar"><div class="profile flex"><div class="avatar">A</div><div><h4 style="">Alex · ${T('Demo member','Kursant demo')}</h4><p class="micro muted">${T('Your tango space','Twoja przestrzeń tanga')}</p></div></div><nav aria-label="Member navigation">${nav.map(([v,i,l])=>`<a class="${tab===v?'active':''}" href="#/member${v?'/'+v:''}">${I(i)}${l}</a>`).join('')}</nav><div class="side-bottom" style="padding:20px 10px 5px"><span class="pill peach">${T('Sample account','Konto przykładowe')}</span><button class="text-link" style="margin-top:20px" onclick="state.member=false;persist();navigate('/')">${I('logout')}${T('Exit member demo','Wyjdź z panelu')}</button></div></aside><div class="account-main">${tab==='classes'?memberClasses():tab==='progress'?memberProgress():tab==='community'?memberCommunity():tab==='account'?memberAccount():memberHome()}</div></div>`}
function bookingName(b){return b.classId?txt(classes[b.classId].name):txt(events.find(e=>e.id===b.eventId)?.name||T('Event','Wydarzenie'))}
function bookingList(list,actions=true){return list.length?list.map(b=>`<div class="list-row"><div class="date-box">${new Date(b.date+'T12:00:00').getDate()}<small>${dateLabel(b.date,{month:'short'})}</small></div><div><h4>${bookingName(b)}</h4><p>${b.time} · ${locations[b.location]?.name||T('Partner venue · TBC','Miejsce do ustalenia')} · ${b.status==='cancelled'?T('Cancelled','Anulowano'):T('Confirmed · demo','Potwierdzono · demo')}</p></div>${actions&&b.status==='confirmed'?`<div class="actions"><button class="btn light sm" onclick="rescheduleModal('${b.id}')">${T('Reschedule','Zmień termin')}</button><button class="round-button" onclick="bookingDetails('${b.id}')" aria-label="Booking details" style="width:35px;height:35px">${I('chevron')}</button></div>`:''}</div>`).join(''):`<div class="empty">${T('No bookings yet. Choose a class to start.','Brak rezerwacji. Wybierz zajęcia na początek.')}</div>`}
function memberHome(){let next=state.bookings.filter(b=>b.status==='confirmed').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return `<div class="account-head"><div><div class="eyebrow">${T('Your studio · Member preview','Twoje studio · Podgląd kursanta')}</div><h1>${T('Good to see you, Alex.<br><em>Your rhythm is here.</em>','Dobrze Cię widzieć, Alex.<br><em>Tu jest Twój rytm.</em>')}</h1></div><span class="pill peach">${T('Illustrative account','Konto ilustracyjne')}</span></div><div class="member-hero"><div><span class="label" style="color:#c3d3a9">${T('A little something to look forward to','Coś, na co warto czekać')}</span><h2 style="margin-top:13px">${next?bookingName(next):T('There is room for your next step.','Jest miejsce na Twój kolejny krok.')}</h2><p>${next?`${dateLabel(next.date)} · ${next.time} · ${locations[next.location]?.name||T('Partner venue','Miejsce partnerskie')}`:T('Explore a suitable class to begin.','Wybierz odpowiednie zajęcia na początek.')}</p>${next?`<button class="btn sm" onclick="bookingDetails('${next.id}')">${T('View my booking','Zobacz rezerwację')}${I('arrow')}</button>`:A('/classes',T('Explore classes','Zobacz zajęcia'),'arrow','btn sm')}</div><div class="big-script">tango.</div></div><div class="stats"><div class="stat">${I('ticket')}<div class="value">${state.credits}</div><div class="name">${T('Ladies credits left','Pozostałe wejścia Ladies')}</div><div class="micro muted">${T('Demo balance','Saldo demo')}</div></div><div class="stat">${I('calendar')}<div class="value">${state.bookings.filter(b=>b.status==='confirmed').length}</div><div class="name">${T('Upcoming bookings','Nadchodzące rezerwacje')}</div><div class="micro muted">${T('Sample programme','Przykładowy program')}</div></div><div class="stat">${I('book')}<div class="value">02<span style="color:var(--muted)"> / 04</span></div><div class="name">${T('Foundation lessons','Lekcje podstawowe')}</div><div class="micro muted">${T('Illustrative progress','Postęp ilustracyjny')}</div></div></div><div class="grid2"><div class="card dashboard-card"><div class="flex between"><h3>${T('Coming up','Wkrótce')}</h3>${A('/member/classes',T('View all','Wszystkie'),'','text-link')}</div>${bookingList(state.bookings.filter(b=>b.status==='confirmed').slice(0,2),false)}</div><div class="card dashboard-card" style="background:#e8eddd"><span class="label muted">${T('A thoughtful next step','Przemyślany kolejny krok')}</span><h3 class="serif" style="margin:18px 0 14px">${T('Make practice<br><em>part of your week.</em>','Niech praktyka<br><em>stanie się częścią tygodnia.</em>')}</h3><p class="small muted">${T('A supported Sunday session to revisit your first steps and meet your community.','Niedzielna praktyka ze wsparciem, powtórką pierwszych kroków i spotkaniem ze społecznością.')}</p>${A('/event/sunday-practice',T('Explore practice','Zobacz praktykę'),'arrow','text-link')}</div></div><div class="callout"><div><h3>${T('Good feelings are worth sharing.','Dobrymi emocjami warto się dzielić.')}</h3><p>${T('Share your demo invitation from the community area.','Udostępnij zaproszenie demo z panelu społeczności.')}</p></div>${A('/member/community',T('Invite a friend','Zaproś znajomych'),'users','btn')}</div>`}
function memberClasses(){return `<div class="account-head"><div><div class="eyebrow">${T('A little structure. More dancing.','Trochę porządku. Więcej tańca.')}</div><h1>${T('My <em>classes.</em>','Moje <em>zajęcia.</em>')}</h1><p>${T('Review, reschedule or cancel your demonstration bookings.','Sprawdź, zmień lub odwołaj demonstracyjne rezerwacje.')}</p></div>${A('/timetable',T('Book a class','Zarezerwuj'),'calendar','btn sm')}</div><div class="notice" style="margin-bottom:22px">${I('ticket')}<span>${T('You have','Masz')} <strong>${state.credits}</strong> ${T('sample Ladies credits. A credit is only restored when cancelling a booking that actually used one. Other purchases remain visible in Orders.','przykładowych wejść Ladies. Wejście wraca tylko przy anulowaniu rezerwacji, która je wykorzystała. Pozostałe zakupy są widoczne w zamówieniach.')}</span></div><div class="card dashboard-card"><h3>${T('Upcoming & changed bookings','Nadchodzące i zmienione rezerwacje')}</h3>${bookingList(state.bookings)}</div><div class="card dashboard-card" style="margin-top:23px"><h3>${T('Continue your foundation','Kontynuuj podstawy')}</h3><p class="small muted" style="margin:14px 0 20px">${T('Choose another four Ladies classes when you are ready. This is a one-time demo purchase, not an automatic renewal.','Wybierz kolejne cztery zajęcia Ladies, gdy będziesz gotowa. To jednorazowy zakup demo, nie automatyczne odnowienie.')}</p><button class="btn" onclick="startBooking('ladies','package')">${T('Add a 4-class package · 220 PLN','Dodaj pakiet 4 zajęć · 220 PLN')}${I('arrow')}</button></div>`}
function memberProgress(){return `<div class="account-head"><div><div class="eyebrow">${T('Your journey, your pace','Twoja droga, Twoje tempo')}</div><h1>${T('Small steps.<br><em>Real possibility.</em>','Małe kroki.<br><em>Nowe możliwości.</em>')}</h1><p>${T('A sample learning pathway, not a teaching assessment or a certificate.','Przykładowa ścieżka nauki, nie ocena umiejętności ani certyfikat.')}</p></div></div><div class="card card-pad" style="margin-bottom:22px"><div class="flex between"><h3>${T('Foundation · Module 01','Podstawy · Moduł 01')}</h3><span class="pill green">${T('In progress · demo','W toku · demo')}</span></div><div class="progress-line" style="margin:22px 0 10px"><span style="width:50%"></span></div><p class="small muted">${T('2 of 4 sample lessons complete. Learning pace is individual.','2 z 4 przykładowych lekcji ukończone. Tempo nauki jest indywidualne.')}</p></div>${[[T('Find your balance','Znajdź równowagę'),'walk',T('Walking, awareness and comfortable posture.','Chodzenie, świadomość i wygodna postawa.'),true],[T('Hear the music','Usłysz muzykę'),'music',T('Listening, pausing and moving with intention.','Słuchanie, pauza i intencja w ruchu.'),true],[T('Connect the steps','Połącz kroki'),'heart',T('Put simple ideas together with feedback.','Łącz proste pomysły z informacją zwrotną.'),false],[T('Your first practice','Twoja pierwsza praktyka'),'users',T('Revisit, ask questions and enjoy dancing.','Powtarzaj, pytaj i ciesz się tańcem.'),false]].map(([h,i,p,done],idx)=>`<div class="module"><div class="module-icon">${I(done?'check':i)}</div><div style="flex:1"><h4>${h}</h4><p>${p}</p><span class="pill ${done?'green':''}">${done?T('Explored · sample','Poznane · przykład'):T('Coming next','Wkrótce')}</span></div><button class="btn light sm" onclick="practiceNotes(${idx})">${T('Class notes','Notatki')}</button></div>`).join('')}<div class="notice" style="margin-top:20px">${I('info')}<span>${T('The teacher approves the real curriculum and progress records. Demo notes are general prompts, not a substitute for instruction.','Instruktor zatwierdza program i rzeczywiste postępy. Notatki demo to ogólne wskazówki, nie zastępstwo nauki.')}</span></div>`}
function memberCommunity(){return `<div class="account-head"><div><div class="eyebrow">${T('More than a class','Więcej niż zajęcia')}</div><h1>${T('Find your<br><em>people.</em>','Znajdź swoich<br><em>ludzi.</em>')}</h1><p>${T('Practice, shared moments and a thoughtful invitation.','Praktyka, wspólne chwile i zaproszenie od serca.')}</p></div></div><div class="grid2">${events.slice(0,2).map(eventCard).join('')}</div><div class="card card-pad" style="margin-top:24px;background:#e8eedc"><div class="eyebrow">${T('Bring a friend','Przyprowadź znajomych')}</div><h2 style="">${T('A first step is better<br><em>when it is shared.</em>','Pierwszy krok jest lepszy,<br><em>gdy go dzielisz.</em>')}</h2><p class="small muted" style="margin:18px 0">${T('Show your friend a beginner class or invite them to a sample event. Any live referral reward would need separate approval; no discount or benefit is promised here.','Pokaż znajomym zajęcia na start lub zaproś na przykładowe wydarzenie. Ewentualna nagroda za polecenie wymaga zatwierdzenia; tutaj nie obiecujemy rabatu.')}</p><div class="flex" style="flex-wrap:wrap"><span class="ticket-code" style="background:white;padding:12px;border-radius:7px">AURA-DEMO-FRIEND</span><button class="btn" onclick="copyText('AURA-DEMO-FRIEND')">${I('copy')}${T('Copy invitation code','Kopiuj kod zaproszenia')}</button></div></div><div class="card card-pad" style="margin-top:23px"><h3>${T('A welcoming space, by design.','Przyjazna przestrzeń z założenia.')}</h3><p class="small muted" style="margin-top:16px">${T('Ask before offering feedback. Respect personal boundaries. Partner changes are optional, and you can always decline a dance. A host should be easy to find when something does not feel right.','Zapytaj, zanim udzielisz uwagi. Szanuj granice innych. Zmiany partnera są dobrowolne, a tańca zawsze można odmówić. Gdy coś jest nie tak, prowadzący powinien być łatwo dostępny.')}</p></div>`}
function memberAccount(){return `<div class="account-head"><div><div class="eyebrow">${T('The practical things','Sprawy praktyczne')}</div><h1>${T('Your <em>account.</em>','Twoje <em>konto.</em>')}</h1></div><span class="pill peach">${T('No real personal data','Bez prawdziwych danych')}</span></div><div class="grid2"><div class="card dashboard-card"><h3>${T('Sample profile','Przykładowy profil')}</h3><div class="flex" style="margin:22px 0"><div class="avatar">A</div><div><h4>Alex · Demo</h4><p class="small muted">demo@example.com</p></div></div><p class="small muted">${T('Checkout details are used in memory only and cleared after the demonstration. The stored profile is always fictional.','Dane zamówienia są używane tylko w pamięci i usuwane po demonstracji. Zapisany profil zawsze pozostaje fikcyjny.')}</p></div><div class="card dashboard-card"><h3>${T('Your preferences','Twoje preferencje')}</h3><label class="checkline"><input type="checkbox" ${state.consent.marketing?'checked':''} onchange="state.consent.marketing=this.checked;persist();toast(T('Demo preference saved; no messages will be sent.','Zapisano preferencję demo; bez wysyłania wiadomości.'))"><span>${T('Demonstrate opting into news and events.','Demonstracja zgody na informacje i wydarzenia.')}</span></label><button class="text-link" onclick="showPolicy('privacy')">${T('Privacy settings','Ustawienia prywatności')}${I('settings')}</button></div></div><div class="card dashboard-card" style="margin-top:24px"><h3 style="margin-bottom:20px">${T('Your demo orders','Twoje zamówienia demo')}</h3>${state.orders.length?`<div class="table-scroll"><table><thead><tr><th>${T('Confirmation','Potwierdzenie')}</th><th>${T('Experience','Doświadczenie')}</th><th>${T('Total','Suma')}</th><th>${T('Document','Dokument')}</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>${o.id}</td><td>${ESC(o.name)}<br><span class="micro muted">${ESC(o.packageLabel)}</span></td><td>${money(o.total)}</td><td><button class="text-link" style="" onclick="downloadReceipt('${o.id}')">${T('Demo receipt','Potwierdzenie demo')}${I('download')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${T('No demo purchases yet. Try a class or event checkout.','Brak zakupów demo. Wypróbuj zapis na zajęcia lub wydarzenie.')}</div>`}</div><div class="notice" style="margin-top:22px">${I('info')}<div>${T('Receipts are demonstrations, not VAT invoices or evidence of payment. Live invoicing, refunds and data-subject requests need secure backend services.','Potwierdzenia są demonstracyjne, nie są fakturami VAT ani dowodem płatności. Fakturowanie, zwroty i obsługa danych wymagają bezpiecznego zaplecza.')}</div></div>`}
function studioShell(tab){const nav=[['','chart',T('Overview','Przegląd')],['enrolments','users',T('Enrolments & CRM','Zapisy i CRM')],['attendance','calendar',T('Attendance','Obecność')],['events','ticket',T('Event campaigns','Kampanie wydarzeń')],['content','search',T('SEO & content','SEO i treści')],['settings','settings',T('Studio settings','Ustawienia')]];return `<div class="wrap account-layout"><aside class="sidebar"><div class="profile"><span class="label muted">AURATANGO</span><h3 class="serif" style="margin-top:7px">${T('Behind the scenes.','Za kulisami.')}</h3></div><nav aria-label="Studio navigation">${nav.map(([v,i,l])=>`<a href="#/studio${v?'/'+v:''}" class="${tab===v?'active':''}">${I(i)}${l}</a>`).join('')}</nav><div class="side-bottom" style="padding:20px 8px 5px"><span class="pill peach">${T('Fictional studio data','Fikcyjne dane studia')}</span></div></aside><div class="account-main"><div class="notice" style="margin-bottom:24px">${I('shield')}<span>${T('Open studio preview. No access control, real analytics, live students or connected business systems. This is not a secure admin application.','Otwarty podgląd studia. Bez kontroli dostępu, rzeczywistej analityki, kursantów i połączonych systemów. To nie jest bezpieczna aplikacja administracyjna.')}</span></div>${tab==='enrolments'?studioCRM():tab==='attendance'?studioAttendance():tab==='events'?studioEvents():tab==='content'?studioContent():tab==='settings'?studioSettings():studioHome()}</div></div>`}
function studioHome(){let buyers=state.leads.filter(l=>l.status==='Package purchased').length;return `<div class="account-head"><div><div class="eyebrow">${T('Acquisition to belonging','Od pozyskania do wspólnoty')}</div><h1>${T('A clearer view<br>of <em>your studio.</em>','Jasny obraz<br><em>Twojego studia.</em>')}</h1><p>${T('Illustrative operating dashboard · October 2026','Ilustracyjny panel operacyjny · Październik 2026')}</p></div><button class="btn light sm" onclick="exportCRM()">${I('download')}CSV</button></div><div class="stats"><div class="stat">${I('users')}<div class="value">${state.leads.length}</div><div class="name">${T('Demo CRM records','Rekordy CRM demo')}</div></div><div class="stat">${I('ticket')}<div class="value">${buyers}</div><div class="name">${T('Package-purchased status','Status zakupionego pakietu')}</div></div><div class="stat">${I('chart')}<div class="value">${state.orders.reduce((s,o)=>s+o.total,0)}</div><div class="name">${T('PLN · simulated checkout total','PLN · suma symulowanych zakupów')}</div></div></div><div class="grid2"><div class="card dashboard-card"><div class="flex between"><h3>${T('Example acquisition funnel','Przykładowy lejek')}</h3><span class="pill peach">${T('Illustrative','Ilustracyjny')}</span></div><div class="chart-bars">${[[120,T('Visits','Wizyty')],[36,T('Enquiries','Zapytania')],[20,T('Booked','Zapisy')],[14,T('Attended','Obecność')],[7,T('Bought','Zakup')]].map(([n,l])=>`<div class="bar-wrap"><div class="bar" style="height:${n/120*82+8}%"><span>${n}</span></div><small>${l}</small></div>`).join('')}</div><p class="micro muted">${T('Static sample counts. Not real analytics or the local demo CRM.','Statyczne przykłady. Nie są to prawdziwe dane ani dane lokalnego CRM demo.')}</p></div><div class="card dashboard-card"><h3>${T('What needs attention','Co wymaga uwagi')}</h3><div class="list-row"><div class="module-icon">${I('users')}</div><div><h4>${T('Solo matching queue','Kolejka dopasowania solo')}</h4><p>${state.waitlist.length} ${T('local demo requests','lokalnych zgłoszeń demo')}</p></div></div><div class="list-row"><div class="module-icon">${I('calendar')}</div><div><h4>${T('First-package continuation','Kontynuacja po pierwszym pakiecie')}</h4><p>${T('Review when the renewal window has matured.','Sprawdź po zamknięciu okna odnowienia.')}</p></div></div><div class="list-row"><div class="module-icon">${I('search')}</div><div><h4>${T('Resolve conflicting class information','Ujednolić informacje o zajęciach')}</h4><p>${T('Use one approved price and timetable record.','Jedna zatwierdzona tabela cen i grafiku.')}</p></div></div></div></div><div class="callout"><div><h3>${T('Grow what brings people back.','Rozwijaj to, co sprawia, że ludzie wracają.')}</h3><p>${T('Separate leads, attendance, first purchases and matured renewals.','Rozdzielaj leady, obecność, pierwszy zakup i dojrzałe odnowienia.')}</p></div>${A('/studio/enrolments',T('Explore CRM','Zobacz CRM'),'arrow','btn')}</div>`}
const statuses=['Enquiry','Trial booked','Attended','Package purchased','Not continuing'];
function statusLabel(s){return state.lang==='en'?s:({'Enquiry':'Zapytanie','Trial booked':'Próba zarezerwowana','Attended':'Obecność','Package purchased':'Pakiet zakupiony','Not continuing':'Brak kontynuacji'}[s]||s)}
function studioCRM(){return `<div class="account-head"><div><div class="eyebrow">${T('From interest to the next step','Od zainteresowania do kolejnego kroku')}</div><h1>${T('Enrolments<br>& <em>conversations.</em>','Zapisy<br>i <em>rozmowy.</em>')}</h1></div><button class="btn light sm" onclick="exportCRM()">${I('download')}${T('Export CSV','Eksport CSV')}</button></div><div class="card"><div class="card-pad"><div class="field" style="margin:0"><label>${T('Search sample records','Szukaj przykładowych rekordów')}</label><input id="crm-search" placeholder="${T('Name, interest or source…','Nazwa, zainteresowanie lub źródło…')}" oninput="filterCRM(this.value)"></div></div><div class="table-scroll"><table id="crm-table"><thead><tr><th>${T('Visitor','Odwiedzający')}</th><th>${T('Source','Źródło')}</th><th>${T('Interest','Zainteresowanie')}</th><th>${T('Stage','Etap')}</th><th>${T('Next action','Kolejny krok')}</th></tr></thead><tbody>${state.leads.map((l,i)=>`<tr><td>${ESC(l.name)}</td><td>${ESC(l.source)}</td><td>${ESC(l.interest)}</td><td><select aria-label="Lead status ${i+1}" onchange="state.leads[${i}].status=this.value;persist();toast(T('Demo stage updated.','Zmieniono etap demo.'))">${statuses.map(s=>`<option value="${s}" ${s===l.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></td><td><button class="text-link" style="" onclick="followupModal(${i})">${T('Follow up','Kontakt')}${I('mail')}</button></td></tr>`).join('')}</tbody></table></div></div><div class="card dashboard-card" style="margin-top:24px"><h3>${T('Matching & waiting list','Dopasowanie i lista oczekujących')}</h3>${state.waitlist.length?state.waitlist.map(w=>`<div class="list-row"><div class="avatar">D</div><div><h4>${T('Demo applicant','Osoba demo')} · ${txt(classes[w.classId].name)}</h4><p>${w.date} · ${w.time} · ${ESC(w.role||'either')} · ${T('Not confirmed','Niepotwierdzone')}</p></div><button class="btn light sm" style="margin-left:auto" onclick="toast(T('Matching must be handled by an authorised team before payment. This request remains unconfirmed.','Dopasowanie wymaga uprawnionej osoby przed płatnością. Zgłoszenie pozostaje niepotwierdzone.'))">${T('Review','Sprawdź')}</button></div>`).join(''):`<p class="small muted" style="margin-top:17px">${T('Try a solo partnered application to populate this queue.','Wypróbuj indywidualny zapis na tango w parze, aby wypełnić kolejkę.')}</p>`}</div>`}
function studioAttendance(){let rows=[...state.bookings.filter(b=>b.status==='confirmed')];return `<div class="account-head"><div><div class="eyebrow">${T('Know who actually came','Wiedz, kto naprawdę przyszedł')}</div><h1>${T('A warm welcome.<br><em>A clear register.</em>','Serdeczne powitanie.<br><em>Jasna lista obecności.</em>')}</h1><p>${T('Mark sample attendance. Absences are a prompt for a considerate conversation—not an automatic diagnosis.','Zaznacz przykładową obecność. Nieobecność to powód do życzliwego kontaktu, nie automatycznej oceny.')}</p></div></div><div class="card table-scroll"><table><thead><tr><th>${T('Member','Kursant')}</th><th>${T('Class','Zajęcia')}</th><th>${T('Date','Data')}</th><th>${T('Attendance','Obecność')}</th></tr></thead><tbody>${rows.map(b=>`<tr><td>Alex · Demo</td><td>${bookingName(b)}</td><td>${dateLabel(b.date)} ${b.time}</td><td><select aria-label="Attendance" onchange="state.attendance['${b.id}']=this.value;persist();toast(T('Demo attendance saved.','Zapisano obecność demo.'))">${[['unmarked',T('Not marked','Nieoznaczona')],['attended',T('Attended','Obecny/a')],['absent',T('Absent','Nieobecny/a')]].map(([v,l])=>`<option value="${v}" ${state.attendance[b.id]===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="callout"><div><h3>${T('A first absence? Start with care.','Pierwsza nieobecność? Zacznij z troską.')}</h3><p>${T('Offer a useful next step, without pressure or repeated messages.','Zaproponuj pomocny kolejny krok, bez nacisku i powtarzanych wiadomości.')}</p></div><button class="btn" onclick="absenceMessage()">${T('Preview message','Podgląd wiadomości')}</button></div>`}
function studioEvents(){return `<div class="account-head"><div><div class="eyebrow">${T('Offline discovery, connected','Połącz odkrywanie offline')}</div><h1>${T('From the city<br>to <em>the studio.</em>','Z miasta<br>do <em>studia.</em>')}</h1></div><button class="btn light sm" onclick="partnerForm()">${T('Partner enquiry','Zapytanie partnera')}${I('up')}</button></div><div class="grid2">${events.map(e=>`<div class="card card-pad"><span class="pill peach">${T('Proposed · not approved','Propozycja · niezatwierdzona')}</span><h3 class="serif" style="margin:20px 0 12px">${txt(e.name)}</h3><p class="small muted">${dateLabel(e.date)} · ${txt(e.venue)}</p><hr class="rule"><div class="summary-line"><span>${T('Source code','Kod źródła')}</span><code>EVENT-${e.id.toUpperCase()}</code></div><div class="summary-line"><span>${T('Reservations in this demo','Zapisy w tym demo')}</span><strong>${state.orders.filter(o=>o.eventId===e.id).length}</strong></div><button class="btn light full" style="margin-top:15px" onclick="copyText('EVENT-${e.id.toUpperCase()}')">${I('copy')}${T('Copy campaign code','Kopiuj kod kampanii')}</button>${A('/event/'+e.id,T('Preview event page','Podgląd strony wydarzenia'),'up','text-link')}</div>`).join('')}</div><div class="card dashboard-card" style="margin-top:24px"><h3>${T('Before the first ticket is sold','Zanim sprzedasz pierwszy bilet')}</h3>${[["event-venue",T('Venue, dates, suitability and capacity approved','Potwierdzone miejsce, termin, warunki i pojemność')],["event-permit",T('Permissions, music rights and accessibility checked','Sprawdzone zgody, prawa do muzyki i dostępność')],["event-economics",T('Costs, host promotion and next-class capacity agreed','Uzgodnione koszty, promocja gospodarza i miejsca na kolejne zajęcia')],["event-followup",T('Source code, confirmation and follow-up flow tested','Przetestowany kod źródła, potwierdzenie i kontakt po wydarzeniu')]].map(([id,t])=>taskRow(id,t,T('Operational approval; not inferred by the prototy function taskRow(id,title,sub){return `<div class="task-item"><input id="task-${id}" type="checkbox" ${state.tasks.includes(id)?'checked':''} onchange="toggleTask('${id}',this.checked)"><div><label for="task-${id}">${title}</label><p class="micro muted" style="margin-top:4px">${sub}</p></div></div>`}
function studioContent(){return `<div class="account-head"><div><div class="eyebrow">${T('Make the right things discoverable','Ułatw odkrywanie właściwych rzeczy')}</div><h1>${T('Clear pages.<br><em>Useful stories.</em>','Jasne strony.<br><em>Pomocne historie.</em>')}</h1><p>${T('An implementation checklist—not an SEO score or Search Console report.','Lista wdrożeniowa, nie ocena SEO ani raport Search Console.')}</p></div></div><div class="card dashboard-card"><h3>${T('Launch readiness','Gotowość do publikacji')}</h3>${[['seo-data',T('One approved record for prices, schedules and venues','Jedna zatwierdzona tabela cen, terminów i lokalizacji'),T('Resolve conflicting Polish / English commercial details.','Usuń sprzeczności w polskich i angielskich informacjach.')],['seo-pages',T('Publish real, indexable service URLs','Opublikuj prawdziwe, indeksowalne adresy usług'),T('This file uses hash routes and noindex. Replace with server-rendered pages for production.','Ten plik używa tras hash i noindex. Produkcja wymaga stron renderowanych po stronie serwera.')],['seo-language',T('Equivalent language pages and reciprocal hreflang','Odpowiedniki językowe i wzajemne hreflang'),T('Preserve the service context when changing language.','Zachowaj kontekst usługi przy zmianie języka.')],['seo-index',T('Inspect status, canonicals, sitemap and rendered content','Sprawdź statusy, canonical, mapę i treści renderowane'),T('Measure in the actual hosting environment.','Mierz w rzeczywistym środowisku hostingowym.')],['seo-local',T('Verify Business Profile eligibility and approved locations','Sprawdź kwalifikowalność Profilu Firmy i lokalizacje'),T('Do not create duplicate listings for unapproved rented spaces.','Nie twórz duplikatów dla niezatwierdzonych przestrzeni.')],['seo-tracking',T('Consent-aware tracking and attributable conversions','Pomiar ze zgodą i przypisaniem konwersji'),T('Track booking, attendance, first purchase and mature renewal separately.','Mierz oddzielnie zapisy, obecność, pierwszy zakup i dojrzałe odnowienia.')]].map(x=>taskRow(...x)).join('')}</div><div class="card dashboard-card" style="margin-top:24px"><h3>${T('Content board · sample assignments','Plan treści · przykładowe zadania')}</h3><div class="table-scroll" style="margin-top:20px"><table><thead><tr><th>${T('Story','Temat')}</th><th>${T('Destination','Cel')}</th><th>${T('Status','Status')}</th></tr></thead><tbody>${[[T('Your first class, in 30 seconds','Pierwsza lekcja w 30 sekund'),'Ladies'],[T('A couple’s first shared step','Pierwszy wspólny krok pary'),'Partnered'],[T('Meet your teacher','Poznaj instruktora'),'Story'],[T('A café evening invitation','Zaproszenie do kawiarni'),'Events']].map(([title,d],i)=>`<tr><td>${title}</td><td>${d}</td><td><select aria-label="Content status" onchange="state.content['${i}']=this.value;persist()">${['Idea','In production','Ready for review','Published (demo)'].map(v=>`<option ${state.content[i]===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function studioSettings(){return `<div class="account-head"><div><div class="eyebrow">${T('Make the handoff clear','Jasne przekazanie do wdrożenia')}</div><h1>${T('Ready for<br><em>the real thing.</em>','Gotowi na<br><em>prawdziwe wdrożenie.</em>')}</h1></div></div><div class="card dashboard-card"><h3>${T('Integration status','Status integracji')}</h3>${[['card',T('Payments','Płatności'),T('Simulated BLIK, card and wallets. No merchant account or payment API.','Symulacja BLIK, kart i portfeli. Bez konta sprzedawcy i API płatności.')],['user',T('Authentication & permissions','Uwierzytelnienie i uprawnienia'),T('Open preview. Implement secure authentication and server-side role checks.','Otwarty podgląd. Wdrożenie wymaga bezpiecznego logowania i kontroli ról na serwerze.')],['calendar',T('Availability & attendance','Dostępność i obecność'),T('Local demonstration data. Production needs transactional capacity control.','Lokalne dane demo. Produkcja wymaga transakcyjnej kontroli miejsc.')],['mail',T('Messaging & invoices','Wiadomości i faktury'),T('No email, SMS, WhatsApp or invoice is sent. Approve providers and templates.','Bez e-maili, SMS, WhatsApp i faktur. Zatwierdź dostawców i szablony.')],['search',T('SEO & analytics','SEO i analityka'),T('No analytics tags. Demo is noindex; hash pages are not production SEO architecture.','Bez tagów analitycznych. Demo ma noindex; trasy hash nie są architekturą SEO produkcji.')]].map(([i,h,p])=>`<div class="list-row"><div class="module-icon">${I(i)}</div><div><h4>${h}</h4><p style="white-space:normal">${p}</p></div></div>`).join('')}</div><div class="card dashboard-card" style="margin-top:23px"><h3>${T('Demonstration data','Dane demonstracyjne')}</h3><p class="small muted" style="margin:16px 0 22px">${T('Selections, fictional bookings and workflow changes persist only in this browser when local storage is available. Clear them to start from the original sample state.','Wybory, fikcyjne rezerwacje i zmiany są zachowane tylko w tej przeglądarce, jeśli lokalna pamięć jest dostępna. Usuń je, aby zacząć od początku.')}</p><button class="btn light" onclick="resetDemo()">${I('refresh')}${T('Reset all demo data','Wyzeruj dane demo')}</button></div>`}

d package prices, teacher names and public addresses were checked on 16 September 2026. Private sessions, practice prices, gifts and events are proposed demo offers. There are no fabricated ratings, reviews or awards.','Ceny Ladies (29 / 220 PLN), polskie pakiety dla par, nazwiska instruktorów i adresy sprawdzono 16 września 2026. Lekcje prywatne, praktyki, karty i wydarzenia to propozycje demo. Nie dodano fikcyjnych ocen, recenzji ani nagród.')}</p><div class="flex" style="margin-top:12px;flex-wrap:wrap"><a class="text-link" style="" href="https://syntezja.com/tangodlakobiet" target="_blank" rel="noopener">${T('Published Ladies page','Publiczna strona Ladies')}${I('up')}</a><a class="text-link" style="" href="https://syntezja.com/argentinetango" target="_blank" rel="noopener">${T('Published tango page','Publiczna strona tanga')}${I('up')}</a></div><p style="margin-top:14px">${T('Editorial images: Preillumination SeTh / Unsplash (hero), Freepik / Magnific and the public tango pages. Stock subjects are not presented as AuraTango students. Images and Google Fonts require internet; confirm all photo permissions before publication. AuraTango and Syntezja remain distinct brands.','Fotografie: Preillumination SeTh / Unsplash (hero), Freepik / Magnific i publiczne strony tanga. Osoby ze zdjęć stock nie są przedstawiane jako kursanci. Zdjęcia i Google Fonts wymagają internetu; potwierdź prawa przed publikacją. AuraTango i Syntezja pozostają odrębnymi markami.')}</p>`,true)}
function showPolicy(kind){if(kind==='privacy'){modal(T('Your privacy.<br><em>By design.</em>','Twoja prywatność.<br><em>Z założenia.</em>'),`<p>${T('This local concept has no analytics scripts and sends no form, booking or payment data to a backend. External photographs and Google Fonts can make network requests when loaded.','Ta koncepcja nie zawiera skryptów analitycznych i nie wysyła danych formularzy, rezerwacji ani płatności. Zewnętrzne zdjęcia i Google Fonts mogą wykonywać żądania sieciowe.')}</p><p style="margin-top:13px">${T('Only fictional bookings, demo orders, interface preferences and workflow states are stored locally where the browser allows it. Entered checkout/contact details are not persisted. This does not constitute a production privacy policy.','Lokalnie zapisywane są tylko fikcyjne rezerwacje, zamówienia demo, preferencje interfejsu i statusy. Wpisane dane kontaktowe nie są utrwalane. To nie jest polityka prywatności dla produkcji.')}</p><div class="card card-pad" style="margin-top:22px;padding:20px"><label class="checkline"><input type="checkbox" checked disabled><span>${T('Essential local demo state','Niezbędny lokalny stan demo')}</span></label><label class="checkline"><input id="analytics-pref" type="checkbox" ${state.consent.analytics?'checked':''}><span>${T('Optional analytics preference (no analytics is installed)','Opcjonalna preferencja analityki (brak zainstalowanej analityki)')}</span></label><label class="checkline"><input id="marketing-pref" type="checkbox" ${state.consent.marketing?'checked':''}><span>${T('Optional marketing preference (no messages are sent)','Opcjonalna preferencja marketingowa (bez wysyłania wiadomości)')}</span></label></div><div class="modal-actions"><button class="btn light" onclick="state.consent={analytics:false,marketing:false};persist();closeModal();toast(T('Optional preferences off.','Opcjonalne preferencje wyłączone.'))">${T('Essential only','Tylko niezbędne')}</button><button class="btn" onclick="state.consent.analytics=document.getElementById('analytics-pref').checked;state.consent.marketing=document.getElementById('marketing-pref').checked;persist();closeModal();toast(T('Local demo preferences saved.','Zapisano preferencje lokalnego demo.'))">${T('Save preferences','Zapisz preferencje')}</button></div>`)}else{modal(T('A clear beginning.<br><em>Demo conditions.</em>','Jasny początek.<br><em>Warunki demo.</em>'),`<p>${T('No contract, payment or real place is created through this file. All dates, seats, events and confirmations are simulated. The public prices used for context require owner confirmation, especially where Polish and English pages differ.','Ten plik nie zawiera umowy ani rzeczywistej płatności i nie rezerwuje miejsc. Wszystkie terminy, miejsca, wydarzenia i potwierdzenia są symulowane. Ceny publiczne wymagają potwierdzenia, szczególnie przy rozbieżnościach językowych.')}</p><hr class="rule"><h4>${T('In this prototype','W tym prototypie')}</h4><p style="margin-top:12px">${T('A matched solo place is requested before payment. Couples enrol together. Packages do not automatically renew. A used sample class credit is restored when that booking is cancelled. Rescheduling does not consume another credit.','Miejsce solo jest zgłaszane do dopasowania przed płatnością. Pary zapisują się razem. Pakiety nie odnawiają się automatycznie. Użyte wejście demo wraca po odwołaniu rezerwacji. Zmiana terminu nie pobiera kolejnego wejścia.')}</p><hr class="rule"><h4>${T('Before live launch','Przed rzeczywistą publikacją')}</h4><p style="margin-top:12px">${T('The school must approve the seller identity, full commercial prices, payment provider, refund and cancellation terms, consumer information, accessibility, consent flows, privacy policy, event permissions and imagery rights. None are supplied as legal advice here.','Szkoła musi zatwierdzić sprzedawcę, pełne ceny, dostawcę płatności, zwroty i anulacje, informacje konsumenckie, dostępność, zgody, prywatność, pozwolenia n
