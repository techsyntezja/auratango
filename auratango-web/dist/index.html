<section class="signature-people"><div class="wrap story-split"><div class="story-photo reveal">${photo('teachers','',L('Rick and Anna Daniel','Rick i Anna Daniel','Рик и Анна Дэниел','Рік і Анна Деніел'))}<span class="photo-label">Rick & Anna Daniel</span><button class="floating-play" onclick="openFilm('tango')" aria-label="${L('Watch tango film','Obejrzyj film','Смотреть видео','Дивитися відео')}">${I('play')}</button></div><div><div class="eyebrow">05 / ${L('THE PEOPLE, NOT JUST THE STEPS','LUDZIE, NIE TYLKO KROKI','ЛЮДИ, А НЕ ТОЛЬКО ШАГИ','ЛЮДИ, А НЕ ЛИШЕ КРОКИ')}</div><h2>${L('The dance is taught.<br><em>The feeling is shared.</em>','Tańca się uczymy.<br><em>Emocjami się dzielimy.</em>','Танцу учатся.<br><em>Чувствами делятся.</em>','Танцю навчаються.<br><em>Почуттями діляться.</em>')}</h2><p>${L('Meet Rick and Anna. The people behind the music, your questions, and that first small moment when a step begins to feel like yours.','Poznaj Ricka i Annę. Ludzi, którzy stoją za muzyką, odpowiadają na pytania i towarzyszą Ci, gdy pierwszy krok zaczyna być Twój.','Познакомьтесь с Риком и Анной. Людьми за музыкой, ответами на ваши вопросы и тем первым мгновением, когда шаг становится вашим.','Познайомтеся з Ріком і Анною. Людьми за музикою, відповідями на ваші запитання й тією першою миттю, коли крок стає вашим.')}</p><div class="people-names"><button onclick="teacherModal('rick')">Rick Daniel ↗<small>${T('Partnered Argentine tango','Tango argentyńskie w parze')}</small></button><button onclick="teacherModal('anna')">Anna Daniel ↗<small>Tango Ladies</small></button></div>${A('/journal/interview-rick',L('Conversations behind the dance','Rozmowy za kulisami tańca','Разговоры за кулисами танца','Розмови за лаштунками танцю'),'up','text-link')}</div></div></section>
<section class="rouge-journal section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">06 / ${L('THE JOURNAL','DZIENNIK','ЖУРНАЛ','ЖУРНАЛ')}</div><h2>${L('A little to read.<br><em>A lot to feel.</em>','Trochę do przeczytania.<br><em>Wiele do poczucia.</em>','Немного слов.<br><em>Много чувств.</em>','Трохи слів.<br><em>Багато почуттів.</em>')}</h2></div>${A('/journal',L('Open the journal','Otwórz dziennik','Открыть журнал','Відкрити журнал'),'up','text-link')}</div><div class="grid3">${essays.map(essayCard).join('')}</div></div></section>
<section class="section faq-section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">${L('BEFORE YOUR FIRST STEP','PRZED PIERWSZYM KROKIEM','ПЕРЕД ПЕРВЫМ ШАГОМ','ПЕРЕД ПЕРШИМ КРОКОМ')}</div><h2>${L('A little less wondering.<br><em>A little more yes.</em>','Mniej niewiadomych.<br><em>Więcej chęci.</em>','Меньше сомнений.<br><em>Больше «да».</em>','Менше сумнівів.<br><em>Більше «так».</em>')}</h2></div>${A('/guide',T('Your first-visit guide','Przewodnik przed pierwszą wizytą'),'up','text-link')}</div>${faqs(4)}</div></section>`;}
function homeCinema(){return `<section class="home-cinema"><div class="wrap"><div class="section-head"><div><div class="eyebrow">03 / ${L('PRESS PLAY. FEEL SOMETHING.','WŁĄCZ. POCZUJ.','НАЖМИТЕ PLAY. ПОЧУВСТВУЙТЕ.','НАТИСНІТЬ PLAY. ВІДЧУЙТЕ.')}</div><h2>${L('Before your first step,<br><em>let the music in.</em>','Zanim zrobisz pierwszy krok,<br><em>wpuść muzykę.</em>','До первого шага<br><em>впустите музыку.</em>','До першого кроку<br><em>впустіть музику.</em>')}</h2></div>${A('/journal',L('Films & conversations','Filmy i rozmowy','Фильмы и разговоры','Фільми й розмови'),'up','text-link')}</div><div class="cinema-grid"><button class="cinema-feature" onclick="openFilm('tango')">${photo('tangoFilm','',txt(films[0].title))}<div class="film-scrim"></div><span class="cinema-tag">AURATANGO / ${L('IN MOTION','W RUCHU','В ДВИЖЕНИИ','У РУСІ')}</span><span class="cinema-play">${I('play')}</span><span class="cinema-caption"><span class="label">${L('THE SCHOOL’S FILM','FILM ZE STRONY SZKOŁY','ВИДЕО СО СТРАНИЦЫ ШКОЛЫ','ВІДЕО ЗІ СТОРІНКИ ШКОЛИ')}</span><strong>${txt(films[0].title)}</strong><small>${L('Watch with sound','Obejrzyj z dźwiękiem','Смотреть со звуком','Дивитися зі звуком')} ${I('up')}</small></span></button><div class="cinema-side"><button class="mini-cinema" onclick="openFilm('ladies')">${photo('ladiesFilm','',txt(films[1].title))}<span class="mini-play">${I('play')}</span><span class="mini-cinema-caption"><small>TANGO LADIES</small><strong>${txt(films[1].title)}</strong></span></button><a href="#/journal/interview-rick" class="conversation-teaser"><div class="label">${L('THE CONVERSATION SERIES · PREVIEW','CYKL ROZMÓW · ZAPOWIEDŹ','СЕРИЯ БЕСЕД · АНОНС','СЕРІЯ РОЗМОВ · АНОНС')}</div><h3>${L('What do we hear<br>when we <em>really listen?</em>','Co słyszymy,<br>gdy <em>naprawdę słuchamy?</em>','Что мы слышим,<br>когда <em>слушаем?</em>','Що ми чуємо,<br>коли <em>слухаємо?</em>')}</h3><div class="flex between"><span>Rick Daniel</span><span class="round-button">${I('up')}</span></div></a></div></div></div></section>`;}
const eventPhotos={'after-hours':'cafe','city-steps':'rick','sunday-practice':'teachers'};
function eventCard(e){return `<a href="#/event/${e.id}" class="event-card image-event reveal"><div class="event-art ${e.color}">${photo(eventPhotos[e.id],'event-photo',L('Atmosphere image, not a photograph of this proposed event','Zdjęcie nastrojowe, nie dokumentuje proponowanego wydarzenia','Атмосферное фото, не снимок предлагаемого события','Атмосферне фото, не знімок запропонованої події'))}<div class="event-image-shade"></div><div class="event-top"><span class="glass-pill">${txt(e.typeName)}</span><span class="event-date-glass"><b>${new Date(e.date+'T12:00:00').getDate()}</b><small>${dateLabel(e.date,{month:'short'})}</small></span></div><div class="poster-title">${txt(e.poster)}</div><span class="event-arrow">${I('up')}</span></div><div class="card-body"><div class="event-meta">${I('pin')} ${txt(e.venue)} <span>· ${e.time}</span></div><h3>${txt(e.name)}</h3><div class="card-bottom"><span>${e.price?money(e.price):T('Free','Bezpłatnie')} <small>${L('/ person · sample','/ os. · przykład','/ чел. · пример','/ ос. · приклад')}</small></span><span class="pill peach">${L('Event concept','Koncepcja wydarzenia','Концепция события','Концепція події')}</span></div></div></a>`;}
function eventsPage(){let es=events.filter(e=>state.eventFilter==='all'||state.eventFilter===e.type);return `${pageHead(L('Make a little room<br><em>for a memorable night.</em>','Zrób trochę miejsca<br><em>na piękny wieczór.</em>','Оставьте немного места<br><em>для особенного вечера.</em>','Залиште трохи місця<br><em>для особливого вечора.</em>'),L('A café, a song, a city that feels a little closer. Explore the proposed experiences below.','Kawiarnia, melodia i miasto, które staje się trochę bliższe. Poznaj propozycje spotkań.','Кафе, мелодия и город, который становится чуть ближе. Познакомьтесь с идеями встреч.','Кав’ярня, мелодія й місто, яке стає трохи ближчим. Познайомтеся з ідеями зустрічей.'),L('NIGHTS & MOMENTS','WIECZORY I CHWILE','ВЕЧЕРА И МГНОВЕНИЯ','ВЕЧОРИ Й МИТІ'))}<section class="section-sm"><div class="wrap"><div class="filter-bar">${[['all',L('Every moment','Wszystkie chwile','Все моменты','Усі миті')],['social',L('Café & club evenings','Kawiarnie i kluby','Кафе и клубы','Кав’ярні та клуби')],['popup',L('Out in the city','W mieście','В городе','У місті')],['practice',L('Dance together','Wspólna praktyka','Танцевать вместе','Танцювати разом')]].map(([k,n])=>`<button class="filter-chip ${state.eventFilter===k?'active':''}" onclick="state.eventFilter='${k}';render()">${n}</button>`).join('')}</div><div class="grid3">${es.map(eventCard).join('')}</div><div class="event-disclosure">${I('info')}<p>${L('All events here are proposed examples. Dates, venues and prices require approval. Images set the mood; they are not evidence of events already held.','Wszystkie wydarzenia są propozycjami. Terminy, miejsca i ceny wymagają zatwierdzenia. Zdjęcia oddają nastrój — nie dokumentują minionych wydarzeń.','Все события — примеры предлагаемых форматов. Даты, площадки и цены требуют согласования. Фото передают настроение, а не подтверждают прошедшие события.','Усі події — приклади запропонованих форматів. Дати, майданчики й ціни потребують узгодження. Фото передають настрій, а не підтверджують минулі події.')}</p></div><div class="venue-banner"><div><div class="eyebrow">${L('LET’S CREATE SOMETHING TOGETHER','STWÓRZMY COŚ RAZEM','СОЗДАДИМ ЧТО-ТО ВМЕСТЕ','СТВОРІМО ЩОСЬ РАЗОМ')}</div><h2>${L('Your place.<br><em>A whole new feeling.</em>','Twoje miejsce.<br><em>Zupełnie nowe emocje.</em>','Ваше место.<br><em>Совсем другое чувство.</em>','Ваше місце.<br><em>Зовсім інше відчуття.</em>')}</h2><p>${L('For cafés, clubs, cultural spaces and teams. Tell us about your space and we’ll explore an evening together.','Dla kawiarni, klubów, instytucji kultury i zespołów. Opowiedz o swoim miejscu — porozmawiajmy o wspólnym wieczorze.','Для кафе, клубов, культурных пространств и команд. Расскажите о вашей площадке — обсудим совместный вечер.','Для кав’ярень, клубів, культурних просторів і команд. Розкажіть про ваш майданчик — обговорімо спільний вечір.')}</p><button class="btn" onclick="partnerForm()">${L('Host a tango evening','Zorganizuj wieczór tanga','Провести вечер танго','Провести вечір танго')}${I('up')}</button></div><div>${photo('cafe','',L('Illustrative café interior','Ilustracyjne wnętrze kawiarni','Иллюстративный интерьер кафе','Ілюстративний інтер’єр кав’ярні'))}</div></div></div></section>`;}
function openFilm(id){const f=films.find(f=>f.id===id)||films[0];modal(txt(f.title),`<div class="video-stage" id="video-stage">${photo(f.photo,'',txt(f.title),'eager')}<div class="video-consent"><button class="cinema-play" onclick="loadFilm('${f.id}')" aria-label="${L('Load video','Wczytaj film','Загрузить видео','Завантажити відео')}">${I('play')}</button><strong>${L('Let the music in.','Wpuść muzykę.','Впустите музыку.','Впустіть музику.')}</strong><p>${L('Play loads a YouTube player and connects to YouTube. No video loads before you choose.','Przycisk odtwarzania uruchomi odtwarzacz i połączenie z YouTube. Film nie wczytuje się bez Twojej decyzji.','Воспроизведение загружает плеер и подключается к YouTube. До вашего выбора видео не загружается.','Відтворення завантажує плеєр і підключається до YouTube. До вашого вибору відео не завантажується.')}</p></div></div><p class="small muted" style="margin:16px 0">${txt(f.subtitle)} ${L('Original audio; website language does not translate the recording.','Oryginalny dźwięk; język strony nie tłumaczy nagrania.','Оригинальная дорожка; язык сайта не переводит запись.','Оригінальна доріжка; мова сайту не перекладає запис.')}</p><div class="video-links"><a class="text-link" href="https://www.youtube.com/watch?v=${f.youtube}" target="_blank" rel="noopener noreferrer">${L('Open on YouTube','Otwórz w YouTube','Открыть на YouTube','Відкрити на YouTube')}${I('up')}</a><a class="text-link" href="${f.source}" target="_blank" rel="noopener noreferrer">${L('School source','Źródło szkoły','Страница школы','Сторінка школи')}${I('up')}</a></div><div class="modal-actions"><button class="btn" onclick="closeModal();navigate('/class/${f.route}')">${L('Feel it in a class','Poczuj to na zajęciach','Почувствовать на занятии','Відчути на занятті')}${I('arrow')}</button></div>`,true);document.querySelector('.modal')?.classList.add('cinema-modal');}
function loadFilm(id){let f=films.find(x=>x.id===id);if(!f)return;document.getElementById('video-stage').innerHTML=`<iframe title="${ESC(txt(f.title))}" src="https://www.youtube-nocookie.com/embed/${f.youtube}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;const note=document.createElement('p');note.className='video-fallback-note';note.innerHTML=L('Player unavailable? Use “Open on YouTube” below. Local HTML files may be blocked by the video provider.','Odtwarzacz niedostępny? Użyj „Otwórz w YouTube” poniżej. Dostawca może blokować odtwarzanie w lokalnym pliku HTML.','Плеер недоступен? Нажмите «Открыть на YouTube» ниже. Провайдер может блокировать видео в локальном HTML.','Плеєр недоступний? Натисніть «Відкрити на YouTube» нижче. Провайдер може блокувати відео в локальному HTML.');document.getElementById('video-stage').after(note);}
function feelTheAtmosphere(){openFilm('tango');}
function essayCard(a){return `<a class="essay-card reveal" href="#/journal/${a.id}" data-editorial-kind="article" data-search="${ESC(txt(a.title).toLowerCase())}"><div class="essay-image">${photo(a.photo,'',txt(a.title))}<span class="round-button">${I('up')}</span></div><div class="essay-body"><div class="essay-meta"><span>${txt(a.tag)}</span><span>${a.minutes} ${L('MIN READ','MIN CZYTANIA','МИН ЧТЕНИЯ','ХВ ЧИТАННЯ')}</span></div><h3>${txt(a.title)}</h3><p>${txt(a.intro)}</p><span class="text-link">${L('Read the story','Przeczytaj historię','Читать историю','Читати історію')}${I('up')}</span></div></a>`;}
function filmCard(f){return `<a class="essay-card reveal" href="#/film/${f.id}" data-editorial-kind="film" data-search="${ESC(txt(f.title).toLowerCase())}"><div class="essay-image film-thumb">${photo(f.photo,'',txt(f.title))}<span class="cinema-play">${I('play')}</span></div><div class="essay-body"><div class="essay-meta"><span>${L('IN MOTION','W RUCHU','В ДВИЖЕНИИ','У РУСІ')}</span><span>${L('SCHOOL VIDEO','FILM SZKOŁY','ВИДЕО ШКОЛЫ','ВІДЕО ШКОЛИ')}</span></div><h3>${txt(f.title)}</h3><p>${txt(f.subtitle)}</p><span class="text-link">${L('Watch the film','Zobacz film','Смотреть видео','Дивитися відео')}${I('up')}</span></div></a>`;}
function interviewCard(who){return `<a class="essay-card reveal" href="#/journal/interview-${who}" data-editorial-kind="interview" data-search="${who==='rick'?'rick рик рік rhythm':'anna анна connection'}"><div class="essay-image">${photo(who==='rick'?'portraitRick':'anna','',who==='rick'?'Rick Daniel':'Anna Daniel')}<span class="glass-pill interview-preview">${L('INTERVIEW PREVIEW','ZAPOWIEDŹ ROZMOWY','АНОНС ИНТЕРВЬЮ','АНОНС ІНТЕРВ’Ю')}</span></div><div class="essay-body"><div class="essay-meta"><span>${L('IN CONVERSATION','W ROZMOWIE','В БЕСЕДЕ','У РОЗМОВІ')}</span><span>${who==='rick'?'RICK DANIEL':'ANNA DANIEL'}</span></div><h3>${who==='rick'?L('Before the step, the music.','Najpierw muzyka. Potem krok.','Сначала музыка. Потом шаг.','Спочатку музика. Потім крок.'):L('There is room for your own rhythm.','Jest miejsce na Twój rytm.','Здесь есть место вашему ритму.','Тут є місце вашому ритму.')}</h3><p>${L('A first look at our proposed conversation series. Recording and answers are not yet published.','Zapowiedź proponowanego cyklu rozmów. Nagranie i odpowiedzi nie są jeszcze opublikowane.','Первый взгляд на предлагаемую серию бесед. Запись и ответы ещё не опубликованы.','Перший погляд на запропоновану серію розмов. Запис і відповіді ще не опубліковані.')}</p><span class="text-link">${L('Explore the conversation','Poznaj tematy rozmowy','Узнать темы беседы','Дізнатися теми розмови')}${I('up')}</span></div></a>`;}
function journal(id){if(id?.startsWith('interview-'))return interviewPage(id.split('-')[1]);if(id){let a=essays.find(a=>a.id===id);if(a)return articlePage(a);return notFound();}return `${pageHead(L('Stories to move you.<br><em>Even when you’re still.</em>','Historie, które poruszają.<br><em>Nawet gdy stoisz w miejscu.</em>','Истории, которые трогают.<br><em>Даже в тишине.</em>','Історії, які зворушують.<br><em>Навіть у тиші.</em>'),L('Films from the school, thoughtful notes for your first step, and the people behind the dance.','Filmy ze szkoły, wskazówki na pierwszy krok i ludzie, którzy tworzą taniec.','Видео школы, заметки перед первым шагом и люди, которые стоят за танцем.','Відео школи, нотатки перед першим кроком і люди, які стоять за танцем.'),L('THE AURATANGO JOURNAL','DZIENNIK AURATANGO','ЖУРНАЛ AURATANGO','ЖУРНАЛ AURATANGO'))}<section class="section-sm"><div class="wrap"><div class="editorial-toolbar"><div class="filter-bar">${[['all',L('Everything','Wszystko','Всё','Усе')],['film',L('Films','Filmy','Фильмы','Фільми')],['article',L('Stories','Historie','Истории','Історії')],['interview',L('Conversations','Rozmowy','Беседы','Розмови')]].map(([k,n])=>`<button class="filter-chip ${state.editorialFilter===k?'active':''}" onclick="state.editorialFilter='${k}';filterEditorial();document.querySelectorAll('.editorial-toolbar .filter-chip').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${n}</button>`).join('')}</div><div class="editorial-search">${I('search')}<input type="search" value="${ESC(state.editorialSearch)}" aria-label="${L('Search journal','Szukaj w dzienniku','Поиск в журнале','Пошук у журналі')}" placeholder="${L('Something on your mind?','Czego szukasz?','Что вас интересует?','Що вас цікавить?')}" oninput="state.editorialSearch=this.value;filterEditorial()"></div></div><div class="editorial-grid" id="editorial-grid">${films.map(filmCard).join('')}${essays.map(essayCard).join('')}${interviewCard('rick')}${interviewCard('anna')}</div><div class="empty hidden" id="editorial-empty">${L('No story found. Try another word or show everything.','Nie znaleziono historii. Spróbuj innego słowa lub pokaż wszystko.','История не найдена. Попробуйте другое слово или покажите всё.','Історію не знайдено. Спробуйте інше слово або покажіть усе.')}</div></div></section>`;}
function filterEditorial(){let count=0;document.querySelectorAll('#editorial-grid [data-editorial-kind]').forEach(el=>{const yes=(state.editorialFilter==='all'||state.editorialFilter===el.dataset.editorialKind)&&(!state.editorialSearch||el.textContent.toLocaleLowerCase(LOCALE()).includes(state.editorialSearch.toLocaleLowerCase(LOCALE())));el.classList.toggle('hidden',!yes);if(yes)count++});document.getElementById('editorial-empty')?.classList.toggle('hidden',count>0);}
function articlePage(a){return `<section class="article-opening"><div class="wrap"><a href="#/journal" class="text-link">← ${L('Back to the journal','Wróć do dziennika','Вернуться в журнал','Повернутися до журналу')}</a><div class="article-title-grid"><div><div class="eyebrow">${txt(a.tag)} · ${a.minutes} ${L('MIN READ','MIN CZYTANIA','МИН ЧТЕНИЯ','ХВ ЧИТАННЯ')}</div><h1>${txt(a.title)}</h1><p class="lead">${txt(a.intro)}</p><div class="article-tools"><button class="btn light sm" onclick="saveStory('${a.id}',this)">${I(state.bookmarks.includes(a.id)?'check':'heart')}${L('Save this story','Zapisz historię','Сохранить историю','Зберегти історію')}</button><button class="text-link" onclick="copyStoryLink()">${L('Share','Udostępnij','Поделиться','Поділитися')}${I('up')}</button></div></div><div class="article-cover">${photo(a.photo,'',txt(a.title),'eager')}</div></div></div></section><article class="article-reading">${a.sections.map(([h,p],i)=>`<section><span class="label accent">0${i+1}</span><h2>${txt(h)}</h2><p>${txt(p)}</p></section>`).join('')}<div class="article-editorial-note">${L('Written for this website concept. Editorial guidance, not a quoted interview or a record of a particular class. Final teaching details should be approved by the school.','Tekst przygotowany do tej koncepcji strony. Wskazówki redakcyjne, nie cytat z wywiadu ani relacja z konkretnych zajęć. Szczegóły nauczania wymagają zatwierdzenia przez szkołę.','Текст подготовлен для концепции сайта. Редакционные рекомендации, не цитата из интервью и не описание конкретного урока. Учебные детали должна утвердить школа.','Текст підготовлено для концепції сайту. Редакційні поради, не цитата з інтерв’ю й не опис конкретного уроку. Навчальні деталі має затвердити школа.')}</div><div class="article-next"><h3>${L('Your first chapter<br><em>could start here.</em>','Twój pierwszy rozdział<br><em>może zacząć się tutaj.</em>','Ваша первая глава<br><em>может начаться здесь.</em>','Ваш перший розділ<br><em>може початися тут.</em>')}</h3><button class="btn" onclick="openQuiz()">${T('Find my first class','Znajdź moje zajęcia')}${I('up')}</button></div></article>`;}
function saveStory(id,btn){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];btn.innerHTML=I(state.bookmarks.includes(id)?'check':'heart')+L(state.bookmarks.includes(id)?'Saved for this session':'Save this story',state.bookmarks.includes(id)?'Zapisano w tej sesji':'Zapisz historię',state.bookmarks.includes(id)?'Сохранено на эту сессию':'Сохранить историю',state.bookmarks.includes(id)?'Збережено на цю сесію':'Зберегти історію');}
async function copyStoryLink(){const publicOrigin=/^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1'].includes(location.hostname);const value=publicOrigin?location.href:'AuraTango website concept · '+location.hash;try{await navigator.clipboard.writeText(value);toast(publicOrigin?L('Link copied.','Link skopiowany.','Ссылка скопирована.','Посилання скопійовано.'):L('Page reference copied. Share the HTML file separately; this is not a hosted site.','Skopiowano odnośnik do strony. Udostępnij plik HTML osobno — strona nie jest opublikowana.','Ссылка на раздел скопирована. Сам HTML-файл нужно отправить отдельно: сайт не опубликован.','Посилання на розділ скопійовано. Сам HTML-файл потрібно надіслати окремо: сайт не опубліковано.'));}catch(e){modal(L('Share this story','Udostępnij historię','Поделиться историей','Поділитися історією'),`<p>${ESC(value)}</p><p>${L('Share the HTML file and this page reference together.','Udostępnij plik HTML razem z tym odnośnikiem.','Отправьте HTML-файл вместе со ссылкой на этот раздел.','Надішліть HTML-файл разом із посиланням на цей розділ.')}</p>`);}}
function filmPage(id){let f=films.find(f=>f.id===id);if(!f)return notFound();return `${pageHead(txt(f.title),txt(f.subtitle),L('AURATANGO IN MOTION','AURATANGO W RUCHU','AURATANGO В ДВИЖЕНИИ','AURATANGO У РУСІ'))}<section class="section-sm"><div class="wrap"><button class="cinema-feature standalone-cinema" onclick="openFilm('${f.id}')">${photo(f.photo,'',txt(f.title),'eager')}<div class="film-scrim"></div><span class="cinema-play">${I('play')}</span><span class="cinema-caption"><strong>${L('Press play. Feel it.','Włącz. Poczuj.','Нажмите play. Почувствуйте.','Натисніть play. Відчуйте.')}</strong></span></button><div class="film-page-foot"><p class="lead">${L('A film can give you a glimpse. A first lesson makes it yours.','Film pozwoli Ci podejrzeć. Pierwsza lekcja — poczuć po swojemu.','Видео позволяет увидеть. Первый урок — почувствовать по-своему.','Відео дозволяє побачити. Перший урок — відчути по-своєму.')}</p>${A('/class/'+f.route,T('Explore the class','Zobacz zajęcia'),'up','btn')}</div><p class="editorial-note">${L('Embedded from the school’s public page. Playback needs internet access and permission from the video provider. Original audio and any available subtitles are supplied by YouTube.','Film osadzony z publicznej strony szkoły. Odtwarzanie wymaga internetu i zgody dostawcy. Oryginalny dźwięk i dostępne napisy dostarcza YouTube.','Видео со страницы школы. Для воспроизведения нужны интернет и разрешение провайдера. Оригинальное аудио и доступные субтитры предоставляет YouTube.','Відео зі сторінки школи. Для відтворення потрібні інтернет і дозвіл провайдера. Оригінальне аудіо й доступні субтитри надає YouTube.')}</p></div></section>`;}
function interviewPage(who){const r=who==='rick';const name=r?'Rick Daniel':'Anna Daniel';const qs=r?[
 ['When did rhythm become a conversation for you?','Kiedy rytm stał się dla Ciebie rozmową?','Когда ритм стал для вас разговором?','Коли ритм став для вас розмовою?'],['What would you want a nervous beginner to know?','Co chciałbyś powiedzieć początkującej osobie z tremą?','Что вы хотели бы сказать волнующемуся новичку?','Що ви хотіли б сказати новачку, який хвилюється?'],['How do you help a student listen before moving?','Jak pomagasz najpierw usłyszeć muzykę, a potem ruszyć?','Как вы помогаете сначала услышать, а потом двигаться?','Як ви допомагаєте спершу почути, а потім рухатися?']
 ]:[
 ['What does dancing for yourself mean to you?','Co znaczy dla Ciebie tańczyć dla siebie?','Что для вас значит танцевать для себя?','Що для вас означає танцювати для себе?'],['How do you make the first class feel welcoming?','Jak sprawiasz, że pierwsza lekcja jest przyjazna?','Как вы создаёте уютную атмосферу на первом занятии?','Як ви створюєте затишну атмосферу на першому занятті?'],['What small moment tells you a student is finding their rhythm?','Jaki mały moment mówi Ci, że ktoś odnajduje swój rytm?','Какой маленький момент говорит, что ученик находит свой ритм?','Яка маленька мить підказує, що учень знаходить свій ритм?']
 ];return `${pageHead(r?L('Before the step,<br><em>the music.</em>','Zanim pojawi się krok,<br><em>jest muzyka.</em>','До первого шага —<br><em>музыка.</em>','До першого кроку —<br><em>музика.</em>'):L('Your own rhythm.<br><em>A place for you.</em>','Twój własny rytm.<br><em>Miejsce dla Ciebie.</em>','Ваш собственный ритм.<br><em>Место для вас.</em>','Ваш власний ритм.<br><em>Місце для вас.</em>'),name,L('CONVERSATION SERIES · EDITORIAL PREVIEW','CYKL ROZMÓW · ZAPOWIEDŹ REDAKCYJNA','СЕРИЯ БЕСЕД · РЕДАКЦИОННЫЙ АНОНС','СЕРІЯ РОЗМОВ · РЕДАКЦІЙНИЙ АНОНС'))}<section class="section-sm"><div class="wrap conversation-layout"><div class="conversation-portrait">${photo(r?'portraitRick':'anna','',name,'eager')}<span>${name}</span></div><div><span class="pill peach">${L('Recording not yet published','Nagranie jeszcze nieopublikowane','Запись ещё не опубликована','Запис ще не опубліковано')}</span><h2 style="margin-top:25px">${L('A good conversation<br><em>starts with curiosity.</em>','Dobra rozmowa<br><em>zaczyna się od ciekawości.</em>','Хорошая беседа<br><em>начинается с любопытства.</em>','Гарна розмова<br><em>починається з цікавості.</em>')}</h2><p class="lead" style="margin-top:20px">${L('This is a preview of a proposed interview, not a transcript. These are questions we would like to explore; no answers or quotes have been invented.','To zapowiedź proponowanego wywiadu, nie transkrypcja. Poniżej znajdują się tematy do rozmowy — nie wymyślone odpowiedzi ani cytaty.','Это анонс предлагаемого интервью, а не расшифровка. Ниже — вопросы для беседы; ответы и цитаты не выдуманы.','Це анонс запропонованого інтерв’ю, а не розшифровка. Нижче — запитання для розмови; відповіді й цитати не вигадані.')}</p><div class="interview-questions">${qs.map((q,i)=>`<div><span>0${i+1}</span><h3>${txt(q)}</h3></div>`).join('')}</div><div class="flex" style="flex-wrap:wrap"><button class="btn" onclick="interviewQuestion('${who}')">${L('What would you ask?','O co chcesz zapytać?','Что бы вы спросили?','Що б ви запитали?')}${I('up')}</button><button class="text-link" onclick="teacherModal('${who}')">${L('Meet the teacher','Poznaj instruktora','О преподавателе','Про інструктора')}${I('up')}</button></div></div></div></section>`;}
function interviewQuestion(who){modal(L('Your curiosity<br><em>belongs here.</em>','Twoja ciekawość<br><em>jest mile widziana.</em>','Вашему любопытству<br><em>здесь рады.</em>','Вашій цікавості<br><em>тут раді.</em>'),`<form onsubmit="event.preventDefault();state.interviewQuestions=state.interviewQuestions||[];state.interviewQuestions.push(document.getElementById('interview-question').value.trim());closeModal();toast(L('Question preview saved for this session only. Nothing was sent.','Podgląd pytania zapisano tylko w tej sesji. Nic nie wysłano.','Вопрос сохранён только в этой сессии. Ничего не отправлено.','Запитання збережено лише в цій сесії. Нічого не надіслано.'))"><p>${who==='rick'?'Rick Daniel':'Anna Daniel'}</p><div class="field"><label for="interview-question">${L('Your question','Twoje pytanie','Ваш вопрос','Ваше запитання')}</label><textarea id="interview-question" required minlength="8" maxlength="600" rows="4" placeholder="${L('I have always wondered…','Zawsze zastanawiało mnie…','Мне всегда было интересно…','Мені завжди було цікаво…')}"></textarea></div><button type="submit" class="btn full">${L('Preview my question','Zapisz podgląd pytania','Сохранить пример вопроса','Зберегти приклад запитання')}${I('arrow')}</button><p class="small muted" style="margin-top:12px">${L('Demonstration only. Do not enter personal or sensitive information.','Tylko demonstracja. Nie podawaj danych osobowych ani wrażliwych.','Только демонстрация. Не вводите личные или чувствительные данные.','Лише демонстрація. Не вводьте особисті чи чутливі дані.')}</p></form>`);}
function enhanceRouge(){filterEditorial();let r=route();if(r==='/')document.title='AuraTango — '+L('Less thinking. More feeling.','Mniej myśli. Więcej emocji.','Меньше мыслей. Больше чувств.','Менше думок. Більше почуттів.');if(r.startsWith('/event/')){const e=events.find(e=>e.id===r.split('/')[2]);const art=document.querySelector('.detail-layout .event-art');if(e&&art){art.classList.add('photo-event-detail');art.insertAdjacentHTML('afterbegin',photo(eventPhotos[e.id],'event-photo',L('Atmosphere image','Zdjęcie nastrojowe','Атмосферное фото','Атмосферне фото'))+'<div class="event-image-shade"></div>');}}document.querySelectorAll('.footer-links').forEach((links,i)=>{if(i===0&&!links.querySelector('[href="#/journal"]'))links.insertAdjacentHTML('beforeend',`<a href="#/journal">${L('Films & journal','Filmy i dziennik','Фильмы и журнал','Фільми й журнал')}</a>`)});document.querySelectorAll('.modal .close-modal').forEach(b=>b.setAttribute('aria-label',L('Close','Zamknij','Закрыть','Закрити')));if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&matchMedia('(pointer:fine)').matches){document.querySelectorAll('.path-card,.image-event,.cinema-feature').forEach(el=>{el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',`${(e.clientX-r.left)/r.width*100}%`);el.style.setProperty('--my',`${(e.clientY-r.top)/r.height*100}%`)});});}}

function statusLabel(s){const labels={'Enquiry':['Enquiry','Zapytanie','Запрос','Запит'],'Trial booked':['Trial booked','Próba zarezerwowana','Записан на пробный','Записаний на пробний'],'Attended':['Attended','Obecność','Посетил','Відвідав'],'Package purchased':['Package purchased','Pakiet zakupiony','Абонемент куплен','Абонемент придбано'],'Not continuing':['Not continuing','Brak kontynuacji','Не продолжает','Не продовжує']};return txt(labels[s]||[s,s,s,s]);}

const originalShowInfo=showInfo;
showInfo=function(){originalShowInfo();const paragraphs=document.querySelectorAll('.modal p');paragraphs.forEach(p=>{if(p.textContent.includes('Preillumination')||p.textContent.includes('Freepik'))p.innerHTML=L('School photographs: Rick and Anna Daniel, from the linked public tango and instructor pages. Café photograph: Unsplash, for atmosphere only. Films are linked from the school’s pages; interviews are editorial previews, not recordings. Images, Google Fonts and playback require internet. Confirm usage rights and final details before publication. AuraTango and Syntezja remain distinct brands.','Fotografie Ricka i Anny Daniel pochodzą z publicznych stron zajęć i instruktorów. Zdjęcie kawiarni: Unsplash, wyłącznie ilustracja nastroju. Filmy są powiązane ze stronami szkoły; wywiady to zapowiedzi, nie nagrania. Zdjęcia, Google Fonts i odtwarzanie wymagają internetu. Przed publikacją zatwierdź prawa i szczegóły. AuraTango i Syntezja to odrębne marki.','Fotografie','Fotografie');});if(state.lang==='ru'||state.lang==='uk')paragraphs.forEach(p=>{if(p.textContent==='Fotografie')p.textContent=TRANSLATIONS[Object.keys(TRANSLATIONS).find(k=>k.startsWith('Editorial images:'))][state.lang==='ru'?0:1]});};
const originalShowPolicy=showPolicy;
showPolicy=function(kind){originalShowPolicy(kind);if(kind==='privacy'){const p=document.querySelector('.modal>p');if(p)p.textContent=L('This local concept has no analytics scripts and sends no form, booking or payment data to a backend. External photographs, video thumbnails and Google Fonts can make network requests. A YouTube player loads only after you choose to play a video. It may make requests to YouTube and its providers.','Koncepcja nie zawiera skryptów analitycznych i nie wysyła formularzy, rezerwacji ani płatności do serwera. Zewnętrzne zdjęcia, miniatury wideo i Google Fonts mogą wykonywać żądania sieciowe. Odtwarzacz YouTube uruchamia się dopiero po wybraniu odtwarzania i może łączyć się z usługami dostawcy.','В концепции нет аналитики, формы, записи и платежи не отправляются на сервер. Внешние фотографии, миниатюры видео и Google Fonts создают сетевые запросы. Плеер YouTube загружается только после вашего выбора и может обращаться к сервисам провайдера.','У концепції немає аналітики, форми, записи й платежі не надсилаються на сервер. Зовнішні фотографії, мініатюри відео й Google Fonts створюють мережеві запити. Плеєр YouTube завантажується лише після вашого вибору й може звертатися до сервісів провайдера.');}};


</script><script>const SOURCE_SECTIONS=[{"title": "1. Main Vision", "text": ["Build a strong, recognizable tango community around AURATANGO teaching and approach, with several complementary activities:", "Regular weekly Couple group classes", "Ladies’ solo classes", "Regular practicas and community events", "Large, profitable milongas", "Tango workshops in Warsaw and other cities", "The AuraTouch connection project for people outside the tango community", "Tango Outfits for Ladies", "A stronger online presence and website", "A community platform that keeps people connected beyond WhatsApp", "Special events and activities that strengthen relationships within the community", "The long-term objective is to create a sustainable tango ecosystem where teaching, events, workshops, products and community all support one another."]}, {"title": "2. WEEKLY TANGO GROUPS", "text": ["Saturday Groups", "Three groups: 15:00-16:15, 16:15-17:30, 17:30-18:45", "Goal", "Fill the Saturday groups and establish them as regular, predictable classes throughout the year.", "Long-term objective", "Create a stable base of regular students who form the core of the tango community."]}, {"title": "3. LADIES’ SOLO", "text": ["Ladies’ solo should become a regular year-round program, rather than an occasional class.", "Current structure", "Saturday and Sunday:", "10:00–12:00 — Ladies’ Solo", "Possible additional group", "12:00–13:00 on Saturday or Sunday", "Goal", "Build a loyal group of women who attend regularly and see the classes as an ongoing program.", "Important opportunity", "Ladies’ Solo can also become an entry point into the wider tango community. Someone can start with solo work before deciding to learn partner dancing."]}, {"title": "4. MILONGA — THE BIG EVENT PROJECT", "text": ["This should be treated as a separate business/project rather than simply another tango evening.", "Concept", "Create a larger, attractive milonga that can bring together people from the Warsaw tango community and eventually visitors from outside Warsaw.", "The goal is for the event to become:", "A recognizable event", "A strong community meeting point", "A source of income", "A way to strengthen the AURATANGO brand", "Something people look forward to attending regularly", "Location", "Solec 38 is not suitable because it is an apartment building and the event needs to finish by approximately 23:00.", "Therefore, find a venue that:", "Allows dancing and music", "Can operate until approximately 1-2am", "Has sufficient capacity (for up 100people)", "Has suitable flooring", "Allows drinks/snacks", "Is financially viable", "Is accessible by public transport", "Can potentially be booked regularly", "Team required", "Responsibilities should be divided:", "Rick", "Artistic direction", "Music/tango atmosphere", "Teaching/community presence", "Overall concept", "DJ", "Music", "Entrance/payment", "Welcome guests", "Collect payments", "Track attendance", "Drinks/snacks", "Preparation", "Serving", "Stock management", "Venue manager", "Communication with venue", "Negotiation", "Setup", "Closing/cleanup", "Promotion", "Social media", "Website", "WhatsApp/community communication", "Contacting other tango communities", "Financial model", "Before launching, calculate:", "Venue + DJ + drinks/snacks + promotion + other costs = total event cost", "Then determine:", "Expected attendance × ticket price = revenue", "The event should have a clear minimum attendance number at which it becomes profitable.", "Development", "Start with a manageable event and gradually build it.", "Possible long-term structure:", "Regular weekly/recurring milonga → recognizable brand → larger attendance → visiting dancers/DJs → increased profitability."]}, {"title": "5. WORKSHOPS", "text": ["Workshops should develop beyond the regular Warsaw classes.", "Warsaw", "Organize special workshops for the existing tango community (attract dancers from other schools)", "These can be occasional special events in addition to the regular classes.", "Outside Warsaw", "Develop relationships with tango communities in other Polish cities.", "Potential model:", "Contact tango schools/community organizers.", "Introduce Auratango and its teaching approach.", "Offer workshop concepts.", "Build relationships with organizers.", "Accept invitations to teach.", "Gradually become known outside Warsaw.", "Long-term objective", "Rick becomes recognized not only as a local teacher but as someone who can be invited to:", "Workshops", "Festivals", "Tango weekends", "Guest teaching events"]}, {"title": "6. AURATOUCH PROJECT", "text": ["This is a separate concept and should have its own identity and presentation.", "Concept", "A three-hour experience using tango as a tool for connection.", "It is not primarily about learning tango.", "The focus is:", "Connection with yourself", "Connection with another person", "Presence", "Communication", "Touch", "Awareness", "Trust", "Movement", "Basic tango elements as a tool for exploration", "Target groups", "It can be designed for:", "Couples", "Strengthening connection", "Exploring communication through movement", "Doing something together", "Singles", "Connection with yourself", "Body awareness", "Communication and trust", "Meeting others in a different way", "Companies/groups\n Potentially later adapted as a team/connection experience.", "Format", "Approximately 3 hours.", "Possible structure:", "Introduction", "Individual awareness/body exercises", "Partner connection exercises", "Introduction to basic tango movement", "Exercises around communication and connection", "Guided tango experience", "Reflection/integration", "Goal", "Create a product that can reach people who would never normally walk into a tango school.", "This could therefore become an important new audience and marketing channel for tango."]}, {"title": "7. TANGO DRESSES PROJECT", "text": ["A separate project focused on clothing for tango.", "Concept", "Develop practical tango dresses for trainings and milongas", "The project is currently in an experimentation/prototype phase.", "Next steps", "Test different designs", "Test fabrics", "Test movement and comfort", "Establish approximate production cost", "Determine realistic selling price", "Identify target customer", "Decide whether production should be small-batch or made-to-order", "Photograph the finished products", "Develop a small initial collection", "Website", "The website should eventually include a Tango Dresses / Shop section.", "Potentially later:", "Practice dresses", "Milonga dresses", "Tops", "Skirts", "Accessories", "The first goal should be to validate whether people actually want the product before investing heavily in inventory."]}, {"title": "8. WEBSITE", "text": ["The website should become the central home of everything we are building.", "Instead of simply being a place that says “we teach tango,” it should eventually connect all the projects.", "Possible structure", "HOME", "Clear explanation of who we are and what makes Auratango approach different.", "CLASSES", "Weekly groups", "Weekend groups", "Ladies’ Solo", "Practicas", "Private Classes Rick/Anna", "Schedule", "Registration", "WORKSHOPS", "Upcoming Warsaw workshops", "Special workshops", "Workshops in other cities", "Booking Rick", "MILONGA", "Upcoming dates", "Location", "Tickets", "Information", "Photos/videos", "Community announcements", "AURATOUCH", "Dedicated presentation of the project.", "COMMUNITY", "Events", "Practicas", "Special activities", "Community calendar", "Possibly member area", "SHOP", "Tango dresses and eventually other products.", "ABOUT", "Rick + team + philosophy.", "CONTACT", "Simple contact and booking information."]}, {"title": "9. COMMUNITY PLATFORM", "text": ["At the moment, WhatsApp is doing most of the communication work.", "The problem is that WhatsApp becomes difficult to manage when the community grows.", "The long-term question is:", "How can we create one central place where people can stay connected without requiring us to manually communicate with everyone all the time?", "Objectives", "The platform should make it possible to:", "Announce classes", "Announce workshops", "Announce milongas", "Organize practicas", "Share community events", "Keep people informed", "Allow people to return after a period away", "Maintain contact with former students", "Create smaller interest groups", "Possible community activities", "Ladies’ events", "Ladies’ technique", "Ladies’ solo", "Social evenings", "Men’s events", "Men’s technique", "Partnering/leading workshops", "Practice", "Regular practicas", "Guided practicas", "Social", "Concerts", "Dinners", "Cultural events", "Holiday events", "Group outings", "Special tango events", "Tango weekends", "Guest teachers", "Themed evenings", "Community celebrations", "Important principle", "The community should not exist only when someone is attending a class.", "The goal is to create a feeling that:", "“I am part of this tango community.”", "That makes it easier for people to stay connected even when they temporarily stop taking classes."]}, {"title": "10. COMMUNITY REACTIVATION", "text": ["There is a large opportunity in people who have already been connected to the community.", "Some people leave because of different reasons, but that does not necessarily mean they have permanently left tango.", "Create a simple system", "Keep a database of:", "Current students", "Former students", "Workshop participants", "Milonga attendees", "Interested/new people", "Then communicate with them appropriately.", "Examples:", "Former student:\n “Hey, we’re starting a new Saturday group and thought you might be interested.”", "Workshop participant:\n “We’re doing a special connection workshop next month.”", "Milonga attendee:\n “Next milonga is coming up…”", "This should eventually be systematized so that it does not depend on someone remembering to message everyone manually."]}, {"title": "11. REVENUE STREAMS", "text": ["The different projects should eventually support each other financially.", "Core revenue", "Regular classes\n → Stable recurring income", "Ladies’ Solo\n → Additional recurring income", "Workshops\n → Higher-value individual events", "Milongas\n → Event revenue + community growth", "Auratouch\n → New audience + premium workshop/product", "Tango dresses\n → Product revenue", "Guest teaching/festivals\n → External income + reputation", "Potentially:", "Private lessons\n → Premium service"]}, {"title": "12. HOW THE PROJECTS CONNECT", "text": ["The important thing is that these are not separate businesses.", "They can create a cycle:", "Classes\n ↓\n People join the community\n ↓\n Community attends practicas & milongas\n ↓\n People become more engaged\n ↓\n They attend workshops\n ↓\n Some discover Auratouch / other experiences\n ↓\n They buy products / dresses\n ↓\n They invite friends\n ↓\n Community grows\n ↓\n Milonga grows\n ↓\n Rick becomes more visible outside Warsaw\n ↓\n More workshop/festival invitations\n ↓\n More people discover the community", "This creates a self-reinforcing tango ecosystem."]}, {"title": "13. PRIORITIES", "text": ["Not everything needs to happen simultaneously.", "PHASE 1 — FOUNDATION", "Immediate priorities", "Fill the Saturday groups.", "Establish Ladies’ Solo as a regular program.", "Clarify the team and responsibilities.", "Define the website structure.", "Create a basic database of current and former students.", "Continue testing the tango dresses.", "Start researching and planning the new milonga.", "PHASE 2 — COMMUNITY", "Once the weekly classes are stable:", "Establish regular practicas.", "Organize smaller community events.", "Create men’s/ladies’ workshops.", "Improve communication beyond WhatsApp.", "Start reactivating former students.", "Develop the community section of the website.", "PHASE 3 — MILONGA", "Find suitable venue.", "Negotiate price and conditions.", "Build the team.", "Establish DJ arrangements.", "Calculate the financial model.", "Create branding and promotion.", "Launch the first event.", "Measure attendance and profitability.", "Improve the event.", "Establish it as a recurring event.", "PHASE 4 — WORKSHOPS & AURATOUCH", "Develop workshop topics.", "Create workshop descriptions.", "Photograph/video the concept.", "Add workshops to the website.", "Contact tango communities outside Warsaw.", "Develop the Auratouch three-hour format.", "Test it with a small group.", "Refine it based on feedback.", "Start offering it to couples, singles and potentially organizations.", "PHASE 5 — TANGO DRESSES", "Complete prototypes.", "Test with dancers.", "Establish production costs.", "Decide pricing.", "Create initial collection.", "Photograph products.", "Add shop section to website.", "Test sales without holding excessive inventory.", "Expand only after demand is proven."]}, {"title": "14. THE BIGGER GOAL", "text": ["The ultimate objective is to build something bigger than a schedule of tango classes.", "It is to create a recognizable tango brand and community around:", "Teaching + Community + Events + Workshops + Experiences + Products", "with Rick’s teaching and artistic approach at the center.", "The community should provide the foundation.", "The classes create regular contact.", "The milonga creates a social hub.", "The workshops develop the students and attract outside dancers.", "Auratouch opens tango to people who are not currently dancers.", "The dresses create a complementary product.", "The website connects everything.", "And the team allows the whole project to grow without everything depending on one or two people."]}, {"title": "15. CORE PRINCIPLE", "text": ["Build the foundation first, then scale.", "The first objective is not to do everything at once.", "It is to create a reliable weekly structure and a strong community. Once that foundation exists, the milonga, workshops, Auratouch project, dresses and outside-city activities can grow from it in a controlled way."]}];
const FEEDBACK=[{"id": "F01", "section": 1, "label": "One connected AuraTango ecosystem", "detail": "The home page connects teaching, community, milonga, workshops, AuraTouch and the atelier. Each has a distinct purpose and onward journey, rather than a disconnected brochure page.", "route": "/", "status": "Local flow built"}, {"id": "F02", "section": 1, "label": "Rick’s teaching and approach at the centre", "detail": "Retained authentic teacher imagery, teacher profiles, source-linked films and interview previews. No invented qualifications, testimonials, completed interviews or awards.", "route": "/story", "status": "Local flow built"}, {"id": "F03", "section": 2, "label": "Three exact Saturday partner groups", "detail": "15:00–16:15, 16:15–17:30 and 17:30–18:45. The same source records power class details, the timetable and the invitation flow. Dates are checked against Saturday.", "route": "/timetable", "status": "Local flow built"}, {"id": "F04", "section": 2, "label": "Year-round recurring enrolment", "detail": "Choose a recurring group, provide experience/role, submit a request, receive an operator-reviewed invitation, review all practical details, simulate payment and manage remaining package sessions.", "route": "/enrol/partnered", "status": "Local flow built"}, {"id": "F05", "section": 2, "label": "No invented group levels, prices or venue assignment", "detail": "The source gives times but not levels, fees, exact intake dates or assigned venues. These remain pending until a clearly labelled operator-entered demonstration offer. Old prices are not silently applied to the new programme.", "route": "/studio/requests", "status": "Owner information required"}, {"id": "F06", "section": 2, "label": "Individual versus couple registration", "detail": "A couple is two participants. An individual requires explicit suitable-partner review before an invitation. Role preference does not infer gender; waiting, withdrawal and unavailable states are separate from paid enrolment.", "route": "/enrol/partnered", "status": "Local flow built"}, {"id": "F07", "section": 3, "label": "Ladies’ Solo on both weekend days", "detail": "Saturday and Sunday, 10:00–12:00, as a regular year-round programme. Duration is 120 minutes in invitations, receipts and calendar files—not the original 60-minute trial.", "route": "/class/ladies", "status": "Local flow built"}, {"id": "F08", "section": 3, "label": "Possible extra 12:00–13:00 group", "detail": "Retained as an interest choice, not an announced weekly class. The operator cannot issue a sale invitation through this concept branch.", "route": "/enrol/ladies", "status": "Validation only"}, {"id": "F09", "section": 3, "label": "Solo-to-partner transition", "detail": "An optional, visible onward route to Saturday partner groups and community. No automatic enrolment or assumption that a Ladies’ Solo student must switch.", "route": "/class/ladies", "status": "Local flow built"}, {"id": "F10", "section": 4, "label": "A dedicated, recognisable milonga project", "detail": "Public milonga page and separate operator workspace, rather than folding it into a generic beginner café evening. It stays part of the overall AuraTango brand.", "route": "/milonga", "status": "Local flow built"}, {"id": "F11", "section": 4, "label": "Exclude Solec 38 from late-night milonga", "detail": "The late-night event gate explicitly rejects Solec 38. Existing class-location information is retained without assigning the new timetable to either location.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F12", "section": 4, "label": "Venue criteria and up-to-100-person concept", "detail": "Late finish around 01:00–02:00, floor, safe capacity, public transport, refreshments, permissions, repeatability and commercial viability are represented in planning. No venue contract is fabricated.", "route": "/studio/milonga", "status": "Owner information required"}, {"id": "F13", "section": 4, "label": "Separate delivery roles", "detail": "Rick/artistic lead; DJ; entrance and payments; drinks/snacks; venue manager; promotion. Assignment fields and the source responsibilities are available in operations.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F14", "section": 4, "label": "Transparent event economics", "detail": "Editable venue, DJ, refreshments, promotion, other fixed costs, per-attendee costs, ticket price, capacity and expected attendance. Computes contribution, break-even and first strictly profitable attendance; empty fields are not zero.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F15", "section": 4, "label": "Drinks/snacks stock and closing responsibilities", "detail": "A small stock register records planned and used quantities; remaining stock is computed. The venue role includes setup, closing and cleanup. Alcohol service is not presumed licensed.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F16", "section": 4, "label": "Gate ticket offers until planning is complete", "detail": "Interest first. A local ticket offer is available only after the venue and financial data/readiness checks are complete. Simulated tickets track guests, entry and contribution—not confirmed real-world sales.", "route": "/milonga", "status": "Local flow built"}, {"id": "F17", "section": 4, "label": "Start manageable; develop a recurring event", "detail": "The source’s phased launch tasks, recurrence considerations and improvement notes are retained. There are no invented weekly dates, DJs or sold-out claims.", "route": "/studio/roadmap", "status": "Owner information required"}, {"id": "F18", "section": 4, "label": "Milonga information, media and announcements", "detail": "Public information and announcement routes connect to the event. Existing school video is labelled as atmosphere, not footage of an event that has not happened.", "route": "/milonga", "status": "Local flow built"}, {"id": "F19", "section": 5, "label": "Warsaw workshops open to other schools’ dancers", "detail": "Workshop directory and detail pages are separate from weekly groups. The invitation flow allows experience, role and party preferences; topics and levels remain proposed until approved.", "route": "/workshops", "status": "Local flow built"}, {"id": "F20", "section": 5, "label": "Guest teaching outside Warsaw", "detail": "A host enquiry collects city, event format, audience, date preference, venue and budget context. The operator can review, draft a response and track the relationship. No booking is confirmed merely by submitting an enquiry.", "route": "/host", "status": "Local flow built"}, {"id": "F21", "section": 5, "label": "Workshops, festivals, weekends and invitations", "detail": "The host form supports the source’s distinct invitation formats; contact, introduction, concept, relationship and invitation stages appear in the roadmap and host workflow.", "route": "/studio/partners", "status": "Local flow built"}, {"id": "F22", "section": 6, "label": "AuraTouch has its own identity", "detail": "A distinct three-hour connection-experience page, not a renamed tango class. It introduces presence, awareness, communication, trust, movement and connection.", "route": "/auratouch", "status": "Local flow built"}, {"id": "F23", "section": 6, "label": "The seven-part three-hour experience", "detail": "Introduction; individual awareness; partner connection; basic tango; communication; guided experience; reflection. Preserves the source’s order without inventing exact minute-by-minute clinical methodology.", "route": "/auratouch", "status": "Local flow built"}, {"id": "F24", "section": 6, "label": "Couples and singles enter differently", "detail": "Request flow captures an individual/couple preference and contact comfort. Instructor/venue/date/price must be reviewed before payment; duration remains 180 minutes.", "route": "/enrol/auratouch", "status": "Local flow built"}, {"id": "F25", "section": 6, "label": "Company version remains later-stage", "detail": "Organisation requests record interest only. They are not sold as an already developed programme.", "route": "/enrol/auratouch", "status": "Validation only"}, {"id": "F26", "section": 6, "label": "Pilot and feedback before expansion", "detail": "Pilot planning appears in phase four. The copy does not claim therapy, a cure, compulsory touch or guaranteed relationship outcomes. Participation and touch are optional.", "route": "/studio/roadmap", "status": "Validation only"}, {"id": "F27", "section": 7, "label": "Tango dresses are a prototype project", "detail": "Atelier and two design-direction pages distinguish practice and milonga use. Abstract visual studies are explicitly not photographs of completed garments.", "route": "/shop", "status": "Validation only"}, {"id": "F28", "section": 7, "label": "Design, fabric, movement and comfort testing", "detail": "Detailed anonymous feedback forms record use, priorities and willingness to test; the studio can review and export responses. These forms do not create orders.", "route": "/shop/practice-dress", "status": "Validation only"}, {"id": "F29", "section": 7, "label": "Cost, price and production method decisions", "detail": "Operator validation fields cover unit cost, indicative price, audience feedback, batch size and small-batch versus made-to-order. Missing data stays blank.", "route": "/studio/atelier", "status": "Local flow built"}, {"id": "F30", "section": 7, "label": "Finished photos and small initial collection", "detail": "Readiness checklist requires actual prototypes, wear testing, photos, sizing/product details, realistic economics and fulfilment terms before sales.", "route": "/studio/atelier", "status": "Validation only"}, {"id": "F31", "section": 7, "label": "Future product range without fake stock", "detail": "Practice dresses and milonga dresses have concept pages. Tops, skirts and accessories are explicitly future directions—not purchasable fictional inventory.", "route": "/shop", "status": "Validation only"}, {"id": "F32", "section": 8, "label": "Complete website information architecture", "detail": "Classes/schedule/registration; workshops/Booking Rick; milonga; AuraTouch; community; shop; about and contact are all navigable from the header or Discover menu and footer.", "route": "/", "status": "Local flow built"}, {"id": "F33", "section": 8, "label": "Private classes with Rick or Anna", "detail": "Dedicated detail and request route lets a visitor choose Rick, Anna or a recommendation. The operator provides duration, teacher, date and complete offer before payment.", "route": "/class/private", "status": "Local flow built"}, {"id": "F34", "section": 8, "label": "Practical registration, offers and payment", "detail": "Guided request → studio review → invitation → acceptance → payment simulation → receipt → member management. Failure and retry, duplicate prevention, group capacity and full-price review are implemented locally.", "route": "/tour", "status": "Local flow built"}, {"id": "F35", "section": 8, "label": "Keep the visual and media work", "detail": "Preserved crimson/cream glossy treatment, responsive layouts, consent-to-play source-linked films, searchable journal, teacher story and four-language interface. Media delivery/rights are not newly verified.", "route": "/journal", "status": "Local flow built"}, {"id": "F36", "section": 9, "label": "Community beyond WhatsApp", "detail": "Dedicated public/member community, smaller circles, announcements and calendar. Local prototype actions demonstrate the central workflow; actual multi-user hosting/messages require backend integration.", "route": "/community", "status": "Local flow built"}, {"id": "F37", "section": 9, "label": "Five interest circles", "detail": "Ladies’ activity; men’s technique/partnering; practice; social/cultural activities; special tango experiences. Joining/leaving a circle is independent of payment and marketing consent.", "route": "/community", "status": "Local flow built"}, {"id": "F38", "section": 9, "label": "Draft, review and publish announcements", "detail": "Operator creates a draft with class/workshop/milonga/practica/social type, audience, details and optional date. A separate review action publishes it locally; drafts are not shown to members.", "route": "/studio/community", "status": "Local flow built"}, {"id": "F39", "section": 9, "label": "Community calendar and RSVP", "detail": "Only published dated announcements appear as scheduled calendar items. Social-event RSVP is distinct from a paid class or event booking. No placeholder date is marketed as real.", "route": "/community/calendar", "status": "Local flow built"}, {"id": "F40", "section": 9, "label": "Belong without an active package", "detail": "Community routes are not gated by a paid class balance. Return after a break, manage circles and pause updates without losing access to the community preview.", "route": "/return", "status": "Local flow built"}, {"id": "F41", "section": 10, "label": "Five reactivation segments", "detail": "Current students, former students, workshop participants, milonga attendees and interested/new visitors are distinct operator segments. Requests are not misreported as unique people.", "route": "/studio/reactivation", "status": "Local flow built"}, {"id": "F42", "section": 10, "label": "Relevant messages and consent controls", "detail": "Separate Saturday return, workshop and milonga templates; eligible local records only. Creates deduplicated unsent drafts, not actual mail. Pausing or unsubscribing excludes contacts from new drafts.", "route": "/studio/reactivation", "status": "Local flow built"}, {"id": "F43", "section": 10, "label": "No fabricated imported contact database", "detail": "The local workspace begins empty. Current/former records must come from authorised sources in production; no historical AuraTango metrics or customers are invented.", "route": "/studio/requests", "status": "Production integration required"}, {"id": "F44", "section": 11, "label": "Separate revenue streams", "detail": "Dashboard distinguishes partnered classes, Ladies’ Solo, private lessons, workshops, milonga, AuraTouch and other event flows. Dresses and guest-teaching appear as not yet sold, not fictitious revenue.", "route": "/studio", "status": "Local flow built"}, {"id": "F45", "section": 11, "label": "Contribution is not net profit", "detail": "Event calculator shows specified receipts and costs. The order dashboard labels simulated gross totals; tax, unallocated overhead, refunds and accounting reconciliation are not silently inferred.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F46", "section": 12, "label": "Cross-project journeys", "detail": "Classes lead to community/practice, workshops, milonga and other experiences; Ladies’ Solo can lead to partner groups; atelier discovery is optional. No forced upsells or artificial subscriptions.", "route": "/community", "status": "Local flow built"}, {"id": "F47", "section": 12, "label": "Inviting friends without commitment", "detail": "Source vision of recommendations is represented by a copyable, clearly labelled invitation. Earlier Partner Night remains an optional community concept, not a mandatory paired enrolment.", "route": "/event/partner-night", "status": "Local flow built"}, {"id": "F48", "section": 13, "label": "Phase 1: foundation", "detail": "All seven source activities retained: Saturday groups, Ladies’ programme, team, website structure, database, dress testing and milonga research.", "route": "/studio/roadmap", "status": "Local flow built"}, {"id": "F49", "section": 13, "label": "Phase 2: community", "detail": "All six source activities retained: practicas, smaller events, men’s/ladies’ workshops, communication, reactivation and community website.", "route": "/studio/roadmap", "status": "Local flow built"}, {"id": "F50", "section": 13, "label": "Phase 3: milonga", "detail": "All ten source activities retained: venue, negotiation, team, DJ, finance, promotion, launch, measurement, improvement and recurrence.", "route": "/studio/roadmap", "status": "Local flow built"}, {"id": "F51", "section": 13, "label": "Phase 4: workshops and AuraTouch", "detail": "All nine source activities retained: topics, descriptions, media, website, other cities, three-hour format, pilot, feedback and later audiences.", "route": "/studio/roadmap", "status": "Local flow built"}, {"id": "F52", "section": 13, "label": "Phase 5: dresses", "detail": "All nine source activities retained: prototypes, testing, costs, prices, initial collection, photography, shop, low-inventory sales tests and evidence-led expansion.", "route": "/studio/roadmap", "status": "Local flow built"}, {"id": "F53", "section": 14, "label": "Delegation rather than one-person operation", "detail": "Named responsibility fields, host pipeline, content checklist and event-operation workspace separate teaching, administration, promotion and delivery. A checked box is not proof a real contract or permit exists.", "route": "/studio/milonga", "status": "Local flow built"}, {"id": "F54", "section": 15, "label": "Foundation before scaling", "detail": "Default public state requests information or interest instead of selling unconfirmed products. The guided tour can load sample values explicitly, but it never changes source facts into real approved offers.", "route": "/tour", "status": "Local flow built"}, {"id": "F55", "section": 15, "label": "Publication limits made visible", "detail": "Real authentication, payment providers, notifications, shared community data, production SEO URLs, product fulfilment and owner-approved terms remain integration work. Source requests are mapped, not silently omitted.", "route": "/studio/settings", "status": "Production integration required"}];

function requestLocationLabel(id){

}
function bookingFormPhoto(id,teacher){
  if(!Object.hasOwn(OFFER,id))return '';
  const selectedTeacher=id==='private'&&Object.hasOwn(privateTeachers,teacher);
  const image=selectedTeacher?teacher:id==='private'?'teachers':OFFER[id].photo;
  const caption=selectedTeacher?privateTeachers[teacher]:itemTitle(id);
  return `<div class="booking-form-photo"><img src="${asset[image]}" alt="" width="72" height="72" decoding="async"><span>${ESC(caption)}</span></div>`;
}

}
function validBookingPhone(form,value,errorId){
  const phone=String(value||'').trim();
  const digitCount=phone.replace(/\D/g,'').length;
  if(/^\+?[0-9 ()\-.]+$/.test(phone)&&digitCount>=7&&digitCount<=15)return phone;
  document.getElementById(errorId).textContent=L('Enter a phone number with 7 to 15 digits.','Wpisz numer telefonu zawierający od 7 do 15 cyfr.','Введите номер телефона из 7–15 цифр.','Введіть номер телефону з 7–15 цифр.');
  form.elements.phone.focus();
  return null;
}
function timetableTrialChoices(offer){
  const slots=SLOTS.filter(slot=>slot.offer===offer).map(slot=>[slot.id,slotName(slot)]);
  const anyTime=L('Help me choose','Pomóżcie wybrać','Помогите выбрать','Допоможіть обрати');

      ['couple',L('With a partner','Z partnerem / partnerką','С партнёром','З партнером')]
    ]):''}`;
}

function openTimetableTrial(){
  const title=L('Trial class','Lekcja próbna','Пробное занятие','Пробне заняття');
  const offers=[['ladies',itemTitle('ladies')+' · 29 zł'],['partnered',L('Partner Group','Grupa w parach','Парная группа','Парна група')]];
  modal(brandedPopupHeading(title),`<form onsubmit="saveTimetableTrial(event)">
    <div id="trial-class-photo">${bookingFormPhoto('ladies')}</div>
    <p>${demoText()}</p>
    ${sel('offer',L('Choose a class','Wybierz zajęcia','Выберите занятие','Оберіть заняття'),offers,'ladies','onchange="updateTimetableTrialChoices(this.form)"')}
    ${requestLocationField()}
    <div id="timetable-trial-choices">${timetableTrialChoices('ladies')}</div>
    <div class="form-grid">${bookingContactFields({})}</div>
    <p class="error" id="trial-phone-error" role="alert"></p>
    <div class="modal-actions">
      <button type="button" class="btn light" onclick="closeModal()">${W('timetable')}</button>
      <button type="submit" class="btn trial-class-button">${L('Save demo request','Zapisz zgłoszenie demo','Сохранить демо-заявку','Зберегти демо-заявку')}${I('arrow')}</button>
    </div>
  </form>`);
}
function saveTimetableTrial(event){
  event.preventDefault();
  const form=event.currentTarget;
  const data=new FormData(form);
  const offer=data.get('offer');
  const slot=data.get('trial-slot');
  const preferredLocation=data.get('preferredLocation');
  if(!['ladies','partnered'].includes(offer)||!Object.hasOwn(locations,preferredLocation))return;
  if(slot!==''&&!SLOTS.some(item=>item.id===slot&&item.offer===offer))return;
  const phone=validBookingPhone(form,data.get('phone'),'trial-phone-error');
  if(!phone)return;
  const party=offer==='partnered'&&data.get('party')==='couple'?'couple':'solo';
  prepareRequest(offer,slot,party);
  U.wizard.preferredLocation=preferredLocation;
  U.form={email:data.get('email'),phone};
  closeModal();
  submitRequest();
}

classesPage=function(){return pageHead(L('A regular rhythm.<br><em>A personal way in.</em>','Stały rytm.<br><em>Osobista droga.</em>','Регулярный ритм.<br><em>Личный путь.</em>','Регулярний ритм.<br><em>Особистий шлях.</em>'),L('Choose a weekly group, Ladies’ Solo, private attention or practica. New classes will not appear as confirmed until the studio supplies their details.','Wybierz grupę, Ladies’ Solo, lekcję prywatną lub praktikę. Nowe zajęcia wymagają potwierdzenia szczegółów przez studio.','Выберите группу, женское соло, личный урок или практику. Подтверждённые места появятся после уточнения студией деталей.','Оберіть групу, жіноче соло, особистий урок чи практику. Підтверджені місця з’являться після уточнення студією деталей.'),W('classes'))+section('',`<div class="grid2">${Object.keys(OFFER).map(classListingCard).join('')}</div><div class="callout"><div><h3>${L('Not sure which group fits?','Nie wiesz, która grupa pasuje?','Не знаете, какая группа подходит?','Не знаєте, яка група підходить?')}</h3><p>${L('The three Saturday groups are not assigned invented levels. Tell us your experience; the teacher confirms your fit.','Nie przypisujemy wymyślonych poziomów. Opisz doświadczenie; nauczyciel dobierze grupę.','Трём группам не присвоены выдуманные уровни. Расскажите об опыте — преподаватель подскажет.','Трьом групам не присвоєно вигадані рівні. Розкажіть про досвід — викладач підкаже.')}</p></div>${A('/start',L('Guide me','Poprowadź mnie','Помогите выбрать','Допоможіть обрати'),'spark')}</div>`) };
